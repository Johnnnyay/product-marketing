<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undercover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Same projector-first palette as fnh.html. */
:root{
  --ground:#F2F5F1; --panel:#FFFFFF; --panel-2:#E8EEE8; --line:#C8D2C9; --line-2:#A8B6AA;
  --ink:#141A16; --ink-2:#3A453C; --muted:#5F6C62;
  --sage:#345043; --sage-2:#4A7060; --sage-light:#E4EDE6;
  --amber:#96420A; --amber-light:#FBEEE2; --red:#A81C1C; --red-light:#F8E3E3; --blue:#1546B0; --purple:#5B3391;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.wrap.narrow{max-width:520px}
h1,h2{font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px;margin:0 0 10px}
p{margin:0 0 12px}
a{color:var(--sage);font-weight:600}
button,select{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .back{font-size:14px}
.top .sp{flex:1}
.pill{background:#fff;border:2px solid var(--line-2);color:var(--ink-2);border-radius:999px;font-size:14px;font-weight:700;padding:6px 14px}
.pill[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.pill:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:8px;margin:6px 0 16px}
.tabs .pill{font-size:16px;padding:9px 20px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:22px}
.go{background:var(--sage);color:#fff;border:0;border-radius:11px;font-weight:800;font-size:19px;padding:14px 22px}
.go:hover{background:var(--sage-2)}
.go:disabled{opacity:.45;cursor:default}
.ghost{background:#fff;border:2px solid var(--line-2);color:var(--ink-2);border-radius:10px;font-size:15px;font-weight:700;padding:10px 16px}
.ghost:disabled{opacity:.45;cursor:default}
.err{color:var(--red);font-weight:600;font-size:15px;min-height:1px;margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin-top:12px}

.rules{display:grid;gap:14px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.rules .call{grid-column:1/-1}
.rules .side{display:grid;gap:14px}
.call{background:var(--sage);color:#fff;border-radius:14px;padding:22px 24px;text-align:center}
.call .q{font-size:clamp(28px,5vw,52px);font-weight:800;line-height:1.15}
.call .a{font-size:clamp(18px,2.4vw,24px);opacity:.9;margin-top:6px}
.steps{margin:0;padding-left:1.3em;font-size:clamp(17px,1.6vw,20px)}
.steps li{margin:0 0 10px}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ex span{border-radius:10px;padding:8px 12px;font-weight:700;background:var(--panel-2);font-size:15px}
.ex .u{background:var(--amber);color:#fff}

textarea{width:100%;min-height:200px;background:#fff;border:2px solid var(--line-2);border-radius:10px;color:var(--ink);font:inherit;font-size:18px;padding:12px 14px;resize:vertical}
textarea:focus{border-color:var(--sage);outline:none}
.opts{display:grid;gap:12px;margin:14px 0}
.opts .lbl{font-size:14px;font-weight:700;color:var(--ink-2);margin-right:6px}

/* host board */
.link{display:flex;gap:8px;align-items:center;background:var(--sage-light);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.link b{font-size:17px}
.link code{flex:1;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.now{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.now .rd{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.now .gm{font-size:clamp(40px,6vw,72px);font-weight:800;line-height:1;color:var(--sage);margin:6px 0}
.now .who{font-size:clamp(20px,2.6vw,28px);font-weight:800;margin-top:10px;overflow-wrap:anywhere}
.now .counts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.now .counts span{background:var(--panel-2);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.ring{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ring li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.ring .ix{width:26px;flex:none;font-weight:800;color:var(--muted)}
.ring .nm{flex:1;min-width:0;font-weight:700;font-size:clamp(17px,1.9vw,21px);overflow-wrap:anywhere}
.ring .tag{flex:none;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff}
.ring .tag.c{background:var(--sage)} .ring .tag.u{background:var(--amber)} .ring .tag.b{background:var(--purple)}
.ring .x{flex:none;background:#fff;border:2px solid var(--line-2);color:var(--red);border-radius:9px;font-size:14px;font-weight:800;padding:5px 12px}
.ring li.out{background:var(--panel-2)}
.ring li.out .nm{text-decoration:line-through;color:var(--muted)}
.ring li.first{border-color:var(--blue)}

.foot{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot .l{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.ver{flex-basis:100%;margin:6px 0 0;font-size:12px;color:var(--muted)}
.ver.old{color:var(--red);font-weight:700}

/* end screen */
#end{position:fixed;inset:0;z-index:80;background:var(--sage);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:auto}
#end.u{background:var(--amber)} #end.b{background:var(--purple)}
#end .big{font-size:clamp(40px,8vw,96px);font-weight:800;line-height:1.05}
#end .words{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:22px 0 10px}
#end .words div{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 20px;min-width:180px}
#end .words small{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
#end .words b{font-size:clamp(26px,4vw,40px)}
#end .who{font-size:18px;font-weight:600;opacity:.95}
#end .row{justify-content:center;margin-top:22px}
#end .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
#end .go{background:#fff;color:var(--ink)}
#end .note{color:#fff;opacity:.85;margin-top:10px}

/* player phone */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.seats button{background:#fff;border:2px solid var(--line-2);border-radius:12px;font-size:17px;font-weight:700;padding:14px 8px;color:var(--ink);overflow-wrap:anywhere}
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px 8px 16px;margin:12px 0}
.gamebar b{font-size:20px}
.gamebar .row{gap:6px}
.gamebar button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line-2);background:#fff;font-size:22px;font-weight:800;color:var(--ink)}
.reveal{width:100%;min-height:220px;border-radius:16px;border:0;background:var(--sage);color:#fff;font-size:22px;font-weight:800;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.reveal .w{font-size:clamp(40px,12vw,64px);line-height:1.1;overflow-wrap:anywhere}
.reveal small{font-size:14px;font-weight:600;opacity:.85}
.reveal.on{background:#fff;color:var(--ink);border:3px solid var(--sage)}
.reveal.on.b{border-color:var(--purple);color:var(--purple)}

#upd{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;font-size:14px;font-weight:700;max-width:calc(100vw - 24px)}
#upd button{font:inherit;font-size:13px;font-weight:800;background:#FFD166;color:var(--ink);border:0;border-radius:999px;padding:7px 14px;white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:760px){
  .stage,.rules{grid-template-columns:1fr}
  h1{font-size:28px}
}
</style>

<!-- ===================== HOST ===================== -->
<div class="wrap" id="host" hidden>
  <div class="top">
    <a class="back" href="games.html" data-t="back"></a>
    <span class="sp"></span>
    <button type="button" class="pill" data-lang="en">English</button>
    <button type="button" class="pill" data-lang="zh">中文</button>
  </div>
  <div class="eyebrow" data-t="eyebrow"></div>
  <h1 data-t="title"></h1>
  <div class="tabs">
    <button type="button" class="pill" data-tab="rules" data-t="tabRules"></button>
    <button type="button" class="pill" data-tab="play" data-t="tabPlay"></button>
  </div>

  <section id="rules" class="rules" hidden>
    <div class="call"><div class="q" data-t="callQ"></div><div class="a" data-t="callA"></div></div>
    <div class="card"><h2 data-t="howTitle"></h2><ol class="steps" id="steps"></ol></div>
    <div class="side">
      <div class="card">
        <h2 data-t="exTitle"></h2>
        <p data-t="exLead"></p>
        <div class="ex" id="ex"></div>
        <p class="note" data-t="exNote"></p>
      </div>
      <div class="card">
        <h2 data-t="tipsTitle"></h2>
        <p data-t="tip1"></p>
        <p data-t="tip2"></p>
        <p class="note" data-t="source"></p>
      </div>
    </div>
  </section>

  <section id="play" hidden>
    <div id="setup" class="card">
      <h2 data-t="setupTitle"></h2>
      <p data-t="setupLead"></p>
      <textarea id="names" spellcheck="false" autocomplete="off"></textarea>
      <div class="opts">
        <div class="row"><span class="lbl" data-t="ucLbl"></span><span id="ucOpts" class="row"></span></div>
        <div class="row"><span class="lbl" data-t="blankLbl"></span>
          <button type="button" class="pill" data-blank="0" data-t="no"></button>
          <button type="button" class="pill" data-blank="1" data-t="yes"></button>
          <span class="note" data-t="blankNote"></span></div>
        <div class="row"><span class="lbl" data-t="wordsLbl"></span>
          <button type="button" class="pill" data-wl="en">English</button>
          <button type="button" class="pill" data-wl="zh">中文</button></div>
      </div>
      <button type="button" class="go" id="create" data-t="create"></button>
      <div class="err" id="err"></div>
    </div>

    <div id="board" hidden>
      <div class="link">
        <b data-t="linkLbl"></b>
        <code id="linkText"></code>
        <button type="button" class="ghost" id="copy" data-t="copy"></button>
        <a id="openSelf" target="_blank" rel="noopener" data-t="openOne"></a>
      </div>
      <div class="stage">
        <div class="now">
          <div class="rd" data-t="gameLbl"></div>
          <div class="gm" id="gm"></div>
          <div class="note" id="gmNote"></div>
          <div class="who" id="starts"></div>
          <div class="counts" id="counts"></div>
          <div class="row" style="justify-content:center;margin-top:14px">
            <button type="button" class="ghost" id="undo" data-t="undo"></button>
          </div>
          <div class="hint" data-t="tieHint"></div>
        </div>
        <ul class="ring" id="ring"></ul>
      </div>
    </div>

    <div class="foot">
      <span class="l" data-t="hostTools"></span>
      <button type="button" class="ghost" id="skip" data-t="skip"></button>
      <button type="button" class="ghost" id="reveal" data-t="revealBtn"></button>
      <button type="button" class="ghost" id="wipe" data-t="wipe"></button>
    </div>
  </section>
  <p class="ver"></p>
</div>

<div id="end" hidden>
  <div class="eyebrow" style="color:#fff;opacity:.85" id="endGame"></div>
  <div class="big" id="endTitle"></div>
  <div class="words" id="endWords"></div>
  <div class="who" id="endWho"></div>
  <div class="row">
    <button type="button" class="go" id="nextGame" data-t="nextGame"></button>
    <button type="button" class="ghost" id="endUndo" data-t="undo"></button>
  </div>
  <div class="note" id="endNote"></div>
</div>

<!-- ===================== PLAYER PHONE ===================== -->
<div class="wrap narrow" id="player" hidden>
  <div class="top">
    <div class="eyebrow" data-t="title"></div>
    <span class="sp"></span>
    <button type="button" class="pill" data-lang="en">EN</button>
    <button type="button" class="pill" data-lang="zh">中文</button>
  </div>
  <div id="pickSeat">
    <h1 data-t="whoAreYou"></h1>
    <p class="note" data-t="whoNote"></p>
    <div class="seats" id="seats"></div>
  </div>
  <div id="mine" hidden>
    <h1 id="meName"></h1>
    <div class="gamebar">
      <b id="pGame"></b>
      <div class="row">
        <button type="button" id="gMinus" aria-label="Previous game">−</button>
        <button type="button" id="gPlus" aria-label="Next game">+</button>
      </div>
    </div>
    <p class="note" data-t="gameNote"></p>
    <button type="button" class="reveal" id="rv"></button>
    <p class="hint" style="text-align:center"><button type="button" class="ghost" id="notMe" data-t="notMe"></button></p>
  </div>
  <p class="ver"></p>
</div>

<div id="upd" hidden><span id="updt"></span><button type="button" id="updgo">Reload now</button></div>

let LANG = "en";
function t(k, v){ let s = T[LANG][k]; if(v) for(const p in v) s = s.split("{" + p + "}").join(v[p]); return s; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ---------- dealing ----------
   No server: the host's link carries a seed, the names, the settings and how many pairs existed.
   Every phone works out the same deal from that, game by game. A curious player could tap someone
   else's name or read the code to see more, so this is honour-system, fine for a team game. */
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pairIdx(cfg, g){ return Math.floor(rng(cfg.s ^ Math.imul(g, 0x9E3779B1))() * cfg.L); }
function deal(cfg, g){
  const r = rng((cfg.s ^ Math.imul(g, 0x9E3779B1)) + 7);
  let pi = pairIdx(cfg, g);
  if(g > 1 && pi === pairIdx(cfg, g - 1)) pi = (pi + 1) % cfg.L;   /* never the same pair twice running */
  const pair = WORDS[cfg.l][pi], flip = r() < 0.5;
  const civ = flip ? pair[1] : pair[0], uc = flip ? pair[0] : pair[1];
  const order = cfg.n.map(function(_, i){ return i; });
  for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const x = order[i]; order[i] = order[j]; order[j] = x; }
  const role = cfg.n.map(function(){ return "c"; });
  order.slice(0, cfg.u).forEach(function(i){ role[i] = "u"; });
  if(cfg.b) role[order[cfg.u]] = "b";
  return { civ: civ, uc: uc, role: role };
}
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64d(s){ return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); }
function validCfg(c){ return c && Array.isArray(c.n) && c.n.length >= 4 && WORDS[c.l] && c.L >= 1 && c.L <= WORDS[c.l].length && c.u >= 1 && typeof c.s === "number"; }

/* ===================== HOST ===================== */
const HKEY = "undercover-host-v1";
let H = hblank();
function hblank(){ return { cfg: null, game: 1, out: [], round: 1, starter: 0, ended: false, shown: false, hist: [], u: 0, b: 0, wl: null }; }
function hsave(){ try{ localStorage.setItem(HKEY, JSON.stringify(H)); }catch(e){} }
function hsnap(){ const c = JSON.parse(JSON.stringify(H)); delete c.hist; H.hist.push(c); if(H.hist.length > 60) H.hist.shift(); }
function hundo(){ if(!H.hist.length) return; const h = H.hist; H = h.pop(); H.hist = h; hsave(); drawHost(); }
function alive(){ return H.cfg ? H.cfg.n.map(function(_, i){ return i; }).filter(function(i){ return H.out.indexOf(i) < 0; }) : []; }
function pickStarter(){ const a = alive(); H.starter = a[Math.floor(Math.random() * a.length)]; }
function maxUc(n){ return Math.max(1, Math.min(3, Math.floor((n - 1) / 2) - (H.b && n >= 5 ? 1 : 0) || 1)); }
function defUc(n){ return n <= 6 ? 1 : n <= 10 ? 2 : 3; }
/* Who has won, if anyone: civilians when no undercover or Mr. White is left; Mr. White when only the
   undercovers are gone; the undercover when alive players fall to the line (2, or 3 at 7+). */
function verdict(){
  const d = deal(H.cfg, H.game), a = alive();
  const u = a.filter(function(i){ return d.role[i] === "u"; }).length, b = a.filter(function(i){ return d.role[i] === "b"; }).length;
  if(!u && !b) return "c";
  if(!u && b) return "b";
  if(a.length <= (H.cfg.n.length >= 7 ? 3 : 2)) return "u";
  return "";
}

let editingNames = true;
function readNames(){ return $("names").value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean); }
function create(){
  const names = readNames();
  if(names.length < 4){ $("err").textContent = t("needFour"); return; }
  const seen = {}, dup = names.filter(function(n){ const k = n.toLowerCase(); if(seen[k]) return true; seen[k] = 1; return false; });
  if(dup.length){ $("err").textContent = t("dupes") + dup.join(", "); return; }
  $("err").textContent = "";
  const b = H.b && names.length >= 5 ? 1 : 0;
  const u = Math.min(H.u || defUc(names.length), maxUc(names.length));
  const wl = H.wl || LANG;
  hsnap();
  H.cfg = { s: Math.floor(Math.random() * 2147483647), n: names, u: u, b: b, l: wl, L: WORDS[wl].length };
  H.game = 1; H.out = []; H.round = 1; H.ended = false; H.shown = false; pickStarter();
  $("names").blur(); try{ sessionStorage.removeItem("uc-draft"); }catch(e){}
  hsave(); drawHost();
}
function voteOut(i){
  hsnap();
  if(H.out.indexOf(i) > -1){ H.out = H.out.filter(function(x){ return x !== i; }); }
  else{
    H.out.push(i);
    if(verdict()){ H.ended = true; H.shown = true; }
    else { H.round++; pickStarter(); }
  }
  hsave(); drawHost();
}
function nextGame(){ hsnap(); H.game++; H.out = []; H.round = 1; H.ended = false; H.shown = false; pickStarter(); hsave(); drawHost(); setTimeout(reloadWhenSafe, 400); }
function linkFor(){ return location.origin + location.pathname + "#j=" + b64e(H.cfg); }

let TAB = "rules";
function drawCommon(){
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-t]").forEach(function(el){ const v = T[LANG][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === LANG); });
}
function drawHost(){
  drawCommon();
  document.title = t("title");
  document.querySelectorAll("[data-tab]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.tab === TAB); });
  $("rules").hidden = TAB !== "rules"; $("play").hidden = TAB !== "play";
  $("steps").innerHTML = T[LANG].steps.map(function(s){ return "<li>" + s + "</li>"; }).join("");
  $("ex").innerHTML = T[LANG].exClues.map(function(c){ return '<span class="' + (c[2] ? "u" : "") + '">' + esc(c[0]) + " · " + esc(c[1]) + "</span>"; }).join("");

  const n = readNames().length || (H.cfg ? H.cfg.n.length : 0);
  const mx = maxUc(Math.max(n, 4)), cur = Math.min(H.u || defUc(n), mx);
  let uo = ""; for(let k = 1; k <= 3; k++) uo += '<button type="button" class="pill" data-uc="' + k + '" aria-pressed="' + (k === cur) + '"' + (k > mx ? " disabled" : "") + ">" + k + "</button>";
  $("ucOpts").innerHTML = uo;
  document.querySelectorAll("[data-blank]").forEach(function(b){ b.setAttribute("aria-pressed", String(H.b ? 1 : 0) === b.dataset.blank); });
  document.querySelectorAll("[data-wl]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.wl === (H.wl || LANG)); });

  const playing = !!H.cfg;
  $("setup").hidden = playing; $("board").hidden = !playing;
  $("skip").hidden = !playing; $("reveal").hidden = !playing || H.ended;
  $("end").hidden = !(playing && H.shown && TAB === "play");
  if(!playing) return;

  const d = deal(H.cfg, H.game), a = alive();
  $("linkText").textContent = linkFor();
  $("openSelf").href = linkFor();
  $("gm").textContent = H.game;
  $("gmNote").textContent = t("gmNote", { g: H.game });
  $("starts").textContent = H.ended ? t("ended") : t("starts", { r: H.round, n: H.cfg.n[H.starter] || "" });
  const ucIn = a.filter(function(i){ return d.role[i] === "u"; }).length;
  $("counts").innerHTML = "<span>" + esc(t("counts", { a: a.length })) + "</span><span>" + esc(t(ucIn === 1 ? "ucLeft" : "ucLeftP", { u: ucIn })) + "</span>";
  $("ring").innerHTML = H.cfg.n.map(function(nm, i){
    const out = H.out.indexOf(i) > -1, showRole = out || H.shown;
    return '<li class="' + (out ? "out" : "") + (i === H.starter && !H.ended && !out ? " first" : "") + '"><span class="ix">' + (i + 1) + '</span><span class="nm">' + esc(nm) + "</span>"
      + (showRole ? '<span class="tag ' + d.role[i] + '">' + esc(T[LANG].role[d.role[i]]) + "</span>" : "")
      + (H.ended ? "" : '<button type="button" class="x" data-v="' + i + '">' + (out ? t("back2") : t("voteOut")) + "</button>")
      + "</li>";
  }).join("");
  $("undo").disabled = !H.hist.length; $("endUndo").disabled = !H.hist.length;

  if(H.shown){
    const v = H.ended ? verdict() : "";
    const ucNames = H.cfg.n.filter(function(_, i){ return d.role[i] === "u"; }), bName = H.cfg.n.filter(function(_, i){ return d.role[i] === "b"; });
    $("end").className = v === "u" ? "u" : v === "b" ? "b" : "";
    $("endGame").textContent = LANG === "zh" ? "第 " + H.game + " 局" : "Game " + H.game;
    $("endTitle").textContent = v === "c" ? t("winC") : v === "u" ? t(ucNames.length > 1 ? "winUs" : "winU") : v === "b" ? t("winB") : t("ended");
    $("endWords").innerHTML = "<div><small>" + esc(t("civW")) + "</small><b>" + esc(d.civ) + "</b></div><div><small>" + esc(t("ucW")) + "</small><b>" + esc(d.uc) + "</b></div>";
    $("endWho").textContent = t("ucWere", { n: ucNames.join(LANG === "zh" ? "、" : ", ") }) + (bName.length ? " · " + t("bWas", { n: bName[0] }) : "");
    $("endNote").textContent = t("endNote", { g: H.game + 1 });
  }
}

/* ===================== PLAYER ===================== */
let P = null, pcfg = null, rvTimer = 0;
function pkey(){ return "undercover-me-" + pcfg.s; }
function pload(){ try{ P = JSON.parse(localStorage.getItem(pkey()) || "null"); }catch(e){ P = null; } if(!P) P = { seat: -1, game: 1 }; }
function psave(){ try{ localStorage.setItem(pkey(), JSON.stringify(P)); }catch(e){} }
let shownWord = false;
function drawPlayer(){
  drawCommon();
  document.title = t("title");
  if(!pcfg){ $("pickSeat").hidden = false; $("mine").hidden = true; $("seats").innerHTML = '<p class="err">' + esc(t("badLink")) + "</p>"; return; }
  const has = P.seat > -1 && P.seat < pcfg.n.length;
  $("pickSeat").hidden = has; $("mine").hidden = !has;
  $("seats").innerHTML = pcfg.n.map(function(nm, i){ return '<button type="button" data-seat="' + i + '">' + esc(nm) + "</button>"; }).join("");
  if(!has) return;
  $("meName").textContent = pcfg.n[P.seat];
  $("pGame").textContent = t("pGame", { g: P.game });
  $("gMinus").disabled = P.game <= 1;
  const d = deal(pcfg, P.game), r = d.role[P.seat];
  const rv = $("rv");
  rv.classList.toggle("on", shownWord); rv.classList.toggle("b", shownWord && r === "b");
  if(!shownWord) rv.innerHTML = "<span>" + esc(t("tapSee")) + "</span><small>" + esc(t("hides")) + "</small>";
  else if(r === "b") rv.innerHTML = '<span class="w">' + esc(t("blankWord")) + "</span><small>" + esc(t("blankSub")) + "</small>";
  else rv.innerHTML = "<small>" + esc(t("yourWord")) + '</small><span class="w">' + esc(r === "u" ? d.uc : d.civ) + "</span><small>" + esc(t("hides")) + "</small>";
}
function toggleWord(){
  shownWord = !shownWord; clearTimeout(rvTimer);
  if(shownWord) rvTimer = setTimeout(function(){ shownWord = false; drawPlayer(); setTimeout(reloadWhenSafe, 400); }, 5000);
  drawPlayer();
}

try{

}catch(e){}
function setLang(l){ LANG = l; try{ localStorage.setItem("fnh-lang", LANG); }catch(e){} MODE === "host" ? drawHost() : drawPlayer(); }
document.querySelectorAll("[data-lang]").forEach(function(b){ b.onclick = function(){ setLang(b.dataset.lang); }; });

if(MODE === "player"){

/* ---------- always the newest version (see fnh.html and app-qa/references/self-update.md) ----------
   On a phone it never reloads while the word is showing; on the host laptop never over the end
   screen or a half-typed list. The link's #j= part survives the reload, so each phone keeps its
   name and game number. */
let stale = false, checkedAt = 0, triedAt = 0, staleKey = "";
function fmtWhen(t){ return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
function paintVer(){
  const txt = "Version " + fmtWhen(BUILD) + (stale ? " · a newer version is out, reloading"
    : checkedAt ? " · the newest (checked " + new Date(checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ")" : "");
  document.querySelectorAll(".ver").forEach(function(el){ el.textContent = txt; el.classList.toggle("old", stale); });
}
function busy(){
  const a = document.activeElement;
  if(MODE === "player") return shownWord;
  return !$("end").hidden || !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value && a.offsetParent)
    || (!H.cfg && !!$("names").value.trim());
}
function freshen(){
  if(!/^https?:$/.test(location.protocol) || document.hidden || Date.now() - triedAt < 8000) return;
  triedAt = Date.now();
  fetch(location.pathname + "?latest=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(html){
      const m = /const BUILD = "([^"]+)";/.exec(html);
      if(!m || !SELF) return;
      checkedAt = Date.now();
      stale = m[1] >= BUILD && html.indexOf(SELF) < 0;
      staleKey = m[1] + ":" + html.length;
      paintVer(); reloadWhenSafe();
    }).catch(function(){});
}
function reloadWhenSafe(){
  if(!stale){ $("upd").hidden = true; return; }
  let tried = ""; try{ tried = sessionStorage.getItem("uc-tried") || ""; }catch(e){}
  if(tried !== staleKey && !busy()){ reloadNow(); return; }
  $("updt").textContent = tried === staleKey ? "A newer version of this page is out." : "A newer version is out. It loads when you close this.";
  $("upd").hidden = false;
}
