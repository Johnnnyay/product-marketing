<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3D5A4C;--green:#5C8A6E;--green-light:#EDF2EE;--green-mid:#6F9E80;
    --off-white:#F7F9F7;--gray-100:#F0F3F0;--gray-200:#E4E9E5;--gray-400:#9ca3af;
    --gray-500:#6E7B74;--gray-600:#55605A;--gray-800:#2A332D;--radius-lg:18px;
  }
  /* Each check-in wears its station's color, matching the cards on the event page. */
  body.t-skin{--navy:#245A73;--green:#2F7391;--green-mid:#4E8FAB;--green-light:#E4F1F7}
  body.t-hair{--navy:#6E4469;--green:#8B5A86;--green-mid:#A57AA0;--green-light:#F4EAF3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--off-white);color:var(--gray-800);-webkit-font-smoothing:antialiased;min-height:100vh}
  .site-header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center}
  .site-logo{font-family:'Caveat',cursive;font-size:22px;font-weight:600;color:rgba(255,255,255,.95)}
  .hero{background:radial-gradient(120% 140% at 85% 0%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--navy) 0%,var(--green) 100%);color:#fff;padding:34px 20px 30px;text-align:center}
  .hero-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:8px}
  .hero h1{font-size:26px;font-weight:700;margin-bottom:8px}
  .hero p{font-size:14px;line-height:1.6;color:rgba(255,255,255,.78);max-width:460px;margin:0 auto}
  .wrap{max-width:620px;margin:0 auto;padding:24px 16px 56px}
  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:0 1px 4px rgba(0,0,0,.07);padding:22px;margin-bottom:14px}
  .q{margin-bottom:22px}
  .q:last-child{margin-bottom:0}
  .q-label{display:block;font-size:15px;font-weight:600;color:var(--gray-800);margin-bottom:4px;line-height:1.45}
  .q-sub{font-size:12.5px;color:var(--gray-500);margin-bottom:10px;line-height:1.5}
  .req{color:var(--green)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row2 .q{margin-bottom:0}
  @media(max-width:520px){.row2{grid-template-columns:1fr;gap:16px}}
  .f label{display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
  input[type=text],input[type=email],textarea{width:100%;border:1.5px solid var(--gray-200);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;color:var(--gray-800);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--green)}
  textarea{resize:vertical;min-height:84px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border:1.5px solid var(--gray-200);border-radius:999px;background:#fff;font:inherit;font-size:14px;color:var(--gray-600);cursor:pointer;transition:all .15s;position:relative}
  .chip:hover{border-color:var(--green);color:var(--green)}
  .chip.on{background:var(--green-light);border-color:var(--green);color:var(--navy);font-weight:600}
  .chip.dim{opacity:.4;cursor:default}
  .chip.dim:hover{border-color:var(--gray-200);color:var(--gray-600)}
  .chip .rank{display:none;margin-right:7px;width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;vertical-align:1px}
  .chip.on .rank{display:inline-flex}
  .count{font-size:12px;color:var(--gray-500);margin-top:8px}
  .reveal{margin-top:10px}
  .reveal[hidden]{display:none}
  .err{display:none;margin-top:8px;font-size:12.5px;color:#b3261e}
  .q.bad .err{display:block}
  .q.bad input,.q.bad textarea{border-color:#e7a29c}
  .btn{display:block;width:100%;padding:14px 24px;border-radius:999px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border:0;background:var(--navy);color:#fff;text-align:center;text-decoration:none}
  .btn:hover{background:var(--green)}
  .btn:disabled{background:var(--gray-400);cursor:default}
  .btn-ghost{background:none;color:var(--green);font-size:14px;padding:12px}
  .btn-ghost:hover{background:none;text-decoration:underline}
  .form-err{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#991b1b;margin-bottom:14px;line-height:1.5}
  .privacy{font-size:12px;color:var(--gray-500);text-align:center;margin-top:12px;line-height:1.5}
  /* Done: the guest's own answers, to show at the station. */
  .done-head{text-align:center;padding:10px 0 18px}
  .done-icon{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center}
  .done-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .done-sub{font-size:14px;color:var(--gray-600);line-height:1.6;max-width:420px;margin:0 auto}
  .profile-h{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .profile-h::after{content:'';flex:1;height:1px;background:var(--gray-200)}
  .pr{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:14px;line-height:1.5}
  .pr:last-child{border-bottom:0}
  .pr-k{color:var(--gray-500);font-size:13px}
  .pr-v{color:var(--gray-800);white-space:pre-wrap;word-break:break-word}
  @media(max-width:420px){.pr{grid-template-columns:1fr;gap:2px}}
  .tag{display:inline-block;background:var(--green-light);color:var(--navy);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;margin:0 6px 4px 0}
  .ver{font-size:11.5px;color:var(--gray-400);text-align:center;margin-top:26px}
  .ver.old{color:#A81C1C;font-weight:700}
  #upd{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:#141A16;color:#fff;border-radius:999px;padding:8px 8px 8px 18px;font-size:14px;font-weight:700;max-width:calc(100vw - 24px)}
  #upd[hidden]{display:none}
  #upd button{font:inherit;font-size:13px;font-weight:800;background:#FFD166;color:#141A16;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
  [hidden]{display:none !important}
</style>
<script src="event-options.js?v=1"></script>
</head>
<body>
<script>document.body.className = "t-" + (new URLSearchParams(location.search).get("type") === "hair" ? "hair" : "skin");</script>

<header class="site-header"><span class="site-logo">Glow From Within</span><div class="lang-wrap" id="langMenu" style="margin-left:auto"></div></header>

<div class="hero">
  <div class="hero-kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="lede"></p>
</div>

<div class="wrap">
  <form id="form" novalidate>
    <div class="form-err" id="formErr" role="alert"></div>

    <div class="card">
      <div class="row2">
        <div class="q f" id="q-name"><label for="a-name"><span data-t="name"></span> <span class="req">*</span></label>
          <input type="text" id="a-name" autocomplete="name" placeholder="Jane Smith"><div class="err" data-t="errName"></div></div>
        <div class="q f" id="q-email"><label for="a-email"><span data-t="email"></span> <span style="font-weight:400;color:var(--gray-400)" data-t="optional"></span></label>
          <input type="email" id="a-email" autocomplete="email" placeholder="you@example.com"><div class="err" data-t="errEmail"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="q" id="q-concerns">
        <span class="q-label" data-t="concernsQ"></span>
        <div class="q-sub" data-t="concernsSub"></div>
        <div class="chips" id="concernChips"></div>
        <div class="count" id="concernCount"></div>
        <div class="reveal" id="otherWrap" hidden><input type="text" id="a-concernOther" maxlength="200" data-ph="otherPh"></div>
        <div class="err" id="concernErr"></div>
      </div>
      <div class="q" id="q-type">
        <span class="q-label" id="typeLabel"></span>
        <div class="chips" id="typeChips"></div>
        <div class="err" data-t="errType"></div>
      </div>
      <div class="q" id="q-chem" hidden>
        <span class="q-label" data-t="chemQ"></span>
        <div class="chips" id="chemChips"></div>
        <div class="err" data-t="errChoose"></div>
      </div>
    </div>

    <div class="card">
      <div class="q" id="q-routine">
        <label class="q-label" for="a-routine" id="routineLabel"></label>
        <div class="q-sub" id="routineSub"></div>
        <textarea id="a-routine" maxlength="1500"></textarea>
        <div class="err" data-t="errRoutine"></div>
      </div>
      <div class="q" id="q-allergy">
        <span class="q-label" data-t="allergyQ"></span>
        <div class="chips" id="allergyChips"></div>
        <div class="reveal" id="allergyWrap" hidden><input type="text" id="a-allergies" maxlength="500" data-ph="allergyPh"></div>
        <div class="err" id="allergyErr"></div>
      </div>
    </div>

    <button type="submit" class="btn" id="sendBtn"></button>
    <p class="privacy" data-t="privacy"></p>
  </form>

  <div id="done" hidden>
    <div class="done-head">
      <div class="done-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="done-title" id="doneTitle"></div>
      <div class="done-sub" id="doneSub"></div>
    </div>
    <div class="card"><div class="profile-h" id="profileH"></div><div id="profile"></div></div>
    <a class="btn" id="backBtn" href="glow.html" data-t="backBtn"></a>
    <button type="button" class="btn btn-ghost" id="againBtn" data-t="againBtn"></button>
  </div>

  <p class="ver"></p>
</div>

<div id="upd" hidden><span id="updt"></span><button type="button" id="updgo"></button></div>

<script>
const BUILD = "2026-09-24T21:45:39Z";
const SELF = document.currentScript ? document.currentScript.textContent : "";
if(/[?&]v=/.test(location.search)){
  const keep = new URLSearchParams(location.search); keep.delete("v");
  history.replaceState(null, "", location.pathname + (keep.toString() ? "?" + keep : "") + location.hash);
}

const API = "https://health-intake-api.vercel.app/api/event";
const params = new URLSearchParams(location.search);
const TYPE = params.get("type") === "hair" ? "hair" : "skin";
const EVENT = /^[a-z0-9-]{3,40}$/.test(params.get("event") || "") ? params.get("event") : "general";
const BACK = /^[a-z0-9-]+\.html$/.test(params.get("back") || "") ? params.get("back") : "glow.html";
const OPT = EventI18n.OPTS;
let L = EventI18n.current();
const tx = (a) => Array.isArray(a) ? (a[L] || a[0]) : a;

/* Everything the guest reads, in English and Chinese. Answers are saved in English (OPT values). */
const T = {
  name: ['First and last name', '姓名'], email: ['Email', '邮箱'], optional: ['(optional)', '（可选）'],
  errName: ['Please add your name.', '请填写姓名。'],
  errEmail: ['That email doesn\'t look complete.', '邮箱好像不完整。'],
  concernsQ: ['What are your top 2 concerns?', '你最在意的两个问题是什么？'],
  concernsSub: ['Tap up to two, most important first.', '最多选两个，最在意的先点。'],
  count: ['{n} of 2 chosen', '已选 {n}/2'],
  countFull: ['. Tap a chosen one to change it.', '，点已选的可以换。'],
  otherPh: ['Tell us in a few words', '简单写几个字'],
  errPick: ['Pick at least one.', '至少选一个。'],
  errOther: ['Tell us what the other concern is.', '写一下"其他"具体是什么。'],
  errType: ['Pick one. "I don\'t know" is fine.', '选一个就好，"不确定"也可以。'],
  chemQ: ['Have you ever dyed, permed or chemically treated your hair?', '你染过、烫过或做过其他化学处理吗？'],
  errChoose: ['Please choose one.', '请选一个。'],
  errRoutine: ['A few words is enough.', '写几个字就够了。'],
  allergyQ: ['Any allergies or sensitivities?', '有过敏或敏感的情况吗？'],
  yes: ['Yes', '有'], no: ['No', '没有'],
  allergyPh: ['What are you allergic or sensitive to?', '对什么过敏或敏感？'],
  errAllergy: ['Tell us what you\'re allergic or sensitive to.', '写一下对什么过敏或敏感。'],
  send: ['Send my answers', '提交我的答案'], sendAgain: ['Send corrected answers', '提交修改后的答案'], sending: ['Sending…', '提交中…'],
  privacy: ['Only the event team sees your answers. They are not published anywhere.', '你的答案只有活动团队能看到，不会公开。'],
  sendFail: ['That didn\'t go through ({e}). Check your connection and tap Send again. Your answers are all still here.', '提交没成功（{e}）。检查一下网络再点提交，你填的内容都还在。'],
  doneTitle: ['Thank you, {name}.', '谢谢你，{name}。'],
  doneSub: ['You\'re all set. Your {station} picks up from these answers at the event.', '都好了。活动当天的{station}会从这些答案开始。'],
  topConcerns: ['Top concerns', '最在意的问题'], chemK: ['Dyed, permed or chemically treated', '染烫或化学处理'],
  routineK: ['Current routine', '现在的护理'], allergiesK: ['Allergies', '过敏'], none: ['None', '没有'],
  backBtn: ['Back to the event page', '回到活动页面'],
  againBtn: ['Made a mistake? Send a corrected version', '填错了？提交一份修改后的版本'],
  reload: ['Reload now', '立即刷新'], newer: ['A newer version is out.', '页面有新版本。'], newerTried: ['A newer version of this page is out.', '这个页面有新版本。'],
};
const COPY = {
  skin: {
    title: ['Skin Assessment', '皮肤评估'], kicker: ['Skincare', '护肤'],
    lede: ['About two minutes, no wrong answers. It gives your skin diagnostic a starting point that\'s about you.', '大约两分钟，没有标准答案。让你的皮肤检测从你自己的情况开始。'],
    typeLabel: ['What do you think your skin type is?', '你觉得自己是什么肤质？'],
    routineLabel: ['What\'s your current routine?', '你现在的护肤步骤是怎样的？'],
    routineSub: ['The products you use and their brands. "Nothing much" is a perfectly good answer.', '用了哪些产品、什么牌子。"没怎么护肤"也完全可以。'],
    routinePh: ['e.g. gel cleanser from CeraVe, a vitamin C serum, moisturizer, sunscreen most days', '比如：CeraVe 洁面啫喱、维 C 精华、面霜，大部分时候涂防晒'],
    profile: ['Your skin profile', '你的皮肤档案'], station: ['skin diagnostic', '皮肤检测'], typeKey: ['Skin type', '肤质'],
  },
  hair: {
    title: ['Hair & Scalp Assessment', '头发与头皮评估'], kicker: ['Scalp & Haircare', '头皮与头发护理'],
    lede: ['About two minutes, no wrong answers. It gives your scalp and hair scan a starting point that\'s about you.', '大约两分钟，没有标准答案。让你的头皮和头发检测从你自己的情况开始。'],
    typeLabel: ['What do you think your hair type is?', '你觉得自己是什么发质？'],
    routineLabel: ['What hair products do you use now?', '你现在用哪些护发产品？'],
    routineSub: ['Shampoo, conditioner, styling, treatments, and their brands. "Nothing much" is a perfectly good answer.', '洗发水、护发素、造型、护理，以及牌子。"没怎么用"也完全可以。'],
    routinePh: ['e.g. a drugstore shampoo and conditioner, heat protectant, color every 2 months', '比如：超市买的洗发水和护发素、吹头发前用隔热喷雾、两个月染一次'],
    profile: ['Your hair & scalp profile', '你的头发与头皮档案'], station: ['scalp and hair scan', '头皮与头发检测'], typeKey: ['Hair type', '发质'],
  },
}[TYPE];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DRAFT = "assess-draft:" + EVENT + ":" + TYPE;
const DONE = "event-done:" + EVENT;
/* Name and email typed once for this event (here or on the health assessment) fill in the next check-in. */
const GUEST = "event-guest:" + EVENT;
function readGuest(){ try { return JSON.parse(localStorage.getItem(GUEST) || "{}") || {}; } catch (e) { return {}; } }
function saveGuest(name, email){
  const g = readGuest();
  if (name) g.name = name;
  if (email) g.email = email;
  try { localStorage.setItem(GUEST, JSON.stringify(g)); } catch (e) {}
}

const OTHER = "Something else";
const CONCERNS = OPT[TYPE].concerns.concat([[OTHER, OPT.other[0], OPT.other[1]]]);
const TYPES = OPT[TYPE].types;
const ALLERGY = [["no", T.no[0], T.no[1]], ["yes", T.yes[0], T.yes[1]]];

let concerns = [];          /* values, in the order tapped: first is the most important */
let skinType = "", allergy = "", chem = "", sending = false, lastAnswers = null, resent = false;

$("backBtn").href = BACK + "?done=" + TYPE;
if (TYPE === "hair") $("q-chem").hidden = false; else $("q-chem").remove();

function chipsHtml(list, ranked){
  return list.map((o) => '<button type="button" class="chip" data-v="' + esc(o[0]) + '">' + (ranked ? '<span class="rank"></span>' : '') + esc(o[1 + L] || o[1]) + "</button>").join("");
}
function paintConcerns(){
  document.querySelectorAll("#concernChips .chip").forEach((b) => {
    const i = concerns.indexOf(b.dataset.v);
    b.classList.toggle("on", i >= 0);
    b.classList.toggle("dim", i < 0 && concerns.length >= 2);
    b.setAttribute("aria-pressed", i >= 0);
    b.querySelector(".rank").textContent = i >= 0 ? i + 1 : "";
  });
  $("concernCount").textContent = tx(T.count).replace("{n}", concerns.length) + (concerns.length >= 2 ? tx(T.countFull) : "");
  $("otherWrap").hidden = concerns.indexOf(OTHER) < 0;
}
function paintSingle(boxId, value){
  document.querySelectorAll("#" + boxId + " .chip").forEach((b) => {
    b.classList.toggle("on", b.dataset.v === value);
    b.setAttribute("aria-pressed", b.dataset.v === value);
  });
}
function paintAllergy(){
  paintSingle("allergyChips", allergy);
  $("allergyWrap").hidden = allergy !== "yes";
}

/* Every word on the page, in the current language. Chips are rebuilt; the answers are values, so
   switching language never loses a choice. */
function paintText(){
  document.documentElement.lang = L ? "zh" : "en";
  document.title = tx(COPY.title);
  $("title").textContent = tx(COPY.title);
  $("kicker").textContent = tx(COPY.kicker);
  $("lede").textContent = tx(COPY.lede);
  $("typeLabel").textContent = tx(COPY.typeLabel);
  $("routineLabel").textContent = tx(COPY.routineLabel);
  $("routineSub").textContent = tx(COPY.routineSub);
  $("a-routine").placeholder = tx(COPY.routinePh);
  $("profileH").textContent = tx(COPY.profile);
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tx(T[el.dataset.t]); });
  document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = tx(T[el.dataset.ph]); });
  $("sendBtn").textContent = tx(resent ? T.sendAgain : T.send);
  $("updgo").textContent = tx(T.reload);
  $("concernChips").innerHTML = chipsHtml(CONCERNS, true);
  $("typeChips").innerHTML = chipsHtml(TYPES);
  $("allergyChips").innerHTML = chipsHtml(ALLERGY);
  if ($("chemChips")) $("chemChips").innerHTML = chipsHtml(OPT.chemical);
  paintConcerns(); paintSingle("typeChips", skinType); if ($("chemChips")) paintSingle("chemChips", chem); paintAllergy();
  if (lastAnswers && !$("done").hidden) showDone(lastAnswers);
}

$("concernChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const v = b.dataset.v, i = concerns.indexOf(v);
  if (i >= 0) concerns.splice(i, 1);
  else if (concerns.length < 2) concerns.push(v);
  else return;
  if (v === OTHER && i < 0) setTimeout(() => $("a-concernOther").focus(), 30);
  $("q-concerns").classList.remove("bad");
  paintConcerns(); saveDraft();
});
if ($("chemChips")) $("chemChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  chem = b.dataset.v;
  $("q-chem").classList.remove("bad");
  paintSingle("chemChips", chem); saveDraft();
});
$("typeChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  skinType = skinType === b.dataset.v ? "" : b.dataset.v;
  $("q-type").classList.remove("bad");
  paintSingle("typeChips", skinType); saveDraft();
});
$("allergyChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  allergy = b.dataset.v;
  if (allergy === "yes") setTimeout(() => $("a-allergies").focus(), 30);
  $("q-allergy").classList.remove("bad");
  paintAllergy(); saveDraft();
});
["a-name", "a-email", "a-routine", "a-concernOther", "a-allergies"].forEach((id) => {
  $(id).addEventListener("input", () => { $(id).closest(".q").classList.remove("bad"); saveDraft(); });
});

/* A half-filled form survives a reload (the page reloads itself when a newer version is out). */
function saveDraft(){
  const d = { concerns, skinType, allergy, chem };
  ["a-name", "a-email", "a-routine", "a-concernOther", "a-allergies"].forEach((id) => { d[id] = $(id).value; });
  try { sessionStorage.setItem(DRAFT, JSON.stringify(d)); } catch (e) {}
}
function loadDraft(){
  let d = null;
  try { d = JSON.parse(sessionStorage.getItem(DRAFT) || "null"); } catch (e) {}
  if (!d) return;
  const ok = (list, v) => list.some((o) => o[0] === v);
  concerns = (d.concerns || []).filter((c) => ok(CONCERNS, c)).slice(0, 2);
  skinType = ok(TYPES, d.skinType) ? d.skinType : "";
  allergy = d.allergy === "yes" || d.allergy === "no" ? d.allergy : "";
  chem = ok(OPT.chemical, d.chem) ? d.chem : "";
  ["a-name", "a-email", "a-routine", "a-concernOther", "a-allergies"].forEach((id) => { if (typeof d[id] === "string") $(id).value = d[id]; });
}

function collect(){
  const other = $("a-concernOther").value.trim();
  return {
    name: $("a-name").value.trim(),
    email: $("a-email").value.trim(),
    concerns: concerns.map((c) => c === OTHER ? (other ? "Other: " + other : "Other") : c),
    concernOther: concerns.indexOf(OTHER) >= 0 ? other : "",
    type: skinType,
    chemical: TYPE === "hair" ? chem : "",
    routine: $("a-routine").value.trim(),
    hasAllergy: allergy,
    allergies: allergy === "yes" ? $("a-allergies").value.trim() : "",
    lang: L ? "zh" : "en",
  };
}

function validate(a){
  const bad = [];
  if (!a.name) bad.push("q-name");
  if (a.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email)) bad.push("q-email");
  if (!concerns.length || (concerns.indexOf(OTHER) >= 0 && !a.concernOther)) {
    $("concernErr").textContent = tx(concerns.length ? T.errOther : T.errPick);
    bad.push("q-concerns");
  }
  if (!a.type) bad.push("q-type");
  if (TYPE === "hair" && !a.chemical) bad.push("q-chem");
  if (!a.routine) bad.push("q-routine");
  if (!allergy || (allergy === "yes" && !a.allergies)) {
    $("allergyErr").textContent = tx(allergy ? T.errAllergy : T.errChoose);
    bad.push("q-allergy");
  }
  document.querySelectorAll(".q").forEach((q) => q.classList.toggle("bad", bad.indexOf(q.id) >= 0));
  if (bad.length) $(bad[0]).scrollIntoView({ behavior: "smooth", block: "center" });
  return !bad.length;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (sending) return;
  const a = collect();
  $("formErr").style.display = "none";
  if (!validate(a)) return;
  sending = true;
  $("sendBtn").disabled = true; $("sendBtn").textContent = tx(T.sending);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "submit", event: EVENT, type: TYPE, answers: a }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "The server did not accept the answers");
    try { sessionStorage.removeItem(DRAFT); } catch (err) {}
    saveGuest(a.name, a.email);
    try {
      const done = JSON.parse(localStorage.getItem(DONE) || "{}");
      done[TYPE] = j.submittedAt || new Date().toISOString();
      localStorage.setItem(DONE, JSON.stringify(done));
    } catch (err) {}
    lastAnswers = a;
    $("form").hidden = true; $("done").hidden = false;
    showDone(a);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    $("formErr").textContent = tx(T.sendFail).replace("{e}", err.message);
    $("formErr").style.display = "block";
    $("formErr").scrollIntoView({ behavior: "smooth", block: "center" });
  } finally {
    sending = false;
    $("sendBtn").disabled = false; $("sendBtn").textContent = tx(resent ? T.sendAgain : T.send);
  }
});

function showDone(a){
  const first = a.name.split(/\s+/)[0];
  $("doneTitle").textContent = tx(T.doneTitle).replace("{name}", first);
  $("doneSub").textContent = tx(T.doneSub).replace("{station}", tx(COPY.station));
  const rows = [
    [tx(T.topConcerns), a.concerns.map((c) => '<span class="tag">' + esc(EventI18n.label(CONCERNS, c, L)) + "</span>").join("")],
    [tx(COPY.typeKey), esc(EventI18n.label(TYPES, a.type, L))],
  ].concat(a.chemical ? [[tx(T.chemK), esc(EventI18n.label(OPT.chemical, a.chemical, L))]] : []).concat([
    [tx(T.routineK), esc(a.routine)],
    [tx(T.allergiesK), a.hasAllergy === "yes" ? esc(a.allergies) : tx(T.none)],
  ]);
  $("profile").innerHTML = rows.map((r) => '<div class="pr"><div class="pr-k">' + esc(r[0]) + '</div><div class="pr-v">' + r[1] + "</div></div>").join("");
}

$("againBtn").addEventListener("click", () => {
  $("done").hidden = true; $("form").hidden = false;
  resent = true; $("sendBtn").textContent = tx(T.sendAgain);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

EventI18n.menu($("langMenu"), (lang) => { L = lang; paintText(); paintVer(); });

loadDraft();
(function(){
  const g = readGuest();
  if (!$("a-name").value && g.name) $("a-name").value = g.name;
  if (!$("a-email").value && g.email) $("a-email").value = g.email;
})();
paintText();

/* Always the newest version: see DiamondA70/_skills/app-qa/references/self-update.md */
let stale = false, checkedAt = 0, triedAt = 0, staleKey = "";
function busy(){
  const a = document.activeElement;
  return sending || !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value);
}
function paintVer(){
  const loc = L ? "zh-CN" : "en-US";
  const when = (t) => new Date(t).toLocaleString(loc, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const txt = "Version " + when(BUILD) + (stale ? " · a newer version is out, reloading"
    : checkedAt ? " · the newest (checked " + new Date(checkedAt).toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" }) + ")" : "");
  document.querySelectorAll(".ver").forEach((el) => { el.textContent = txt; el.classList.toggle("old", stale); });
}
function freshen(){
  if (!/^https?:$/.test(location.protocol) || document.hidden || Date.now() - triedAt < 8000) return;
  triedAt = Date.now();
  fetch(location.pathname + "?latest=" + Date.now(), { cache: "no-store" })
    .then((r) => r.ok ? r.text() : "")
    .then((html) => {
      const m = /const BUILD = "([^"]+)";/.exec(html);
      if (!m || !SELF) return;
      checkedAt = Date.now();
      stale = m[1] >= BUILD && html.indexOf(SELF) < 0;
      staleKey = m[1] + ":" + html.length;
      paintVer(); reloadWhenSafe();
    }).catch(() => {});
}
function reloadWhenSafe(){
  const bar = $("upd");
  if (!stale) { bar.hidden = true; return; }
  let tried = ""; try { tried = sessionStorage.getItem("assess-tried") || ""; } catch (e) {}
  if (tried !== staleKey && !busy() && $("done").hidden) { reloadNow(); return; }
  $("updt").textContent = tx(tried === staleKey ? T.newerTried : T.newer);
  bar.hidden = false;
}
function reloadNow(){
  saveDraft();
  try { sessionStorage.setItem("assess-tried", staleKey); } catch (e) {}
  const q = new URLSearchParams(location.search); q.set("v", Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
}
$("updgo").onclick = reloadNow;
paintVer(); freshen();
setInterval(freshen, 60000);
setInterval(() => { if (stale) reloadWhenSafe(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) freshen(); });
addEventListener("focus", freshen);
addEventListener("pageshow", (e) => { if (e.persisted) { triedAt = 0; freshen(); } });
</script>
</body>
</html>
