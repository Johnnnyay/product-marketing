<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quality of health is quality of life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <style>
    :root {
      --white:        #ffffff;
      --off-white:    #F7F9F7;
      --gray-100:     #F0F3F0;
      --gray-200:     #E4E9E5;
      --gray-300:     #d1d5db;
      --gray-400:     #9ca3af;
      --gray-500:     #6E7B74;
      --gray-600:     #55605A;
      --gray-800:     #2A332D;
      /* Low-saturation sage palette */
      --navy:         #3D5A4C;   /* deep sage — primary surface */
      --navy-hover:   #47695a;
      --green:        #5C8A6E;   /* muted accent */
      --green-mid:    #6F9E80;
      --green-light:  #EDF2EE;
      --purple:       #6b46a0;
      --purple-light: #f0eafb;
      --blue:         #2563eb;
      --blue-light:   #eff6ff;
      --amber:        #b45309;
      --amber-light:  #fffbeb;
      --red:          #dc2626;
      --shadow-xs:    0 1px 2px rgba(0,0,0,0.05);
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:       0 4px 16px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 28px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
      --radius-sm:    8px;
      --radius:       12px;
      --radius-lg:    18px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--off-white);
      color: var(--gray-800);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    #site-header {
      background: var(--navy);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .header-top {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Row 2 — tools. Separate row so the slogan above is never truncated,
       and so the partner/IBO controls have room on a narrow screen. */
    .header-tools {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 9px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-tools-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .logo {
      color: white;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      user-select: none;
    }
    .logo { display: flex; align-items: center; text-decoration: none; min-width: 0; flex: 1; }
    .logo-tag {
      font-family: 'Caveat', 'Segoe Script', cursive;
      font-size: 25px; font-weight: 600; color: rgba(255,255,255,0.96);
      letter-spacing: 0.3px; line-height: 1.15;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding-right: 12px; padding-top: 2px;
    }
    .logo-tag.zh {
      font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', cursive;
      font-size: 21px; letter-spacing: 1.5px; padding-top: 1px;
    }

    /* icon buttons */
    .icon-btn {
      background: none; border: none; cursor: pointer; padding: 8px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); }
    .icon-btn svg {
      width: 19px; height: 19px; fill: none; stroke: rgba(255,255,255,0.85);
      stroke-width: 2; stroke-linecap: round;
    }
    .icon-btn.on svg { stroke: #fff; }

    /* slide-down search */
    .search-bar {
      max-height: 0; overflow: hidden;
      transition: max-height 0.22s ease;
      background: rgba(0,0,0,0.14);
    }
    .search-bar.open { max-height: 70px; }
    .search-bar-inner { padding: 8px 24px 10px; }
    .search-bar-inner {
      max-width: 1280px; margin: 0 auto; padding: 10px 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .search-icon { width: 17px; height: 17px; fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 2; flex: 0 0 auto; }
    #search-input {
      flex: 1; background: none; border: none; color: white;
      font-family: inherit; font-size: 15px; padding: 6px 0; outline: none;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.45); }
    .search-close {
      background: none; border: none; color: rgba(255,255,255,0.5);
      font-size: 15px; cursor: pointer; padding: 4px 6px;
    }
    .search-close:hover { color: white; }
    .logo .brand-tag {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      margin-left: 8px;
      letter-spacing: 0;
    }


    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.16);
      color: rgba(255,255,255,0.85);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.18s;
      white-space: nowrap;
    }
    .lang-btn i { font-style: normal; opacity: 0.4; margin: 0 3px; }
    .lang-btn:hover { background: rgba(255,255,255,0.2); }
    .lang-btn.zh-active { background: rgba(255,255,255,0.15); }

    .lang-wrap { position: relative; }
    .lang-btn { display: inline-flex; align-items: center; gap: 5px; }
    .lang-caret {
      width: 0; height: 0; border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent; border-top: 4px solid currentColor;
      opacity: .65;
    }
    .lang-menu {
      display: none; position: absolute; top: calc(100% + 7px); right: 0; z-index: 300;
      background: white; border: 1px solid var(--gray-200); border-radius: 10px;
      box-shadow: var(--shadow-lg); padding: 5px; min-width: 150px;
    }
    .lang-menu.open { display: block; }
    .lang-opt {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; border-radius: 7px; padding: 8px 10px;
      cursor: pointer; text-align: left; font: inherit;
      font-size: 13.5px; color: var(--gray-700); white-space: nowrap;
    }
    .lang-opt:hover { background: var(--green-light); }
    .lang-opt.on { background: var(--green-light); color: var(--navy); font-weight: 650; }
    .lang-opt-label {
      flex: none; width: 26px; font-size: 10.5px; font-weight: 700;
      letter-spacing: .04em; color: var(--green); text-transform: uppercase;
    }

    /* .cat-nav / .cat-tab replaced by .primary-nav / .secondary-nav system */

    /* ─── CATEGORY HERO ─── */
    .cat-hero {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 28px 24px;
      display: none;
    }
    .cat-hero.visible { display: block; }
    .cat-hero-inner { max-width: 1280px; margin: 0 auto; }
    .cat-hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .cat-hero h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .cat-hero p {
      font-size: 14px;
      color: var(--gray-500);
      max-width: 700px;
      line-height: 1.65;
    }
    /* Category accent colors for hero */
    .hero-nutrition .cat-hero-label { color: var(--green); }
    .hero-beauty    .cat-hero-label { color: var(--purple); }
    .hero-care      .cat-hero-label { color: var(--blue); }
    .hero-home      .cat-hero-label { color: var(--amber); }

    /* ─── MAIN + GRID ─── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .section-count {
      font-size: 13px;
      color: var(--gray-400);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .tile-deep {
      position: absolute; top: 7px; right: 7px; z-index: 3;
      background: rgba(61,90,76,.92); color: #fff;
      font-size: 9px; letter-spacing: .08em; font-weight: 600;
      padding: 2px 6px; border-radius: 4px; line-height: 1.4;
      pointer-events: none;
    }
    /* ─── PROTOCOL (清调补养) ─── */
    .protocol { margin: 0 0 34px; }

    .pr-intro {
      background: var(--green-light);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 16px;
    }
    .pr-intro-label {
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      font-weight: 700; color: var(--green); margin-bottom: 8px;
    }
    .pr-intro p {
      margin: 0; font-size: 14px; line-height: 1.75; color: var(--gray-700);
    }

    .pr-stage {
      border: 1px solid var(--gray-200); border-radius: 11px;
      margin-bottom: 10px; background: white; overflow: hidden;
    }
    .pr-stage-head {
      display: flex; align-items: center; gap: 13px; width: 100%;
      padding: 11px 16px; background: none; border: 0; cursor: pointer;
      text-align: left; font: inherit;
    }
    .pr-stage-head:hover { background: var(--off-white); }
    .pr-glyph {
      flex: none;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--navy); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; line-height: 1;
    }
    .pr-stage[data-stage="regulate"]   .pr-glyph { background: var(--green); }
    .pr-stage[data-stage="supplement"] .pr-glyph { background: var(--green-mid); }
    .pr-stage[data-stage="sustain"]    .pr-glyph { background: #8FB09C; }
    .pr-stage-text { flex: 1; min-width: 0; }
    .pr-stage-title {
      display: block; font-size: 14.5px; font-weight: 650; color: var(--navy);
      line-height: 1.3;
    }
    .pr-stage-sub {
      display: block; font-size: 12px; color: var(--gray-500); margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pr-count {
      flex: none; font-size: 11px; font-weight: 700; color: var(--navy);
      background: var(--green-light); border-radius: 999px; padding: 2px 9px;
    }
    .pr-chev {
      flex: none; color: var(--gray-400); font-size: 11px;
      transition: transform .18s ease;
    }
    .pr-stage.open .pr-chev { transform: rotate(180deg); }

    .pr-body { display: none; padding: 0 16px 8px; }
    .pr-stage.open .pr-body { display: block; }

    .pr-row {
      display: grid;
      /* Prose gets the wider column. At ~300px the reasoning wrapped to 10+ lines
         and the single product sat in a half-empty band; this roughly halves the
         row height and puts the dead space to work. */
      grid-template-columns: minmax(0, 520px) minmax(0, 1fr);
      gap: 28px;
      padding: 15px 0;
      border-top: 1px dashed var(--gray-200);
    }
    .pr-why p {
      margin: 0; font-size: 13px; line-height: 1.7; color: var(--gray-600);
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
      overflow: hidden;
    }
    .pr-why.open p { -webkit-line-clamp: unset; overflow: visible; }
    .pr-more {
      background: none; border: 0; padding: 4px 0 0; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 600; color: var(--green);
    }
    .pr-more:hover { text-decoration: underline; }
    .pr-tags { display: flex; gap: 5px; margin-bottom: 7px; }
    .pr-route, .pr-lead {
      font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
      font-weight: 700; padding: 2px 7px; border-radius: 4px;
    }
    .pr-route { background: var(--gray-100); color: var(--gray-500); }
    .pr-lead  { background: var(--navy); color: white; }

    /* Compact line items instead of full cards, tiled so a wide screen is used */
    .pr-items {
      display: grid;
      /* Two per row reads comfortably at this column width; three crowds the
         names into ellipsis. A third item wraps to a second line. */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px; align-content: start;
    }
    .pr-item {
      min-height: 46px;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--gray-200); border-radius: 9px;
      padding: 5px 7px 5px 5px; background: white;
    }
    .pr-item.picked { border-color: var(--green); background: var(--green-light); }
    .pr-item-main {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
      background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
      font: inherit;
    }
    .pr-thumb {
      flex: none; width: 34px; height: 34px; border-radius: 6px;
      background: var(--gray-100); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .pr-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .pr-item-text { min-width: 0; }
    .pr-item-name {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      font-size: 12.5px; font-weight: 600; color: var(--gray-800);
      line-height: 1.25; overflow: hidden;
    }
    .pr-item-meta {
      display: block; font-size: 10.5px; color: var(--gray-500); margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* The shared stepper is built to sit on a product photo: white glyphs on a
       translucent dark pill. On the light protocol row that reads as grey-on-grey,
       so this row gets its own light-background treatment. */
    .pr-item-add { flex: none; display: flex; align-items: center; gap: 2px; }
    .pr-item-add .p-step-btn {
      width: 26px; height: 26px;
      background: white; border: 1.5px solid var(--green-mid);
      color: var(--navy); font-weight: 600;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .pr-item-add .p-step-btn:hover { background: var(--green-light); transform: scale(1.08); }
    .pr-item-add .p-step-btn:disabled { opacity: .35; }
    .pr-item-add .p-step-qty {
      color: var(--navy); font-size: 13px; font-weight: 800; min-width: 20px;
    }

    /* ─── EDUCATION (reader: two courses, a list of lessons, one page per lesson) ─── */
    .edu-view { margin: 0; }
    .edu-wrap { max-width: 1000px; margin: 0 auto; padding: 28px 24px 56px; }
    .edu-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
    .edu-h1 { font-size: 30px; font-weight: 700; line-height: 1.25; color: var(--gray-800); margin: 6px 0 6px; letter-spacing: -0.3px; }
    .edu-sub { font-size: 14.5px; color: var(--gray-500); margin-bottom: 26px; }
    .edu-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .edu-card { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 30px 30px 26px; min-height: 240px; background: #3D5A4C; color: #fff; border: 0; border-radius: 18px; cursor: pointer; font: inherit; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .edu-card:nth-child(2) { background: #2F4A3D; }
    .edu-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .edu-card-kicker { font-size: 12.5px; letter-spacing: 0.05em; color: rgba(255,255,255,0.78); }
    .edu-card-title { font-size: 30px; font-weight: 700; line-height: 1.25; }
    .edu-card-sub { font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.88); }
    .edu-card-go { margin-top: auto; font-size: 14px; font-weight: 600; }
    .edu-back { background: none; border: 0; padding: 0; margin-bottom: 18px; font: inherit; font-size: 14px; font-weight: 600; color: var(--green); cursor: pointer; }
    .edu-back:hover { text-decoration: underline; }
    .edu-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--gray-200); }
    .edu-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px 6px; background: none; border: 0; border-bottom: 1px solid var(--gray-200); text-align: left; cursor: pointer; font: inherit; color: inherit; }
    .edu-item:hover { background: var(--green-light); }
    .edu-item-n { flex: 0 0 38px; font-size: 14px; font-weight: 700; color: var(--green); text-align: right; }
    .edu-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .edu-item-title { font-size: 16.5px; font-weight: 600; color: var(--gray-800); line-height: 1.45; }
    .edu-item-meta { font-size: 12.5px; color: var(--gray-500); }
    .edu-item-chev { color: var(--gray-400); font-size: 20px; }
    .edu-read { max-width: 720px; }
    .edu-kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--green); }
    .edu-lesson-title { font-size: 28px; font-weight: 700; line-height: 1.35; color: var(--gray-800); margin: 8px 0 6px; }
    .edu-speaker { font-size: 15px; color: var(--gray-500); }
    .edu-head { padding-bottom: 22px; margin-bottom: 28px; border-bottom: 1px solid var(--gray-200); }
    .edu-text { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Inter, sans-serif; font-size: 17.5px; line-height: 2; letter-spacing: 0.015em; color: var(--gray-800); }
    .edu-text p { margin: 0 0 1.2em; }
    .edu-text .edu-aside { font-size: 15px; font-style: italic; line-height: 1.7; color: var(--gray-500); background: var(--gray-100); border-radius: 10px; padding: 10px 14px; }
    .edu-note { margin: 34px 0 0; font-size: 12.5px; color: var(--gray-500); }
    .edu-text.en { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; line-height: 1.75; letter-spacing: 0; }
    .edu-text .term { position: relative; cursor: help; border-bottom: 1.5px dotted var(--green); color: var(--navy); outline: none; }
    .edu-text .term-q { display: inline-block; margin-left: 2px; width: 14px; height: 14px; line-height: 14px; border-radius: 50%; background: var(--green-light); color: var(--green); font-size: 10px; font-weight: 700; text-align: center; vertical-align: 2px; }
    .edu-text .term-pop { display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 400; width: min(320px, 80vw); background: #fff; border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px 14px; font-size: 13.5px; line-height: 1.55; color: var(--gray-600); font-style: normal; }
    .edu-text .term:hover .term-pop, .edu-text .term:focus .term-pop, .edu-text .term:focus-within .term-pop { display: block; }
    .edu-text .term-pop a { display: inline-block; margin-top: 6px; color: var(--green); font-weight: 600; text-decoration: none; }
    .edu-text .term-pop a:hover { text-decoration: underline; }
    .edu-fallback { margin: 0 0 22px; padding: 12px 14px; border-radius: 10px; background: var(--gray-100); font-size: 13.5px; color: var(--gray-600); }
    .edu-pn { display: flex; gap: 14px; margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--gray-200); }
    .edu-pn-btn { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; background: #fff; border: 1px solid var(--gray-200); border-radius: 12px; text-align: left; cursor: pointer; font: inherit; }
    .edu-pn-btn.next { text-align: right; }
    .edu-pn-btn:hover { background: var(--green-light); border-color: var(--green); }
    .edu-pn-dir { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-400); }
    .edu-pn-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--navy); }
    .ev-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .ev-card { display: flex; flex-direction: column; background: #fff; border-radius: 18px; padding: 24px 24px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border-top: 4px solid var(--green); }
    .ev-card.past { border-top-color: var(--gray-200); }
    .ev-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .ev-date { font-size: 13px; font-weight: 600; color: var(--green); }
    .ev-status { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--gray-100); color: var(--gray-500); }
    .ev-status.up { background: var(--green-light); color: var(--navy); }
    .ev-status.today { background: var(--green); color: #fff; }
    .ev-title { font-size: 24px; font-weight: 700; line-height: 1.25; color: var(--gray-800); }
    .ev-place { font-size: 13.5px; color: var(--gray-500); margin-top: 4px; }
    .ev-blurb { font-size: 14.5px; line-height: 1.6; color: var(--gray-600); margin: 12px 0 18px; }
    .ev-actions { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .ev-open { background: var(--navy); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; }
    .ev-open:hover { background: #47695a; }
    .ev-copy { background: none; border: 1.5px solid var(--gray-200); color: var(--navy); font: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
    .ev-copy:hover { border-color: var(--green); }
    @media (max-width: 760px) { .ev-cards { grid-template-columns: 1fr; } .ev-card { padding: 20px 18px 18px; } .ev-title { font-size: 21px; } }
    .edu-loading, .edu-error { padding: 64px 0; text-align: center; font-size: 15px; color: var(--gray-500); }
    .edu-error button { margin-top: 14px; padding: 9px 20px; border-radius: 999px; border: 1.5px solid var(--navy); background: none; color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; }
    @media (max-width: 760px) {
      .edu-wrap { padding: 18px 16px 44px; }
      .edu-h1 { font-size: 25px; }
      .edu-cards { grid-template-columns: 1fr; gap: 14px; }
      .edu-card { min-height: 0; padding: 24px 22px 22px; }
      .edu-card-title { font-size: 26px; }
      .edu-lesson-title { font-size: 23px; }
      .edu-text { font-size: 17px; line-height: 1.95; }
      .edu-item { gap: 12px; padding: 14px 2px; }
      .edu-item-n { flex-basis: 30px; }
      .edu-pn { flex-direction: column; }
    }

    @media (max-width: 760px) {
      .pr-row { grid-template-columns: 1fr; gap: 11px; padding: 13px 0; }
      .pr-why p { -webkit-line-clamp: 4; }
      .pr-items { grid-template-columns: 1fr; gap: 7px; }
      .pr-intro { padding: 15px 16px; }
      .pr-intro p { font-size: 13.5px; }
      .pr-stage-head { padding: 12px 13px; gap: 10px; }
      .pr-stage-sub { display: none; }
      .pr-body { padding: 0 13px 6px; }
    }

    /* ─── PRODUCT CARD ─── */
    .p-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.18s;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--gray-200);
    }
    .p-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    .p-card:active { transform: translateY(-1px); }

    /* Image area */
    .p-img {
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .p-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .p-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
    }
    .p-initial {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .p-brand-small {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }

    /* Category theme backgrounds */
    .theme-nutrition .p-img { background: linear-gradient(135deg, #e0f2ea 0%, #c8e8d9 100%); }
    .theme-nutrition .p-initial { color: var(--green); }
    .theme-nutrition .p-brand-small { color: var(--green); }

    .theme-beauty .p-img { background: linear-gradient(135deg, #ede9f7 0%, #ddd2f0 100%); }
    .theme-beauty .p-initial { color: var(--purple); }
    .theme-beauty .p-brand-small { color: var(--purple); }

    .theme-care .p-img { background: linear-gradient(135deg, #dbeafe 0%, #c3d7f8 100%); }
    .theme-care .p-initial { color: var(--blue); }
    .theme-care .p-brand-small { color: var(--blue); }

    .theme-home .p-img { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
    .theme-home .p-initial { color: var(--amber); }
    .theme-home .p-brand-small { color: var(--amber); }

    /* Card body */
    .p-body {
      padding: 14px 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .p-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .p-brand { color: var(--green); }
    .theme-beauty    .p-brand { color: var(--purple); }
    .theme-care      .p-brand { color: var(--blue); }
    .theme-home      .p-brand { color: var(--amber); }

    .p-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .p-tagline {
      font-size: 12.5px;
      color: var(--gray-500);
      line-height: 1.5;
      flex: 1;
    }

    /* Card footer pricing */
    .p-pricing {
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--gray-100);
      margin-top: 12px;
    }
    .p-price-col {}
    .p-price-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 2px;
    }
    .p-price-ibo {
      font-size: 17px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1;
    }
    .p-price-retail {
      font-size: 11px;
      color: var(--gray-400);
      margin-top: 2px;
    }
    .p-pv-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--green);
      color: white;
      white-space: nowrap;
    }
    .p-pv-badge.dim { background: var(--gray-300); }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,20,35,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-imgbar {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      position: relative;
      overflow: hidden;
    }
    .modal-imgbar img { width: 100%; height: 100%; object-fit: cover; }
    .modal-imgbar-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .modal-initial {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .modal-brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .theme-nutrition .modal-imgbar { background: linear-gradient(135deg, #d1ead9 0%, #b8dfc8 100%); }
    .theme-nutrition .modal-initial { color: var(--green); }
    .theme-nutrition .modal-brand-tag { color: var(--green); }
    .theme-beauty    .modal-imgbar { background: linear-gradient(135deg, #ddd3f1 0%, #cbbde9 100%); }
    .theme-beauty    .modal-initial { color: var(--purple); }
    .theme-beauty    .modal-brand-tag { color: var(--purple); }
    .theme-care      .modal-imgbar { background: linear-gradient(135deg, #c7d9f8 0%, #afc8f5 100%); }
    .theme-care      .modal-initial { color: var(--blue); }
    .theme-care      .modal-brand-tag { color: var(--blue); }
    .theme-home      .modal-imgbar { background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%); }
    .theme-home      .modal-initial { color: var(--amber); }
    .theme-home      .modal-brand-tag { color: var(--amber); }

    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: rgba(0,0,0,0.2);
      border: none;
      color: white;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.4); }

    .modal-head {
      padding: 18px 22px 0;
    }
    .modal-brand-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .modal-brand-label { color: var(--green); }
    .theme-beauty    .modal-brand-label { color: var(--purple); }
    .theme-care      .modal-brand-label { color: var(--blue); }
    .theme-home      .modal-brand-label { color: var(--amber); }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--gray-800);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .modal-tagline {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .modal-pricing-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: var(--gray-100);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 0 22px 18px;
    }
    .modal-price-cell { text-align: center; }
    .modal-price-lbl {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 4px;
    }
    .modal-price-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--gray-800);
    }
    .modal-price-val.pv { color: var(--green); }
    .modal-price-val.retail {
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-400);
    }
    .modal-price-val.na { color: var(--gray-300); font-size: 16px; }

    .modal-body { padding: 0 22px 22px; }

    .modal-section { margin-bottom: 16px; }
    .modal-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 6px;
    }
    .modal-section-text {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.65;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-notion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: white;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-notion:hover { background: var(--navy-hover); }
    .btn-notion svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ─── CALCULATOR SECTION ─── */
    .calc-section {
      background: white;
      border-top: 1px solid var(--gray-200);
      padding: 52px 24px;
      text-align: center;
    }
    .calc-inner { max-width: 520px; margin: 0 auto; }
    .calc-section h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--gray-800);
      margin-bottom: 8px;
    }
    .calc-section .calc-sub {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .calc-coming {
      border: 2px dashed var(--gray-200);
      border-radius: var(--radius);
      padding: 36px 24px;
      color: var(--gray-400);
      font-size: 14px;
    }
    .calc-coming .calc-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .calc-milestone {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* ─── FOOTER ─── */
    footer {
      background: var(--navy);
      padding: 20px 24px;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 24px;
      text-align: center;
      color: var(--gray-400);
    }
    .empty-state p { font-size: 15px; }

    /* ─── PRIMARY NAV (mode selector) ─── */
    .primary-nav {
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .primary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
    }
    .primary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      padding: 12px 22px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
      letter-spacing: 0.2px;
    }
    .primary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 22px; right: 22px;
      height: 2px;
      background: #93c5fd;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .primary-tab:hover { color: rgba(255,255,255,0.85); }
    .primary-tab.active { color: white; }
    .primary-tab.active::after { transform: scaleX(1); }

    /* ─── SECONDARY NAV (contextual sub-tabs) ─── */
    .secondary-nav {
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: none;
    }
    .secondary-nav.visible { display: block; }
    .secondary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .secondary-nav-scroll::-webkit-scrollbar { display: none; }
    .secondary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
    }
    .secondary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 2px;
      background: white;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .secondary-tab:hover { color: rgba(255,255,255,0.8); }
    .secondary-tab.active { color: white; }
    .secondary-tab.active::after { transform: scaleX(1); }

    /* ─── PRODUCT IMAGE FIX ─── */
    .p-img img { object-fit: contain !important; padding: 8px; background: white; }
    .modal-imgbar img { object-fit: contain !important; padding: 12px; background: white; }

    /* ─── HEADER CALC WIDGET ─── */
    .header-calc {
      display: none;
      align-items: center;
      background: var(--green);
      border: none;
      border-radius: 18px;
      padding: 0 4px 0 2px;
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }
    .header-calc { display: flex; }
    .header-calc.idle { background: rgba(255,255,255,0.12); box-shadow: none; }
    .header-calc.idle .header-calc-clear { display: none; }
    .header-calc.idle .calc-caret { opacity: 0.55; }
    .header-calc-onetime {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 8px;
    }
    .header-calc-clear {
      background: rgba(255,255,255,0.12);
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 14px;
      transition: background 0.15s;
      margin-left: 2px;
    }
    .header-calc-clear:hover { background: rgba(255,255,255,0.22); color: white; }

    /* ─── CARD SELECTION ─── */
    .p-card.selected {
      box-shadow: 0 0 0 2px var(--green), var(--shadow-sm);
    }
    .p-stepper {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      display: flex; align-items: center;
    }
    .p-step-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.55);
      color: white; font-size: 16px; font-weight: 500; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      padding: 0; flex: 0 0 auto;
    }
    .p-step-btn:hover { background: rgba(0,0,0,0.55); transform: scale(1.1); }
    .p-stepper.on {
      background: var(--green); border-radius: 16px; padding: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
    }
    .p-stepper.on .p-step-btn {
      width: 24px; height: 24px; background: rgba(255,255,255,0.18);
      border-color: transparent; font-size: 15px;
    }
    .p-stepper.on .p-step-btn:hover { background: rgba(255,255,255,0.34); }
    .p-step-btn:disabled { opacity: 0.32; cursor: default; transform: none; }
    .p-step-qty {
      color: white; font-size: 12.5px; font-weight: 800;
      min-width: 24px; text-align: center; letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }

    /* ─── DAILY COST ─── */
    .p-price-ibo-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .p-daily-cost {
      font-size: 11px;
      font-weight: 600;
      color: var(--green-mid);
    }
    .p-supply {
      font-size: 10px; font-weight: 600; color: var(--gray-500);
      background: var(--gray-100); padding: 1px 6px; border-radius: 4px;
    }
    .p-onetime-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--amber);
      background: var(--amber-light);
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.2px;
    }

    /* ─── CALC PANEL + MODE BUTTON + SOLUTION HERO ─── */
    .header-top { position: relative; }
    .header-calc-summary {
      background: none; border: none; color: white; font-family: inherit;
      font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 2px 4px 8px;
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .calc-caret {
      width: 0; height: 0; display: inline-block;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-top: 5px solid rgba(255,255,255,0.85);
    }
    .search-wrap { flex: 1; max-width: 340px; margin: 0 18px; }
    #search-input {
      width: 100%; background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 18px;
      color: white; font-family: inherit; font-size: 13px;
      padding: 7px 14px; outline: none; transition: background 0.15s;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.4); }
    #search-input:focus { background: rgba(255,255,255,0.2); }
    @media (max-width: 600px) { .search-wrap { margin: 0 8px; } }
    .calc-panel {
      display: none; position: absolute; top: 100%; right: 24px; z-index: 200;
      background: white; border-radius: var(--radius); box-shadow: var(--shadow-lg);
      width: 344px; padding: 14px 16px 12px; border: 1px solid var(--gray-200);
      max-height: 78vh; overflow-y: auto;
    }
    .calc-panel.open { display: block; }
    .calc-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; color: var(--gray-600); padding: 5px 0;
      border-bottom: 1px dashed var(--gray-200);
    }
    .calc-row.strong { color: var(--gray-800); font-weight: 700; font-size: 14px; }
    .calc-row.pv span:last-child { color: var(--green); font-weight: 700; }
    .calc-row.onetime span:last-child { color: var(--amber); font-weight: 600; }
    .calc-row.ship { border-bottom: none; }
    .calc-sec {
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;

    .sensitive-note{
  max-width:760px;margin:26px auto 0;padding:14px 18px;
  border-left:3px solid var(--green-mid);background:var(--green-light);

.footer-disclaimer {
      max-width: 760px; margin: 0 auto; font-size: 11px; line-height: 1.6;
      color: var(--gray-400); text-align: center; padding: 4px 16px 0;

    /* ─── SUB-LEVEL TILES ─── */
    .tile-strip {
      background: white; border-bottom: 1px solid var(--gray-200);
      padding: 16px 0 18px;
      position: relative;
    }
    /* Nothing signalled that this row scrolls, so the tiles past the fold went
       unseen. A fade at each live edge plus an arrow makes it obvious. */
    .tile-strip-inner { max-width: 1280px; margin: 0 auto; position: relative; }
    .tile-strip-inner::before, .tile-strip-inner::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 52px;
      pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 2;
    }
    .tile-strip-inner::before { left: 0;  background: linear-gradient(to right, white 22%, rgba(255,255,255,0)); }
    .tile-strip-inner::after  { right: 0; background: linear-gradient(to left,  white 22%, rgba(255,255,255,0)); }
    .tile-strip.can-left  .tile-strip-inner::before { opacity: 1; }
    .tile-strip.can-right .tile-strip-inner::after  { opacity: 1; }

    .tile-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--green); border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      color: white; font-size: 18px; font-weight: 600; line-height: 1; padding: 0 0 2px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .tile-nav:hover { background: var(--navy); }
    .tile-nav:active { transform: translateY(-50%) scale(0.9); }
    /* Sits on the edge of the last visible tile, not out in the page margin. */
    .tile-nav.prev { left: 12px; }
    .tile-nav.next { right: 12px; }
    .tile-strip.can-left  .tile-nav.prev { display: flex; }
    .tile-strip.can-right .tile-nav.next { display: flex; }
    /* Touch devices swipe; the fade alone is enough and an arrow just covers a tile. */
    @media (hover: none) { .tile-nav { display: none !important; } }
    .tile-scroll {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none;
    }
    .tile-scroll::-webkit-scrollbar { display: none; }
    .tile {
      flex: 0 0 auto; width: 168px; border: none; padding: 0;
      background: none; cursor: pointer; font-family: inherit;
      position: relative; border-radius: 16px; overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: var(--shadow-sm); display: block;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .tile-img {
      width: 100%; height: 132px; position: relative; overflow: hidden;
      background: var(--gray-200); display: block;
    }
    .tile-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s ease;
    }
    .tile:hover .tile-img img { transform: scale(1.06); }
    .tile-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(12,20,38,0.82) 0%, rgba(12,20,38,0.32) 45%, rgba(12,20,38,0.06) 100%);
    }
    .tile-label {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 0 12px 11px; text-align: left;
      font-size: 13.5px; font-weight: 700; color: white;
      line-height: 1.25; letter-spacing: -0.2px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.45);
    }
    .tile.active { box-shadow: 0 0 0 3px var(--green), var(--shadow); }
    .tile.active .tile-label::after {
      content: ''; display: block; width: 26px; height: 3px;
      background: var(--green); border-radius: 2px; margin-top: 6px;
    }

    /* Persona narrative blocks */
    .module-narrative {
      max-width: 1280px; margin: 0 auto; padding: 0 24px 4px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;
    }
    .mn-block {
      background: white; border: 1px solid var(--gray-200);
      border-radius: var(--radius); padding: 16px 18px;
    }
    .mn-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.7px;
      text-transform: uppercase; color: var(--green); margin-bottom: 7px;
    }
    .mn-block.gap .mn-label { color: var(--amber); }
    .mn-text { font-size: 13.5px; line-height: 1.65; color: var(--gray-600); }
    main { padding-top: 18px; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    }

    /* ── Tablet / phone ── */
    @media (max-width: 720px) {
      .header-top { padding: 0 14px; height: 48px; }
      /* Slogan gets the full width of its own row, so it can stay readable. */
      .logo-tag { font-size: 19px; }
      .logo-tag.zh { font-size: 17px; }
      .header-tools { padding: 0 14px 8px; gap: 6px; }
      .header-tools-right { gap: 5px; }
      .search-bar-inner { padding: 8px 14px 10px; }

      /* primary nav: equal thirds, no scroll */
      .primary-nav-scroll { padding: 0 6px; }
      .primary-tab { flex: 1 1 0; padding: 12px 4px; font-size: 13px; text-align: center; }

      /* tiles: smaller, snap-scrolling */
      .tile-strip { padding: 12px 0 14px; }
      .tile-scroll {
        padding: 0 14px; gap: 10px;
        scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      }
      .tile { width: 132px; scroll-snap-align: start; }
      .tile-img { height: 104px; }
      .tile-label { font-size: 12.5px; padding: 0 10px 9px; }

      .cat-hero { padding: 20px 16px; }
      .cat-hero h2 { font-size: 22px; }
      .module-narrative { padding: 0 14px 4px; gap: 12px; }
      main { padding: 16px 14px 32px; }
      .product-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .p-img { height: 132px; }
      .p-name { font-size: 13.5px; }
      .p-tagline { -webkit-line-clamp: 2; }
      .p-pricing { padding: 8px 12px 10px; }
      .p-price-ibo { font-size: 15px; }

      /* calculator: full-width sheet docked to the bottom */
      .calc-panel {
        position: fixed; top: auto; bottom: 0; left: 0; right: 0;
        width: auto; border-radius: 18px 18px 0 0;
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
        border: none; border-top: 1px solid var(--gray-200);
      }
      .calc-row { font-size: 14px; padding: 8px 0; }
      .calc-row.strong { font-size: 15.5px; }
      .calc-panel-actions button { padding: 12px 0; font-size: 13.5px; }

      .modal { max-height: 92vh; }
      .modal-pricing-row { padding: 12px 10px; }
      .modal-price-val { font-size: 16px; }
      .hero-stack-btn { width: 100%; padding: 13px 20px; }
    }

    /* ── Small phones ── */
    @media (max-width: 420px) {
      .logo-tag { font-size: 11.5px; white-space: normal; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .header-top { height: 56px; }
      .icon-btn { padding: 7px; }
      .lang-btn { font-size: 11px; padding: 5px 8px; }
      .mode-btn { padding: 5px 6px; }
      .header-calc { font-size: 11.5px; min-width: 0; }
      .header-calc-summary { padding: 4px 2px 4px 8px; min-width: 0; }
      .header-calc-summary span:first-child {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .header-tools { padding: 0 10px 8px; }
      .header-top { padding: 0 10px; }
      .logo-tag { font-size: 17px; }
      .logo-tag.zh { font-size: 15.5px; }
      .primary-tab { font-size: 12px; letter-spacing: -0.2px; }
      .tile { width: 118px; }
      .tile-img { height: 92px; }
      .tile-label { font-size: 11.5px; }
      .product-grid { gap: 10px; }
      .p-img { height: 118px; }
    }

  /* ── HOME ─────────────────────────────────────────────────────── */
  /* One screen, four jobs: start the assessment, open my report, learn from what you feel, see the
     next community event. Then three knowledge cards that read in seconds. */
  .home-view { max-width: 1200px; margin: 0 auto; padding: 22px 24px 40px; }
  .hm-card { border-radius: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .hm-start { min-height: 400px; color: #fff; justify-content: space-between; gap: 24px; padding: 30px 36px 34px; background: #2f4a3d; }
  .hm-start img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hm-start::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,38,30,.62), rgba(20,38,30,.08) 70%), linear-gradient(180deg, rgba(20,38,30,.35) 0%, rgba(20,38,30,0) 30%, rgba(20,38,30,.82) 85%); }
  .hm-start > *:not(img) { position: relative; z-index: 1; }
  .hm-facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .hm-facts span { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; color: #fff; }
  .hm-start-body { display: flex; flex-direction: column; }
  .hm-kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
  .hm-start .hm-kicker { color: #CDEBD5; }
  .hm-start h1 { font-size: 40px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; max-width: 620px; }
  .hm-start p { font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.9); margin: 12px 0 22px; max-width: 520px; }
  .hm-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .hm-btn { background: #fff; color: var(--navy); font-weight: 700; font-size: 15px; padding: 13px 24px; border-radius: 999px; text-decoration: none; transition: transform .15s ease; }
  .hm-btn:hover { transform: translateY(-1px); }
  .hm-btn.ghost { background: rgba(255,255,255,.12); color: #fff; border: 1.5px solid rgba(255,255,255,.7); }
  .hm-btn.ghost:hover { background: rgba(255,255,255,.22); }
  .hm-go { margin-top: auto; padding-top: 10px; font-size: 14px; font-weight: 700; color: var(--navy); }
  .hm-sec-sub { font-size: 13.5px; color: var(--gray-500); margin-top: 3px; }
  .hm-sec { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
  .hm-sec h2 { font-size: 20px; font-weight: 800; color: var(--gray-800); letter-spacing: -.01em; }
  .hm-sec button { background: none; border: 0; font: inherit; font-size: 13.5px; font-weight: 700; color: var(--green); cursor: pointer; white-space: nowrap; }
  .hm-areas { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .hm-area { position: relative; aspect-ratio: 1 / 1.05; border-radius: 16px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--gray-100); font: inherit; }
  .hm-area img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .hm-area:hover img { transform: scale(1.05); }
  .hm-area::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(15,30,22,.78)); }
  .hm-area span { position: absolute; left: 12px; right: 12px; bottom: 11px; z-index: 1; color: #fff; font-size: 15px; font-weight: 700; text-align: left; line-height: 1.25; }
  /* ── QUICK GUIDE (default area view when proto.summary exists) ── */
  .qg { display: flex; flex-direction: column; gap: 16px; padding-bottom: 12px; }
  .qg-hero { position: relative; border-radius: 22px; overflow: hidden; min-height: 230px; display: flex; align-items: flex-end; background: #2f4a3d; color: #fff; }
  .qg-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .qg-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,38,30,.75), rgba(20,38,30,.15) 75%), linear-gradient(180deg, rgba(20,38,30,0) 30%, rgba(20,38,30,.7)); }
  .qg-hero-in { position: relative; z-index: 1; padding: 28px 32px; max-width: 700px; }
  .qg-kicker, .qg-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .qg-kicker { color: #CDEBD5; }
  .qg-hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 6px 0 8px; }
  .qg-hero p { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.9); }
  .qg-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 2px 6px; }
  .qg-chips::-webkit-scrollbar { display: none; }
  .qg-chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 9px 9px; border-radius: 999px; background: #fff; border: 1.5px solid var(--gray-200); font: inherit; font-size: 15px; font-weight: 700; color: var(--gray-800); cursor: pointer; transition: all .15s ease; }
  .qg-chip-ico { width: 30px; height: 30px; border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center; }
  .qg-chip-ico svg { width: 17px; height: 17px; stroke: var(--navy); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .qg-chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .qg-chip.on .qg-chip-ico { background: rgba(255,255,255,.16); }
  .qg-chip.on .qg-chip-ico svg { stroke: #fff; }
  .qg-panel.in { animation: qgIn .35s ease; }
  @keyframes qgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .qg-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
  .qg-why, .qg-fixes { background: #fff; border: 1px solid var(--gray-200); border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
  .qg-label { color: var(--green); }
  .qg-what { font-size: 19px; line-height: 1.5; font-weight: 600; color: var(--gray-800); }
  .qg-twist { background: var(--green-light); border-left: 4px solid var(--green); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.5; font-weight: 600; color: var(--navy); }
  .qg-visual { margin: 2px 0; }
  .qg-visual svg { width: 100%; height: auto; display: block; }
  .qg-vt { font-size: 12px; font-weight: 700; }
  .qg-vt.red { fill: #C0584B; } .qg-vt.green { fill: #3F7D5C; }
  .qg-visual figcaption { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--gray-500); margin-top: 4px; }
  .qg-visual .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
  .qg-visual .dot:first-child { margin-left: 0; }
  .qg-visual .dot.red { background: #C0584B; } .qg-visual .dot.green { background: #3F7D5C; }
  .qg-fix { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
  .qg-fixes .qg-label + .qg-fix { border-top: 0; padding-top: 0; }
  .qg-fix p { font-size: 15px; line-height: 1.5; color: var(--gray-600); }
  .qg-more { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qg-more button, .qg-more a { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font: inherit; cursor: pointer; text-decoration: none; border-radius: 18px; padding: 18px 20px; }
  .qg-more button { background: #fff; border: 1.5px solid var(--gray-200); color: var(--gray-800); }
  .qg-more a { background: var(--navy); border: 0; color: #fff; }
  .qg-more b { display: block; font-size: 16px; }
  .qg-more small { display: block; font-size: 13.5px; opacity: .75; margin-top: 2px; }
  .qg-more i { font-style: normal; font-size: 22px; font-weight: 700; }
  .qg-doctor { font-size: 13px; line-height: 1.55; color: var(--gray-500); }
  .qg-switch { position: sticky; top: var(--qg-top, 118px); z-index: 6; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; margin: 0 auto 16px; max-width: 560px; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--gray-200); border-radius: 999px; box-shadow: 0 8px 22px -14px rgba(20,40,30,.45); }
  .qg-switch button { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: none; border-radius: 999px; padding: 12px 14px; font: inherit; font-size: 16px; font-weight: 700; color: var(--gray-600); cursor: pointer; transition: background .15s ease, color .15s ease; }
  .qg-switch button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .qg-switch button.on { background: var(--navy); color: #fff; }
  .qg-switch button:not(.on):hover { background: var(--green-light); color: var(--navy); }
  @media (max-width: 760px) {
    .qg-hero { min-height: 0; border-radius: 18px; }
    .qg-hero-in { padding: 34px 18px 16px; }
    .qg-hero h1 { font-size: 24px; margin: 4px 0 6px; }
    .qg-hero p { font-size: 14px; }
    .qg-switch { max-width: none; margin-bottom: 12px; }
    .qg-switch button { font-size: 15px; padding: 11px 6px; gap: 6px; }
    .qg-chips { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; gap: 6px; }
    .qg-chip { font-size: 13.5px; line-height: 1.25; text-align: left; padding: 7px 10px 7px 7px; border-radius: 14px; }
    .qg-chip-ico { width: 26px; height: 26px; flex: none; }
    .qg-grid, .qg-more { grid-template-columns: 1fr; }
    .qg-why, .qg-fixes { padding: 18px; }
    .qg-what { font-size: 17px; }
  }
  .assess-link { display: inline-flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 18px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); color: #fff; font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
