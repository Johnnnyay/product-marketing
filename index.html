<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product & Volume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --white:        #ffffff;
      --off-white:    #f7f8fa;
      --gray-100:     #f3f4f6;
      --gray-200:     #e5e7eb;
      --gray-300:     #d1d5db;
      --gray-400:     #9ca3af;
      --gray-500:     #6b7280;
      --gray-600:     #4b5563;
      --gray-800:     #1f2937;
      --navy:         #1B2A4A;
      --navy-hover:   #243459;
      --green:        #2D7F4E;
      --green-mid:    #38a169;
      --green-light:  #e8f5ee;
      --purple:       #6b46a0;
      --purple-light: #f0eafb;
      --blue:         #2563eb;
      --blue-light:   #eff6ff;
      --amber:        #b45309;
      --amber-light:  #fffbeb;
      --red:          #dc2626;
      --shadow-xs:    0 1px 2px rgba(0,0,0,0.05);
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:       0 4px 16px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 28px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
      --radius-sm:    8px;
      --radius:       12px;
      --radius-lg:    18px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--off-white);
      color: var(--gray-800);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    #site-header {
      background: var(--navy);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .header-top {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      user-select: none;
    }
    .logo em {
      font-style: normal;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      margin: 0 3px;
    }
    .logo .brand-tag {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      margin-left: 8px;
      letter-spacing: 0;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.18s;
      letter-spacing: 0.3px;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.2); }
    .lang-btn.zh-active { background: rgba(255,255,255,0.15); }

    /* .cat-nav / .cat-tab replaced by .primary-nav / .secondary-nav system */

    /* ─── CATEGORY HERO ─── */
    .cat-hero {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 28px 24px;
      display: none;
    }
    .cat-hero.visible { display: block; }
    .cat-hero-inner { max-width: 1280px; margin: 0 auto; }
    .cat-hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .cat-hero h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .cat-hero p {
      font-size: 14px;
      color: var(--gray-500);
      max-width: 700px;
      line-height: 1.65;
    }
    /* Category accent colors for hero */
    .hero-nutrition .cat-hero-label { color: var(--green); }
    .hero-beauty    .cat-hero-label { color: var(--purple); }
    .hero-care      .cat-hero-label { color: var(--blue); }
    .hero-home      .cat-hero-label { color: var(--amber); }

    /* ─── MAIN + GRID ─── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .section-count {
      font-size: 13px;
      color: var(--gray-400);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ─── PRODUCT CARD ─── */
    .p-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.18s;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--gray-200);
    }
    .p-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    .p-card:active { transform: translateY(-1px); }

    /* Image area */
    .p-img {
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .p-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .p-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
    }
    .p-initial {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .p-brand-small {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }

    /* Category theme backgrounds */
    .theme-nutrition .p-img { background: linear-gradient(135deg, #e0f2ea 0%, #c8e8d9 100%); }
    .theme-nutrition .p-initial { color: var(--green); }
    .theme-nutrition .p-brand-small { color: var(--green); }

    .theme-beauty .p-img { background: linear-gradient(135deg, #ede9f7 0%, #ddd2f0 100%); }
    .theme-beauty .p-initial { color: var(--purple); }
    .theme-beauty .p-brand-small { color: var(--purple); }

    .theme-care .p-img { background: linear-gradient(135deg, #dbeafe 0%, #c3d7f8 100%); }
    .theme-care .p-initial { color: var(--blue); }
    .theme-care .p-brand-small { color: var(--blue); }

    .theme-home .p-img { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
    .theme-home .p-initial { color: var(--amber); }
    .theme-home .p-brand-small { color: var(--amber); }

    /* Card body */
    .p-body {
      padding: 14px 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .p-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .p-brand { color: var(--green); }
    .theme-beauty    .p-brand { color: var(--purple); }
    .theme-care      .p-brand { color: var(--blue); }
    .theme-home      .p-brand { color: var(--amber); }

    .p-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .p-tagline {
      font-size: 12.5px;
      color: var(--gray-500);
      line-height: 1.5;
      flex: 1;
    }

    /* Card footer pricing */
    .p-pricing {
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--gray-100);
      margin-top: 12px;
    }
    .p-price-col {}
    .p-price-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 2px;
    }
    .p-price-ibo {
      font-size: 17px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1;
    }
    .p-price-retail {
      font-size: 11px;
      color: var(--gray-400);
      margin-top: 2px;
    }
    .p-pv-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--green);
      color: white;
      white-space: nowrap;
    }
    .p-pv-badge.dim { background: var(--gray-300); }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,20,35,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-imgbar {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      position: relative;
      overflow: hidden;
    }
    .modal-imgbar img { width: 100%; height: 100%; object-fit: cover; }
    .modal-imgbar-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .modal-initial {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .modal-brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .theme-nutrition .modal-imgbar { background: linear-gradient(135deg, #d1ead9 0%, #b8dfc8 100%); }
    .theme-nutrition .modal-initial { color: var(--green); }
    .theme-nutrition .modal-brand-tag { color: var(--green); }
    .theme-beauty    .modal-imgbar { background: linear-gradient(135deg, #ddd3f1 0%, #cbbde9 100%); }
    .theme-beauty    .modal-initial { color: var(--purple); }
    .theme-beauty    .modal-brand-tag { color: var(--purple); }
    .theme-care      .modal-imgbar { background: linear-gradient(135deg, #c7d9f8 0%, #afc8f5 100%); }
    .theme-care      .modal-initial { color: var(--blue); }
    .theme-care      .modal-brand-tag { color: var(--blue); }
    .theme-home      .modal-imgbar { background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%); }
    .theme-home      .modal-initial { color: var(--amber); }
    .theme-home      .modal-brand-tag { color: var(--amber); }

    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: rgba(0,0,0,0.2);
      border: none;
      color: white;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.4); }

    .modal-head {
      padding: 18px 22px 0;
    }
    .modal-brand-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .modal-brand-label { color: var(--green); }
    .theme-beauty    .modal-brand-label { color: var(--purple); }
    .theme-care      .modal-brand-label { color: var(--blue); }
    .theme-home      .modal-brand-label { color: var(--amber); }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--gray-800);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .modal-tagline {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .modal-pricing-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: var(--gray-100);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 0 22px 18px;
    }
    .modal-price-cell { text-align: center; }
    .modal-price-lbl {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 4px;
    }
    .modal-price-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--gray-800);
    }
    .modal-price-val.pv { color: var(--green); }
    .modal-price-val.retail {
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-400);
    }
    .modal-price-val.na { color: var(--gray-300); font-size: 16px; }

    .modal-body { padding: 0 22px 22px; }

    .modal-section { margin-bottom: 16px; }
    .modal-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 6px;
    }
    .modal-section-text {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.65;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-notion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: white;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-notion:hover { background: var(--navy-hover); }
    .btn-notion svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ─── CALCULATOR SECTION ─── */
    .calc-section {
      background: white;
      border-top: 1px solid var(--gray-200);
      padding: 52px 24px;
      text-align: center;
    }
    .calc-inner { max-width: 520px; margin: 0 auto; }
    .calc-section h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--gray-800);
      margin-bottom: 8px;
    }
    .calc-section .calc-sub {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .calc-coming {
      border: 2px dashed var(--gray-200);
      border-radius: var(--radius);
      padding: 36px 24px;
      color: var(--gray-400);
      font-size: 14px;
    }
    .calc-coming .calc-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .calc-milestone {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* ─── FOOTER ─── */
    footer {
      background: var(--navy);
      padding: 20px 24px;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 24px;
      text-align: center;
      color: var(--gray-400);
    }
    .empty-state p { font-size: 15px; }

    /* ─── PRIMARY NAV (mode selector) ─── */
    .primary-nav {
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .primary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
    }
    .primary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      padding: 12px 22px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
      letter-spacing: 0.2px;
    }
    .primary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 22px; right: 22px;
      height: 2px;
      background: #93c5fd;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .primary-tab:hover { color: rgba(255,255,255,0.85); }
    .primary-tab.active { color: white; }
    .primary-tab.active::after { transform: scaleX(1); }

    /* ─── SECONDARY NAV (contextual sub-tabs) ─── */
    .secondary-nav {
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: none;
    }
    .secondary-nav.visible { display: block; }
    .secondary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .secondary-nav-scroll::-webkit-scrollbar { display: none; }
    .secondary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
    }
    .secondary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 2px;
      background: white;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .secondary-tab:hover { color: rgba(255,255,255,0.8); }
    .secondary-tab.active { color: white; }
    .secondary-tab.active::after { transform: scaleX(1); }

    /* ─── PRODUCT IMAGE FIX ─── */
    .p-img img { object-fit: contain !important; padding: 8px; background: white; }
    .modal-imgbar img { object-fit: contain !important; padding: 12px; background: white; }

    /* ─── HEADER CALC WIDGET ─── */
    .header-calc {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 5px 6px 5px 14px;
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .header-calc.visible { display: flex; }
    .header-calc-onetime {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 8px;
    }
    .header-calc-clear {
      background: rgba(255,255,255,0.12);
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 14px;
      transition: background 0.15s;
      margin-left: 2px;
    }
    .header-calc-clear:hover { background: rgba(255,255,255,0.22); color: white; }

    /* ─── CARD SELECTION ─── */
    .p-card.selected {
      box-shadow: 0 0 0 2px var(--green), var(--shadow-sm);
    }
    .p-add-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.28);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      z-index: 2;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .p-add-btn:hover { background: rgba(0,0,0,0.5); transform: scale(1.12); }
    .p-add-btn.selected {
      background: var(--green);
      border-color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* ─── DAILY COST ─── */
    .p-price-ibo-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .p-daily-cost {
      font-size: 11px;
      font-weight: 600;

   STATE & LANGUAGE
   ════════════════════════════════════════════════ */
let currentCat = 'all';
let currentLang = 'en'; // 'en' | 'zh'
let viewMode = 'category'; // 'category' | 'painpoint' | 'strategy'
let currentPainPoint = 'energy';
let currentStrategy = 'morning';

function toggleLang() {
  currentLang = currentLang === 'en' ? 'zh' : 'en';
  const btn = document.getElementById('lang-toggle-btn');
  btn.classList.toggle('zh-active', currentLang === 'zh');
  btn.textContent = currentLang === 'en' ? 'EN / 中' : '中 / EN';
  if (viewMode === 'category') {
    renderGrid(currentCat);
    updateHero(currentCat);
  } else if (viewMode === 'painpoint') {
    renderPainPointChips();
    renderPainPointGrid(currentPainPoint);
  } else {
    renderStrategyChips();
    renderStrategyGrid(currentStrategy);
  }
}

function t(enStr, zhStr) {
  return currentLang === 'zh' && zhStr ? zhStr : enStr;
}

/* ════════════════════════════════════════════════
   FORMATTING
   ════════════════════════════════════════════════ */
function fmtPrice(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  return '$' + n.toFixed(2);
}

function fmtPv(n) {
  if (n === null || n === undefined) return '—';
  return n % 1 === 0 ? n.toString() : n.toFixed(2);
}

/* ════════════════════════════════════════════════
   CATEGORY HERO
   ════════════════════════════════════════════════ */
function updateHero(cat) {
  const hero = document.getElementById('cat-hero');
  if (cat === 'all') {
    hero.classList.remove('visible');
    hero.className = 'cat-hero';
    return;
  }
  const c = CATS[cat];
  document.getElementById('hero-label').textContent = t(c.label, c.labelZh);
  document.getElementById('hero-title').textContent = t(c.label, c.labelZh);
  document.getElementById('hero-intro').textContent = t(c.intro, c.introZh);
  hero.className = `cat-hero visible hero-${c.theme}`;
}

/* ════════════════════════════════════════════════
   CARD RENDERING
   ════════════════════════════════════════════════ */
function cardHtml(p) {
  const theme = CATS[p.cat]?.theme || 'nutrition';
  const initial = p.brand.charAt(0);
  const meta = PRODUCT_META[p.id] || {};
  const qty = calcSelections[p.id] || 0;

  const imgSection = p.imageUrl
    ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy"
            onerror="this.style.display='none';this.parentElement.querySelector('.p-img-placeholder').style.display='flex'">`
    : '';
  const placeholderDisplay = p.imageUrl ? 'display:none' : '';

  const pvBadge = p.pv !== null
    ? `<div class="p-pv-badge">${fmtPv(p.pv)} PV</div>`
    : `<div class="p-pv-badge dim">—</div>`;

  // Daily cost or one-time tag
  let costTag = '';
  if (meta.oneTime) {
    costTag = `<span class="p-onetime-tag">One-time</span>`;
  } else if (p.iboPrice && meta.daysSupply) {
    costTag = `<span class="p-daily-cost">${fmtPrice(p.iboPrice / meta.daysSupply)}/day</span>`;
  }

  // + button
  const addLabel = qty > 0 ? `×${qty}` : '+';
  const addClass = qty > 0 ? 'p-add-btn selected' : 'p-add-btn';

  return `
    <div class="p-card theme-${theme}${qty > 0 ? ' selected' : ''}" id="card-${p.id}"
         onclick="openModal('${p.id}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')openModal('${p.id}')">
      <div class="p-img">
        ${imgSection}
        <div class="p-img-placeholder" style="${placeholderDisplay}">
          <div class="p-initial">${initial}</div>
          <div class="p-brand-small">${p.brand}</div>
        </div>
        <button class="${addClass}" id="add-btn-${p.id}"
                onclick="toggleSelect('${p.id}',event)"
                aria-label="Add to calculator">${addLabel}</button>
      </div>
      <div class="p-body">
        <div class="p-brand">${p.brand}</div>
        <div class="p-name">${t(p.name, p.nameZh)}</div>
        <div class="p-tagline">${t(p.tagline, p.taglineZh)}</div>
      </div>
      <div class="p-pricing">
        <div class="p-price-col">
          <div class="p-price-label">IBO Price</div>
          <div class="p-price-ibo-row">
            <span class="p-price-ibo">${fmtPrice(p.iboPrice)}</span>
            ${costTag}
          </div>
          ${p.retailPrice ? `<div class="p-price-retail">Retail ${fmtPrice(p.retailPrice)}</div>` : ''}
        </div>
        ${pvBadge}
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════
   GRID
   ════════════════════════════════════════════════ */
function renderGrid(cat) {
  const products = cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);
  const grid = document.getElementById('product-grid');
  const label = document.getElementById('grid-label');
  const count = document.getElementById('grid-count');

  if (cat === 'all') {
    label.textContent = t('All Products', '全部产品');
  } else {
    label.textContent = t(CATS[cat]?.label, CATS[cat]?.labelZh) || cat;
  }
  count.textContent = `${products.length} ${t('products', '款产品')}`;

  if (products.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No products in this category yet.</p></div>';
    return;
  }
  grid.innerHTML = products.map(cardHtml).join('');
}

/* ════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════ */
function openModal(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  const theme = CATS[p.cat]?.theme || 'nutrition';

  // Image bar
  const imgbar = document.getElementById('modal-imgbar');
  imgbar.className = `modal-imgbar theme-${theme}`;
  document.getElementById('modal-initial').textContent = p.brand.charAt(0);
  document.getElementById('modal-brand-tag').textContent = p.brand;

  const mImg = document.getElementById('modal-img');
  const mPlaceholder = document.getElementById('modal-img-placeholder');
  if (p.imageUrl) {
    mImg.src = p.imageUrl;
    mImg.alt = p.name;
    mImg.style.display = '';
    mPlaceholder.style.display = 'none';
    mImg.onerror = () => { mImg.style.display='none'; mPlaceholder.style.display='flex'; };
  } else {
    mImg.style.display = 'none';
    mPlaceholder.style.display = 'flex';
  }

  // Head
  const brandLabel = document.getElementById('modal-brand-label');
  brandLabel.className = `modal-brand-label theme-${theme}`;
  brandLabel.textContent = p.brand;
  document.getElementById('modal-title').textContent = t(p.name, p.nameZh);
  document.getElementById('modal-tagline').textContent = t(p.tagline, p.taglineZh);

  // Pricing
  document.getElementById('modal-ibo-val').textContent = fmtPrice(p.iboPrice);
  const pvEl = document.getElementById('modal-pv-val');
  pvEl.textContent = fmtPv(p.pv);
  pvEl.className = p.pv ? 'modal-price-val pv' : 'modal-price-val na';
  const retailEl = document.getElementById('modal-retail-val');
  retailEl.textContent = fmtPrice(p.retailPrice);
  retailEl.className = p.retailPrice ? 'modal-price-val retail' : 'modal-price-val na';

  // Body
  document.getElementById('modal-advantage').textContent = t(p.advantage, p.advantageZh);
  document.getElementById('modal-who').textContent = t(p.who, p.whoZh);
  document.getElementById('modal-how').textContent = t(p.how, p.howZh);

  // Footer
  const footer = document.getElementById('modal-footer');
  if (p.notionId) {
    const url = `https://www.notion.so/${p.notionId.replace(/-/g, '')}`;
    footer.innerHTML = `<a class="btn-notion" href="${url}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      ${t('Full Product Profile', '查看完整产品档案')}
    </a>`;
  } else {
    footer.innerHTML = '';
  }

  // Open overlay
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ════════════════════════════════════════════════
   VIEW MODE SWITCHING
   ════════════════════════════════════════════════ */
function setViewMode(mode) {
  viewMode = mode;

  // Primary tabs
  document.querySelectorAll('.primary-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('vtab-' + mode).classList.add('active');

  // Secondary navs
  document.getElementById('cat-secondary-nav').classList.toggle('visible', mode === 'category');
  document.getElementById('painpoint-secondary-nav').classList.toggle('visible', mode === 'painpoint');
  document.getElementById('strategy-secondary-nav').classList.toggle('visible', mode === 'strategy');

  // Hero only in category mode
  if (mode !== 'category') {
    document.getElementById('cat-hero').className = 'cat-hero';
  }

  if (mode === 'category') {
    renderGrid(currentCat);
    updateHero(currentCat);
  } else if (mode === 'painpoint') {
    renderPainPointChips();
    renderPainPointGrid(currentPainPoint);
  } else {
    renderStrategyChips();
    renderStrategyGrid(currentStrategy);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ════════════════════════════════════════════════
   CALCULATOR
   ════════════════════════════════════════════════ */
const calcSelections = {};   // { productId: qty (1-3) }

function toggleSelect(id, event) {
  event.stopPropagation();   // don't open modal
  const current = calcSelections[id] || 0;
  const next = current >= 3 ? 0 : current + 1;
  if (next === 0) {
    delete calcSelections[id];
  } else {
    calcSelections[id] = next;
  }

  // Update button label/state
  const btn = document.getElementById('add-btn-' + id);
  const card = document.getElementById('card-' + id);
  if (btn) {
    btn.textContent = next > 0 ? '×' + next : '+';
    btn.className   = next > 0 ? 'p-add-btn selected' : 'p-add-btn';
  }
  if (card) {
    if (next > 0) card.classList.add('selected');
    else card.classList.remove('selected');
  }

  updateCalcWidget();
}

function clearCalc() {
  Object.keys(calcSelections).forEach(k => delete calcSelections[k]);
  // Reset all buttons and cards
  document.querySelectorAll('.p-add-btn').forEach(btn => {
    btn.textContent = '+';
    btn.className = 'p-add-btn';
  });
  document.querySelectorAll('.p-card.selected').forEach(card => {
    card.classList.remove('selected');
  });
  updateCalcWidget();
}

function updateCalcWidget() {
  let monthlyTotal = 0;
  let pvTotal      = 0;
  const onetimeItems = [];

  Object.entries(calcSelections).forEach(([id, qty]) => {
    const p    = PRODUCTS.find(x => x.id === id);
    const meta = PRODUCT_META[id] || {};
    if (!p) return;

    if (meta.oneTime) {
      // Collect one-time purchases separately
      onetimeItems.push({ name: p.name, price: p.iboPrice * qty, qty });
    } else if (p.iboPrice && meta.daysSupply) {
      // Monthly cost = price * (30 / daysSupply) * qty
      monthlyTotal += p.iboPrice * (30 / meta.daysSupply) * qty;
    } else if (p.iboPrice) {
      // Fallback: assume 30-day supply
      monthlyTotal += p.iboPrice * qty;
    }

    if (p.pv) pvTotal += p.pv * (meta.oneTime ? qty : (30 / (meta.daysSupply || 30)) * qty);
  });

  const widget  = document.getElementById('header-calc');
  const monthly = document.getElementById('header-calc-monthly');
  const onetime = document.getElementById('header-calc-onetime');

  const hasItems = Object.keys(calcSelections).length > 0;
  if (!hasItems) {
    widget.classList.remove('visible');
    return;
  }

  widget.classList.add('visible');
  monthly.textContent = '~$' + monthlyTotal.toFixed(0) + '/mo · ' + Math.round(pvTotal) + ' PV';

  if (onetimeItems.length > 0) {
    const onetimeTotal = onetimeItems.reduce((s, i) => s + i.price, 0);
    onetime.textContent = '+$' + onetimeTotal.toFixed(0) + ' one-time';
    onetime.style.display = 'inline';
  } else {
    onetime.style.display = 'none';
  }
}

/* ════════════════════════════════════════════════
   NAV TABS
   ════════════════════════════════════════════════ */
document.querySelectorAll('.cat-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentCat = btn.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateHero(currentCat);
    renderGrid(currentCat);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* ════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════ */
renderGrid('all');
</script>
