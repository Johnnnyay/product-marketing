as, misma persona, otra curva. Es lo más barato de esta página y lo primero que hay que darle a alguien, porque no cuesta nada, le demuestra que el mecanismo es real, y una persona que ha visto funcionar una cosa prueba la siguiente."},{"stage":"clear","rank":2,"route":"internal","products":["Carb Blocker","Prebiotic Fiber"],"why":"The first load is the size of the glucose spike after each meal, and you can flatten it without removing a single food. White kidney bean extract slows the enzyme that breaks starch into sugar, so part of a starch-heavy plate passes through instead of arriving all at once. Viscous fibre does the same job by a different route: it thickens what is in the stomach so the whole meal empties more slowly. This matters more than a diet plan for one reason. Nobody in a family that has eaten tortillas and rice for three generations is going to stop, and a plan that requires them to stop will be abandoned in a week. A plan that flattens the curve on the food they already eat can actually be kept.","whyZh":"第一个负担是每餐之后血糖峰值的高度，而这个高度可以在不删掉任何一种食物的前提下压平。白芸豆提取物抑制把淀粉分解成糖的那个酶，让一部分淀粉直接通过，而不是一次性全涌进来。黏性纤维用另一条路做同一件事：它让胃里的东西变稠，整餐排空得更慢。这件事比一份食谱更重要，理由只有一个：一个三代人都在吃玉米饼和米饭的家庭，不会真的戒掉，而任何要求他们戒掉的方案，一周之内就会被放弃。能压平曲线又不动他们本来饮食的方案，才是能坚持下去的那个。","key":"metabolic.clear.carb-blocker","productIds":["carb-blocker","prebiotic-fiber"],"why_es":"La primera carga es el tamaño del pico de glucosa después de cada comida, y se puede aplanar sin quitar un solo alimento. El extracto de frijol blanco frena la enzima que rompe el almidón en azúcar, así que parte de un plato con mucho almidón pasa de largo en vez de llegar todo de golpe. La fibra viscosa hace lo mismo por otra vía: espesa lo que hay en el estómago, así que la comida entera se vacía más despacio. Esto importa más que un plan de dieta por una razón. Nadie en una familia que lleva tres generaciones comiendo tortillas y arroz va a dejarlo, y un plan que se lo exija se abandona en una semana. Un plan que aplana la curva de la comida que ya comen sí se puede sostener."},{"stage":"clear","rank":3,"route":"internal","products":["Liver Support","Organics Turmeric Capsules"],"why":"The third load is the liver, and it is the organ this whole area turns on. Visceral fat drains directly into the liver through the portal vein, delivering fatty acids and inflammatory signals to it before they reach the rest of the body. A liver carrying its own fat responds poorly to insulin and keeps producing glucose when it should have stopped. This is also the mechanism behind something people find confusing: someone can be only slightly overweight and still have the metabolic picture of someone much heavier, because the fat is in the liver rather than under the skin.","whyZh":"第三个负担在肝，而整个领域其实都是围着这个器官转的。内脏脂肪经门静脉直接引流进肝脏，把脂肪酸和炎症信号先送到肝，再送到全身其他地方。一个自己也囤着脂肪的肝，对胰岛素反应变差，该停止产糖的时候还在产糖。这也解释了一件让很多人困惑的事：有人只是略微超重，代谢指标却像一个重得多的人，因为脂肪长在肝里，而不在皮下。","key":"metabolic.clear.liver-support","productIds":["liver-support","organics-turmeric-capsules"],"why_es":"La tercera carga es el hígado, y es el órgano sobre el que gira toda esta área. La grasa visceral drena directamente al hígado por la vena porta, entregándole ácidos grasos y señales inflamatorias antes de que lleguen al resto del cuerpo. Un hígado que carga su propia grasa responde mal a la insulina y sigue produciendo glucosa cuando debería haber parado. Este es también el mecanismo detrás de algo que confunde a la gente: alguien puede tener solo un poco de sobrepeso y aun así el cuadro metabólico de alguien mucho más pesado, porque la grasa está en el hígado y no bajo la piel."},{"stage":"regulate","rank":1,"route":"internal","products":["Plant Protein Powder"],"why":"This stage is about changing what a meal does, and breakfast is where the leverage is. A carbohydrate-only breakfast sets the pattern for the whole day: it spikes, it crashes, and the crash is what makes the mid-morning craving feel like willpower failing when it is actually blood sugar. Replacing that one meal with protein is the highest-return single change in this area. There is a second reason it matters here specifically. When people lose weight, a meaningful share of what they lose is muscle, and muscle is the tissue that disposes of most of your blood glucose. Lose it and you come out of the diet metabolically worse than you went in.","whyZh":"这一步管的是改变一餐的行为方式，而杠杆最大的地方是早餐。一顿只有碳水的早餐会给一整天定下节奏：血糖冲上去、掉下来，而那个下坠正是上午十点那种馋，感觉像是意志力不够，其实是血糖。把这一餐换成蛋白质，是整个领域里回报最高的单一改变。在这里它还有第二层意义：人在减重时掉的有相当一部分是肌肉，而肌肉正是处理你大部分血糖的组织。掉了肌肉，减完这一轮，代谢比开始前更差。","key":"metabolic.regulate.plant-protein-powder","productIds":["plant-protein-powder"],"why_es":"Esta etapa trata de cambiar lo que hace una comida, y el desayuno es donde está la palanca. Un desayuno de puro carbohidrato marca el patrón del día entero: sube, cae, y esa caída es lo que hace que el antojo de media mañana se sienta como falta de voluntad cuando en realidad es azúcar en sangre. Cambiar esa única comida por proteína es el cambio de mayor retorno de toda el área. Hay una segunda razón para que esté aquí. Cuando la gente baja de peso, una parte importante de lo que pierde es músculo, y el músculo es el tejido que se lleva la mayor parte de tu glucosa. Si lo pierdes, sales de la dieta metabólicamente peor de como entraste."},{"stage":"regulate","rank":2,"route":"internal","products":["Probiotic","Metabolic Pre & Postbiotic"],"why":"The gut sits in this stage rather than the first one because for metabolism its job is conversion, not clearance. The bacteria in your colon ferment the fibre you send them and produce short-chain fatty acids, which is one of the ways fibre affects blood sugar beyond simply slowing the meal down. Postbiotics are those bacterial products supplied directly, so the benefit does not depend on whether the strains survive the journey. If someone is only going to add one thing here, fibre first and bacteria second: feeding the population you already have is cheaper than importing a new one.","whyZh":"肠道放在这一步而不是第一步，是因为对代谢而言，它的职责是转化，不是清除。结肠里的菌把你送进去的纤维发酵成短链脂肪酸，这是纤维影响血糖的另一条路径，不只是把一餐变慢那么简单。后生元是把这些菌产物直接给到，所以效果不取决于菌株能不能活着走完这段路。如果只加一样，先纤维后菌：喂饱你本来就有的菌群，比引进一批新的便宜。","key":"metabolic.regulate.probiotic","productIds":["probiotic","metabolic-pre-postbiotic"],"why_es":"El intestino está en esta etapa y no en la primera porque, para el metabolismo, su trabajo es conversión, no limpieza. Las bacterias del colon fermentan la fibra que les mandas y producen ácidos grasos de cadena corta, que es una de las formas en que la fibra afecta al azúcar en sangre más allá de solo frenar la comida. Los postbióticos son esos productos bacterianos dados directamente, así que el beneficio no depende de si las cepas sobreviven el viaje. Si alguien solo va a añadir una cosa aquí: primero fibra, después bacterias. Alimentar a la población que ya tienes sale más barato que importar una nueva."},{"stage":"supplement","rank":1,"route":"internal","products":["Magnesium","Calcium Magnesium D"],"why":"Of everything on this page, magnesium has the strongest evidence and the least marketing behind it. Pooling twenty-five prospective studies covering more than 630,000 people, higher dietary magnesium intake tracked with roughly 17% lower risk of type 2 diabetes, dose-dependently: each extra 100mg a day was associated with a further 8 to 13% reduction. The label matters here too. This is 200mg delivered as bisglycinate chelate, hydroxide and malate rather than the cheap oxide most shelf products use, which is the difference between a dose you absorb and a dose that mostly reaches the toilet. Note what the evidence is and is not: an association across large populations, not a promise about your numbers.","whyZh":"这一页上的所有东西里，镁的证据最强，而它背后的营销最少。汇总二十五项前瞻性研究、超过六十三万人，膳食镁摄入较高的人群，2型糖尿病风险约低 17%，而且呈剂量依赖：每天每多 100 毫克，风险再降 8% 到 13%。标签在这里也重要。这是 200 毫克，来自甘氨酸螯合镁、氢氧化镁和苹果酸镁，而不是货架上多数产品用的廉价氧化镁，这个区别决定了它是一份你吸收得进去的剂量，还是一份基本进了马桶的剂量。但要看清证据是什么、不是什么：这是大人群里的相关性，不是对你个人指标的承诺。","key":"metabolic.supplement.magnesium","productIds":["magnesium","calcium-magnesium-d"],"why_es":"De todo lo que hay en esta página, el magnesio es lo que tiene la evidencia más sólida y el menor marketing detrás. Al juntar veinticinco estudios prospectivos con más de 630.000 personas, una ingesta más alta de magnesio se asoció con un riesgo de diabetes tipo 2 cerca de un 17% menor, de forma dosis-dependiente: cada 100mg adicionales al día se asociaron con una reducción extra del 8 al 13%. La etiqueta también importa aquí. Son 200mg en forma de quelato de bisglicinato, hidróxido y malato, y no el óxido barato que usan la mayoría de los productos de estantería, que es la diferencia entre una dosis que absorbes y una que en gran parte acaba en el váter. Fíjate en lo que la evidencia es y no es: una asociación en poblaciones grandes, no una promesa sobre tus análisis."},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill","Men's Pack","Women's Pack"],"why":"A broad multivitamin is here for an unglamorous reason: the nutrients that matter for glucose handling are spread across many of them, and picking them off one at a time costs more than covering the whole floor at once. Chromium is the one people ask about, and the honest answer is that it is involved in how cells respond to insulin but the trial evidence is mixed and much of it is low quality, so treat it as a reasonable inclusion rather than the reason to buy. If the budget only stretches to one supplement in this whole area, this is a defensible choice, because it covers a wide floor rather than betting everything on one nutrient.","whyZh":"综合营养素放在这里，理由并不花哨：与血糖处理相关的营养素分散在很多种里，一个一个单买，比一次性把底盘铺满更贵。铬是大家最常问的那个，诚实的回答是：它确实参与细胞对胰岛素的反应，但临床试验结果不一致，其中不少质量偏低，所以把它当成一个合理的配料，而不是购买的理由。如果整个领域的预算只够买一样，这是一个说得过去的选择，因为它铺的是一个宽的底盘，而不是把赌注压在单一营养素上。","key":"metabolic.supplement.double-x-multivitamin-31-day","productIds":["double-x-multivitamin-31-day-refill","men-s-pack","women-s-pack"],"why_es":"Un multivitamínico amplio está aquí por una razón poco vistosa: los nutrientes que importan para el manejo de la glucosa están repartidos entre muchos de ellos, y comprarlos de uno en uno sale más caro que cubrir todo el piso de una vez. El cromo es el que la gente pregunta, y la respuesta honesta es que participa en cómo las células responden a la insulina, pero la evidencia de los ensayos es mixta y buena parte es de baja calidad, así que trátalo como un ingrediente razonable y no como el motivo de compra. Si el presupuesto solo da para un suplemento en toda esta área, esta es una elección defendible, porque cubre un piso ancho en vez de apostarlo todo a un solo nutriente."},{"stage":"supplement","rank":2,"route":"internal","products":["Advanced Omega"],"why":"Insulin resistance runs on a background of low-grade inflammation, and visceral fat is an active source of it rather than an inert store. Omega-3 works on that background rather than on glucose directly, which is why you should not expect it to move a reading next week. The gap is almost always about ratio rather than absence: modern eating carries plenty of omega-6 and very little omega-3, and the balance between them sets the inflammatory tone.","whyZh":"胰岛素抵抗是建立在一层低度炎症的背景之上的，而内脏脂肪不是惰性的储存仓，它本身就是炎症的活跃来源。Omega-3 作用在这层背景上，而不是直接作用于血糖，所以不要指望它下周就把某个读数改掉。这个缺口几乎总是比例问题而不是有无问题：现代饮食里 Omega-6 很多、Omega-3 很少，而炎症的基调由两者的比例决定。","key":"metabolic.supplement.advanced-omega","productIds":["advanced-omega"],"why_es":"La resistencia a la insulina ocurre sobre un fondo de inflamación de bajo grado, y la grasa visceral es una fuente activa de ella, no un depósito inerte. El omega-3 actúa sobre ese fondo y no sobre la glucosa directamente, por eso no esperes que mueva un análisis la semana que viene. El hueco casi siempre es de proporción y no de ausencia: la alimentación moderna trae mucho omega-6 y muy poco omega-3, y el equilibrio entre ambos fija el tono inflamatorio."},{"stage":"supplement","rank":3,"route":"internal","products":["Concentrated Fruits & Vegetables","Vitamin B Complex 120ct"],"why":"Two supporting lines for people who have gone past the basics. Plant pigment families are how the body sources several antioxidants it cannot make, and almost nobody eats across all the colour groups in a week. B vitamins are coenzymes in energy metabolism and get consumed faster on a high-carbohydrate diet, which describes most people arriving at this page. The 120-count works out under thirty cents a day, which makes it one of the easiest additions to justify to a household watching every dollar.","whyZh":"两条辅助线，给已经做完基础项的人。植物色素家族是身体获取多种自身无法合成的抗氧化物的来源，而几乎没有人能在一周内把所有色系吃全。B族是能量代谢里的辅酶，在高碳水饮食下消耗得更快，而这正好描述了大多数会看到这一页的人。120粒装算下来每天不到三毛钱，对于一个每一块钱都要算的家庭，这是最容易说得通的一笔添加。","key":"metabolic.supplement.concentrated-fruits-vegetabl","productIds":["concentrated-fruits-vegetables","vitamin-b-complex-120ct"],"why_es":"Dos líneas de apoyo para quien ya pasó lo básico. Las familias de pigmentos vegetales son de donde el cuerpo saca varios antioxidantes que no puede fabricar, y casi nadie come todos los grupos de color en una semana. Las vitaminas del grupo B son coenzimas del metabolismo energético y se gastan más rápido con una dieta alta en carbohidratos, que describe a la mayoría de quien llega a esta página. El frasco de 120 sale a menos de treinta centavos al día, lo que lo convierte en una de las adiciones más fáciles de justificar en una casa que cuida cada dólar."},{"stage":"sustain","rank":1,"route":"habit","products":["Calcium Magnesium D","Stress Relief Probiotic"],"why":"Sleep is the lever most people skip and it acts directly on this problem. Short sleep raises cortisol, cortisol raises blood glucose, and it pushes appetite specifically toward the foods that make tomorrow's numbers worse. So a bad week of sleep is not a separate topic from blood sugar, it sits upstream of it. Neither of these replaces going to bed earlier; they help someone land that step. Say that out loud, because a person who thinks a capsule substitutes for sleep will be disappointed and stop trusting the rest.","whyZh":"睡眠是多数人跳过的那根杠杆，而它直接作用在这个问题上。睡眠不足抬高皮质醇，皮质醇抬高血糖，同时把食欲专门推向那些让明天指标更难看的食物。所以睡不好的一周不是血糖之外的话题，它在血糖的上游。这两样都不能替代早睡，它们只是帮人把早睡这一步落地。这句话要说出口，因为一个以为吃胶囊可以代替睡觉的人，最后会失望，然后连带着不再相信其余部分。","key":"metabolic.sustain.calcium-magnesium-d","productIds":["calcium-magnesium-d","stress-relief-probiotic"],"why_es":"El sueño pertenece a esta etapa y es la palanca que más gente se salta. Dormir poco sube el cortisol, el cortisol sube la glucosa, y además empuja el apetito justo hacia los alimentos que hacen más difícil el día siguiente. Así que una mala semana de sueño no está aparte de la conversación del azúcar en sangre, está río arriba de ella. Ninguno de estos dos sustituye acostarse antes. Solo ayudan a aterrizar ese paso, y vale la pena decirlo en voz alta, porque quien crea que una cápsula reemplaza al sueño se va a decepcionar y dejará de confiar en el resto."}],"overview_es":"La insulina es la señal que le dice a las células que saquen el azúcar de la sangre. En el patrón en el que está la mayoría de los adultos de más de cuarenta, el páncreas sigue mandándola, a menudo más que nunca. Las células han dejado de responder. Lo que hace que dejen de responder es la grasa en el lugar equivocado: no la de los brazos, que es bastante inofensiva, sino la que se empaqueta alrededor de los órganos y dentro del hígado. Esa grasa drena directo al hígado por la vena porta, lo empuja a seguir produciendo glucosa cuando debería haber parado, y mantiene todo el sistema en inflamación de bajo grado. Por eso alguien con solo un poco de sobrepeso puede tener peores números que alguien mucho más pesado, y por eso la medida de la cintura dice más que el peso. Todo lo de abajo va junto a lo que tu médico te haya indicado, nunca en su lugar. Los cuatro pasos van en orden: aplana lo que llega, cambia cómo se comporta la comida, aporta la materia prima, y sostén el ritmo del que depende todo lo demás.","summary":{"title":"Worried about your blood sugar? First, what did you notice?","titleZh":"担心血糖？先想想，你是从哪里开始留意的？","sub":"Most people notice something small first. Pick the one that sounds like you.","subZh":"大多数人都是先从一些小信号开始察觉的。选一个最像你的。","moments":[{"id":"after-meals","icon":"bowl","label":"Sleepy or hungry after meals","labelZh":"饭后犯困，又很快饿","visual":"sugar","what":"That is a sugar spike and the drop after it. Rice, noodles and bread turn into sugar fast, insulin rushes out to clear it, and your blood sugar falls. That fall is the sleepy, hungry-again feeling.","whatZh":"这是血糖冲高再掉下来。米饭、面条、面包很快变成糖，胰岛素一下子涌出来处理，血糖随之往下掉。掉下来的那一刻，你就犯困，或者又饿了。","twist":"You do not have to give up rice. Eat vegetables and protein first and the rice last. Same plate, same person, a lower curve.","twistZh":"不用戒米饭。先吃菜和肉，最后吃饭。同样一盘菜，同一个人，血糖曲线就低很多。","fixes":[{"id":"carb-blocker","why":"Take it before a starch-heavy meal. Part of the starch passes through instead of arriving as sugar all at once.","whyZh":"碳水多的那顿饭前吃，一部分淀粉直接过去，不会一下子全变成糖。"},{"id":"prebiotic-fiber","why":"Not a salad person? Stir fibre into water or coffee. It slows the whole meal down.","whyZh":"不爱吃沙拉？纤维粉加进水或咖啡里，整顿饭都消化得慢一些。"},{"id":"green-superfood","why":"For days with no vegetables: drink it before the meal, so the greens still come first.","whyZh":"没吃到蔬菜的日子，饭前先喝一杯，让绿色的东西还是排在最前面。"}]},{"id":"cravings","icon":"clock","label":"Sugar cravings","labelZh":"总想吃甜的","visual":null,"what":"A craving an hour or two after breakfast is usually not weak willpower. A carb-only breakfast spikes and then crashes, and when your blood sugar drops, your brain asks for the fastest fix: more sugar.","whatZh":"早餐后一两个小时就想吃甜的，通常不是你意志力差。只有碳水的早餐让血糖先冲高再跌下来，血糖一低，大脑就要最快的补救办法：再来点糖。","twist":"Change breakfast, not your willpower. Protein in the morning keeps the whole day level.","twistZh":"要改的是早餐，不是意志力。早上吃够蛋白质，一整天都会平稳很多。","fixes":[{"id":"plant-protein-powder","why":"21g of plant protein at breakfast. It digests slowly, so there is no spike to crash from.","whyZh":"早餐来一杯，21克植物蛋白。消化得慢，没有冲高，也就没有跌落。"},{"id":"vitamin-b-complex-120ct","why":"A high-carb diet uses up B vitamins faster, and they are what turn food into steady energy.","whyZh":"碳水吃得多，B族就消耗得快，而把食物变成稳定的能量，靠的就是它。"}]},{"id":"borderline","icon":"drop","label":"Told it's borderline","labelZh":"体检说血糖临界","visual":null,"what":"Borderline usually means your pancreas is still sending insulin, often more than ever. What changed is that your cells stopped answering it well, so sugar stays in your blood longer.","whatZh":"临界值通常意味着，胰腺还在分泌胰岛素，甚至比以前还多。变的是细胞不怎么“听”它了，糖就在血液里停留得更久。","twist":"This is the stage where food and daily habits matter most. Keep working with your doctor: everything here goes alongside their care, never instead of it.","twistZh":"这正是饮食和生活习惯最能发挥作用的阶段。继续跟着医生走，这里的一切都是配合医生，绝不是替代医生。","fixes":[{"id":"magnesium","why":"Magnesium is one of the best-studied nutrients for blood sugar, and many people eat less than they need.","whyZh":"镁是和血糖相关研究最多的营养素之一，而很多人平时都吃得不够。"},{"id":"double-x-multivitamin-31-day-refill","why":"The nutrients that help your body handle sugar are spread across many vitamins and minerals. One base a day covers them.","whyZh":"帮身体处理糖的营养素，分散在很多种维生素和矿物质里。每天一份，把基础都铺好。"}]},{"id":"family","icon":"heart","label":"It runs in the family","labelZh":"家里有人血糖高","visual":null,"what":"Genes load the dice, they do not roll them. A lot of what runs in families is also shared habits: the same rice, the same late dinners, the same stress.","whatZh":"基因决定的是概率，不是结局。一家人一起传下来的，还有生活习惯：一样的米饭，一样晚的晚饭，一样的压力。","twist":"You cannot change your genes, but you can start earlier than your parents did. Keep the family food, change the order you eat it in, and check your numbers every year.","twistZh":"基因改不了，但你可以比父母早一步开始。家里的饭照吃，换个吃的顺序，每年查一次血糖。","fixes":[{"id":"advanced-omega","why":"Works on the low-grade inflammation that makes cells stop answering insulin. Judge it in months, not by next week's reading.","whyZh":"针对让细胞对胰岛素“装聋”的慢性炎症。按月看效果，别指望下周的数字就变。"},{"id":"concentrated-fruits-vegetables","why":"Five colour groups of plants in capsules, for families whose vegetables are the same two or three on repeat.","whyZh":"五种颜色的植物营养浓缩在胶囊里，适合家里来来回回只吃那两三种菜的。"}]},{"id":"belly","icon":"scale","label":"Belly fat, slim arms","labelZh":"四肢不胖，肚子大","visual":null,"what":"Fat on your arms is fairly harmless. Fat packed around your organs and inside your liver is different. It drains straight into the liver, keeps it releasing sugar when it should stop, and makes your cells stop answering insulin.","whatZh":"胳膊腿上的脂肪相对无害。麻烦的是包在内脏周围、长在肝里的脂肪。它直接流进肝脏，让肝在该停的时候还在往血里放糖，也让细胞不再应答胰岛素。","twist":"That is why someone only a little overweight can have worse numbers than someone much heavier. Your waist tells you more than the scale does.","twistZh":"所以有些人只是微胖，血糖却比胖很多的人还差。腰围比体重更能说明问题。","fixes":[{"id":"liver-support","why":"Milk thistle to support your liver, the organ this whole area turns on.","whyZh":"奶蓟草，给肝脏支持。血糖这件事，关键就在肝。"},{"id":"organics-turmeric-capsules","why":"Turmeric for the background inflammation that belly fat keeps going. Measure it in months.","whyZh":"姜黄，针对肚子上的脂肪带来的慢性炎症。按月看效果。"},{"id":"metabolic-pre-postbiotic","why":"Your gut bacteria turn fibre into compounds that play a part in blood sugar. Postbiotics give you those compounds directly.","whyZh":"肠道细菌会把纤维变成参与血糖调节的物质，后生元就是直接把这些物质给你。"}]},{"id":"after-40","icon":"calendar","label":"After 40, things changed","labelZh":"过了40，身体变了","visual":null,"what":"From your 30s on you slowly lose muscle unless you use it, and muscle is where most of the sugar from a meal goes. Less muscle, less room for sugar. Sleep gets lighter too, and short sleep raises stress hormones, which raise blood sugar.","whatZh":"三十岁以后，肌肉不用就会慢慢流失，而饭后大部分的糖，都是肌肉在消化。肌肉少了，糖就没地方去。睡眠也变浅了，睡得少，压力激素升高，血糖也跟着往上走。","twist":"Two strength sessions a week and a regular bedtime do more than you would think.","twistZh":"每周两次力量训练，每天固定时间睡觉，效果比你想的大。","fixes":[{"id":"plant-protein-powder","why":"Enough protein every day gives your body what it needs to keep the muscle that takes up sugar.","whyZh":"每天吃够蛋白质，身体才有原料留住那些帮你消化糖的肌肉。"},{"id":"calcium-magnesium-d","why":"Take it in the evening to help you wind down. It does not replace going to bed earlier.","whyZh":"晚上吃，帮身体放松下来。但它代替不了早点上床。"},{"id":"stress-relief-probiotic","why":"For the busy head at night. Your gut and your stress are more connected than you think.","whyZh":"适合晚上脑子停不下来的人。肠道和压力的关系，比你想的紧密得多。"}]}],"doctor":"Very thirsty, peeing a lot, losing weight without trying, blurry vision or cuts that heal slowly? See a doctor first. Already on blood sugar medication? Keep taking it as prescribed, and tell your doctor before adding anything.","doctorZh":"如果口很渴、小便多、体重莫名下降、视力模糊，或者伤口好得很慢，请先去看医生。已经在吃降糖药的，请按医嘱继续吃，添加任何保健品之前先告诉医生。"}},"weight":{"overview":"Two people lose the same ten pounds. One loses mostly fat and keeps it off. The other loses a third of it as muscle, and muscle is the tissue that burns energy at rest, so they finish the diet lighter and worse at staying light. Then they regain, and the weight that comes back is fat. That is the loop, and it is why the number on the scale is a poor guide to whether something is working. The four steps below are built around composition rather than the number: make the meals you eat more filling so the deficit is bearable, get enough protein that your body has no reason to break down muscle, cover the nutrient gaps that open up whenever you eat less, and protect what you built, because the hard part was never the losing.","overviewZh":"两个人减掉同样的十斤。一个减掉的主要是脂肪，而且守住了；另一个有三分之一减掉的是肌肉，而肌肉恰恰是静息状态下消耗能量的组织，于是这一轮减完，人更轻了，但更不容易维持轻。然后反弹，涨回来的是脂肪。这就是那个循环，也是为什么体重秤上的数字并不能说明一件事有没有奏效。下面四步围绕的是身体成分而不是数字：让你吃的每一餐更顶饱，好让热量缺口撑得下去；把蛋白质吃够，让身体没有理由去拆肌肉；补上少吃之后必然出现的营养缺口；最后守住你建起来的东西，因为难的从来不是减掉。","overview_es":"Dos personas pierden los mismos cinco kilos. Una pierde sobre todo grasa y los mantiene. La otra pierde un tercio en forma de músculo, y el músculo es el tejido que quema energía en reposo, así que termina la dieta más ligera y peor preparada para seguir ligera. Después recupera, y lo que vuelve es grasa. Ese es el bucle, y por eso el número de la báscula es una mala guía para saber si algo está funcionando. Los cuatro pasos de abajo giran en torno a la composición y no al número: haz que las comidas que ya haces llenen más para que el déficit sea soportable, come suficiente proteína para que tu cuerpo no tenga motivo para deshacer músculo, cubre los huecos de nutrientes que se abren siempre que comes menos, y protege lo que construiste, porque la parte difícil nunca fue bajarlo.","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Prebiotic Fiber","Green Superfood"],"why":"Start by making the same food fill you up more, because a deficit you cannot tolerate is a deficit you will not keep. Viscous fibre thickens what is in the stomach and slows how fast it empties, which is why a meal with fibre in it stops feeling like a meal you finished twenty minutes ago. This is the cheapest lever in the whole area and it works on food you already buy. Most adults get roughly half the fibre they need, so for most people this is closing a real gap rather than adding something exotic.","whyZh":"先让同样的食物更顶饱，因为一个你忍受不了的热量缺口，就是一个你守不住的缺口。黏性纤维让胃里的东西变稠、排空变慢，这就是为什么一顿有纤维的饭，不会二十分钟后就像没吃过。这是整个领域最便宜的杠杆，而且作用在你本来就在买的食物上。大多数成年人的纤维摄入只有需要量的一半左右，所以对多数人来说，这是在补一个真实的缺口，而不是加一样新奇的东西。","key":"weight.clear.prebiotic-fiber","productIds":["prebiotic-fiber","green-superfood"],"why_es":"Empieza por hacer que la misma comida te llene más, porque un déficit que no toleras es un déficit que no vas a mantener. La fibra viscosa espesa lo que hay en el estómago y frena la velocidad a la que se vacía, y por eso una comida con fibra deja de sentirse como una comida que terminaste hace veinte minutos. Es la palanca más barata de toda el área y actúa sobre la comida que ya compras. La mayoría de los adultos toma más o menos la mitad de la fibra que necesita, así que para casi todos esto es cerrar un hueco real y no añadir algo exótico."},{"stage":"clear","rank":1,"route":"habit","products":["Organics All-in-One Shakes","Wellness Bars"],"why":"Then replace the one meal you consistently lose control of. For most people that is not dinner, it is breakfast skipped and then a mid-afternoon collapse. Replacing a single meal with something of known size removes a decision instead of adding a rule, and decisions are what run out by 4pm. The test for a bar is the first three ingredients: a candy bar with protein added leads with sugar, a whole-food bar leads with nuts, fruit or oats. That difference decides whether it helps or just moves the problem.","whyZh":"然后替换掉你固定会失控的那一餐。对多数人来说不是晚餐，是早餐没吃、然后下午彻底垮掉。把一餐换成分量已知的东西，是减少一个决定，而不是增加一条规矩，而到下午四点先用完的，正是决定力。判断一根能量棒看前三位配料：加了蛋白质的糖果棒第一位是糖，全食物棒第一位是坚果、水果或燕麦。这个区别决定了它是帮你，还是只是把问题挪了个位置。","key":"weight.clear.organics-all-in-one-shakes","productIds":["organics-all-in-one-shakes","wellness-bars"],"why_es":"Después sustituye la comida en la que pierdes el control de forma constante. Para la mayoría no es la cena, es el desayuno saltado y luego el derrumbe de media tarde. Cambiar una sola comida por algo de tamaño conocido elimina una decisión en vez de añadir una regla, y lo que se agota a las cuatro de la tarde son las decisiones. La prueba de una barrita son los tres primeros ingredientes: una barra de dulce con proteína añadida empieza por azúcar, una de comida real empieza por frutos secos, fruta o avena. Esa diferencia decide si ayuda o solo mueve el problema de sitio."},{"stage":"clear","rank":2,"route":"internal","products":["Carb Blocker"],"why":"The third lever is the starch-heavy meal you are not going to give up. The label is 500mg of white kidney bean extract, which inhibits alpha-amylase, the enzyme that breaks starch into absorbable sugar. Some of that plate passes through undigested instead of arriving as glucose. Be clear about what this is: a tool for specific meals, taken before them, not a daily supplement and not permission to eat more. It belongs here because a plan that requires someone to abandon the food their family eats will be the first thing abandoned.","whyZh":"第三根杠杆是那顿你不打算放弃的、淀粉很重的饭。标签上是 500 毫克白芸豆提取物，它抑制的是α-淀粉酶，也就是把淀粉分解成可吸收糖分的那个酶。那一盘里有一部分会不经消化直接通过，而不是变成葡萄糖进来。要说清楚它是什么：针对特定几餐、饭前吃的工具，不是每天必补的营养品，更不是多吃的许可证。它放在这里，是因为一个要求人放弃家里那口饭的方案，会最先被放弃。","key":"weight.clear.carb-blocker","productIds":["carb-blocker"],"why_es":"La tercera palanca es esa comida cargada de almidón que no vas a dejar. La etiqueta son 500mg de extracto de frijol blanco, que inhibe la alfa-amilasa, la enzima que rompe el almidón en azúcar absorbible. Parte de ese plato pasa sin digerir en lugar de llegar como glucosa. Ten claro qué es: una herramienta para comidas concretas, tomada antes, no un suplemento diario ni un permiso para comer más. Está aquí porque un plan que exige abandonar la comida que come tu familia será lo primero que se abandone."},{"stage":"clear","rank":3,"route":"internal","key":"weight.clear.slimmetry","products":["Slimmetry"],"why":"Read this label before deciding what it is. 150mg of GreenSelect Phytosome, which is green tea catechins bound to phosphatidylcholine, delivering only 20mg of EGCG. That number looks too small until you see the point: ordinary green tea extract trials use 200 to 800mg of EGCG, and the phospholipid complex exists to raise absorption so a fraction of the dose does the work. That matters for safety as much as effect, because the liver signals reported with green tea extract come from the high-dose end. In a controlled trial adding it to a low-calorie diet, the supplemented group lost substantially more over 90 days than diet alone, though that trial was open-label rather than blinded, so treat the direction as more trustworthy than the size.","whyZh":"先看标签再决定它是什么。150 毫克 GreenSelect Phytosome，也就是与磷脂酰胆碱结合的绿茶儿茶素，实际提供的 EGCG 只有 20 毫克。这个数字看起来小得离谱，直到你看懂它的用意：普通绿茶提取物的试验用的是 200 到 800 毫克 EGCG，而磷脂复合物的存在就是为了提高吸收率，让零头的剂量做同样的事。这一点对安全性和对效果同样重要，因为绿茶提取物报告出的肝脏信号，来自的正是高剂量那一端。在一项把它加进低热量饮食的对照试验里，加了这一项的组在 90 天里减掉的明显更多，但那项试验是开放标签而非双盲，所以方向比幅度更值得相信。","productIds":["slimmetry"],"why_es":"Lee la etiqueta antes de decidir qué es esto. 150mg de GreenSelect Phytosome, que son catequinas de té verde unidas a fosfatidilcolina, aportando solo 20mg de EGCG. Ese número parece demasiado pequeño hasta que ves la idea: los ensayos con extracto de té verde normal usan de 200 a 800mg de EGCG, y el complejo con fosfolípidos existe para subir la absorción de modo que una fracción de la dosis haga el trabajo. Eso importa tanto por seguridad como por efecto, porque las señales hepáticas descritas con extracto de té verde vienen del extremo de dosis altas. En un ensayo controlado que lo añadió a una dieta baja en calorías, el grupo suplementado perdió bastante más en 90 días que la dieta sola, aunque ese ensayo fue abierto y no ciego, así que fíate más de la dirección que del tamaño."},{"stage":"regulate","rank":1,"route":"internal","products":["Plant Protein Powder","XS Grass-Fed Whey Protein"],"why":"This is the step that decides what you lose. In controlled trials at matched weight loss, the higher-protein group lost about 1.5kg of lean mass while the normal-protein group lost about 2.8kg. Same scale reading, nearly twice the muscle gone in one group. Protein also blunts the drop in fullness that comes with eating less, so it works on adherence at the same time. If you only do one thing on this page, do this one, and put it at breakfast, which is the meal most people currently eat as pure carbohydrate.","whyZh":"这一步决定你减掉的是什么。在体重下降幅度相当的对照试验里，高蛋白组瘦体重减少约 1.5 公斤，普通蛋白组约 2.8 公斤。秤上的数字一样，其中一组掉的肌肉几乎是另一组的两倍。蛋白质同时还能缓解少吃带来的饱腹感下降，所以它顺带解决了坚持度的问题。如果这一页你只做一件事，就做这件，并且放在早餐，因为那正是多数人目前当作纯碳水在吃的一餐。","key":"weight.regulate.plant-protein-powder","productIds":["plant-protein-powder","xs-grass-fed-whey-protein"],"why_es":"Este es el paso que decide qué pierdes. En ensayos controlados con pérdida de peso equivalente, el grupo de proteína alta perdió alrededor de 1,5 kg de masa magra mientras que el de proteína normal perdió unos 2,8 kg. La misma lectura en la báscula, casi el doble de músculo perdido en uno de los grupos. La proteína además amortigua la caída de saciedad que viene con comer menos, así que trabaja también sobre la adherencia. Si solo haces una cosa de esta página, haz esta, y ponla en el desayuno, que es la comida que hoy la mayoría hace de puro carbohidrato."},{"stage":"regulate","rank":2,"route":"internal","products":["Probiotic","Metabolic Pre & Postbiotic"],"why":"Fibre only pays off if you have the bacteria to ferment it. They turn it into short-chain fatty acids, which is one of the routes by which fibre affects appetite signalling rather than just physically filling you. Order matters and saves money: feed the population you already have before importing a new one, so fibre first, bacteria second.","whyZh":"纤维要有菌来发酵才划算。菌把它变成短链脂肪酸，这是纤维影响食欲信号的路径之一，而不只是物理上把你填满。顺序有讲究，也省钱：先喂饱你本来就有的菌群，再考虑引进新的，所以先纤维、后菌。","key":"weight.regulate.probiotic","productIds":["probiotic","metabolic-pre-postbiotic"],"why_es":"La fibra solo rinde si tienes las bacterias que la fermenten. Ellas la convierten en ácidos grasos de cadena corta, que es una de las vías por las que la fibra afecta a las señales de apetito y no solo te llena físicamente. El orden importa y ahorra dinero: alimenta a la población que ya tienes antes de importar una nueva, así que primero fibra, después bacterias."},{"stage":"supplement","rank":1,"route":"internal","products":["Double X Multivitamin 31-day Refill","Men's Pack","Women's Pack"],"why":"Eating less means eating fewer nutrients, and that is the part diet advice never mentions. Cut 500 calories a day and you cut roughly a fifth of everything that came with them. The symptoms people blame on dieting, the flatness, the cold hands, the hair in the drain, are frequently that gap rather than the calorie deficit itself. Covering a wide floor cheaply matters more here than any single nutrient, which is the argument for a broad multi over buying six bottles.","whyZh":"少吃意味着摄入的营养素也少了，而这一点，减肥建议从来不提。每天少吃 500 大卡，你同时也少掉了随之而来的大约五分之一的一切。人们归咎于节食的那些症状，没精神、手脚冰凉、地漏里的头发，很多时候是这个缺口造成的，而不是热量缺口本身。在这里，把底盘便宜地铺宽，比任何单一营养素都重要，这也是选综合而不是买六瓶的理由。","key":"weight.supplement.double-x-multivitamin-31-day","productIds":["double-x-multivitamin-31-day-refill","men-s-pack","women-s-pack"],"why_es":"Comer menos significa tomar menos nutrientes, y esa es la parte que los consejos de dieta nunca mencionan. Quita 500 calorías al día y quitas más o menos una quinta parte de todo lo que venía con ellas. Los síntomas que la gente le achaca a la dieta, la falta de chispa, las manos frías, el pelo en el desagüe, muchas veces son ese hueco y no el déficit calórico en sí. Cubrir barato un piso ancho importa aquí más que cualquier nutriente suelto, y ese es el argumento del multivitamínico frente a comprar seis frascos."},{"stage":"supplement","rank":2,"route":"internal","products":["Vitamin B Complex 120ct","Advanced Omega"],"why":"Two specific gaps worth closing. B vitamins are the coenzymes that let you turn food into usable energy, they are water-soluble so they clear in about a day, and they get used up faster under stress, which describes anyone in a deficit. Omega-3 works on the inflammatory background that body fat actively maintains rather than on weight directly, so judge it over months. Between them the 120-count B complex runs under thirty cents a day, which makes it the easiest thing here to keep.","whyZh":"两个值得补上的具体缺口。B族是把食物转成可用能量的辅酶，它是水溶性的，大约一天就清空，而且在压力下消耗更快，而处在热量缺口里的人正是这种状态。Omega-3 作用的是脂肪组织本身在维持的那层炎症背景，而不是直接作用于体重，所以要按月来看。两者之中，120粒装的B族每天不到三毛钱，是这里最容易坚持下去的一样。","key":"weight.supplement.vitamin-b-complex-120ct","productIds":["vitamin-b-complex-120ct","advanced-omega"],"why_es":"Dos huecos concretos que vale la pena cerrar. Las vitaminas del grupo B son las coenzimas que te permiten convertir la comida en energía utilizable, son hidrosolubles y se eliminan en un día, y se gastan más rápido bajo estrés, que describe a cualquiera en déficit. El omega-3 actúa sobre el fondo inflamatorio que la grasa corporal mantiene activamente, no sobre el peso directamente, así que júzgalo por meses. De los dos, el frasco de 120 de complejo B sale a menos de treinta centavos al día, lo que lo convierte en lo más fácil de sostener."},{"stage":"sustain","rank":1,"route":"habit","products":["Calcium Magnesium D","Sleep Gummies"],"why":"This is the most under-rated finding in the whole area. In a controlled trial where people ate the same restricted diet, those whose sleep was cut short lost 55% less of their weight as fat. Same calories, same weight on the scale, but far more of it came out of muscle. Short sleep also raises ghrelin and pushes appetite specifically toward sweet food, so it attacks the plan from both ends. Neither of these replaces going to bed earlier. They help someone land that step, and saying so plainly is what keeps them trusting the rest of the page.","whyZh":"这是整个领域里最被低估的一个发现。在一项对照试验里，人们吃同样的限制饮食，而睡眠被削短的那组，减掉的重量中脂肪的比例低了 55%。同样的热量、秤上同样的数字，但其中相当大一部分是从肌肉里出来的。睡眠不足同时抬高饥饿素，并把食欲专门推向甜食，等于从两头同时拆你的计划。这两样都不能替代早睡，它们只是帮人把早睡这一步落地。把这句话说明白，才是让人继续相信这一页其余内容的原因。","key":"weight.sustain.calcium-magnesium-d","productIds":["calcium-magnesium-d","sleep-gummies"],"why_es":"Este es el hallazgo más infravalorado de toda el área. En un ensayo controlado en el que la gente hizo la misma dieta restringida, quienes durmieron poco perdieron un 55% menos de su peso en forma de grasa. Las mismas calorías, el mismo número en la báscula, pero mucha más parte salió del músculo. Dormir poco además sube la grelina y empuja el apetito específicamente hacia lo dulce, así que ataca el plan por los dos lados. Ninguno de estos dos sustituye acostarse antes. Ayudan a aterrizar ese paso, y decirlo con claridad es lo que hace que sigan confiando en el resto de la página."},{"stage":"sustain","rank":1,"route":"habit","products":["Lean Muscle","XS Muscle Multiplier (EAAs)"],"why":"Protein gives your body the material to keep muscle. Resistance training gives it the reason. Without the signal that the muscle is being used, the body treats it as expensive tissue it can afford to lose, and in a deficit it will. Two sessions a week is enough to change the answer, and this is the step that decides whether you end up smaller and stronger or just smaller.","whyZh":"蛋白质给身体保住肌肉的材料，力量训练给它保住肌肉的理由。如果没有「这块肌肉还在被使用」这个信号，身体就会把它当成一块养不起的昂贵组织，而在热量缺口下，它真的会拆掉。每周两次就足以改变这个答案，而这一步决定了你最后是变小并且变强，还是只是变小。","key":"weight.sustain.lean-muscle","productIds":["lean-muscle","xs-muscle-multiplier-eaas"],"why_es":"La proteína le da a tu cuerpo el material para conservar músculo. El entrenamiento de fuerza le da el motivo. Sin la señal de que ese músculo se está usando, el cuerpo lo trata como tejido caro del que puede prescindir, y en déficit prescindirá. Dos sesiones por semana bastan para cambiar esa respuesta, y este es el paso que decide si terminas más pequeño y más fuerte, o solo más pequeño."},{"stage":"sustain","rank":2,"route":"habit","products":["Wellness Bars","XS Protein Bars 12-pack"],"why":"Regain is the normal outcome, not the exception, and the plan rarely fails at dinner. It fails in the gap between meals when there is nothing on hand and something convenient is. Keeping one acceptable option in the bag, the car and the desk drawer is a boring intervention that outperforms most of what gets sold as motivation.","whyZh":"反弹是常态而不是例外，而计划很少是在晚餐时崩的。它崩在两餐之间那个空档：手边什么都没有，而方便的东西正好在。在包里、车里、办公桌抽屉里各放一样能接受的东西，是个很无聊的干预，但它的效果好过大多数以「动力」为名卖出去的东西。","key":"weight.sustain.wellness-bars","productIds":["wellness-bars","xs-protein-bars-12-pack"],"why_es":"Recuperar el peso es lo normal, no la excepción, y el plan rara vez falla en la cena. Falla en el hueco entre comidas, cuando no hay nada a mano y sí hay algo cómodo. Tener una opción aceptable en el bolso, en el coche y en el cajón del escritorio es una intervención aburrida que funciona mejor que casi todo lo que se vende como motivación."}],"summary":{"title":"Trying to lose weight? First, where do you get stuck?","titleZh":"想瘦下来？先看看你卡在哪一步。","sub":"The scale only shows one number, but the reasons behind it are different. Pick the one that sounds like you.","subZh":"体重秤只给你一个数字，背后的原因却各不相同。选一个最像你的。","moments":[{"id":"rebound","icon":"scale","label":"Diet works, then it comes back","labelZh":"瘦了又反弹","visual":null,"what":"The scale cannot tell fat from muscle. Cut hard and up to a third of what you lose can be muscle, and muscle is what burns energy while you rest. So you finish lighter but burning less, and what comes back is fat.","whatZh":"体重秤分不出掉的是脂肪还是肌肉。节食节得太狠，掉的体重里可能有三分之一是肌肉，而肌肉正是你躺着不动也在烧热量的地方。结果人是轻了，消耗也少了，反弹回来的全是脂肪。","twist":"Stop chasing the fastest drop. Eat enough protein so your body has no reason to touch your muscle, and judge by your waist and your clothes, not the scale alone.","twistZh":"别再追求掉得最快。蛋白质吃够，身体就没理由去拆肌肉。看腰围、看衣服松没松，别只盯着秤。","fixes":[{"id":"plant-protein-powder","why":"Protein at breakfast tells your body to keep its muscle, and it keeps you full until lunch.","whyZh":"早餐来一杯植物蛋白，身体就知道肌肉要留着，还能饱到中午。"},{"id":"double-x-multivitamin-31-day-refill","why":"Eat less and you get fewer vitamins too. Feeling flat, cold hands, more hair in the drain: often that is the gap, not the diet itself.","whyZh":"吃得少，维生素矿物质也跟着少了。没精神、手脚冰、掉头发，很多时候是缺营养，不是节食本身。"}]},{"id":"still-gaining","icon":"bowl","label":"Eat well, still gaining","labelZh":"吃得不多，还是长肉","visual":"sugar","what":"Rice, noodles, bread and juice turn into sugar fast, even in small portions. Your body sends out insulin to clear it, and insulin is also the signal that says store it. Spike after spike, it adds up.","whatZh":"米饭、面条、面包、果汁，就算吃得不多，也会很快变成糖。身体放出胰岛素来处理，而胰岛素同时也是叫身体“存起来”的信号。一顿一顿地冲高，就这样慢慢攒下来了。","twist":"You do not have to stop eating rice. Eat your vegetables and protein first and the rice last. Same plate, slower sugar.","twistZh":"不用戒米饭。先吃菜和肉，最后再吃饭。同样一盘菜，糖进得慢多了。","fixes":[{"id":"carb-blocker","why":"Take it before the rice or noodle meal you are not giving up. Part of the starch passes through instead of turning into sugar.","whyZh":"那顿躲不掉的米饭面条之前吃，一部分淀粉直接过去，不变成糖。"},{"id":"prebiotic-fiber","why":"Not a salad person? Stir fibre into water or coffee. The same meal fills you up longer and the sugar comes in slower.","whyZh":"不爱吃沙拉？纤维粉加进水或咖啡里就行。同样一顿饭更顶饱，糖也进得慢。"}]},{"id":"night","icon":"moon","label":"Snacking at night","labelZh":"晚上管不住嘴","visual":null,"what":"Night snacking usually starts in the morning. Skip breakfast, rush lunch, and by evening your body is chasing what it missed. Short sleep makes it worse, because it turns up your hunger and points it at sweet things.","whatZh":"晚上嘴馋，往往是早上埋下的。早餐不吃，午饭凑合，到了晚上身体就在找补白天欠的。睡得少更麻烦，饿的感觉会更强，而且专门想吃甜的。","twist":"Fix breakfast, not the night. And keep one real snack ready for 4 pm, so you are not starving by dinner.","twistZh":"要改的是早餐，不是晚上。下午四点备好一份像样的加餐，晚饭前就不会饿过头。","fixes":[{"id":"organics-all-in-one-shakes","why":"One glass for breakfast with protein, fibre and greens. It takes the decision out of the meal you usually skip.","whyZh":"早餐一杯，蛋白质、纤维、蔬菜都在里面。你最容易跳过的那顿，不用再想吃什么。"},{"id":"wellness-bars","why":"A whole-food bar for the afternoon. Check the first ingredient: nuts or oats, not sugar.","whyZh":"下午的加餐。看配料表第一位，是坚果燕麦，不是糖。"},{"id":"calcium-magnesium-d","why":"Take it in the evening to help you wind down. Better sleep means a quieter appetite the next day.","whyZh":"晚上吃，帮身体放松下来。睡得好，第二天胃口也没那么乱。"}]},{"id":"stress","icon":"bolt","label":"Eating when stressed","labelZh":"一有压力就想吃","visual":null,"what":"Stress hormones push your appetite toward sugar and fat. By the end of a hard day there is nothing left for good decisions, so you grab whatever is closest.","whatZh":"压力一大，身体里的压力激素会让你特别想吃甜的、油的。忙了一整天，已经没力气做选择了，手边有什么就吃什么。","twist":"It is not a willpower problem. Put a better option within reach before the moment comes: your bag, your car, your desk drawer.","twistZh":"这不是意志力的问题。在那个时刻来之前，先把好一点的选择放在手边：包里、车上、办公桌抽屉里。","fixes":[{"id":"xs-protein-bars-12-pack","why":"Keep a box in the drawer. Protein holds you much longer than chips or cookies.","whyZh":"抽屉里放一盒。蛋白质比薯片饼干顶饿得多。"},{"id":"vitamin-b-complex-120ct","why":"Stress burns through B vitamins, and they are what turn your food into usable energy.","whyZh":"压力大的时候B族消耗得特别快，而把食物变成能用的能量，靠的就是它。"},{"id":"organics-ashwagandha-capsules","why":"Helps your body handle stress, so the evening is less of a battle. Give it a few weeks.","whyZh":"帮身体扛住压力，晚上就没那么难熬。给它几周时间。"}]},{"id":"belly","icon":"flame","label":"Belly that won't budge","labelZh":"肚子就是瘦不下来","visual":null,"what":"You cannot choose where fat comes off, so sit-ups alone will not melt your belly. Belly fat is also not just sitting there. It is active, and it keeps a low level of inflammation going in your body.","whatZh":"脂肪从哪里掉，不是你能挑的，所以光做仰卧起坐瘦不了肚子。而且肚子上的脂肪不是安安静静待着的，它很活跃，会让身体一直处在低度发炎的状态。","twist":"What moves it is the whole routine: protein, fibre, sleep, and two strength sessions a week. Check your waist with a tape measure, not just the scale.","twistZh":"能让它动起来的是整套习惯：蛋白质、纤维、睡眠，加上每周两次力量训练。拿软尺量腰围，别只看体重秤。","fixes":[{"id":"advanced-omega","why":"Fish oil works on that background inflammation, not on weight directly. Judge it over months.","whyZh":"鱼油针对的是背后的慢性炎症，不是直接减重。按月看效果。"},{"id":"slimmetry","why":"Green tea extract to support a plan you are already doing. It helps at the margin, it does not work alone.","whyZh":"绿茶提取物，给你已经在做的计划加一把力。它是帮手，不能单靠它。"}]},{"id":"muscle","icon":"dumbbell","label":"Lose fat, keep muscle","labelZh":"只想减脂，不想掉肌肉","visual":null,"what":"Protein gives your body the material to keep muscle. Training gives it the reason. Eat less without that signal, and your body treats muscle as expensive tissue it can let go.","whatZh":"蛋白质给身体留住肌肉的原料，训练给它留住肌肉的理由。光少吃不练，身体会觉得肌肉太“费钱”，先把它省掉。","twist":"You do not need to live at the gym. Two strength sessions a week is enough to change the answer.","twistZh":"不用天天泡健身房。每周两次力量训练，就足够改变结果。","fixes":[{"id":"xs-grass-fed-whey-protein","why":"25g of grass-fed whey after training, third-party tested so you know what is in the tub.","whyZh":"练完来一杯，25克草饲乳清蛋白，有第三方检测，罐子里是什么清清楚楚。"},{"id":"xs-muscle-multiplier-eaas","why":"The nine essential amino acids, for when a full shake is too heavy or you train before eating.","whyZh":"九种必需氨基酸。空腹训练，或者喝不下一整杯蛋白粉的时候用。"},{"id":"lean-muscle","why":"CLA to support body composition alongside real training. It does not replace the training.","whyZh":"CLA，配合训练支持身体成分的改善。它代替不了训练本身。"}]}],"doctor":"Weight changing fast for no clear reason, or with constant tiredness, feeling cold, strong thirst or missed periods? See a doctor first, because thyroid and hormones can do this too.","doctorZh":"如果体重在没什么原因的情况下变化很快，或者同时总是很累、怕冷、特别口渴、月经不规律，请先去看医生，甲状腺和激素问题也可能导致这些。"}},"sleep":{"overview":"The stress system is meant to stand down at night. When cortisol stays high into the evening, the brain stays on watch, and you get the tired-but-wired pattern: flat all afternoon, alert at midnight. Lost sleep then feeds the loop; in one study, six short nights raised evening cortisol in healthy young men. The calming signals are built from nutrients, magnesium and the B vitamins among them, and stress uses those up faster. So the steps run in order: remove what keeps the alarm on, calm the stress system and reset the clock, refill the raw materials, then hold a rhythm long enough to stick. Loud snoring, pauses in breathing, or trouble sleeping most nights for three months need a doctor, not a supplement.","overviewZh":"压力系统本来应该在夜里下班。如果皮质醇到晚上还降不下来，大脑就一直处在值班状态，于是出现那种又累又亢奋的样子：下午整个人没电，半夜却精神十足。睡不够又反过来加重这个循环；一项研究里，健康的年轻男性连续六晚睡眠不足后，晚间皮质醇明显升高。让人平静下来的信号，是用营养素造出来的，镁和B族都在其中，而压力会加快它们的消耗。所以四步的顺序是：先拿掉让警报一直响的东西，再让压力系统平静、把生物钟调回来，然后补上原料，最后把节奏坚持到它稳住。如果打鼾很响、睡眠中有呼吸暂停，或者连续三个月大多数晚上都睡不好，需要的是医生，不是补充剂。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["Liver Support"],"why":"Start by removing what keeps the alarm on. Caffeine lingers for hours: in one study, a dose taken six hours before bed cut measured sleep by more than an hour, and people did not notice. Screen light in bed delays the night signal, and a heavy late dinner or evening drinks leave the liver working when the body should be winding down. The teaching behind this plan routes trouble falling asleep through the liver first. Last coffee before 2 pm, a lighter dinner three hours before bed, and the phone out of the bedroom.","key":"sleep.clear.liver-support","whyZh":"先拿掉让警报一直响的东西。咖啡因会在体内停留好几个小时：一项研究里，睡前六小时摄入的咖啡因，让实测睡眠少了一个多小时，而当事人自己毫无察觉。躺在床上看屏幕，光线会推迟身体的「天黑了」信号；晚饭吃得太晚太重，或者晚上喝酒，肝脏在该休息的时候还在加班。这套方案的思路是，入睡困难先从肝入手。咖啡最晚下午两点前，晚饭清淡些、离睡觉三小时，手机不进卧室。","productIds":["liver-support"]},{"stage":"regulate","rank":1,"route":"internal","products":["Organics Ashwagandha Capsules"],"why":"Ashwagandha works on the stress system itself rather than knocking you out. Across five trials it gave a small but real improvement in sleep, larger at 600 mg a day or more, over eight weeks or longer, and in people with insomnia. It works over weeks, not tonight. Take it with the evening meal and judge it at eight weeks. Skip it if you are pregnant or breastfeeding or have thyroid, autoimmune or liver disease, and stop and see a doctor if you notice dark urine or yellowing skin.","key":"sleep.regulate.organics-ashwagandha-capsules","whyZh":"南非醉茄作用在压力系统本身，而不是把你「放倒」。汇总五个试验来看，它对睡眠有小而确实的改善，每天600毫克以上、持续八周以上、以及本身有失眠的人，效果更明显。它是按周起效的，不是今晚吃了今晚就好。跟晚饭一起吃，八周后再判断。怀孕、哺乳，或者有甲状腺、自身免疫、肝脏方面的问题，不要吃；如果出现尿色变深或皮肤发黄，立刻停用并去看医生。","productIds":["organics-ashwagandha-capsules"]},{"stage":"regulate","rank":2,"route":"internal","products":["Stress Relief Probiotic"],"why":"The gut and the brain signal each other in both directions, and stress rarely leaves digestion alone. One strain in this probiotic lowered perceived stress over five weeks and improved sleep recovery in highly stressed adults. A larger trial in students missed its main anxiety goal, though sleep disturbance was lower. So the evidence is mixed and the effect modest: worth trying if stress shows up in your stomach as well as your sleep. One capsule with food at the same time each day, judged after five to eight weeks.","key":"sleep.regulate.stress-relief-probiotic","whyZh":"肠道和大脑之间是双向传递信号的，压力很少会放过消化。这款益生菌里的一株菌，在五周内降低了受试者自评的压力，并改善了高压人群的睡眠恢复。但另一项规模更大的学生试验，没有达到主要的焦虑指标，只是睡眠干扰有所减少。所以证据有好有坏，效果也不大：如果你的压力同时体现在胃和睡眠上，值得一试。每天同一时间随餐一粒，五到八周后再判断。","productIds":["stress-relief-probiotic"]},{"stage":"regulate","rank":3,"route":"internal","products":["Sleep Gummies","Sleep Health"],"why":"Both of these contain 3 mg of melatonin, and melatonin is a clock signal, not a sleeping pill: it tells the body that night has started. On average it helps people fall asleep about seven minutes faster, which is why it suits a shifted clock, jet lag or getting back to a fixed wake time better than long-term insomnia. Use it for occasional nights, 30 to 60 minutes before bed, and do not drive or drink afterwards. Keep it away from children, and ask a doctor first if you are pregnant, breastfeeding or on blood thinners.","key":"sleep.regulate.sleep-gummies","whyZh":"这两款都含3毫克褪黑素，而褪黑素是一个时钟信号，不是安眠药：它告诉身体「天黑了」。平均来看，它能让人入睡快大约七分钟，所以它更适合生物钟被打乱的情况，比如倒时差、或者要把起床时间调回来，而不是长期失眠。只在偶尔需要的晚上用，睡前30到60分钟，吃完不要开车、不要喝酒。放在孩子拿不到的地方；怀孕、哺乳或在服用抗凝药的人，先问医生。","productIds":["sleep-gummies","sleep-health"]},{"stage":"supplement","rank":1,"route":"internal","products":["Magnesium","Calcium Magnesium D"],"why":"Stress raises how much magnesium the body loses, and low magnesium makes the stress response more reactive, so the two feed each other. About half of US adults get less than they need from food. In small trials, older adults with insomnia fell asleep about 17 minutes faster on magnesium, though the evidence is low quality. Take it with dinner, food first where you can, and keep supplemental magnesium within 350 mg a day; loose stools are the first sign of too much. Choose calcium magnesium D if you eat little dairy.","key":"sleep.supplement.magnesium","whyZh":"压力会增加镁的流失，而缺镁又让压力反应更敏感，两者互相加重。大约一半的美国成年人从食物里吃不够镁。小型试验里，有失眠的老年人补镁后入睡快了大约17分钟，不过证据质量不高。跟晚饭一起吃，能从食物里补的先从食物补，补充剂来源的镁每天不超过350毫克；大便变稀是过量的第一个信号。如果平时很少吃奶制品，选钙镁D片。","productIds":["magnesium","calcium-magnesium-d"]},{"stage":"supplement","rank":2,"route":"internal","products":["Vitamin B Complex 120ct"],"why":"The brain builds its calming signals, GABA and serotonin, with enzymes that depend on vitamin B6, and the B vitamins as a group keep nerves supplied. They are water-soluble, the body stores them for hours rather than days, and stress, heavy drinking and refined-carb eating use them faster. Take them daily with food. If they feel energising, move them to dinner rather than skipping them, and avoid stacking several products that each contain B6, because B6 has a daily upper limit of 100 mg.","key":"sleep.supplement.vitamin-b-complex-120ct","whyZh":"大脑用来让自己平静下来的信号，GABA和血清素，要靠依赖维生素B6的酶来合成，而整个B族一起负责给神经供给原料。B族是水溶性的，身体只能存几个小时，而压力、经常喝酒和精致碳水饮食，都会加快它的消耗。每天随餐吃。如果吃了觉得太提神，就改到晚饭吃，而不是不吃；另外别同时吃好几种都含B6的产品，因为B6每天有100毫克的上限。","productIds":["vitamin-b-complex-120ct"]},{"stage":"sustain","rank":1,"route":"habit","products":["Vitamin B Complex 120ct","Liver Support"],"why":"The rhythm this plan follows anchors the evening between about 7:30 and 8:40 pm: B vitamins and liver support at the same time every night, for six months, because liver cells take roughly 180 days to renew. There is no mainstream research on the timing itself, so its value is as a cue. The same act at the same hour starts the wind-down two hours before bed, and after it the lights go down. Judge it at six months, not after a week.","key":"sleep.sustain.vitamin-b-complex-120ct","whyZh":"这套方案的节律，把晚上锚定在大约7点半到8点40之间：每晚同一时间吃B族和护肝，坚持六个月，因为肝细胞大约180天更新一轮。主流研究并没有专门验证这个时间点，所以它的价值在于当一个信号：每天同一时间做同一件事，提前两小时开启放松，做完之后把灯调暗。按六个月来判断，而不是一周。","productIds":["vitamin-b-complex-120ct","liver-support"]},{"stage":"sustain","rank":2,"route":"habit","products":["Sleep + Stress Solution"],"why":"Keep the same wake time seven days a week; a fixed schedule is part of the approach doctors use first for chronic insomnia. Sleep runs in cycles of about 90 minutes, and waking in the middle of deep sleep is what makes a morning feel awful, so count back from your alarm in 90-minute steps: a 7 am alarm means aiming to be asleep around 11:30 pm. If you miss it, wait for the next cycle rather than lying awake. The sleep and stress bundle puts the evening routine in one box.","key":"sleep.sustain.sleep-stress-solution","whyZh":"一周七天保持同一个起床时间；固定作息是医生治疗慢性失眠时首选方法的一部分。睡眠以大约90分钟为一个周期，在深睡中途被叫醒，就是早上特别难受的原因，所以从闹钟往回按90分钟倒推：早上7点起床，就争取11点半左右睡着。错过了，就等下一个周期，而不是躺着硬熬。睡眠减压方案把晚间的这一套放在了一个盒子里。","productIds":["sleep-stress-solution"]}],"summary":{"title":"Sleeping badly? First, what kind of bad night?","titleZh":"睡不好？先想想，是哪一种睡不好？","sub":"Lying awake, waking at 3 am and waking up tired all have different causes. Pick the one that sounds like you.","subZh":"躺下睡不着、半夜醒、睡醒还累，原因都不一样。选一个最像你的。","moments":[{"id":"switch-off","icon":"brain","label":"Can't switch off at night","labelZh":"躺下了脑子停不下来","visual":null,"what":"Your body has a stress alarm, and it is meant to switch off at night. If it is still on at bedtime, your brain stays on watch. You are tired, but your head keeps going.","whatZh":"身体里有一套应对压力的警报系统，本来到了晚上就该关掉。睡觉时它还开着，大脑就一直在站岗。人已经很累了，脑子却还在转。","twist":"You do not have to empty your head to fall asleep. Just stop feeding the alarm: last coffee before 2 pm, and the phone out of the bedroom.","twistZh":"你不需要把脑子清空才睡得着，只要别再给警报加油：咖啡下午两点前喝完，手机别带进卧室。","fixes":[{"id":"magnesium","why":"Helps your body wind down. Stress makes you lose magnesium, and about half of adults do not get enough from food. Take it with dinner.","whyZh":"帮身体慢慢放松下来。压力会让镁流失得更快，而差不多一半的成年人从饮食里本来就吃不够。晚饭时吃。"},{"id":"vitamin-b-complex-120ct","why":"Your brain makes its calming signals with the help of B6, and stress uses the B vitamins up fast.","whyZh":"大脑制造让人平静下来的信号，离不开B6。压力一大，B族消耗得特别快。"},{"id":"calcium-magnesium-d","why":"Eat little dairy? Choose this one instead, so you cover calcium and magnesium together.","whyZh":"平时奶制品吃得少？换成这个，钙和镁一起补上。"}]},{"id":"3am","icon":"moon","label":"Wake up at 3 am","labelZh":"半夜三点醒","visual":null,"what":"A drink or a late, heavy dinner can help you drop off, but your body is still working on it through the night. As it wears off in the early hours, sleep turns light and you are suddenly wide awake.","whatZh":"喝点酒，或者晚饭吃得又晚又多，刚开始可能更容易睡着，但身体整晚都还在处理这些东西。到了后半夜劲头一过，睡眠变浅，人一下子就醒了。","twist":"Do not check the clock, it only wakes you up more. Finish dinner about three hours before bed, and go easy on evening drinks.","twistZh":"醒了别看时间，越看越清醒。晚饭尽量在睡前三小时吃完，晚上少喝点酒。","fixes":[{"id":"liver-support","why":"Late dinners and drinks keep your liver working at night. Milk thistle supports it while it does. Take it in the evening.","whyZh":"晚饭和酒，都要肝在夜里加班处理。奶蓟草给肝一点支持，晚上吃。"},{"id":"vitamin-b-complex-120ct","why":"Drinking uses up B vitamins, and your liver needs them to do its work. Take them together with Liver Support.","whyZh":"喝酒会消耗B族，而肝干活离不开B族。和护肝片一起吃。"}]},{"id":"wired","icon":"bolt","label":"Stressed all day, wired at night","labelZh":"白天发蔫，晚上精神","visual":null,"what":"Stress hormones should be high in the morning and low at night. Weeks of pressure flip that: flat all afternoon, wide awake at midnight. Then the short nights push stress up again the next day, and the loop keeps going.","whatZh":"压力激素本来应该早上高、晚上低。压力大了几个星期，节奏就反过来了：下午整个人发蔫，半夜却特别精神。睡得少，第二天压力更大，就这样一直循环下去。","twist":"You do not have to fix your job first. Calm the stress system from the inside, and give it weeks, not one night.","twistZh":"不用先把工作上的事都解决掉。从身体里面把压力系统调稳，按周来看效果，不是看一个晚上。","fixes":[{"id":"organics-ashwagandha-capsules","why":"Calms the stress system, it does not knock you out. Take it with dinner and judge it at eight weeks. Pregnant or thyroid issues? Skip it.","whyZh":"它调的是压力系统，不是让你昏睡。晚饭时吃，八周后再看效果。怀孕、哺乳或有甲状腺问题的，不要吃。"},{"id":"magnesium","why":"Stress drains magnesium, and low magnesium makes stress hit harder. A steady evening dose helps break that loop.","whyZh":"压力让镁流失，缺镁又让人更扛不住压力。每天晚上固定补一点，帮你把这个循环打断。"}]},{"id":"jetlag","icon":"clock","label":"Jet lag or a shifted schedule","labelZh":"倒时差、作息乱了","visual":null,"what":"Your body runs on a clock, and melatonin is the signal that tells it night has started. After a long flight or a week of late nights, that signal comes at the wrong time, so you lie awake even though you are tired.","whatZh":"身体里有一个生物钟，褪黑素就是告诉它“天黑了”的信号。坐完长途飞机，或者连着熬了一周夜，这个信号来得不是时候，人明明很累却睡不着。","twist":"This is when melatonin makes sense. It is a clock signal, not a sleeping pill: on average it gets you to sleep only a few minutes sooner. Use it for the odd night while your clock resets, not every night.","twistZh":"这种时候，褪黑素才真正用得上。它是调时钟的信号，不是安眠药，平均只让人早几分钟睡着。偶尔用几晚，帮生物钟调回来就好，不要天天吃。","fixes":[{"id":"sleep-gummies","why":"Sweet Dreams: 3 mg melatonin with passionflower. One, 30 to 60 minutes before bed. No driving or alcohol after, and keep them away from kids.","whyZh":"甜梦软糖：每粒3毫克褪黑素，加西番莲。睡前30到60分钟吃一粒。吃完别开车、别喝酒，放在孩子拿不到的地方。"},{"id":"sleep-health","why":"The same 3 mg melatonin, from tomato, with chamomile, as a capsule. Pregnant, breastfeeding or on blood thinners? Ask your doctor first.","whyZh":"同样是3毫克褪黑素，来自番茄，加洋甘菊，做成胶囊。怀孕、哺乳或在吃抗凝药的，先问医生。"}]},{"id":"unrefreshed","icon":"bed","label":"Wake up unrefreshed","labelZh":"睡够了还是没精神","visual":null,"what":"Sleep runs in cycles of about 90 minutes. If your alarm goes off in the middle of deep sleep, you feel awful, even after a full night.","whatZh":"睡眠是一轮一轮的，一轮大约90分钟。闹钟要是正好在深睡的时候响，就算时间睡够了，起来也照样难受。","twist":"Count back from your alarm in 90-minute steps: a 7 am alarm means being asleep around 11:30 pm. Missed it? Wait for the next cycle instead of lying there. Same wake time on weekends too.","twistZh":"从闹钟往回倒推，每90分钟一格：七点起床，就争取十一点半睡着。错过了，就等下一轮再睡，别干躺着。周末也同一时间起床。","fixes":[{"id":"vitamin-b-complex-120ct","why":"Take it at the same time every evening. The routine itself becomes the cue that tells your body the wind-down has started.","whyZh":"每天晚上同一时间吃。这个固定动作本身，就是提醒身体该放松下来的信号。"},{"id":"liver-support","why":"Pair it with the B vitamins every night, around 7:30 to 8:40 pm. Liver cells take about six months to renew, so judge it in months.","whyZh":"每晚7点半到8点40之间，和B族一起吃。肝细胞大约六个月更新一轮，所以按月看效果。"},{"id":"sleep-stress-solution","why":"The whole evening routine in one box, if you would rather not put it together yourself.","whyZh":"整套晚间放松的产品装在一盒里，不想自己一样一样搭配的，直接选这个。"}]},{"id":"stomach","icon":"leaf","label":"Stress goes to your stomach","labelZh":"一紧张胃就打结","visual":null,"what":"Your gut and your brain signal each other all the time, in both directions. That is why a deadline can land straight in your stomach, and why stress rarely leaves digestion alone.","whatZh":"肠道和大脑一直在互相传信号，而且是双向的。所以一有截止日期，胃先有反应；压力大的日子，肠胃也很少能安生。","twist":"Worth trying if stress shows up in your stomach as well as your sleep. The research is still mixed, so give it five to eight weeks and judge for yourself.","twistZh":"如果压力既影响睡眠，又影响肠胃，值得试一试。这方面的研究结论还不一致，给它五到八周，自己感受。","fixes":[{"id":"stress-relief-probiotic","why":"Strains chosen for the gut-brain link. In one study, a strain in it lowered stress and helped sleep recovery. One a day with food.","whyZh":"选的是针对肠脑连接的菌株。在一项研究里，其中一株降低了压力感，也改善了睡眠恢复。每天一粒，随餐吃。"},{"id":"organics-ashwagandha-capsules","why":"Works on the stress side of the loop. Take it with dinner.","whyZh":"从压力这一头下手，晚饭时吃。"}]}],"doctor":"Loud snoring, pauses in breathing, or trouble sleeping most nights for three months? See a doctor first. That needs more than a supplement.","doctorZh":"如果打鼾很响、睡着时会停止呼吸，或者三个月来大多数晚上都睡不好，请先去看医生，这不是补充剂能解决的。"}},"energy":{"overview":"Energy is something your cells make all day, out of food, and three things usually get in the way. The day runs on refined carbs and sugar, which lift you for an hour and then drop you. Sleep runs short, and the debt adds up quietly while caffeine hides it. And the raw materials that turn food into energy, protein, the B vitamins and iron, run low without any hunger signal to warn you. The four steps take them in that order: stop the swings, stop the leaks, supply the materials, then keep the daily rhythm that holds it. If the tiredness has lasted more than a few weeks, or comes with weight loss, breathlessness, very heavy periods or low mood, see a doctor first.","overviewZh":"精力是细胞每天用食物一点点造出来的，通常有三件事在拖后腿。一天靠精致碳水和糖撑着，提神一小时，然后掉下来。睡眠不够，睡眠债悄悄累积，咖啡把它盖住了。把食物变成能量的原料，蛋白质、B族和铁，缺了也不会有饥饿感提醒你。下面四步就按这个顺序来：先止住起伏，再堵住漏洞，然后把原料补上，最后用每天固定的节奏把成果守住。如果累了已经好几周，或者同时有体重下降、气短、经量很多、情绪低落，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["Organics All-in-One Bars","Wellness Bars"],"why":"The first thing to take off is the swing. A meal or snack that is mostly refined carbs lifts you briefly, and a pooled analysis of 31 studies found carbohydrates actually raise fatigue within 30 minutes and lower alertness within the hour. The early-afternoon dip is partly your body clock, but a carb-heavy lunch deepens it. You do not have to give up carbs, you have to stop eating them alone. Swap the 3 pm pastry or sweet drink for something with protein and fibre, and a glass of water.","key":"energy.clear.organics-all-in-one-bars","whyZh":"第一步先卸掉的是那个起伏。一顿以精致碳水为主的饭或零食，只能让你精神一小会儿；一项汇总了31个研究的分析发现，碳水吃下去30分钟内疲劳感反而上升，一小时内警觉度下降。午后那一阵犯困，一部分是生物钟本身，但一顿高碳水的午饭会让它更深。你不需要戒掉碳水，要做的是别让碳水单独出现。把下午三点的点心或甜饮料，换成有蛋白质和纤维的东西，再配一杯水。","productIds":["organics-all-in-one-bars","wellness-bars"]},{"stage":"clear","rank":2,"route":"internal","products":["Begin Daily GI Primer","Prebiotic Fiber","Probiotic"],"why":"The second load sits in the gut, and it matters most when the tiredness comes with bloating, irregular stools or a mostly takeout diet. The teaching behind this plan puts clearing before replenishing: poorly digested food and a gut out of balance keep using up the very nutrients step three will supply, and chronic fatigue sits on the same checklist as bloating and constipation. Direct evidence for gut products treating fatigue is thin, so treat this as getting the order right, not as an energy supplement.","key":"energy.clear.begin-daily-gi-primer","whyZh":"第二个负担在肠道。如果疲劳同时伴随腹胀、排便不规律，或者三餐大多靠外卖，这一步最要紧。这套方案的逻辑是先清后补：消化不完全、菌群失衡，会不断消耗第三步要补进去的营养素，而慢性疲劳和腹胀、便秘本来就在同一张肠道信号清单上。直接用肠道产品来治疲劳，主流研究的证据并不多，所以把它当作把顺序做对，而不是提神产品。","productIds":["begin-daily-gi-primer","prebiotic-fiber","probiotic"]},{"stage":"regulate","rank":1,"route":"habit","products":["Magnesium"],"why":"Sleep debt is the leak most people underestimate. In a controlled study, two weeks of six hours a night left people as impaired as two nights with no sleep at all, while they reported feeling only slightly sleepy. Caffeine does not repay that debt, it hides it, and about a third of US adults sleep under seven hours. Fix the wake time first, the same seven days a week, then aim for seven hours or more. Magnesium in the evening supports the wind-down; low magnesium intake is common, and tiredness is one of its early signs.","key":"energy.regulate.magnesium","whyZh":"睡眠债是最多人低估的漏洞。一项对照研究里，连续两周每晚只睡六小时的人，表现跌到相当于整整两晚没睡，而他们自己只觉得有点困。咖啡还不了这笔债，只是把它盖住；大约三分之一的美国成年人每晚睡不到七小时。先把起床时间固定下来，一周七天一样，再争取睡够七小时以上。晚上补镁可以帮身体放松下来；镁摄入不足很常见，而疲劳正是它最早的信号之一。","productIds":["magnesium"]},{"stage":"regulate","rank":2,"route":"habit","products":["Vitamin C Extended Release 180ct"],"why":"What you eat only counts once it is absorbed, and iron is where that quietly fails. Black tea drunk with a meal cut absorption of plant iron by 79 to 94 percent in one study, and coffee has a smaller but real effect. Vitamin C does the opposite: it turns iron into the form the gut takes up most easily. So keep coffee and tea at least an hour away from meals, and take vitamin C alongside iron-rich food or an iron tablet. It costs nothing, and for anyone who relies on plant iron it is a big fix.","key":"energy.regulate.vitamin-c-extended-release-180ct","whyZh":"吃进去的东西要吸收了才算数，而铁恰恰是悄悄出问题的地方。一项研究里，吃饭时喝红茶，让植物来源的铁吸收下降了79%到94%，咖啡也有影响，只是小一些。维生素C的作用正好相反，它把铁转成肠道最容易吸收的形式。所以咖啡和茶至少离开饭点一小时，吃富含铁的食物或铁片时，配上维生素C。这个修正不花钱，对主要靠植物获取铁的人来说，效果不小。","productIds":["vitamin-c-extended-release-180ct"]},{"stage":"supplement","rank":1,"route":"internal","products":["Plant Protein Powder","Organics All-in-One Shakes"],"why":"Energy is made by enzymes, and enzymes are made of protein. A practical target is about 1.2 g of protein per kilogram of body weight a day, so 72 g for someone who weighs 60 kg, with roughly a third of it at breakfast, because breakfast sets the energy for the day and dinner goes to repair. A breakfast of toast, cereal or congee supplies a fraction of that. If yours looks like that, one shake closes most of the gap. Work out your own number, then look at what your first meal actually contains.","key":"energy.supplement.plant-protein-powder","whyZh":"能量是酶造出来的，而酶是蛋白质做的。一个实用的目标是每天每公斤体重约1.2克蛋白质，体重60公斤就是72克，其中大约三分之一放在早餐，因为早餐供应一整天的精力，晚餐负责修复。一顿吐司、麦片或白粥的早餐，只能提供其中一小部分。如果你的早餐是这样，一杯蛋白奶昔就能补上大部分缺口。先算出你自己的数字，再看看你的第一餐到底吃进了多少。","productIds":["plant-protein-powder","organics-all-in-one-shakes"]},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin B Complex 120ct"],"why":"The B vitamins are the coenzymes that turn carbohydrate, fat and protein into usable energy. B1 is needed to burn carbohydrate, the brain's main fuel. B2, B3 and B5 work inside the energy cycle itself, and B12 and folate build the red cells that carry oxygen. They are water-soluble, the body keeps little in reserve, and refined grains lose most of theirs in milling. The benefit is clearest where intake has been short: irregular meals, regular drinking, or years on metformin or acid reducers, which lower B12 absorption. Take them with food.","key":"energy.supplement.vitamin-b-complex-120ct","whyZh":"B族维生素是把碳水、脂肪、蛋白质转化成可用能量的辅酶。B1负责燃烧碳水，而碳水是大脑的主要燃料；B2、B3、B5就在能量循环内部工作；B12和叶酸负责制造运送氧气的红细胞。它们是水溶性的，身体几乎存不住，而精米白面在加工中丢掉了大部分。最能看出效果的，是本来就摄入不足的人：三餐不规律、经常喝酒，或者长期服用二甲双胍、抑酸药的人，这些药会降低B12的吸收。随餐吃。","productIds":["vitamin-b-complex-120ct"]},{"stage":"supplement","rank":2,"route":"internal","products":["Iron & Folic Acid","Women's Pack"],"why":"Iron is the best-evidenced lever in this area, and the reason many people are told their labs look normal. A standard blood count can be fine while iron stores are low. In a trial of 198 menstruating women with low ferritin but no anaemia, twelve weeks of iron cut fatigue by 48 percent, against 29 percent on placebo. That is a specific group: women with heavy periods, vegetarians and frequent blood donors. Ask for a ferritin test before taking iron long term, because iron can build up, and recheck after about three months.","key":"energy.supplement.iron-folic-acid","whyZh":"铁是这个领域证据最扎实的一个杠杆，也是很多人被告知「化验单正常」却依然很累的原因。血常规可能完全正常，而体内的铁储备已经偏低。一项试验里，198位有月经、铁蛋白偏低但没有贫血的女性，补铁十二周后疲劳下降了48%，安慰剂组是29%。这是特定的人群：经量偏多的女性、素食者、经常献血的人。长期补铁之前先查铁蛋白，因为铁会在体内累积，大约三个月后再复查。","productIds":["iron-folic-acid","women-s-pack"]},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill","Women's Daily Multivitamin","Men's Daily Multivitamin"],"why":"Energy metabolism uses more than B vitamins and iron: magnesium, zinc and vitamin C all take part, and a shortfall in any one of them slows the whole line. A multivitamin is the base that covers several at once, which is why it sits under the targeted products rather than replacing them. Regular exercise raises the demand rather than lowering it, so people who train hard and eat irregularly are the most likely to run short. One base taken every day does more than five bottles taken now and then.","key":"energy.supplement.double-x-multivitamin-31-day-refill","whyZh":"能量代谢用到的不只是B族和铁，镁、锌、维生素C都参与其中，任何一样不足，整条流水线都会变慢。综合营养素是一次覆盖好几样的底座，所以它放在针对性产品的下面，而不是取代它们。规律运动不会减少需求，反而会增加，所以训练多、吃饭又不规律的人，最容易缺。一个底座每天吃，比五个瓶子有一顿没一顿地吃更有用。","productIds":["double-x-multivitamin-31-day-refill","women-s-daily-multivitamin","men-s-daily-multivitamin"]},{"stage":"sustain","rank":1,"route":"habit","products":["Everyday Nutrition Solution"],"why":"The morning is where energy is won or lost for the day. The breakfast this plan is built around covers seven things in one meal: protein, fibre, probiotics, good fats, plant foods, vitamins and minerals, eaten between 7 and 9 am. It does the first three steps at once, which is why keeping it is the fourth. The foundation bundle puts the multivitamin, protein and omega-3 in a single order. Treat it like brushing your teeth: the same breakfast every weekday, not a new plan every Monday.","key":"energy.sustain.everyday-nutrition-solution","whyZh":"一天的精力，早上就决定了一大半。这套方案围绕的营养早餐，一餐覆盖七类：优质蛋白、膳食纤维、益生菌、优质脂肪、蔬果植物营养、维生素和矿物质，在早上7到9点吃。它一餐就完成了前三步，所以守住它就是第四步。基础营养方案把综合营养素、蛋白粉和深海鱼油放在一单里。把它当成刷牙一样：每个工作日同一份早餐，而不是每周一换一个新计划。","productIds":["everyday-nutrition-solution"]},{"stage":"sustain","rank":2,"route":"internal","products":["Vitamin B Complex 120ct","Liver Support"],"why":"The evening half of the rhythm comes from the tradition this plan follows: B vitamins and liver support taken together between about 7:30 and 8:40 pm, every evening, for six months. The reasoning is that the liver processes everything the day brought in, and its cells take roughly 180 days to renew, so it is judged over months, not days. There is no mainstream research on the timing itself, so hold it as a routine that anchors the evening rather than as a claim. If falling asleep is part of the problem, start here too.","key":"energy.sustain.vitamin-b-complex-120ct","whyZh":"节奏的另一半在晚上，来自这套方案所依据的调理传统：每天晚上大约7点半到8点40之间，B族和护肝一起吃，坚持六个月。道理是肝脏要处理一整天带进来的所有东西，而肝细胞大约180天更新一轮，所以要按月看效果，而不是按天。主流研究并没有专门验证这个时间点，所以把它当作固定晚间节奏的习惯，而不是一项功效声明。如果入睡困难也是问题之一，同样从这里开始。","productIds":["vitamin-b-complex-120ct","liver-support"]},{"stage":"sustain","rank":3,"route":"internal","products":["Heart Health CoQ10"],"why":"CoQ10 sits inside the energy machinery of every cell, and the body makes less of it with age. A pooled analysis of 13 trials found it reduced fatigue compared with placebo, with most of the effect in people who were already unwell, so its place is narrow: people past their mid-forties, or anyone whose tiredness comes with a long-term condition. Talk to your doctor first if you take a statin or a blood thinner. It is an add-on for the right person, not a first step for everyone.","key":"energy.sustain.heart-health-coq10","whyZh":"辅酶Q10位于每个细胞的能量机器内部，身体自己合成的量会随年龄下降。一项汇总了13个试验的分析发现，它比安慰剂更能减轻疲劳，但效果大多出现在本身已有健康问题的人身上，所以它的位置很窄：四十五岁以上，或者疲劳伴随长期慢性问题的人。如果你在吃他汀类或抗凝药，先问医生。它是给合适的人的补充，不是每个人的第一步。","productIds":["heart-health-coq10"]}],"summary":{"title":"Tired again? First, when does it hit?","titleZh":"又累了？先想想，什么时候最累？","sub":"Different kinds of tired have different causes. Pick the one that sounds like you.","subZh":"不同时间的累，原因不一样。选一个最像你的。","moments":[{"id":"lunch","icon":"bowl","label":"Sleepy after lunch","labelZh":"午饭后犯困","visual":"sugar","what":"That is a sugar spike. Rice, noodles, bread and sweet drinks turn into sugar fast, your body sends out a wave of insulin to deal with it, and then your blood sugar drops. That drop is the sleepy feeling.","whatZh":"这是血糖在坐过山车。米饭、面条、面包、甜饮料很快变成糖，身体一下子放出一大波胰岛素去处理，然后血糖掉下来。掉下来的那一刻，就是你犯困的时候。","twist":"You do not have to stop eating rice. I know that is hard, and I do not eat salad either. You just slow the sugar down.","twistZh":"你不需要戒米饭，我知道很难，我自己也不爱吃沙拉。你只要让糖进入血液的速度慢下来。","fixes":[{"id":"carb-blocker","why":"Take it before a carb-heavy meal to block part of the carbs, so less of it turns into sugar.","whyZh":"吃大餐或碳水多的一顿之前吃，挡掉一部分碳水，少变成一些糖。"},{"id":"prebiotic-fiber","why":"Not a salad person? Stir fibre into water or coffee. It slows the sugar down the same way.","whyZh":"不爱吃沙拉？把纤维粉加进水或咖啡里，一样能让糖慢下来。"},{"id":"plant-protein-powder","why":"Swap one meal for a protein shake. Protein digests slowly, so there is no spike and no crash.","whyZh":"用一杯蛋白奶昔换掉一顿饭。蛋白质消化得慢，血糖不会冲高，也就不会掉下来。"}]},{"id":"work","icon":"briefcase","label":"Drained after work","labelZh":"下班后整个人被掏空","what":"A full day burns through vitamins and minerals faster than a rushed lunch puts them back. By evening your whole body is running on empty and needs a long time to recover.","whatZh":"忙一整天，身体消耗维生素和矿物质的速度，比一顿匆忙的午饭补回来的快得多。到了晚上，整个身体都在空转，要很久才缓得过来。","twist":"Refill the tank every morning, instead of waiting for the weekend to recover.","twistZh":"每天早上把油加满，而不是等周末再补觉回血。","fixes":[{"id":"double-x-multivitamin-31-day-refill","why":"22 vitamins and minerals plus plant nutrients: the daily refill for what the day uses up.","whyZh":"22种维生素矿物质加植物营养素，把一天消耗掉的每天补回来。"},{"id":"vitamin-b-complex-120ct","why":"The B vitamins turn your food into energy you can use, and a busy day burns through them.","whyZh":"B族负责把吃进去的食物变成能用的能量，越忙越耗B族。"}]},{"id":"coffee","icon":"cup","label":"Running on coffee","labelZh":"全靠咖啡撑着","what":"Coffee does not give you energy, it borrows it. It hides the tired signal for a few hours, and you pay it back in the afternoon or at night.","whatZh":"咖啡不是给你能量，是先借给你。它把累的信号盖住几个小时，下午或者晚上就得还回去。","twist":"The healthier swap: B vitamins help your body pull energy out of the food you already eat. That is why a lot of athletes take them.","twistZh":"更健康的替代：B族帮身体从你本来就吃的食物里把能量提出来，这也是很多运动员会补B族的原因。","fixes":[{"id":"vitamin-b-complex-120ct","why":"A daily B complex instead of the third coffee.","whyZh":"用每天的B族，替掉第三杯咖啡。"},{"id":"plant-protein-powder","why":"Protein at breakfast keeps your energy steady until lunch, so you reach for coffee less.","whyZh":"早餐有蛋白质，精力能稳稳撑到午饭，就不用一直靠咖啡。"}]},{"id":"liver","icon":"glass","label":"Eat out, drink or stay up late","labelZh":"应酬多、外卖多、常熬夜","what":"Your liver is your body's filter. Everything you eat, drink and breathe goes through it. Takeout, drinks and late nights keep it working overtime, and a liver that is always busy leaves you heavy and tired, even when you slept.","whatZh":"肝是身体的过滤器，你吃的、喝的、呼吸进来的，都要经过它。外卖、应酬、熬夜，让它一直在加班，而一个总在加班的肝，会让你觉得身体沉、没精神，就算睡够了也一样。","twist":"Give your liver an evening routine: Liver Support and Vitamin B together, at the same time every night, around 7:30 to 8:40 pm. Liver cells take about six months to renew, so judge it in months, not days.","twistZh":"给肝一个晚间节奏：护肝片和B族一起吃，每晚同一时间，大约7点半到8点40。肝细胞大约六个月更新一轮，所以按月看效果，不是按天。","fixes":[{"id":"liver-support","why":"Milk thistle to support your liver while it does the cleaning up.","whyZh":"奶蓟草，在肝脏清理的时候给它支持。"},{"id":"vitamin-b-complex-120ct","why":"Your liver needs B vitamins to do its work. Take them together with Liver Support in the evening.","whyZh":"肝脏干活离不开B族。晚上和护肝片一起吃。"},{"id":"prebiotic-fiber","why":"Clearing has two halves, liver and gut. Fibre helps the gut carry waste out instead of letting it sit.","whyZh":"清理分两半，肝和肠道。纤维帮肠道把废物带出去，而不是留在里面。"}]},{"id":"morning","icon":"bed","label":"Wake up tired","labelZh":"睡醒了还是累","what":"That is usually sleep debt. Two weeks of six-hour nights leaves you as foggy as two nights with no sleep at all, and you do not even notice it.","whatZh":"这通常是睡眠债。连续两周每晚只睡六小时，脑子的状态相当于两晚完全没睡，而你自己察觉不到。","twist":"Get up at the same time every day, weekends too, and aim for seven hours.","twistZh":"每天同一时间起床，周末也一样，争取睡够七小时。","fixes":[{"id":"magnesium","why":"Helps your body wind down in the evening.","whyZh":"帮身体在晚上放松下来。"},{"id":"iron-folic-acid","why":"Tired all the time and a woman? Ask your doctor to check ferritin first. Low iron often hides behind a normal blood test.","whyZh":"女生如果一直很累，先请医生查一下铁蛋白。缺铁常常藏在正常的血常规后面。"}]},{"id":"stress","icon":"bolt","label":"Stressed and wired","labelZh":"压力大，又累又亢奋","what":"Stress, sugar and processed food keep your body in a low, constant inflammation. Fighting that all day is exhausting.","whatZh":"压力、糖和加工食品，会让身体一直处在低度发炎的状态。整天都在对抗它，人当然累。","twist":"Calm the fire from the inside.","twistZh":"从身体里面把火降下来。","fixes":[{"id":"vitamin-c-extended-release-180ct","why":"The body's main antioxidant, and stress uses it up fast. Take it with meals: it also helps you absorb iron.","whyZh":"身体最主要的抗氧化剂，压力一大就消耗得快。随餐吃，还能帮助铁的吸收。"},{"id":"advanced-omega","why":"Fish oil to cool the inflammation down.","whyZh":"深海鱼油，给身体的炎症降降温。"},{"id":"organics-ashwagandha-capsules","why":"Helps your body handle stress. Give it a few weeks.","whyZh":"帮身体扛住压力，给它几周时间。"}]}],"doctor":"Tired for more than a few weeks, or with weight loss, breathlessness, very heavy periods or low mood? See a doctor first.","doctorZh":"如果累了已经好几周，或者同时有体重下降、气短、经量很多、情绪低落，请先去看医生。"}},"digestion":{"overview":"Constipation and loose stools look like opposite problems, but most of the time they are the same one: stool with the wrong amount of water in it. Fibre is what holds that water, and most adults eat about 16 g a day against the 25 to 38 g they need. Water helps once the fibre is there. The bacteria then ferment that fibre into acids that keep the bowel moving, and the whole system runs on a daily rhythm that is strongest in the morning. The steps follow that order: bulk and water, then the bacteria, then the raw materials, then the rhythm. Blood in the stool, black stool, weight loss you cannot explain, or a new change in habit that lasts, especially after 50, need a doctor first.","overviewZh":"便秘和稀便看起来是相反的两个问题，其实大多数时候是同一件事：大便里的水分不对。能把水分留住的是膳食纤维，而大多数成年人每天只吃到16克左右，需要的是25到38克。有了纤维，喝水才真正有用。接着，肠道细菌把纤维发酵成酸性物质，推动肠道蠕动；整个系统跟着一天的节律走，早上最活跃。下面四步就按这个顺序：先有体积和水分，再是菌群，然后是原料，最后是节律。如果大便带血或发黑、体重不明原因下降，或者排便习惯出现新的、持续的变化，尤其是50岁以后，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Prebiotic Fiber","Green Superfood"],"why":"Start with fibre, because it decides how much water the stool can hold, and that is what makes it too hard or too loose. US adults average about 16 g a day against 25 g for women and 38 g for men. In trials, adding more than 10 g a day for at least four weeks is what changed frequency. Food carries most of the bulk: vegetables first at each meal, then beans, oats and whole grains. The powder tops up the gap. Raise fibre by about 5 g a week, and drink a full glass of water with each serving.","key":"digestion.clear.prebiotic-fiber","whyZh":"从纤维开始，因为它决定大便能留住多少水分，而太干或太稀，说到底就是水分的问题。美国成年人平均每天只吃到约16克纤维，女性需要25克，男性38克。临床试验里，真正改变排便频率的，是每天额外增加10克以上、持续至少四周。大部分的量应该来自食物：每餐先吃蔬菜，再加豆类、燕麦和全谷物，纤维粉用来补上差的那一截。每周增加大约5克，别一下加太多，每一份都配一整杯水。","productIds":["prebiotic-fiber","green-superfood"]},{"stage":"regulate","rank":1,"route":"internal","products":["Probiotic"],"why":"Fibre is also food, and the bacteria that eat it turn it into acids that keep the bowel moving. That makes probiotics the second lever, not the first. The strain matters more than the count: one strain in this product, B. lactis HN019, cut whole-gut transit time from 49 hours to 21 in a two-week trial, while other strains in other studies did nothing
