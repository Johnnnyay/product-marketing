. Across trials the average gain is modest, about one extra bowel movement a week. Take it daily with food, alongside the fibre it lives on, and judge it after four weeks.","key":"digestion.regulate.probiotic","whyZh":"纤维同时也是食物，吃它的细菌会把它发酵成酸性物质，推动肠道蠕动。所以益生菌是第二个杠杆，而不是第一个。菌株比菌数更重要：这款产品里的一株乳双歧杆菌HN019，在一项两周的试验里，把食物通过整个肠道的时间从49小时缩短到21小时；而其他研究里的另一些菌株，完全没有效果。综合所有试验，平均改善并不夸张，大约每周多一次排便。每天随餐吃，和它赖以生存的纤维一起，四周后再判断效果。","productIds":["probiotic"]},{"stage":"regulate","rank":3,"route":"internal","products":["Begin Daily GI Primer","Digestive Enzyme"],"why":"Enzymes answer a different problem: the heavy, bloated feeling after a big meal, not how often you go. The stomach's protein-digesting enzymes decline with age, and food that sits undigested is uncomfortable. The evidence for enzyme supplements is honestly thin, with small trials showing less bloating after single meals, so use them where that symptom is clear rather than every day by default. The 6-in-1 drink combines fibre, enzymes and fermented greens if you would rather take one thing than three.","key":"digestion.regulate.begin-daily-gi-primer","whyZh":"消化酶解决的是另一个问题：大餐之后那种胀、那种沉，而不是排便次数。胃里分解蛋白质的酶会随年龄减少，没消化完的食物停在那里，人就不舒服。老实说，消化酶补充剂的证据并不多，小型试验显示单顿饭后的腹胀有所减轻，所以只在这个症状明确的时候用，而不是默认每天吃。如果不想同时吃三样，六合一饮品把纤维、酶和发酵蔬菜放进了一杯。","productIds":["begin-daily-gi-primer","digestive-enzyme"]},{"stage":"supplement","rank":2,"route":"internal","products":["Magnesium","Calcium Magnesium D"],"why":"Magnesium draws water into the bowel and relaxes smooth muscle, and about half of US adults get less than they need from food. The form here is gentle and well absorbed, so it covers that gap rather than acting as a laxative; laxative magnesium is a different product, used at doses above the safe daily limit for supplements. Take it in the evening with water and keep supplemental magnesium within 350 mg a day. With kidney disease, or if you already use a magnesium laxative, ask your doctor first.","key":"digestion.supplement.magnesium","whyZh":"镁会把水分带进肠道，同时放松肠道的平滑肌，而大约一半的美国成年人从食物里吃不够镁。这里用的是温和、好吸收的形式，作用是补上这个缺口，而不是当泻药用；泻药级别的镁是另一类产品，剂量超过了补充剂的每日安全上限。晚上随水服用，补充剂来源的镁每天不超过350毫克。如果有肾脏问题，或者已经在用含镁的通便药，先问医生。","productIds":["magnesium","calcium-magnesium-d"]},{"stage":"supplement","rank":3,"route":"internal","products":["Plant Protein Powder","Organics All-in-One Shakes"],"why":"The gut lining renews itself every few days, and it is built from protein, as are the digestive enzymes that break food down. A breakfast of white bread or congee brings little of either, and heavy, low-fibre meat meals work against step one. A plant protein shake at breakfast replaces the refined carbs without adding to the load. Keep fibre on the plate alongside it, because protein does not do fibre's job.","key":"digestion.supplement.plant-protein-powder","whyZh":"肠道内壁每隔几天就更新一次，它的原料是蛋白质，负责分解食物的消化酶也一样。白面包或白粥的早餐，两样都给不了多少；而油腻、少纤维的大鱼大肉，又在拖第一步的后腿。早餐一杯植物蛋白奶昔，替掉精致碳水，又不增加负担。同时盘子里的纤维不能少，因为蛋白质替代不了纤维的作用。","productIds":["plant-protein-powder","organics-all-in-one-shakes"]},{"stage":"sustain","rank":1,"route":"habit","products":["Begin 30 Holistic Wellness Solution"],"why":"The bowel runs on a clock. Its strongest contractions come in bursts on waking and after meals, and the reflex that triggers them is strongest after breakfast. The rhythm this plan follows puts warm water first thing, then breakfast between 7 and 9 am, which lands on exactly that window. Give yourself ten unhurried minutes after breakfast, do not ignore the urge, and keep the same time on weekends. The 30-day program adds structure for the first month, roughly how long fibre and probiotics take to show.","key":"digestion.sustain.begin-30-holistic-wellness-solution","whyZh":"肠道是有时钟的。它最强的推进性收缩，集中出现在刚醒来和饭后，而触发它的那个反射，早餐后最强。这套方案的节律是：起床先喝温水，然后在早上7到9点吃早餐，正好落在这个窗口上。早餐后给自己留十分钟，不慌不忙，有便意别忍，周末也保持同一个时间。30天计划在第一个月帮你把结构搭起来，而这差不多正是纤维和益生菌开始见效所需的时间。","productIds":["begin-30-holistic-wellness-solution"]},{"stage":"sustain","rank":3,"route":"internal","products":["Stress Relief Probiotic"],"why":"For some people the pattern is clear: loose stools arrive with deadlines, travel or conflict, because the gut and the brain signal each other in both directions. This probiotic uses strains chosen for that gut-brain link. There is no bowel-habit trial for this exact product, so it is an option for that specific pattern rather than a default. Use it in place of the standard probiotic, not on top of it. Loose stools that last more than a few days, or come with fever, are a question for a doctor.","key":"digestion.sustain.stress-relief-probiotic","whyZh":"有些人的规律很明显：一到截止日期、出差或者吵架，就开始拉肚子，因为肠道和大脑是双向传递信号的。这款益生菌选的是针对这条肠脑通路的菌株。这个具体产品目前没有针对排便习惯的试验，所以它是给这种特定情况的选项，而不是默认配置。用它替换普通益生菌，而不是叠加着吃。如果稀便持续好几天，或者伴随发烧，那是该问医生的问题。","productIds":["stress-relief-probiotic"]}],"summary":{"title":"Not quite regular? First, which way is it off?","titleZh":"肠胃不太顺？先看看是哪一种。","sub":"Too hard, too loose, or bloated after meals: each one has its own cause. Pick the one that sounds like you.","subZh":"太干、太稀，还是吃完就胀，原因不一样。选一个最像你的。","moments":[{"id":"constipated","icon":"calendar","label":"Not going every day","labelZh":"几天才上一次","visual":null,"what":"Most of the time that is not enough fibre. Fibre holds water in the stool, so without it things turn hard and slow. Most adults eat about 16 g a day, and you need 25 to 38.","whatZh":"大多数情况，是纤维吃得不够。纤维能把水分留在粪便里，纤维不够，就会又干又硬、走得很慢。一般成年人每天只吃到16克左右，而实际需要25到38克。","twist":"You do not have to live on salad. Eat your vegetables first at each meal, then top up the rest. Go up slowly, and drink a full glass of water with it.","twistZh":"不用天天吃沙拉。每顿饭先吃蔬菜，不够的再补。量要慢慢往上加，每次配一大杯水。","fixes":[{"id":"prebiotic-fiber","why":"A top-up, not a laxative. Stir it into water or coffee, and raise it a little each week.","whyZh":"它是把纤维的缺口补上，不是泻药。加进水或咖啡里，每周慢慢加一点量。"},{"id":"probiotic","why":"Gut bacteria turn fibre into what keeps things moving. The gain is modest, about one extra trip a week. Take it with the fibre, judge at four weeks.","whyZh":"肠道菌把纤维变成推动肠道的物质。效果是温和的，平均每周多一次左右。和纤维一起吃，四周后再看。"},{"id":"magnesium","why":"A gentle form that covers a gap about half of adults have, not a laxative. Evening, with water. Kidney issues? Ask your doctor first.","whyZh":"温和好吸收的镁，补的是一半左右成年人都有的缺口，不是泻药。晚上配水吃。有肾脏问题的，先问医生。"}]},{"id":"loose","icon":"drop","label":"Loose stools","labelZh":"大便不成形","visual":null,"what":"It sounds like the opposite problem, but it is often the same one: stool with the wrong amount of water in it. Fibre is what soaks that water up and gives it shape.","whatZh":"听起来跟便秘正好相反，其实常常是同一个问题：粪便里的水分不对。纤维的作用，就是把水分吸住，让它成形。","twist":"So yes, fibre helps here too. Start with a small amount and build up slowly, so your gut has time to adjust.","twistZh":"所以，稀的时候一样要补纤维。先从少量开始，慢慢加，让肠道有时间适应。","fixes":[{"id":"prebiotic-fiber","why":"Holds the extra water and feeds the good bacteria you already have. Start small, with a glass of water each time.","whyZh":"把多余的水分吸住，同时喂养你肠道里本来就有的好菌。从少量开始，每次配一杯水。"},{"id":"probiotic","why":"Adds studied strains that live on that fibre. Take it daily with food, alongside the fibre, and judge it after four weeks.","whyZh":"补充有研究的菌株，它们就靠纤维生存。每天随餐吃，和纤维一起，四周后再看效果。"}]},{"id":"after-meals","icon":"bowl","label":"Heavy and bloated after meals","labelZh":"一吃饱就又撑又胀","visual":null,"what":"Big meals ask a lot of your stomach, and the enzymes that break food down, especially protein, decline with age. Food that sits there half-digested feels heavy and puffy.","whatZh":"一顿大餐，对胃的要求很高。而负责分解食物的消化酶，特别是分解蛋白质的，会随着年龄变少。食物消化得不彻底，在胃里停着，人就觉得又撑又胀。","twist":"Use help on the meals where you feel it, not every day by default. Honestly, the research on enzymes is thin, so let your own body be the judge.","twistZh":"在确实会胀的那几顿用就好，不需要每天都吃。老实说，消化酶的研究证据不多，以你自己的感受为准。","fixes":[{"id":"digestive-enzyme","why":"Take it with the heavy meal. Plant enzymes help break down protein, fat and carbs.","whyZh":"吃大餐的时候随餐吃。植物来源的消化酶，帮忙分解蛋白质、脂肪和碳水。"},{"id":"begin-daily-gi-primer","why":"Rather take one thing than three? Fibre, enzymes and fermented greens in one drink.","whyZh":"不想吃一堆瓶瓶罐罐？纤维、消化酶和发酵蔬菜，一杯全有。"}]},{"id":"stress","icon":"bolt","label":"Stress goes straight to your gut","labelZh":"一紧张就想跑厕所","visual":null,"what":"Your gut and your brain signal each other in both directions. For some people the pattern is clear: a deadline, a trip or an argument, and the stomach reacts first.","whatZh":"肠道和大脑一直在双向传信号。有些人的规律特别明显：一赶截止日期、一出差、一吵架，肠胃马上就有反应。","twist":"If that is you, pick the stress probiotic instead of the regular one, not both. It is an option for this pattern, not a must.","twistZh":"如果你就是这样，把普通益生菌换成舒压益生菌，二选一，不要叠加。它是针对这种情况的选择，不是必需品。","fixes":[{"id":"stress-relief-probiotic","why":"Strains chosen for the gut-brain link. One capsule a day with food, in place of the standard probiotic.","whyZh":"选的是针对肠脑连接的菌株。每天一粒，随餐吃，替换掉普通益生菌。"},{"id":"prebiotic-fiber","why":"Gives stool some shape on the rough days too, and it feeds the probiotic.","whyZh":"状态不好的那几天，也能帮大便成形，同时给益生菌提供食物。"}]},{"id":"travel","icon":"clock","label":"Thrown off by travel","labelZh":"一出门就不规律","visual":null,"what":"Your bowel runs on a clock. Its strongest push comes after waking and after breakfast. Travel moves your meals, your sleep and your water, so the clock loses its cue.","whatZh":"肠道也有自己的时钟，最有力的蠕动出现在起床后和早餐后。一出门，吃饭、睡觉、喝水的时间全乱了，这个时钟就找不到节拍。","twist":"Keep one anchor wherever you are: warm water when you wake, then breakfast, then ten unhurried minutes. When you feel the urge, do not hold it in.","twistZh":"不管在哪，守住一个锚点：起床先喝温水，然后吃早餐，饭后给自己十分钟，别赶时间。有感觉了就去，别憋着。","fixes":[{"id":"prebiotic-fiber","why":"Pack it. Restaurant food is low in fibre, and this dissolves clear in water or coffee.","whyZh":"出门带上。外面的饭菜纤维少，这个粉溶在水或咖啡里，看不出来。"},{"id":"begin-30-holistic-wellness-solution","why":"Home again and want a reset? 30 days of structure: gut drink, protein and probiotic, with an app to track it.","whyZh":"回家想重新调一调？30天的完整方案：肠道冲饮、蛋白粉和益生菌，配合App每天打卡。"}]},{"id":"takeout","icon":"leaf","label":"Few vegetables, lots of takeout","labelZh":"外卖多，蔬菜少","visual":null,"what":"Takeout and a white-bread or congee breakfast bring little fibre and little protein. Your gut lining renews every few days and is built from protein, and fibre is what keeps things moving.","whatZh":"外卖，加上白面包、白粥当早餐，纤维和蛋白质都很少。肠道黏膜几天就更新一轮，原料是蛋白质；而让肠道动起来的，是纤维。","twist":"You do not have to cook every night. Fix breakfast first, it is the easiest meal to change.","twistZh":"不用每天自己下厨。先把早餐换掉，这是最容易改的一顿。","fixes":[{"id":"plant-protein-powder","why":"Swap the white bread for a protein shake. It brings the protein your gut lining is built from. Keep the vegetables too, protein does not do fibre's job.","whyZh":"把白面包换成一杯蛋白奶昔，给肠道黏膜补上原料。蔬菜还是要吃，蛋白质替代不了纤维。"},{"id":"green-superfood","why":"For the days vegetables do not happen. A bridge, not a replacement.","whyZh":"吃不上蔬菜的那几天用它顶一下。是过渡，不是替代。"},{"id":"organics-all-in-one-shakes","why":"Want the breakfast decision gone? Protein, fibre and nutrients in one glass.","whyZh":"早餐不想再费脑子？蛋白质、纤维和营养素，一杯搞定。"}]}],"doctor":"Blood in the stool, black stool, weight loss you cannot explain, loose stools with fever or lasting more than a few days, or a change that does not go away, especially after 50? See a doctor first.","doctorZh":"如果大便带血或发黑、体重不明原因下降、拉肚子伴发烧或持续好几天，或者排便习惯变了一直没恢复，特别是50岁以上，请先去看医生。"}},"immunity":{"overview":"Your immune system is not a muscle you can boost. It is a tissue that rebuilds itself constantly, and it struggles when it runs short or gets overloaded. Much of it lines the gut, so that is where the load comes off first. Sleep is the lifestyle lever with the hardest numbers behind it. Then comes steady supply: protein, vitamin C and vitamin D every day, because the benefit in trials came from regular intake, not from reacting once a cold starts. Nothing here prevents infection. A fever lasting more than three days, trouble breathing, or infections that keep coming back need a doctor.","overviewZh":"免疫系统不是一块可以「练大」的肌肉。它是一个时刻都在自我更新的组织，一旦原料短缺或者负担过重，就会力不从心。免疫系统有很大一部分分布在肠道，所以负担要先从这里卸下来。在所有生活习惯里，睡眠背后的数据最硬。接下来是稳定供应：每天的蛋白质、维生素C和维生素D，因为试验里的好处来自规律摄入，而不是感冒开始了才临时补。这里的任何内容都不能预防感染。发烧超过三天、呼吸困难，或者感染反反复复，请去看医生。","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Probiotic","Prebiotic Fiber"],"why":"Much of the immune system lines the gut, and a gut out of balance keeps it busy with trouble at home. That is why the load comes off here first. In a Cochrane review of 24 trials, people taking probiotics were about a quarter less likely to get an upper respiratory infection (low certainty) and about 40 percent less likely to get three or more. Probiotics add bacteria and fibre feeds them, and most adults eat about half the fibre they need. Take one daily with cool water, not hot, and judge it after four weeks.","key":"immunity.clear.probiotic","whyZh":"免疫系统有很大一部分分布在肠道，肠道一旦失衡，免疫系统就忙着处理「家里」的麻烦。所以负担先从这里卸。一篇汇总了24个试验的Cochrane综述发现，吃益生菌的人发生上呼吸道感染的比例低了大约四分之一（证据确定性较低），一年感染三次以上的比例低了约40%。益生菌负责把好菌补进去，纤维负责喂养它们，而大多数成年人只吃到所需纤维的一半左右。每天一次，用温凉水送服，别用热水，四周后再判断。","productIds":["probiotic","prebiotic-fiber"]},{"stage":"clear","rank":2,"route":"habit","products":["g&h Protect Hand Soap"],"why":"The simplest way to lower what the immune system has to deal with is to let less in. Community handwashing programs cut respiratory illnesses such as colds by 16 to 21 percent. The catch is that people cut washing short once their hands crack, and cracked skin is a broken barrier of its own, so a soap that does not strip matters more than it sounds. Twenty seconds on getting home, before eating, and after the school run.","key":"immunity.clear.g-h-protect-hand-soap","whyZh":"减轻免疫系统负担最简单的办法，是少放点东西进来。社区洗手推广能让感冒这类呼吸道疾病减少16%到21%。问题在于，手一干裂，人就会洗得马马虎虎，而干裂的皮肤本身就是一道破了的屏障，所以一块不伤手的洗手液，比听起来更重要。到家、吃饭前、接完孩子，各洗二十秒。","productIds":["g-h-protect-hand-soap"]},{"stage":"clear","rank":3,"route":"environment","products":["Atmosphere Mini Air Purifier","Atmosphere Sky Air Purifier"],"why":"Air is an optional step, and an expensive one. Fine particles irritate the lining of the nose and airways, a HEPA filter traps 99.97 percent of particles at the size hardest to catch, and portable units cut indoor fine particles by roughly half to four fifths. That matters in homes with allergies, wildfire smoke, a busy road outside or pets. There is no evidence that a purifier prevents colds, so buy one for the air, not for the virus. If you do, start with the bedroom, door closed, running all night.","key":"immunity.clear.atmosphere-mini-air-purifier","whyZh":"空气是可选的一步，也是昂贵的一步。细颗粒物会刺激鼻腔和呼吸道黏膜，HEPA滤网对最难拦截的那个粒径能拦住99.97%，便携式净化器能让室内细颗粒物下降大约一半到八成。这对家里有人过敏、遇上山火烟雾、住在大马路边或者养宠物的家庭有意义。没有证据表明净化器能预防感冒，所以买它是为了空气，不是为了病毒。如果要买，先放卧室，关上门，整夜开着。","productIds":["atmosphere-mini-air-purifier","atmosphere-sky-air-purifier"]},{"stage":"regulate","rank":1,"route":"habit","products":["Magnesium","Sleep Health"],"why":"Sleep is the lever with the hardest numbers. In a study that measured people's sleep and then exposed them to a cold virus, those sleeping under six hours were about four times more likely to catch the cold than those sleeping over seven. In another, short sleepers were far more likely to be left unprotected after a hepatitis B vaccine. The products here only help the wind-down; the habit does the work. Protect seven hours and a steady bedtime, most of all in the week before travel or a vaccine.","key":"immunity.regulate.magnesium","whyZh":"睡眠是数据最硬的那个杠杆。一项研究先测量受试者的真实睡眠，再让他们接触感冒病毒，结果每晚睡不到六小时的人，感冒的几率大约是睡七小时以上的人的四倍。另一项研究里，睡得少的人打完乙肝疫苗后，没能产生保护的比例高得多。这里的产品只是帮身体放松下来，真正起作用的是习惯。守住七小时和固定的上床时间，出差或打疫苗前的那一周尤其要守住。","productIds":["magnesium","sleep-health"]},{"stage":"regulate","rank":2,"route":"internal","products":["Concentrated Fruits & Vegetables","Green Superfood"],"why":"Inflammation is how the immune system protects you, but fried food, smoke, alcohol and heavily processed meals keep a low level of it running all day, and that background noise competes with the real job. Plant compounds from colourful fruit and vegetables help keep that background down. There is no strong evidence that capsules change how often you get sick, so treat these as a floor under your diet on busy weeks, not a replacement for eating five colours. Take them with a meal.","key":"immunity.regulate.concentrated-fruits-vegetables","whyZh":"炎症本来是免疫系统保护你的方式，但油炸食品、烟、酒和深度加工的饭菜，会让低度的炎症整天开着，这种背景噪音会跟真正的任务抢资源。五颜六色的蔬果里的植物营养素，有助于把这层背景压下来。没有强有力的证据表明胶囊能改变你生病的频率，所以把它们当作忙碌那几周饮食的保底，而不是用来代替每天吃够五种颜色。随餐吃。","productIds":["concentrated-fruits-vegetables","green-superfood"]},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin C Extended Release 180ct","Vitamin D"],"why":"Vitamin C and D have the clearest evidence here, and both work only when taken daily. In a Cochrane review of 29 trials, regular vitamin C did not prevent colds in most people, but it shortened them by about 8 percent in adults and 14 percent in children; starting it after a cold began showed no consistent benefit. Vitamin D reduced respiratory infections most in people who were low, and with daily or weekly doses, not large occasional ones. Ask your doctor for a vitamin D test if you spend most of the year indoors.","key":"immunity.supplement.vitamin-c-extended-release-180ct","whyZh":"维生素C和D是这里证据最清楚的两样，而且都只有每天吃才有用。一篇汇总了29个试验的Cochrane综述发现，规律补充维生素C并不能让大多数人不感冒，但能让成人的感冒缩短约8%，儿童缩短约14%；等感冒开始了才吃，没有一致的效果。维生素D对本来就缺乏的人减少呼吸道感染最明显，而且要每天或每周补，偶尔来一次大剂量没用。如果你一年大部分时间待在室内，请医生帮你查一下维生素D水平。","productIds":["vitamin-c-extended-release-180ct","vitamin-d"]},{"stage":"supplement","rank":1,"route":"internal","products":["Plant Protein Powder"],"why":"Antibodies, white blood cells and the signals they send are all made of protein, and the front-line cells are replaced within days, so the supply has to arrive every day. Running short on protein is well known to weaken immune responses. A practical target is about 1.2 g per kilogram of body weight a day, and the meal that most often has almost none is breakfast. If yours is toast or congee, one scoop, 21 g, closes a large part of the gap.","key":"immunity.supplement.plant-protein-powder","whyZh":"抗体、白细胞，以及它们之间传递的信号，全都是蛋白质做的，而冲在一线的免疫细胞几天就换一批，所以原料必须每天送到。蛋白质不足会削弱免疫反应，这一点早有定论。一个实用的目标是每天每公斤体重约1.2克蛋白质，而最常几乎没有蛋白质的那一餐，就是早餐。如果你的早餐是吐司或白粥，一勺21克的蛋白粉，就能补上很大一块缺口。","productIds":["plant-protein-powder"]},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill","Immunity Defense Zinc + Holy Basil"],"why":"Zinc, selenium and iron all take part in immune cells doing their job, and the margins are narrow in both directions: too little slows them, and too much zinc over months causes a copper shortfall. A multivitamin is the base that covers the everyday amounts. The zinc tablet is for short, high-stress stretches, not all year, and the review evidence for zinc preventing colds is weak. Check the labels so that zinc from all sources stays under 40 mg a day.","key":"immunity.supplement.double-x-multivitamin-31-day-refill","whyZh":"锌、硒、铁都参与免疫细胞的工作，而且两头的余地都很窄：太少，细胞干活慢；锌吃太多、吃太久，又会导致铜不足。综合营养素是覆盖日常用量的底座。锌片只用在压力特别大的短期阶段，不是全年吃，而且综述里锌预防感冒的证据很弱。看一下标签，确保所有来源加起来，锌每天不超过40毫克。","productIds":["double-x-multivitamin-31-day-refill","immunity-defense-zinc-holy-basil"]},{"stage":"sustain","rank":1,"route":"internal","products":["Everyday Nutrition Solution"],"why":"The benefit in the vitamin C and D trials came from steady daily intake, not from reacting when a cold starts, so the real task is not letting the routine lapse, above all in the week you are run down. The foundation bundle puts the multivitamin, protein and omega-3 in a single order. Put it on a monthly auto-order, take it with the same meal every day, and judge it over a season, not a week.","key":"immunity.sustain.everyday-nutrition-solution","whyZh":"维生素C和D试验里的好处，来自每天稳定地吃，而不是感冒来了才反应，所以真正的任务是别让这个习惯断掉，尤其是在你最累的那一周。基础营养方案把综合营养素、蛋白粉和深海鱼油放在一单里。设成每月自动下单，每天跟同一顿饭一起吃，按一个季节来看效果，而不是一周。","productIds":["everyday-nutrition-solution"]},{"stage":"sustain","rank":2,"route":"internal","products":["Immunity Echinacea","Twist Tubes","g&h Protect Hand Sanitizer"],"why":"Some weeks carry more exposure: travel, the peak of flu season, or the fortnight after a child brings something home. Echinacea is meant for short runs like these, not for all year, and the honest evidence is modest: pooled trials suggest a 10 to 20 percent lower risk, with no clear result in any single trial. Sanitiser is for when there is no soap, not instead of it. Use these for the stretch, then stop.","key":"immunity.sustain.immunity-echinacea","whyZh":"有些时候接触的病菌就是更多：出差、流感高峰，或者孩子从学校带了东西回家之后的那两周。紫锥菊就是为这种短期阶段设计的，不是全年吃，而且老实说证据有限：合并分析显示风险可能降低10%到20%，但没有任何一个单独的试验得出明确结果。免洗洗手液是在没有肥皂的时候用的，不是代替洗手。这段时间用，过了就停。","productIds":["immunity-echinacea","twist-tubes","g-h-protect-hand-sanitizer"]},{"stage":"sustain","rank":2,"route":"internal","products":["Kids Daily Chewable Multivitamin","Kids Toddler Immunity Drops","Go Shield"],"why":"For children, the format is the strategy: drops for toddlers who cannot chew, a chewable after that, and a gummy for the ones who refuse both. In the Cochrane review, regular vitamin C shortened children's colds by about 14 percent. Give it at the same time every morning, and store gummies where a child cannot help themselves, because they look like sweets. Any fever in a baby under three months, or a fever that lasts more than three days, needs a doctor.","key":"immunity.sustain.kids-daily-chewable-multivitamin","whyZh":"给孩子吃，形式就是策略：还不会嚼的幼儿用滴剂，会嚼了用咀嚼片，两样都不肯吃的就用软糖。Cochrane综述里，规律补充维生素C让儿童感冒缩短了约14%。每天早上固定时间吃，软糖放在孩子自己拿不到的地方，因为它们看起来就像糖果。三个月以下的婴儿只要发烧，或者任何孩子发烧超过三天，都要去看医生。","productIds":["kids-daily-chewable-multivitamin","kids-toddler-immunity-drops","go-shield"]}],"summary":{"title":"Catch everything going around? Start with when.","titleZh":"身边一有人感冒你就中招？先看看是哪种情况。","sub":"Immunity is not something you boost. It is something you should not run short of. Pick the one that sounds like you.","subZh":"免疫力不是靠「提升」的，而是别让它缺。选一个最像你的情况。","moments":[{"id":"every-cold","icon":"shield","label":"Catch every cold going around","labelZh":"别人一感冒就中招","visual":null,"what":"Your immune system is not a muscle you can pump up. It rebuilds itself every day, and a big part of it lines your gut. When your gut is out of balance, your immune system is busy with trouble at home and has less left for everything else.","whatZh":"免疫系统不是肌肉，练不大。它每天都在自我更新，而且很大一部分就在肠道里。肠道一乱，免疫系统光处理家里的事就忙不过来，对外面的东西自然顾不上。","twist":"Nothing stops every cold, so be wary of anyone who says it does. The goal is simple: do not let it run short. Start with the gut.","twistZh":"没有什么能让你一次感冒都不得，谁这么说都要小心。目标其实很简单：别让它缺。先从肠道开始。","fixes":[{"id":"probiotic","why":"Puts good bacteria back. Take it daily with cool water, not hot, and judge it after four weeks.","whyZh":"把好菌补回来。每天用凉白开送服，别用热水，吃满四周再看感觉。"},{"id":"prebiotic-fiber","why":"Probiotics add bacteria, fibre feeds them. Most adults eat about half the fibre they need.","whyZh":"益生菌是往里加菌，纤维是把它们喂饱。大多数人的纤维只吃到需要量的一半。"}]},{"id":"kids","icon":"heart","label":"Kids bring everything home","labelZh":"孩子一上学全家轮着病","visual":null,"what":"School and daycare are where colds get shared. Handwashing is still the cheapest fix there is: in community programs it cut colds and similar illnesses by 16 to 21 percent. The catch is cracked hands, because once it stings, people stop washing properly.","whatZh":"学校和幼儿园，就是感冒互相传来传去的地方。洗手仍然是最便宜的办法：社区洗手项目让感冒这类呼吸道疾病少了16%到21%。问题是手一洗就干裂，一疼大家就不好好洗了。","twist":"Twenty seconds when you get home and before you eat. For kids, the format is the whole trick: drops for toddlers, a chewable after that.","twistZh":"一进门、吃饭前，洗满二十秒。给孩子补营养，关键在形式：小宝宝用滴剂，会嚼了就换咀嚼片。","fixes":[{"id":"g-h-protect-hand-soap","why":"Cleans without stripping, so hands do not crack and everyone keeps washing.","whyZh":"洗得干净又不伤手，手不裂，全家才愿意一直好好洗。"},{"id":"kids-daily-chewable-multivitamin","why":"A chewable they actually eat every morning beats a better tablet that turns into a daily fight.","whyZh":"孩子每天早上愿意吃的咀嚼片，比每天要哄半天的药片管用多了。"},{"id":"kids-toddler-immunity-drops","why":"For toddlers who cannot chew yet. Under about three, drops are the right format.","whyZh":"给还不会嚼的小宝宝。三岁左右以前，滴剂才是对的形式。"}]},{"id":"run-down","icon":"briefcase","label":"Sick after a busy stretch","labelZh":"一忙完就病倒","visual":null,"what":"Your antibodies and white blood cells are made of protein, and the front-line cells are replaced within days. In a busy stretch, breakfast is toast or nothing, so the supply runs short right when you need it most.","whatZh":"抗体、白细胞都是用蛋白质做的，冲在最前面的免疫细胞几天就换一批。一忙起来，早餐不是一片面包就是干脆不吃，原料偏偏在最需要的时候断了供。","twist":"You do not have to cook better. One scoop at breakfast closes a big part of the gap.","twistZh":"不用逼自己好好做饭。早餐加一勺蛋白粉，就能补上一大块缺口。","fixes":[{"id":"plant-protein-powder","why":"21 g of protein in one scoop. The easiest fix for a toast-or-congee breakfast.","whyZh":"一勺21克蛋白质。早餐只有面包或白粥的人，最容易补上的一步。"},{"id":"double-x-multivitamin-31-day-refill","why":"Zinc, selenium and iron all help immune cells do their job. A multivitamin covers the everyday amounts.","whyZh":"锌、硒、铁都参与免疫细胞的工作。一份综合营养片，把日常需要的量打好底。"}]},{"id":"short-sleep","icon":"bed","label":"Sleep short, then get sick","labelZh":"一熬夜就感冒","visual":null,"what":"Sleep has the hardest numbers of anything here. In one study where everyone was exposed to the same cold virus, people sleeping under six hours were about four times more likely to catch it than people sleeping over seven.","whatZh":"在所有办法里，睡眠的数据最硬。有研究让一群人接触同一种感冒病毒，每晚睡不到六小时的人，中招的概率大约是睡满七小时的人的四倍。","twist":"The habit does the work, not the bottle. Protect seven hours, most of all in the week before a trip or a vaccine.","twistZh":"真正起作用的是习惯，不是瓶子里的东西。守住七小时睡眠，出门旅行或打疫苗前的那一周尤其要守住。","fixes":[{"id":"magnesium","why":"Helps your body wind down in the evening, so the seven hours actually happen.","whyZh":"帮身体在晚上放松下来，七小时才睡得着、睡得满。"},{"id":"immunity-defense-zinc-holy-basil","why":"For the deadline weeks when sleep slips. Use it for the stretch, not all year.","whyZh":"赶项目、睡不够的那几周用。短期吃，不是一年到头吃。"}]},{"id":"travel","icon":"calendar","label":"Before a trip or flu season","labelZh":"出门旅行、流感季前","visual":null,"what":"Some weeks just carry more exposure: planes, hotels, the peak of flu season. That is when you tighten the routine for a short stretch, instead of doing everything all year.","whatZh":"有些时候接触的人和病菌就是特别多：坐飞机、住酒店、流感高峰。这时候把习惯收紧一段时间就好，不需要一年到头都这么做。","twist":"Use these for the stretch, then stop. The honest evidence for echinacea is modest, and sanitiser is for when there is no soap, not instead of it.","twistZh":"这几样就用在这段时间，过了就停。紫锥菊的证据说实话不算强，免洗洗手液是在没有水和肥皂的时候用，不是用来代替洗手的。","fixes":[{"id":"immunity-echinacea","why":"Made for short runs around a trip or the peak weeks, not for all year.","whyZh":"专门用在出行前后或流感高峰那几周，不是全年吃的。"},{"id":"twist-tubes","why":"Twist, shake into water, drink. Your routine keeps going in a hotel room.","whyZh":"一拧一摇倒进水里就能喝，住酒店也不会断掉每天的习惯。"},{"id":"g-h-protect-hand-sanitizer","why":"One in the bag and one in the car, for when there is no sink.","whyZh":"包里一瓶，车上一瓶，找不到洗手池的时候用。"}]},{"id":"vitamin-c-late","icon":"clock","label":"Vitamin C only once it starts","labelZh":"感冒了才想起吃维C","visual":null,"what":"Here is the honest version. In a review of 29 trials, vitamin C did not stop most people catching colds. Taken every day, it made colds a little shorter. Started after the cold began, it showed no consistent benefit.","whatZh":"说句实在话。综合29项研究的结果，维C并不能让大多数人不感冒。但每天坚持吃的人，感冒的时间会短一点。等感冒了才开始吃，就看不出稳定的效果。","twist":"So it is a daily habit, not a rescue. Vitamin D works the same way: steady doses, and the most benefit for people who were low.","twistZh":"所以维C是日常习惯，不是救急用的。维生素D也一样：稳定地吃，本来就缺的人受益最大。","fixes":[{"id":"vitamin-c-extended-release-180ct","why":"Slow release over eight hours. Your body cannot store vitamin C, so steady beats one big dose.","whyZh":"8小时缓释。维C身体存不住，细水长流比一次吃很多更好。"},{"id":"vitamin-d","why":"Indoors all day or wear sunscreen every day? Ask your doctor for a vitamin D test.","whyZh":"整天待在室内、天天擦防晒？可以请医生帮你查一下维生素D。"},{"id":"everyday-nutrition-solution","why":"Multivitamin, protein and omega-3 in one monthly order, so the routine does not lapse in the week you are run down.","whyZh":"综合营养片、蛋白粉、鱼油一次配齐，设成每月自动送货，最累的那一周习惯也不会断。"}]}],"doctor":"A fever for more than three days, trouble breathing, infections that keep coming back, or any fever in a baby under three months? See a doctor first.","doctorZh":"发烧超过三天、呼吸困难、感染反反复复，或者三个月以下的宝宝发烧，请先去看医生。"}},"hair":{"overview":"Hair grows in cycles, and most of the shedding people notice is a delayed reaction: a shock such as stress, a fever, surgery, childbirth or a crash diet pushes many hairs into their resting phase at once, and they fall out two to three months later. That shedding is usually temporary, because the roots are unharmed. The plan works in order. First take the load off the scalp and the strand: an oily, flaky scalp, harsh styling and heat. Then fix what quietly blocks supply: iron that is eaten but not absorbed, and stress that keeps the cycle disturbed. Then supply what hair is built from, protein first, iron where stores are low, and a broad base of vitamins and minerals without megadoses, because too much vitamin A or selenium can itself cause hair loss. Finally keep a daily care and breakfast routine long enough to judge it, which for hair means months. If hair comes out in patches or clumps, the scalp is sore, red or scarred, the part is widening, or the shedding comes with tiredness, weight change, feeling cold or heavy periods, see a doctor first.","overviewZh":"头发是按周期生长的，大部分人注意到的掉发，其实是延迟反应：一段压力、一次发烧、手术、生孩子或者节食，会让很多头发同时进入休止期，两三个月后才一起掉下来。毛根本身没有受损，所以这种掉发通常是暂时的。下面四步按顺序来。先卸掉头皮和发丝的负担：油腻起屑的头皮、伤发的造型和高温。再处理悄悄卡住供应的地方：吃进去却没吸收的铁，还有让生长周期一直乱着的压力。然后把头发的原料补上，蛋白质第一，铁储备低的补铁，再加一个维生素矿物质的底座，但不要大剂量，因为维生素A或硒过量本身就会掉发。最后把每天的护理和早餐坚持下去，坚持到足够判断效果的时间，对头发来说，是按月算的。如果头发成片或一把一把地掉，头皮疼、发红或留疤，发缝越来越宽，或者掉发同时伴随乏力、体重变化、怕冷、经量很多，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"external","products":["Satinique Anti-Dandruff Shampoo","Satinique Purifying Shampoo 280ml","Satinique Purifying Conditioner"],"why":"Hair grows out of the scalp, so the scalp comes first. Flakes and itch on an oily scalp usually come from a yeast that lives on everyone's skin and feeds on oil; the mild form is dandruff, the stronger one seborrhoeic dermatitis. The American Academy of Dermatology's advice runs against instinct: an oily, flaky scalp needs washing more often, not less. Lather the dandruff shampoo into the scalp and leave it on for about five minutes, two or three times a week during a flare. Fine white flakes with a tight, dry scalp are a different problem and need gentler washing.","key":"hair.clear.satinique-anti-dandruff-shampoo","whyZh":"头发长在头皮上，所以先顾头皮。油性头皮上的头皮屑和痒，多半来自一种人人皮肤上都有、靠油脂生存的酵母菌，轻的是头皮屑，重一点就是脂溢性皮炎。美国皮肤科学会的建议和很多人的直觉相反：头皮越油越起屑，越要勤洗，而不是少洗。去屑洗发水要揉在头皮上，停留五分钟左右再冲，发作期每周两到三次。如果是细小发白的屑、头皮又干又紧，那是另一种问题，反而要洗得温和一些。","productIds":["satinique-anti-dandruff-shampoo","satinique-purifying-shampoo-280ml","satinique-purifying-conditioner"]},{"stage":"clear","rank":2,"route":"habit","products":["Satinique Anti-Hair Fall Shampoo","Satinique Anti-Hair Fall Conditioner","Satinique Anti-Hair Fall Scalp Tonic"],"why":"Not every hair in the drain came out at the root. Losing 50 to 100 hairs a day is normal, and much of the rest is breakage from bleach, colour, relaxers, daily heat and tight ponytails. A shed hair has a small white bulb at one end; a broken one does not. Tight styles worn for years can cause permanent loss at the hairline, so loosen them first. Anti-hair-fall care works on strand strength, and the tonic keeps care on the scalp itself. A widening part or thinning temples is usually inherited pattern loss, which no shampoo reverses; a dermatologist has proven treatments, best started early.","key":"hair.clear.satinique-anti-hair-fall-shampoo","whyZh":"下水口里的头发，不一定都是从根部掉的。每天掉50到100根是正常的，多出来的很多其实是断发：漂、染、拉直、天天用高温、马尾扎得太紧。一看就能分：掉下来的头发一头有个白色小球，断的没有。长年扎得太紧，发际线可能出现永久性脱发，所以先松一松。防脱系列针对的是发丝的强韧度，头皮精华让护理留在头皮上。如果是发缝越来越宽、两鬓变稀，多半是遗传性脱发，洗发水逆转不了，皮肤科有经过验证的治疗，越早开始越好。","productIds":["satinique-anti-hair-fall-shampoo","satinique-anti-hair-fall-conditioner","satinique-anti-hair-fall-scalp-tonic"]},{"stage":"clear","rank":3,"route":"internal","products":["Probiotic","Prebiotic Fiber"],"why":"The teaching behind this plan puts clearing before replenishing, and it lists dull hair and brittle nails on the same checklist as bloating, constipation and irregular stools: signs, in its view, that a gut out of balance is using up or failing to absorb what the body is given. No mainstream trial shows gut products improve hair, so treat this step as getting the order right for people whose hair problems come with digestive ones, not as a hair treatment. The simple version is fibre stirred into water or coffee, plus a daily probiotic.","key":"hair.clear.probiotic","whyZh":"这套方案的逻辑是先清后补。它把头发没光泽、指甲变脆，和腹胀、便秘、排便不规律放在同一张肠道信号清单上：在它看来，肠道失衡的时候，吃进去的营养要么被消耗掉，要么吸收不进去。主流研究里还没有试验证明肠道产品能改善头发，所以这一步适合头发问题同时伴随肠胃问题的人，是把顺序做对，不是治头发的产品。最简单的做法：纤维粉加进水或咖啡里，再加每天一份益生菌。","productIds":["probiotic","prebiotic-fiber"]},{"stage":"regulate","rank":1,"route":"habit","products":["Vitamin C Extended Release 180ct"],"why":"Iron is where absorption quietly fails, and iron matters for hair. Black tea drunk with a meal cut absorption of plant iron by 79 to 94 percent in one study, and coffee has a smaller but real effect. Vitamin C does the opposite, turning iron into the form the gut takes up most easily, and a major review of vitamins in hair loss calls vitamin C intake crucial where hair loss comes with low iron. So keep tea and coffee at least an hour away from meals, and take vitamin C with iron-rich food or an iron tablet. It costs nothing and matters most for people who eat little red meat.","key":"hair.regulate.vitamin-c-extended-release-180ct","whyZh":"铁最容易在吸收这一关悄悄出问题，而铁对头发很关键。一项研究里，吃饭时喝红茶，让植物来源的铁吸收下降了79%到94%，咖啡也有影响，只是小一些。维生素C正好相反，它把铁变成肠道最容易吸收的形式；一篇关于维生素矿物质与脱发的重要综述明确说，缺铁相关的脱发，维生素C的摄入非常关键。所以茶和咖啡离开饭点至少一小时，吃富含铁的食物或铁片时配上维生素C。这个做法不花钱，对很少吃红肉的人最有用。","productIds":["vitamin-c-extended-release-180ct"]},{"stage":"regulate","rank":2,"route":"habit","products":["Organics Ashwagandha Capsules","Magnesium"],"why":"Stress is one of the most common triggers of the shedding people notice, and the timing hides it. A hard stretch, a fever or an operation pushes many hairs into their resting phase at once, and they fall out two to three months later, when the event already feels over. Once the trigger passes, the American Academy of Dermatology says, shedding stops and most people regain normal fullness within six to nine months. What helps is working on the stress: sleep, a wind-down routine, and ashwagandha, which lowered stress scores in trials of stressed adults. No trial has measured its effect on hair.","key":"hair.regulate.organics-ashwagandha-capsules","whyZh":"压力是最常见的掉发诱因之一，而时间差让人很难联想到。一段高压期、一次发烧或手术，会让很多头发同时进入休止期，两三个月后才一起掉，那时你早觉得事情已经过去了。美国皮肤科学会指出，诱因过去以后，掉发会停下来，多数人在六到九个月内恢复原来的发量。要处理的是压力本身：睡眠、睡前放松的习惯，还有南非醉茄，在压力大的成年人中做过的试验里，它降低了压力评分。不过还没有试验直接测过它对头发的作用。","productIds":["organics-ashwagandha-capsules","magnesium"]},{"stage":"supplement","rank":1,"route":"internal","products":["Plant Protein Powder","Organics All-in-One Shakes"],"why":"Hair is keratin, a protein, made by some of the fastest-dividing cells in the body. When protein runs short, the body keeps it for organs and muscle and lets hair go, which is why crash and low-protein diets are a classic trigger for shedding a few months later, and why shedding is one of the most common complaints after weight-loss surgery. The teaching behind this plan uses 1.2 g of protein per kilogram of body weight a day, above the 0.8 g official minimum: 72 g for someone of 60 kg. One shake adds 21 g. If you are cutting calories, cut them slowly and keep the protein.","key":"hair.supplement.plant-protein-powder","whyZh":"头发是角蛋白，由全身分裂最快的一批细胞制造。蛋白质一不够，身体会先保器官和肌肉，头发排在最后，所以节食、低蛋白饮食几个月后开始掉发，是很典型的情况，减重手术后掉发也是最常见的困扰之一。这套方案用的标准是每天每公斤体重1.2克蛋白质，高于官方0.8克的最低量：60公斤就是72克。一杯蛋白粉能补21克。如果在控制热量，就慢慢减，蛋白质别减。","productIds":["plant-protein-powder","organics-all-in-one-shakes"]},{"stage":"supplement","rank":1,"route":"internal","products":["Iron & Folic Acid"],"why":"Iron is the best-studied nutrient in shedding, and low stores can hide behind a normal blood count. Hair-loss studies define low iron with ferritin cut-offs anywhere from 15 to 70 micrograms per litre, some dermatologists aim above 40 when shedding persists, and most authors agree that iron deficiency with hair loss should be corrected. The people most likely to be short are women with heavy periods, new mothers, vegetarians and frequent blood donors. Ask for a ferritin test before taking iron long term, because iron builds up and too much is harmful, then recheck after about three months.","key":"hair.supplement.iron-folic-acid","whyZh":"铁是脱发研究里证据最多的营养素，而铁储备偏低，常常藏在正常的血常规后面。关于脱发的研究，判断缺铁用的铁蛋白标准从每升15到70微克不等，持续掉发时，有些皮肤科医生希望铁蛋白在40以上；多数学者都同意，缺铁又掉发，就应该把铁补上来。最容易缺的是经量多的女性、刚生完孩子的妈妈、素食者和常献血的人。长期补铁之前先查铁蛋白，因为铁会在体内累积，过量有害，大约三个月后再复查。","productIds":["iron-folic-acid"]},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill","Vitamin B Complex 120ct"],"why":"The follicle also runs on zinc, the B vitamins and other micronutrients, and one study found zinc deficiency in about one in ten people with shedding. A multivitamin covers them at sensible doses. More is not better: vitamin A above 3,000 micrograms a day and selenium above 400 micrograms are known to cause hair loss themselves, and zinc above 40 mg drains copper. The teaching behind this plan prefers beta-carotene, which the body turns into vitamin A only as needed. It also links a greasy, flaky face and scalp to low B2 and B6, whose classic deficiency looks like that; the B complex covers both.","key":"hair.supplement.double-x-multivitamin-31-day-refill","whyZh":"毛囊干活还离不开锌、B族和其他微量营养素，一项研究发现，大约十分之一的掉发者缺锌。每天一份综合营养素，就能按合理的量把这些都覆盖到。这里不是越多越好：维生素A每天超过3000微克、硒超过400微克，本身就会导致掉发；锌超过40毫克还会消耗铜。这套方案偏好β-胡萝卜素，身体缺多少才转化多少维生素A。它还把脸上、头皮出油起屑和B2、B6不足联系在一起，这两种维生素缺乏的典型表现正是如此，B族正好把它们补上。","productIds":["double-x-multivitamin-31-day-refill","vitamin-b-complex-120ct"]},{"stage":"supplement","rank":3,"route":"internal","products":["Hair Skin Nail","Collagen Peptides","Collagen Gummies"],"why":"Biotin is what most people buy for hair, and the honest picture is narrow. Real deficiency is uncommon, though one study found low levels in 38 percent of 541 women with shedding. A 2024 review found only three studies of biotin alone and called its marketing for hair loss in healthy people unsubstantiated. It also interferes with lab tests: the FDA has warned it can make a heart-attack test read falsely low, so tell your doctor and the lab you take it. Collagen has one small placebo-controlled trial: 44 women on 2.5 g of specific peptides a day for 16 weeks grew thicker strands.","key":"hair.supplement.hair-skin-nail","whyZh":"生物素是大家买来护发最多的成分，但实话说，它适用的范围很窄。真正缺乏的人不多，不过有一项研究在541位掉发女性里，发现38%生物素偏低。2024年的一篇综述只找到三项单用生物素的研究，结论是：向健康人宣传生物素防脱，缺乏依据。它还会干扰化验：美国FDA警告过，它可能让心梗检测的结果假性偏低，所以要告诉医生和化验室你在吃。胶原蛋白有一项小型安慰剂对照试验：44位女性每天2.5克特定胶原肽，16周后发丝变粗。","productIds":["hair-skin-nail","collagen-peptides","collagen-gummies"]},{"stage":"sustain","rank":1,"route":"external","products":["Satinique Intensive Repair Shampoo","Satinique Intensive Repair Conditioner","Satinique Smooth Shampoo 280ml","Satinique Smooth Conditioner"],"why":"Once hair leaves the scalp it is dead fibre. Nothing you eat repairs the length you already have; care protects it until new, better-fed hair grows through. The American Academy of Dermatology's routine is simple: shampoo the scalp rather than the lengths, and use conditioner after every shampoo, on the ends, where it adds shine and strength and cuts breakage. Pick the line by the problem: Intensive Repair for colour-treated, bleached or heat-styled hair, Smooth for dry or frizzy hair. Pat dry rather than rubbing, and turn the heat down.","key":"hair.sustain.satinique-intensive-repair-shampoo","whyZh":"头发一离开头皮，就是没有生命的纤维。吃什么都修不回已经长出来的那一段，护理的作用是把它护住，等新长出来、营养更好的头发慢慢接上。美国皮肤科学会的做法很简单：洗发水洗头皮，不是洗发梢；每次洗完都用护发素，抹在发尾，能增加光泽和强韧度，减少断发。按问题选系列：染过、漂过、常用高温的选密集修护，干、毛躁的选柔润。用毛巾按干，不要来回搓，吹风机温度调低。","productIds":["satinique-intensive-repair-shampoo","satinique-intensive-repair-conditioner","satinique-smooth-shampoo-280ml","satinique-smooth-conditioner"]},{"stage":"sustain","rank":2,"route":"habit","products":["Everyday Nutrition Solution","Advanced Omega"],"why":"Hair grows about a centimetre a month, and a follicle pushed into rest takes months to cycle back, so hair is judged in months, not weeks. The breakfast this plan is built around puts protein, good fats, vitamins and minerals into the first meal every day, eaten between 7 and 9 am, and the foundation bundle covers the multivitamin, protein and omega-3 in one order. On omega-3, one randomised six-month study of 120 women taking an omega-3, omega-6 and antioxidant blend found better hair density on photographs than in the comparison group. It was one study of a different formula, so hold it lightly.","key":"hair.sustain.everyday-nutrition-solution","whyZh":"头发一个月大约长一厘米，被推进休止期的毛囊，要好几个月才能重新回到生长期，所以看头发要按月，不能按周。这套方案围绕的营养早餐，每天第一餐就把蛋白质、优质脂肪、维生素和矿物质吃进去，时间在早上7到9点；基础营养方案把综合营养素、蛋白粉和深海鱼油放在一单里。关于鱼油，一项为期六个月、120位女性参加的随机研究，服用含Omega-3、Omega-6和抗氧化剂的配方后，照片评估的发量比对照组好。但这只是一项研究，配方也不同，参考即可。","productIds":["everyday-nutrition-solution","advanced-omega"]}],"summary":{"title":"Losing more hair lately? First, what changed?","titleZh":"最近掉发变多了？先想想，这几个月发生了什么？","sub":"Most hair problems have a trigger you can find. Pick the one that sounds like you.","subZh":"大部分头发问题，都找得到原因。选一个最像你的。","moments":[{"id":"stress","icon":"calendar","label":"Shedding after a rough patch","labelZh":"忙过一阵子后开始掉发","visual":null,"what":"Hair runs on a calendar. A hard stretch at work, a bad flu or an operation pushes lots of hairs into their resting phase at the same time, and they all fall out two or three months later. By then the stress feels over, so nobody connects the two.","whatZh":"头发是按日历走的。一段高压期、一场重感冒或一次手术，会让很多头发同时进入休止期，两三个月后一起掉下来。那时候你早觉得事情过去了，所以根本想不到是它。","twist":"The roots are fine, so this is usually temporary. Once the trigger is gone the shedding stops, and most people are back to normal fullness in six to nine months.","twistZh":"毛根没有受损，所以这通常是暂时的。诱因过去以后，掉发就会停，多数人六到九个月能恢复原来的发量。","fixes":[{"id":"plant-protein-powder","why":"Hair is made of protein. A shake makes sure the new hair has something to grow from.","whyZh":"头发本身就是蛋白质。一杯蛋白粉，让新头发有原料可长。"},{"id":"organics-ashwagandha-capsules","why":"The shedding follows the stress, so work on the stress. Give it a few weeks.","whyZh":"掉发是跟着压力来的，那就从压力下手。给它几周时间。"},{"id":"double-x-multivitamin-31-day-refill","why":"A hard stretch burns through vitamins and minerals. One daily base covers the whole set, at sensible doses.","whyZh":"压力大的时候，维生素矿物质消耗得快。每天一份综合营养，按合理的量把整套都补上。"}]},{"id":"baby-diet","icon":"scale","label":"After a baby or a diet","labelZh":"生完孩子或减肥之后","visual":null,"what":"Pregnancy holds your hair in its growing phase. After the birth it all lets go at once, usually worst around four months. Crash diets do something similar: when protein runs short, your body keeps it for your organs, and hair is one of the first things it cuts.","whatZh":"怀孕的时候，头发一直停在生长期；孩子一出生，这些头发就一起放手，通常产后四个月左右掉得最厉害。节食也差不多：蛋白质不够的时候，身体会先留给器官，头发是最先被省掉的之一。","twist":"After a baby, hair is usually back by your child's first birthday. After a diet, you do not have to stop losing weight. Just lose it slower and keep your protein up.","twistZh":"产后掉发，一般到孩子一周岁时就长回来了。减肥也不用停，只要减得慢一点，蛋白质别少。","fixes":[{"id":"plant-protein-powder","why":"Cutting calories? Keep one protein shake a day, so your hair is not the thing that gets cut.","whyZh":"在控制热量？每天留一杯蛋白粉，别让头发成为被省掉的那一个。"},{"id":"organics-all-in-one-shakes","why":"Skipping meals to lose weight? Swap one for a full shake instead: protein, fibre and vitamins in one glass.","whyZh":"靠少吃一顿来减肥？不如换成一杯全能奶昔，蛋白质、纤维、维生素一杯都有。"},{"id":"iron-folic-acid","why":"Giving birth costs iron. Ask your doctor to check ferritin, and ask before new supplements if you are breastfeeding.","whyZh":"生孩子会失去不少铁。请医生查一下铁蛋白；哺乳期吃新的补充品之前，也先问问医生。"}]},{"id":"tired","icon":"bolt","label":"Thinning and tired too","labelZh":"头发变少，人也没劲","visual":null,"what":"Hair getting thinner and you are tired all the time? Think iron. Your body keeps its iron for your blood first and your hair last, so your hair can suffer while your blood test still looks normal.","whatZh":"头发变少，人又总是很累？先想到铁。身体会把铁先留给血液，最后才轮到头发，所以血常规看起来还正常的时候，头发可能已经先受影响了。","twist":"Ask for a ferritin test, not just a blood count. And keep tea and coffee an hour away from meals, because they block iron.","twistZh":"请医生查铁蛋白，不只是血常规。茶和咖啡离开饭点一小时，因为它们会挡住铁的吸收。","fixes":[{"id":"iron-folic-acid","why":"If your ferritin comes back low, this fills the gap. Test first, because iron can build up.","whyZh":"铁蛋白偏低，就用它补上。先检查再补，因为铁会在体内累积。"},{"id":"vitamin-c-extended-release-180ct","why":"Take it with meals. Vitamin C helps your body absorb the iron you already eat.","whyZh":"随餐吃。维生素C帮身体吸收你本来就吃进去的铁。"}]},{"id":"brittle","icon":"sparkle","label":"Dry, brittle ends","labelZh":"发尾干枯、分叉、易断","visual":null,"what":"That is mostly damage to the strand, not the root. Colour, bleach, heat and rough towel-drying lift the outer layer of the hair, and then it snaps. Hair is not alive once it leaves your scalp, so the length you have can be protected but not rebuilt.","whatZh":"这多半是发丝受损，不是毛根的问题。染发、漂发、高温、用毛巾使劲搓，会把头发最外面那层掀起来，然后就容易断。头发一离开头皮就没有生命了，已经长出来的那段只能护，不能修回去。","twist":"Easy check: a hair that fell out has a tiny white bulb at the end, a broken one does not. And shampoo your scalp, condition your ends, every single wash.","twistZh":"教你一招：掉下来的头发，一头有个白色小球；断掉的没有。还有，洗发水洗头皮，护发素抹发尾，每次都要。","fixes":[{"id":"satinique-intensive-repair-shampoo","why":"For coloured, bleached or heat-styled hair. Cleans without roughing the strand up further.","whyZh":"适合染过、漂过、常用高温的头发。洗干净，又不让发丝更毛糙。"},{"id":"satinique-intensive-repair-conditioner","why":"The shampoo opens, the conditioner closes. Put it on the ends, where the breaking happens.","whyZh":"洗发水打开，护发素合上。抹在发尾，那里最容易断。"},{"id":"hair-skin-nail","why":"Biotin and collagen for the new hair coming in. Most useful if your diet has been restricted. Taking it? Tell the lab before blood tests.","whyZh":"给新长出来的头发补生物素和胶原蛋白，饮食受限过的人最用得上。在吃的话，抽血化验前要告诉化验室。"}]},{"id":"scalp","icon":"drop","label":"Oily, itchy, flaky scalp","labelZh":"头皮油、痒、头皮屑多","visual":null,"what":"A yeast lives on everyone's scalp and feeds on oil. When your scalp is oily, it grows more, irritates the skin, and you get flakes and itch. That is why washing less usually makes it worse, not better.","whatZh":"每个人头皮上都有一种酵母菌，靠油脂生存。头皮一油，它就长得多，刺激皮肤，头皮屑和痒就来了。所以少洗通常只会更糟，不会更好。","twist":"Wash more often, not less. Rub the shampoo into your scalp and leave it on for five minutes before you rinse. That contact time is what does the work.","twistZh":"要勤洗，不是少洗。洗发水揉在头皮上，停五分钟再冲。真正起作用的，就是这几分钟。","fixes":[{"id":"satinique-anti-dandruff-shampoo","why":"For flakes and itch. Two or three times a week while it is bad, then once a week to keep it away.","whyZh":"对付头皮屑和痒。严重的时候一周两三次，好了以后一周一次维持。"},{"id":"satinique-purifying-shampoo-280ml","why":"On the other days, a deep clean for oily roots that go flat by the afternoon.","whyZh":"其他日子用它，给一到下午就塌的油头皮做个深层清洁。"},{"id":"vitamin-b-complex-120ct","why":"Greasy, flaky skin is one classic sign of running low on B2 and B6, so it is worth covering them.","whyZh":"又油又起屑，是B2、B6不足的典型表现之一，值得顺手补上。"}]}],"doctor":"Hair coming out in patches or clumps, a sore, red or scarred scalp, a widening part, shedding past six months, or shedding with tiredness, feeling cold or heavy periods? See a doctor first.","doctorZh":"如果头发成片或一把一把地掉，头皮疼、发红或留疤，发缝越来越宽，掉发超过六个月，或者同时伴随乏力、怕冷、经量很多，请先去看医生。"}},"rhinitis":{"overview":"Allergic rhinitis is the immune system treating harmless things, pollen, dust mites, pet dander, as threats and releasing histamine, which brings the sneezing, the runny or blocked nose and the itchy eyes. The biggest lever is exposure, so the plan clears first: the bedroom, the air, the pollen carried in on hair and clothes, and a salt-water nose rinse. Next it works on balance through the gut, where much of the immune system is trained, and through plant compounds. Then it replenishes vitamin D and the nutrients the lining of the nose uses to renew itself. The last step is timing and routine: start seasonal support about two weeks before your season and keep the bedroom habits going. None of this replaces the antihistamines or steroid nasal sprays a doctor recommends; guidelines rank steroid sprays as the most effective single treatment, and these steps sit alongside them. See a doctor first for wheezing, chest tightness or a night cough, facial pain or fever, or symptoms that do not respond to what you already use.","overviewZh":"过敏性鼻炎，是免疫系统把花粉、尘螨、宠物皮屑这些无害的东西当成威胁，释放出组胺，于是打喷嚏、流鼻涕或鼻塞、眼睛痒。最大的杠杆是接触量，所以方案先「清」：卧室、空气、跟着头发衣服带进门的花粉，再加上盐水洗鼻。接着通过肠道来「调」平衡，免疫系统很大一部分是在肠道里被训练的，再加上植物化合物。然后「补」上维生素D和鼻腔黏膜更新要用的营养素。最后一步是时机和习惯：在你的过敏季开始前两周左右启动，卧室的习惯一直保持。这些都不能替代医生建议的抗组胺药或激素喷鼻剂；指南把激素喷鼻剂列为单用效果最好的治疗，这里的步骤是配合它们一起用的。如果有喘鸣、胸闷或夜里咳嗽，脸颊疼或发烧，或者现在用的药不管用，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"environment","products":["Atmosphere Mini Air Purifier"],"why":"Start with the room you spend a third of your life in. Dust mites live in pillows, mattresses and bedding, and pet dander clings to everything, so the bedroom is where exposure piles up overnight. In a multicentre placebo-controlled trial in dust-mite-allergic adults, six weeks of HEPA purifiers cut bedroom fine particles by up to half and reduced the medication people needed, though symptom scores did not differ. Mite allergen is heavy and settles fast, so pair the purifier with a hot wash of the bedding every week. Keep the door shut and pets out.","key":"rhinitis.clear.atmosphere-mini-air-purifier","whyZh":"先从你一生三分之一时间待的地方开始。尘螨住在枕头、床垫和被褥里，宠物皮屑又什么都能粘上，所以卧室是一整晚过敏原越积越多的地方。一项多中心、有安慰剂对照的试验里，对尘螨过敏的成年人在家用了六周HEPA净化器，卧室细颗粒物最多降了一半，需要用的药也变少了，不过症状评分和对照组没有明显差别。尘螨过敏原比较重，落得快，所以净化器要配合每周高温洗床品。卧室门关上，宠物别进卧室。","productIds":["atmosphere-mini-air-purifier"]},{"stage":"clear","rank":1,"route":"habit","products":["Atmosphere Sky Air Purifier"],"why":"In pollen season the load comes in on the air, your hair and your clothes. Allergy groups advise keeping windows shut on high-pollen days, showering and changing when you get home, and washing out the nose. That last one has real support: a Cochrane review of 14 trials found saline rinses may ease symptoms in adults and children over up to three months, with rare, mild side effects. A pooled analysis of eight air-filter trials found a small drop in day and night symptoms. So close up, rinse off, and let a purifier sized for the living space handle the air.","key":"rhinitis.clear.atmosphere-sky-air-purifier","whyZh":"花粉季，过敏原是跟着空气、头发、衣服一起进门的。过敏专科的建议是：花粉浓度高的日子关好窗，回家先洗澡换衣服，再洗洗鼻子。洗鼻子这一条是有证据的：Cochrane汇总14项试验发现，生理盐水洗鼻在三个月内可能减轻成人和儿童的症状，副作用少而且轻。一项汇总八个空气过滤试验的分析也看到，白天和夜里的症状都有小幅下降。所以关窗、冲洗，再让一台适合客厅大小的净化器负责屋里的空气。","productIds":["atmosphere-sky-air-purifier"]},{"stage":"clear","rank":2,"route":"internal","products":["Liver Support","Prebiotic Fiber"],"why":"The teaching behind this plan reads allergy as a clearing problem: when the liver's clearing capacity falls behind and the gut carries a heavy load, the body overreacts. Mainstream medicine does not explain allergy this way, so hold it as the tradition's lens. One small data point: in a trial of 94 people with allergic rhinitis, a month of milk thistle extract added to their usual antihistamine eased symptoms more than placebo, though only 60 finished. Fibre is the gut half, feeding the bacteria step two relies on. Take Liver Support in the evening.","key":"rhinitis.clear.liver-support","whyZh":"这套方案背后的调理体系，把过敏看成「清」的问题：肝的解毒能力跟不上、肠道负担又重，身体就容易反应过度。主流医学并不这样解释过敏，所以把它当作这套传统的视角，而不是定论。有一个小小的数据：一项纳入94位过敏性鼻炎患者的试验里，在常规抗组胺药之外加一个月的奶蓟草提取物，症状比安慰剂组减轻得更多，最后有60人完成试验。纤维是肠道那一半，喂养第二步要依靠的好菌。护肝片放在晚上吃。","productIds":["liver-support","prebiotic-fiber"]},{"stage":"regulate","rank":1,"route":"internal","products":["Probiotic","Prebiotic Fiber"],"why":"Much of the body's immune tissue lines the gut, and that is where it learns what to ignore, which is why probiotics are the most studied supplement here. A review of 23 trials with 1,919 people found better allergy quality of life than placebo, though nasal symptom scores did not change significantly, and a review of 28 trials in children found fewer nose and eye symptoms but no effect on who develops allergy. Effects are modest and strain-specific. Take it daily with fibre, ideally from before your season, and judge it over two to three months.","key":"rhinitis.regulate.probiotic","whyZh":"身体很大一部分免疫组织分布在肠道，免疫系统在这里学会什么该放过、什么该反应，所以在过敏这一块，研究最多的补充品是益生菌。一项汇总23项试验、1919人的分析发现，吃益生菌的人过敏相关的生活质量比安慰剂组好，但鼻部症状评分的差别没有达到显著；另一项汇总28项儿童试验的分析看到鼻子和眼睛的症状减轻，但不能减少过敏的发生。效果和菌株有关，幅度也不大。每天吃，配上纤维让好菌有东西吃，最好在换季前开始，按两三个月来判断。","productIds":["probiotic","prebiotic-fiber"]},{"stage":"regulate","rank":2,"route":"internal","products":["Concentrated Fruits & Vegetables"],"why":"Plant compounds are the other half of calming the reaction. Flavonoids such as quercetin, found in onions, apples and berries, steady the mast cells that release histamine in lab and animal studies, and the tradition this plan follows uses plant nutrients to cool inflammation. Human evidence is thin: a recent systematic review found only four small clinical trials, and quercetin itself is poorly absorbed. So think of it as a floor under a diet short on colour, not as an antihistamine. Eat across the colours first, and let the capsules cover the weeks you do not.","key":"rhinitis.regulate.concentrated-fruits-vegetables","whyZh":"植物化合物是让反应平稳下来的另一半。洋葱、苹果、莓果里的槲皮素这类黄酮，在实验室和动物研究里能稳住释放组胺的肥大细胞；这套方案所依据的传统，也是用植物营养素来给炎症降温。但人体证据很薄：最近一篇系统综述只找到四项小型临床试验，而且槲皮素本身吸收差。所以把它当作饮食颜色不够时的托底，而不是抗组胺药。先把五颜六色吃起来，吃不到的那几周再用胶囊补上。","productIds":["concentrated-fruits-vegetables"]},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin D"],"why":"Vitamin D helps regulate immune responses, and people with allergic rhinitis tend to have lower levels. Trials are mixed: a 2025 review of five randomised trials found symptoms eased but not significantly overall, while a wider analysis of 11 trials reported lower nasal symptom scores. Separately, a pooled analysis of 43 trials linked daily vitamin D with slightly fewer respiratory infections, mostly in people who were low. Test your 25-hydroxy vitamin D first, take it with a meal that has some fat, and stay under 4,000 IU a day unless your doctor says otherwise.","key":"rhinitis.supplement.vitamin-d","whyZh":"维生素D参与调节免疫反应，观察性研究发现，过敏性鼻炎的人血液里的维生素D往往偏低。补充试验的结果不一：2025年一篇汇总5项随机试验的综述发现症状有所减轻，但整体没有达到显著；另一项纳入11项试验的分析则报告鼻部症状评分下降。另外，一项汇总43项试验的分析发现，每天补维生素D和呼吸道感染略少有关，主要是在本来缺乏的人身上。先请医生查一下25-羟基维生素D，随带点油脂的一餐吃，除非医生另有建议，每天不超过4000国际单位。","productIds":["vitamin-d"]},{"stage":"supplement","rank":2,"route":"internal","products":["Vitamin C Extended Release 180ct"],"why":"Vitamin C is concentrated in the fluid lining the airways, where it neutralises the oxidants that pollution and inflammation produce, and the course behind this plan teaches it as the white cells' supply line. For allergy itself the evidence is weak: a 2025 review called the rhinitis findings inconsistent. For colds it is clearer: in the Cochrane review, taking it every day did not stop colds in most people but shortened them by about 8 percent in adults. Take it with meals, split through the day or as extended release, and stay well under 2,000 mg a day, the upper limit.","key":"rhinitis.supplement.vitamin-c-extended-release-180ct","whyZh":"维生素C在呼吸道内壁的液体里浓度很高，负责中和空气污染和炎症产生的氧化物；这套课程把它比作给白细胞送弹药的后勤队。就过敏本身来说，证据很弱：2025年的一篇综述认为鼻炎方面的结果并不一致。对感冒的证据清楚一些：Cochrane综述发现，每天规律补充并不能让多数人少感冒，但能让成年人感冒的时间缩短约8%。随餐吃，分几次或用缓释型，每天远低于2000毫克的上限。","productIds":["vitamin-c-extended-release-180ct"]},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill"],"why":"The nose and eyes are lined with mucous membranes, and vitamin A, zinc and the B vitamins all take part in keeping that lining renewed. The course behind this plan links allergy to low vitamin B2 and pantothenic acid, which mainstream research has not tested, so read that as its view rather than a finding. What holds either way is that one missing nutrient slows repair, and a multivitamin covers several gaps at once. It is the base under the targeted steps, taken every day with food, not a remedy for sneezing.","key":"rhinitis.supplement.double-x-multivitamin-31-day-refill","whyZh":"鼻腔和眼睛表面都是黏膜，维生素A、锌和B族都参与这层黏膜的更新。这套课程把过敏和缺维生素B2、泛酸联系在一起，主流研究没有验证过，所以把它当作课程的观点，而不是结论。不管哪种说法，有一点都成立：缺任何一样营养素，修复都会变慢，而综合营养素一次补上好几个缺口。它是针对性步骤下面的底座，每天随餐吃，不是用来止喷嚏的。","productIds":["double-x-multivitamin-31-day-refill"]},{"stage":"sustain","rank":1,"route":"internal","products":["ClearGuard Allergy"],"why":"Timing is the part people get wrong. Allergists advise starting seasonal treatment about two weeks before your pollen season, not in the worst week. ClearGuard is a blend of cinnamon bark, acerola cherry and Spanish needles. Its one published trial, 20 adults in a crossover study partly run by the maker, found no effect during a nasal allergen challenge but fewer symptoms in the eight hours after, similar to loratadine in that window. Label use: two tablets three times a day with meals, up to 12 weeks at a time; not in pregnancy, fever, ulcers or cinnamon allergy.","key":"rhinitis.sustain.clearguard-allergy","whyZh":"最多人做错的是时机。过敏专科建议，季节性的方案在花粉季开始前大约两周就启动，而不是等最难受那周。畅爽呼吸片是肉桂皮、针叶樱桃和鬼针草的组合。它唯一发表的试验，是一项有厂商研究人员参与、20位成人的小型交叉试验：在鼻腔过敏原激发的当下没有效果，但之后8小时内症状减轻，在这个时段和氯雷他定差不多。标签用法：每次两片，一天三次，随餐，一次最多连续12周。孕期、发烧、胃溃疡或对肉桂过敏的人不要用。","productIds":["clearguard-allergy"]},{"stage":"sustain","rank":2,"route":"environment","products":["Atmosphere Carbon Filter Replacement","Atmosphere Mini Air Purifier"],"why":"The bedroom work only holds if it is kept up. An unchanged filter is just a fan, so replace it on the schedule the unit shows. Dust mites need humidity, and US allergy groups advise keeping indoor humidity below about 50 percent, washing bedding weekly in hot water and vacuuming with a HEPA vacuum. The Cochrane review of mite avoidance found mattress covers alone unlikely to help, while fuller bedroom programmes might, so the routine counts more than any one purchase. Pick one day a week for bedding and filters, and keep it.","key":"rhinitis.sustain.atmosphere-carbon-filter-replacement","whyZh":"卧室这一步，要坚持才守得住。滤网不换，净化器就只是一台风扇，按机器提示的时间更换。尘螨靠湿气活着，美国过敏学会的建议是：室内湿度保持在50%左右以下，床品每周用热水洗，用带HEPA的吸尘器。Cochrane关于防尘螨的综述发现，只换防螨床罩大概没什么用，而整套卧室措施可能有帮助，所以关键在日常习惯，不在买哪一样东西。每周固定一天洗床品、看滤网，坚持下去。","productIds":["atmosphere-carbon-filter-replacement","atmosphere-mini-air-purifier"]}],"summary":{"title":"Sneezing again? First, when does it flare?","titleZh":"又开始打喷嚏？先想想，什么时候最严重？","sub":"Different triggers need different fixes. Pick the one that sounds like you.","subZh":"诱因不一样，办法也不一样。选一个最像你的。","moments":[{"id":"spring","icon":"leaf","label":"Sneezing every spring","labelZh":"每到春天就打喷嚏","visual":null,"what":"That is pollen. Your immune system mistakes it for an invader and releases histamine, and histamine is the sneezing, the runny nose and the itch. It comes back every year because the pollen comes back every year.","whatZh":"这是花粉。免疫系统把花粉当成了入侵者，释放出组胺，打喷嚏、流鼻涕、发痒，都是组胺闹的。它年年都来，是因为花粉年年都来。","twist":"The trick is timing. Start about two weeks before your season, not in the worst week. And when you get home, shower and change, so the pollen does not go to bed with you.","twistZh":"关键是时机。在你的过敏季开始前两周左右就准备好，别等到最难受那周。回到家先洗澡换衣服，别让花粉跟着你上床。","fixes":[{"id":"clearguard-allergy","why":"Cinnamon, acerola and Spanish needles. Start before the season: two tablets three times a day with meals.","whyZh":"肉桂、针叶樱桃加鬼针草。换季前就开始吃，每次两片，一天三次，随餐。"},{"id":"probiotic","why":"Much of your immune system sits in the gut. In studies, people on probiotics rated their allergy days a bit better. Give it a couple of months.","whyZh":"免疫系统很大一部分在肠道。研究里，吃益生菌的人觉得过敏那段日子好过一些。给它两三个月。"},{"id":"atmosphere-sky-air-purifier","why":"Windows shut on high-pollen days, and the purifier cleans the air you breathe inside.","whyZh":"花粉多的日子把窗关上，屋里的空气交给净化器。"}]},{"id":"morning","icon":"bed","label":"Stuffy every morning","labelZh":"每天早上鼻子不通","visual":null,"what":"Look at your bedroom. Dust mites live in pillows, mattresses and blankets, and you spend eight hours breathing right next to them. By morning your nose has had a whole night of it.","whatZh":"看看你的卧室。尘螨住在枕头、床垫和被子里，你每晚就在它们旁边呼吸八个小时。到了早上，鼻子已经被折腾了一整夜。","twist":"You do not have to redo the whole house. Fix the bedroom first: wash bedding hot every week, keep the door closed, and rinse your nose with salt water. It is simple and well studied.","twistZh":"不用整个家大动干戈，先把卧室搞定：床品每周热水洗，房门关上，再用盐水洗洗鼻子。简单，而且研究得很充分。","fixes":[{"id":"atmosphere-mini-air-purifier","why":"Sized for a bedroom. Run it all night with the door shut. It catches what floats, and the hot wash handles what sits in the bedding.","whyZh":"大小刚好适合卧室。关上门，整晚开着。空气里飘的它来抓，被子里的交给热水洗。"},{"id":"atmosphere-carbon-filter-replacement","why":"An unchanged filter is just a fan. Swap it on schedule.","whyZh":"滤网不换，净化器就只是一台风扇。按时换。"}]},{"id":"pets","icon":"wind","label":"Worse around pets or dust","labelZh":"碰到猫狗、灰尘就发作","visual":null,"what":"Pet dander is tiny, so it floats in the air for hours and sticks to sofas, carpets and clothes. That is why you can react in a home even when the cat is not in the room.","whatZh":"宠物皮屑非常细，会在空气里飘好几个小时，还会粘在沙发、地毯和衣服上。所以就算猫不在房间里，你一进门也可能开始难受。","twist":"You do not have to give up your pet. Keep them out of the bedroom, and let a purifier catch what is floating around.","twistZh":"不用把宠物送走。别让它进卧室，空气里飘着的交给净化器。","fixes":[{"id":"atmosphere-sky-air-purifier","why":"For the living room, where you and your pet spend the day. The HEPA layer traps dander and fine dust.","whyZh":"放在客厅，你和宠物白天待的地方。HEPA滤网能拦住皮屑和细灰尘。"},{"id":"atmosphere-mini-air-purifier","why":"For the bedroom, so at least eight hours a day you breathe air without dander.","whyZh":"放在卧室，让你一天至少有八个小时，呼吸的是没有皮屑的空气。"}]},{"id":"eyes","icon":"eye","label":"Itchy, watery eyes","labelZh":"眼睛痒、流眼泪","visual":null,"what":"Same reaction, different place. Pollen and dander land right on your eyes, and the thin lining there releases histamine just like your nose does.","whatZh":"同一个反应，换了个地方。花粉和皮屑直接落在眼睛上，眼睛表面那层薄薄的黏膜，和鼻子一样会释放组胺。","twist":"Do not rub, it makes the itch worse. A cool compress and washing your face when you come in help right away. Sunglasses outdoors keep some pollen off.","twistZh":"别揉，越揉越痒。冷敷一下，进门先洗把脸，马上会舒服一点。出门戴墨镜，能挡掉一部分花粉。","fixes":[{"id":"probiotic","why":"In a review of trials in children, probiotics eased eye symptoms as well as nose symptoms.","whyZh":"一项汇总儿童试验的分析发现，益生菌让眼睛和鼻子的症状都轻了一些。"},{"id":"concentrated-fruits-vegetables","why":"Plant compounds like quercetin, from onions and berries, calm allergy cells in lab studies. Human proof is early, so think of it as a floor under your diet.","whyZh":"洋葱、莓果里的槲皮素这类植物成分，在实验室里能让过敏细胞安静下来。人体证据还在早期，把它当作饮食的托底。"}]},{"id":"colds","icon":"thermometer","label":"Always catching colds too","labelZh":"还老是感冒","visual":null,"what":"Sometimes it is a cold, sometimes it is the allergy. A cold brings a sore throat, aches, sometimes a fever, and is gone in about a week. An allergy itches, and it lasts as long as you are around the trigger.","whatZh":"有时候是感冒，有时候其实是过敏。感冒会喉咙痛、身上酸，有时发烧，一周左右就过去；过敏是痒，只要还碰着过敏原，就一直不走。","twist":"Check your vitamin D. If you are indoors all day it is often low, and it is a simple blood test.","twistZh":"查一下维生素D。整天待在室内的人常常偏低，抽个血就知道。","fixes":[{"id":"vitamin-d","why":"In a large review of trials, daily vitamin D meant slightly fewer nose and chest infections, mostly in people who were low.","whyZh":"一项大型试验汇总发现，每天补维生素D，呼吸道感染会略少一些，主要是本来就缺的人。"},{"id":"vitamin-c-extended-release-180ct","why":"Taken every day, vitamin C will not stop colds, but it makes them a little shorter. Take it with meals.","whyZh":"每天吃维生素C，不能让你不感冒，但能让感冒短一点。随餐吃。"},{"id":"probiotic","why":"A Cochrane review found people on probiotics caught somewhat fewer colds. The evidence is not strong yet.","whyZh":"Cochrane综述发现，吃益生菌的人感冒次数少一些，不过证据还不算强。"}]},{"id":"sensitive","icon":"shield","label":"Sensitive to everything","labelZh":"什么都容易过敏","visual":null,"what":"Nose, skin, sometimes the stomach too. The teaching I follow reads this as a load problem: when the liver cannot keep up with clearing and the gut is out of balance, the body overreacts to everything.","whatZh":"鼻子、皮肤，有时连肠胃也跟着闹。我学的这套调理理论认为，这是负担太重：肝清理不过来，肠道菌群又失衡，身体就对什么都反应过度。","twist":"Work from the inside, and be patient. Liver cells take about six months to renew, so judge it in months, not days.","twistZh":"从里面慢慢调，要有耐心。肝细胞大约六个月更新一轮，所以按月看效果，不是按天看。","fixes":[{"id":"probiotic","why":"Rebalance the gut, the place where your immune system learns what to ignore.","whyZh":"把肠道菌群调回来，免疫系统就是在肠道里学会什么该放过。"},{"id":"prebiotic-fiber","why":"Food for the good bacteria, and it helps the gut carry waste out instead of letting it sit.","whyZh":"给好菌的食物，也帮肠道把废物带出去，而不是留在里面。"},{"id":"liver-support","why":"Milk thistle for the liver. In one small trial, allergy patients who added it to their usual antihistamine had milder symptoms.","whyZh":"奶蓟草护肝。一项小型试验里，过敏患者在常规抗组胺药之外加上它，症状更轻。"}]}],"doctor":"Wheezing, a tight chest or a cough at night, face pain or fever, or no relief from what you already use? See a doctor first. All of this goes alongside the sprays or tablets your doctor recommends, not instead of them.","doctorZh":"如果有喘鸣、胸闷、夜里咳嗽，脸颊疼或发烧，或者现在用的药不管用，请先去看医生。这些都是配合医生建议的喷鼻剂或药片一起用，不是替代。"}},"eye":{"overview":"Most everyday eye trouble is not damage, it is use. Screens hold the focusing muscle tight for hours and cut blinking by up to two thirds, which leaves eyes tired, dry and blurry by evening. Behind that sit two slower stories: UV and smoke add oxidative load year after year, and the macula relies on lutein and zeaxanthin, pigments the body cannot make and many diets supply poorly. The four steps take them in order: change how the eyes are used and shielded, make sure the fat-soluble nutrients are actually absorbed, supply the pigments and vitamin A, then keep the sleep, daylight and checkups that hold it. Evidence is strongest for breaks, UV protection, outdoor time for children and, in people who already have intermediate macular degeneration, the NIH AREDS2 formula; it is weak for blue-light glasses and for fish oil in dry eye. Sudden changes in vision, eye pain, a painful red eye, or new flashes and floaters need an eye doctor the same day.","overviewZh":"日常大多数的眼睛不适，不是损伤，而是用得太多。看屏幕时，对焦的肌肉几个小时一直绷着，眨眼次数最多能少三分之二，所以到了晚上眼睛又累、又干、又模糊。背后还有两条更慢的线：紫外线和烟雾年复一年地增加氧化负担；黄斑要靠叶黄素和玉米黄质保护，而这两种色素身体造不出来，很多人的饮食又给得太少。下面四步按这个顺序来：先改用眼和防护的方式，再确保这些脂溶性营养真正被吸收，然后补上色素和维生素A，最后用睡眠、户外光照和定期检查把成果守住。证据最扎实的是用眼休息、防紫外线、孩子多到户外，以及已经有中期黄斑变性的人使用美国国立卫生研究院的AREDS2配方；防蓝光眼镜、用鱼油改善干眼，证据都很弱。如果视力突然变化、眼睛疼痛、眼红伴疼，或者突然出现闪光和大量飞蚊，请当天就去看眼科。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["Eye Mojo Blue Light Gummies","Vision Health"],"why":"The first load to take off is the way the eyes are used, not a missing nutrient. At a screen the focusing muscle holds a close-up position for hours, and blinking drops from about 15 times a minute to as few as 5, so the tear film dries between blinks. That is most of what people call eye strain, and it is not damage. The AAO backs the 20-20-20 rule: every 20 minutes, look 20 feet away for 20 seconds. Keep the screen an arm's length away, slightly below eye level, as bright as the room. A gummy on the desk makes a handy cue for the break.","key":"eye.clear.eye-mojo-blue-light-gummies","whyZh":"第一件要卸掉的，是用眼的方式，而不是缺了什么营养。盯着屏幕时，负责对焦的肌肉几个小时都绷在看近处的位置，眨眼从每分钟大约15次掉到最少5次，泪膜在两次眨眼之间就干了。大多数人说的眼疲劳就是这个，并不是眼睛受了损伤。美国眼科学会推荐20-20-20法则：每20分钟，看6米外的地方20秒。屏幕离眼睛一臂远，略低于视线，亮度和房间差不多。护眼软糖放在桌上，正好当作休息的提醒。","productIds":["eye-mojo-blue-light-gummies","vision-health"]},{"stage":"clear","rank":2,"route":"environment","products":["Vitamin C Extended Release 180ct","Concentrated Fruits & Vegetables"],"why":"The second load comes from outside: sunlight and smoke. Years of UV exposure are linked to cataract and to growths on the eye surface, so wear sunglasses labelled 99 to 100 percent UVA and UVB (UV400) and a brimmed hat outdoors, children included. Smoking is the biggest changeable risk factor for macular degeneration, raising the risk two- to fourfold in population studies, and it burns through antioxidants: NIH advises smokers to get 35 mg more vitamin C a day. Vitamin C and a wider range of coloured plants cover part of that load, but quitting is the step that counts.","key":"eye.clear.vitamin-c-extended-release-180ct","whyZh":"第二个负担来自外面：阳光和烟。长年的紫外线照射，和白内障、眼表的增生都有关系，所以出门戴标明能阻挡99%到100% UVA和UVB（UV400）的太阳镜，再加一顶有帽檐的帽子，孩子也一样。抽烟是黄斑变性最大的可改变风险，人群研究里风险高出两到四倍，而且特别耗抗氧化剂：美国国立卫生研究院建议吸烟者每天多摄入35毫克维生素C。维生素C和更多颜色的蔬果能分担一部分，但真正算数的一步是戒烟。","productIds":["vitamin-c-extended-release-180ct","concentrated-fruits-vegetables"]},{"stage":"regulate","rank":1,"route":"habit","products":["Vision Health","Advanced Omega"],"why":"Lutein, zeaxanthin and beta-carotene are fat-soluble, so a capsule swallowed with black coffee on an empty stomach is largely wasted. In a feeding study, adding avocado to a salad raised lutein absorption 5.1-fold and beta-carotene absorption 15-fold, purely because of the fat. Egg yolk is a well-absorbed food source for the same reason: it brings its own fat. So the rule is simple. Take the eye supplement with your biggest meal that contains some fat, and if you take fish oil, take the two together. Absorption depends on the meal, not on the time of day.","key":"eye.regulate.vision-health","whyZh":"叶黄素、玉米黄质和β-胡萝卜素都是脂溶性的，空腹配一杯黑咖啡吞下去，大部分都浪费了。一项研究里，沙拉加上牛油果，叶黄素的吸收提高到5.1倍，β-胡萝卜素提高到15倍，原因就是多了油脂。蛋黄是吸收很好的食物来源，道理一样，它自带油脂。所以规则很简单：护眼营养跟一天里最丰盛、带点油脂的那一顿一起吃；如果你也吃鱼油，两个一起吃。吸收看的是那一餐，不是几点钟。","productIds":["vision-health","advanced-omega"]},{"stage":"regulate","rank":2,"route":"habit","products":["Advanced Omega"],"why":"Dry, gritty or burning eyes are a tear-film problem, and the tear film is shaped by habits first: full blinks, air that is not too dry, and no fan or vent blowing at the face. Here the honest finding matters. In the NIH-funded DREAM trial, 535 people with moderate to severe dry eye took 3,000 mg of fish-oil omega-3 or an olive-oil placebo for a year, and both groups improved by the same amount. So fish oil keeps its place in the daily base for heart and brain, not as a dry-eye fix. Use a humidifier in heated or air-conditioned rooms, blink on purpose, and use lubricating drops.","key":"eye.regulate.advanced-omega","whyZh":"眼睛干、涩、发烫，是泪膜的问题，而泪膜首先受习惯影响：眨眼要眨完整，空气别太干，风扇和出风口别对着脸吹。这里要说一个诚实的结果。美国国立卫生研究院资助的DREAM研究里，535位中重度干眼的人，每天吃3000毫克鱼油Omega-3或者橄榄油安慰剂，吃了一年，两组改善的程度一样。所以鱼油留在每天的基础营养里，是为了心脏和大脑，不是用来解决干眼。开暖气或空调的房间放加湿器，刻意眨眼，再配合人工泪液。","productIds":["advanced-omega"]},{"stage":"supplement","rank":1,"route":"internal","products":["Vision Health","Eye Mojo Blue Light Gummies"],"why":"Lutein and zeaxanthin are the yellow pigments of the macula, the centre of the retina you read and recognise faces with. They filter blue light and act as antioxidants, and the body cannot make them, so levels follow diet: dark greens, corn, egg yolk. In 115 healthy young adults, a year of 10 mg lutein and 2 mg zeaxanthin improved glare tolerance and recovery from bright light. The NIH AREDS2 formula uses those doses for people who already have intermediate macular degeneration; Cochrane finds no proof supplements prevent it in healthy eyes. Pick one product, not both.","key":"eye.supplement.vision-health","whyZh":"叶黄素和玉米黄质是黄斑里的黄色色素，黄斑就是视网膜的中心，看字、认人脸都靠它。它们过滤蓝光、抗氧化，身体自己造不出来，所以含量取决于饮食：深绿色蔬菜、玉米、蛋黄。一项研究里，115位健康年轻人每天吃10毫克叶黄素加2毫克玉米黄质，一年后更不怕眩光，被强光晃过恢复更快。AREDS2配方用的就是这个剂量，但对象是已有中期黄斑变性的人；Cochrane综述没有找到补充剂能让健康眼睛预防它的证据。两款选一款就够。","productIds":["vision-health","eye-mojo-blue-light-gummies"]},{"stage":"supplement","rank":2,"route":"internal","products":["Double X Multivitamin 31-day Refill","Concentrated Fruits & Vegetables"],"why":"The retina builds its light-sensing pigment from vitamin A and rebuilds it constantly, so a shortfall shows first as poor vision in dim light, then as a drying eye surface. True deficiency is rare where diets are varied. The teaching behind this plan says heavy screen use raises the need; mainstream research has not measured that. The safest source is beta-carotene, which the body converts only as needed. Preformed vitamin A has an adult upper limit of 3,000 mcg a day, and high-dose beta-carotene raised lung cancer risk in smokers, so smokers should ask a doctor first.","key":"eye.supplement.double-x-multivitamin-31-day-refill","whyZh":"维生素A是视网膜制造感光物质的原料，这种感光物质不停地被用掉、再重新合成，所以缺乏最早的信号是暗处看不清，接下来是眼睛表面变干。饮食多样的人，真正缺乏的很少。这套方案所依据的课程认为，大量看屏幕会增加需求，但主流研究还没有测量过这一点。最安全的来源是β-胡萝卜素，身体需要多少才转化多少。直接形式的维生素A，成人每日上限是3000微克；而高剂量β-胡萝卜素在吸烟者身上增加了肺癌风险，所以抽烟的人先问医生。","productIds":["double-x-multivitamin-31-day-refill","concentrated-fruits-vegetables"]},{"stage":"sustain","rank":1,"route":"habit","products":["Everyday Nutrition Solution","Vision Health"],"why":"Macular pigment builds slowly: trials measure it over six to twelve months, so judge an eye routine in months, and keep the daily base steady rather than switching products every season. The rest of the rhythm is sleep and checkups. Short sleep is linked with dry-eye symptoms, and screens late at night affect the body clock rather than damaging the eye, which is why the AAO suggests night mode and less screen time in the hour or two before bed. The AAO also recommends a baseline eye exam at 40, earlier with diabetes, high blood pressure or a family history of eye disease.","key":"eye.sustain.everyday-nutrition-solution","whyZh":"黄斑色素是慢慢累积的，研究都是以六到十二个月来测量，所以护眼要按月来看效果，每天的基础营养稳稳吃，而不是每季换一个产品。节奏的另一部分是睡眠和检查。睡眠不足和干眼症状有关联；深夜看屏幕影响的是生物钟，而不是伤眼睛，所以美国眼科学会建议睡前一两个小时少看屏幕、打开夜间模式。学会也建议40岁做一次基础眼科检查；有糖尿病、高血压或家族眼病史的人，要更早。","productIds":["everyday-nutrition-solution","vision-health"]},{"stage":"sustain","rank":2,"route":"habit","products":["Concentrated Fruits & Vegetables","Eye Mojo Blue Light Gummies"],"why":"For children the best-evidenced habit is daylight. In a trial across 12 primary schools in Guangzhou, one extra 40-minute outdoor class a day lowered new short-sightedness over three years from 39.5 to 30.4 percent. Many eye doctors now suggest about two hours outside a day, plus the 20-20-20 break and books held a forearm's length away. At this age food matters more than pills: children who eat few coloured vegetables get little lutein. Check the age on any supplement label before giving it to a child, and keep up regular eye tests through the school years.","key":"eye.sustain.concentrated-fruits-vegetables","whyZh":"对孩子来说，证据最扎实的习惯就是晒太阳。广州一项覆盖12所小学的研究里，每天多上一节40分钟的户外课，三年下来新发近视的比例从39.5%降到30.4%。现在很多眼科医生建议每天户外活动两小时左右，再加上20-20-20的休息，看书保持一小臂的距离。这个年纪，吃比补更重要：彩色蔬菜吃得少的孩子，叶黄素也吃得少。给孩子任何补充剂之前，先看清标签上的适用年龄；整个上学阶段都要定期查视力。","productIds":["concentrated-fruits-vegetables","eye-mojo-blue-light-gummies"]},{"stage":"sustain","rank":3,"route":"internal","products":["Liver Support","Vitamin B Complex 120ct"],"why":"The liver holds most of the body's vitamin A store, and Chinese medicine says the liver opens into the eyes. The tradition this plan follows adds an evening routine: B vitamins and liver support taken together between about 7:30 and 8:40 pm, judged over six months because liver cells take roughly 180 days to renew. There is no mainstream research on this routine for eyesight, so hold it as the tradition's framing and an anchor for the evening, not as an eye claim. It suits people whose tired eyes come with late nights, regular drinking or a takeout diet.","key":"eye.sustain.liver-support","whyZh":"身体里大部分的维生素A储存在肝脏，中医也讲「肝开窍于目」。这套方案所依据的调理传统，在晚上加了一个节奏：每晚大约7点半到8点40之间，B族和护肝片一起吃，按六个月来看，因为肝细胞大约180天更新一轮。主流研究没有验证过这个方法对视力的作用，所以把它当作传统的理解和固定晚间节奏的习惯，而不是护眼功效。适合眼睛累、同时常熬夜、常喝酒或三餐靠外卖的人。","productIds":["liver-support","vitamin-b-complex-120ct"]}],"summary":{"title":"Eyes tired, dry or blurry? When do you notice it?","titleZh":"眼睛累、干、看不清？先想想，什么时候最明显？","sub":"Different eye problems come from different places. Pick the one that sounds like you.","subZh":"眼睛的问题，来源不一样。选一个最像你的。","moments":[{"id":"screens","icon":"screen","label":"Tired after screens all day","labelZh":"屏幕看久眼好累","visual":null,"what":"Your eyes are not damaged, they are overworked. Looking close up, the focusing muscle stays tight for hours, and you blink about a third as often, so the surface dries out. Long story short, that is the heavy, tired feeling by 5 pm.","whatZh":"眼睛不是坏了，是太累了。看近处的时候，负责对焦的肌肉几个小时一直绷着，眨眼次数也只剩平时的三分之一左右，眼睛表面就干了。说白了，下午五点那种又酸又沉的感觉，就是这么来的。","twist":"You do not have to quit screens. Every 20 minutes, look at something 20 feet away for 20 seconds, and blink properly a few times.","twistZh":"不用戒掉屏幕。每20分钟，看6米外的地方20秒，再好好眨几下眼。","fixes":[{"id":"vision-health","why":"Lutein and zeaxanthin, the light-filtering pigments at the centre of your eye. Your body cannot make them, so they come from food or from this.","whyZh":"叶黄素和玉米黄质，是眼睛中心负责过滤光线的色素。身体自己造不出来，只能靠吃，或者靠补。"},{"id":"eye-mojo-blue-light-gummies","why":"The same pigments in a gummy. Keep it on your desk and let it remind you to look away from the screen.","whyZh":"同样是叶黄素和玉米黄质，做成了软糖。放在桌上，顺便提醒你抬头看看远处。"}]},{"id":"dry","icon":"drop","label":"Dry or gritty eyes","labelZh":"眼睛干涩","visual":null,"what":"Tears are a thin film of water, oil and mucus, and it breaks up when you stop blinking or the air is dry. Air conditioning, heating, fans and long screen time all speed that up. That is the sandy, burning feeling.","whatZh":"泪液其实是一层很薄的膜，有水、有油、有黏液。一不眨眼、空气一干，这层膜就散了。空调、暖气、风扇、长时间看屏幕，都会让它散得更快，所以眼睛才会像进了沙子一样，又干又烫。","twist":"Blink on purpose, keep the screen a little below eye level so your lids cover more of the eye, and put a humidifier where you work. Drops from the pharmacy are fine too.","twistZh":"刻意多眨眼；屏幕放得比视线略低，眼皮能多盖住一点眼球；工作的地方放个加湿器。药店买的人工泪液也可以用。","fixes":[{"id":"advanced-omega","why":"Honest answer: the biggest trial found fish oil no better than olive oil for dry eyes. Keep it for heart and brain, and let the habits do the eye work.","whyZh":"说实话，最大的一项研究发现，鱼油改善干眼的效果和橄榄油差不多。鱼油留着养心养脑，干眼主要靠上面这些习惯。"},{"id":"double-x-multivitamin-31-day-refill","why":"Vitamin A keeps the surface of the eye moist, and a real shortage dries it out. The multivitamin covers your daily base.","whyZh":"维生素A负责让眼睛表面保持湿润，真的缺了，眼睛就会干。综合营养素把每天的基本量补上。"}]},{"id":"night","icon":"moon","label":"Hard to see at night","labelZh":"晚上看不清","visual":null,"what":"Your eyes see in dim light with a pigment made from vitamin A, used up and rebuilt every moment you look. Short on vitamin A, the rebuilding cannot keep up, and night vision goes first. Glare from headlights is a different thing, and that is where the yellow pigment in your eye helps.","whatZh":"眼睛在暗处看得见，靠的是一种用维生素A做成的感光物质，你每看一眼，它就用掉一次、再重新合成一次。维生素A不够，合成就跟不上，最先变差的就是夜间视力。至于对面车灯晃得睁不开眼，那是另一回事，靠的是眼睛里的黄色色素。","twist":"If it is new or getting worse, get your eyes checked first. Often it is just an old prescription or an early cataract, and that is the eye doctor's job.","twistZh":"如果是最近才出现，或者越来越明显，先去查一下眼睛。很多时候只是度数变了，或者是早期白内障，这些要交给眼科医生。","fixes":[{"id":"double-x-multivitamin-31-day-refill","why":"Covers your daily vitamin A, the raw material for seeing in the dark.","whyZh":"把每天的维生素A补上，这就是在暗处看东西的原料。"},{"id":"vision-health","why":"In a one-year trial, lutein and zeaxanthin helped healthy adults handle glare and recover faster from bright light. It also has beta-carotene for vitamin A.","whyZh":"一项为期一年的研究里，叶黄素和玉米黄质让健康的年轻人更不怕眩光，被强光晃到之后恢复得更快。里面还有β-胡萝卜素，可以转成维生素A。"}]},{"id":"aging","icon":"eye","label":"Worried about aging eyes","labelZh":"担心眼睛老化","visual":null,"what":"The centre of your retina, the macula, is what you read and recognise faces with. It is protected by lutein and zeaxanthin, which you only get from food: dark leafy greens, corn, egg yolk. Most diets give far less than the amounts used in studies.","whatZh":"视网膜的中心叫黄斑，你看字、认人脸，靠的都是它。保护黄斑的是叶黄素和玉米黄质，只能从食物里来：深绿色蔬菜、玉米、蛋黄。大多数人平时吃到的量，比研究里用的量少得多。","twist":"In people already diagnosed with mid-stage macular degeneration, a big NIH study found a lutein formula slowed it down. For healthy eyes that is not proven, so think of it as keeping the pigment topped up, along with sunglasses and not smoking.","twistZh":"对已经确诊中期黄斑变性的人，美国国立卫生研究院的大型研究发现，含叶黄素的配方能让病情发展慢一些。健康的眼睛能不能靠它预防，目前没有证据，所以就把它当成把色素补满，再加上戴太阳镜、不抽烟。","fixes":[{"id":"vision-health","why":"Lutein and zeaxanthin every day, from marigolds. If you smoke, ask your doctor first, because it also contains beta-carotene.","whyZh":"每天补上来自万寿菊
