<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Product & Volume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:           #f4f3ef;
      --surface:      #ffffff;
      --dark:         #1a1a28;
      --dark-mid:     #2c2c40;
      --gold:         #b8943c;
      --gold-light:   #f5edd8;
      --text:         #1a1a28;
      --text-2:       #5a5a72;
      --text-3:       #9a9ab0;
      --border:       rgba(0,0,0,0.07);
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:    0 4px 16px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      --radius:       14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      background: var(--dark);
      padding: 18px 18px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.25);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .logo-dot { color: var(--gold); }

    .sync-badge {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.02em;
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      opacity: 0.4;
    }

    #searchInput {
      width: 100%;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px 10px 36px;
      font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      color: white;
      outline: none;
      transition: background 0.2s, border-color 0.2s;
    }

    #searchInput:focus {
      background: rgba(255,255,255,0.13);
      border-color: rgba(184,148,60,0.5);
    }

    #searchInput::placeholder { color: rgba(255,255,255,0.3); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 90px;
      z-index: 90;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--text-3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      user-select: none;
      transition: color 0.15s;
    }

    .tab-btn.active {
      color: var(--dark);
      border-bottom-color: var(--gold);
    }

    /* ── Main ── */
    main {
      padding: 18px 16px 40px;
      min-height: 60vh;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 72px 20px;
      color: var(--text-3);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Category grid ── */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .cat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 8px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    .cat-card:active {
      transform: scale(0.95);
      box-shadow: none;
    }

    .cat-emoji { font-size: 28px; margin-bottom: 8px; }

    .cat-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-2);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    /* ── View header ── */
    .view-hd {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .back-btn {
      background: var(--surface);
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--text-2);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .back-btn:active { background: var(--bg); }

    .view-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    /* ── Intro callout ── */
    .intro-box {
      background: var(--gold-light);
      border-left: 3px solid var(--gold);
      border-radius: 0 10px 10px 0;
      padding: 13px 15px;
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    /* ── Product cards ── */
    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 15px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.15s, transform 0.1s;
      user-select: none;
    }

    .product-card:active {
      box-shadow: none;
      transform: scale(0.99);
    }

    .product-card.no-detail { cursor: default; }

    .product-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .arrow-tag {
      font-size: 16px;
      color: var(--gold);
      flex-shrink: 0;
      line-height: 1.2;
    }

    .product-adv {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 100px;
      background: var(--bg);
      color: var(--text-2);
    }

    .badge.pv {
      background: var(--gold-light);
      color: #7a5c10;
    }

    /* ── Strategy grid ── */
    .strat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      border-left: 3px solid var(--gold);
      transition: box-shadow 0.15s, transform 0.1s;
      user-select: none;
    }

    .strat-card:active {
      box-shadow: none;
      transform: scale(0.99);
    }

    .strat-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .strat-sub {
      font-size: 12px;
      color: var(--text-3);
    }

    /* ── Strategy table ── */
    .table-wrap {
      overflow-x: auto;
      margin-top: 14px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 480px;
    }

    th {
      background: var(--dark);
      color: rgba(255,255,255,0.85);
      padding: 11px 12px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--bg);
      color: var(--text-2);
      vertical-align: top;
      line-height: 1.55;
    }

    tr:last-child td { border-bottom: none; }

    td.linked {
      color: var(--dark);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--gold);
      text-underline-offset: 2px;
    }

    /* ── Modal (bottom sheet) ── */
    #modalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,20,0.6);
      z-index: 200;
      align-items: flex-end;
      backdrop-filter: blur(2px);
    }

    #modalOverlay.open { display: flex; }

    .modal-sheet {
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-height: 87vh;
      overflow-y: auto;
      padding: 6px 22px 48px;
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-handle {
      width: 32px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin: 14px auto 20px;
    }

    #modalTitle {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    /* Detail sections */
    .d-callout {
      background: var(--gold-light);
      border-left: 3px solid var(--gold);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.7;
    }

    .d-h1, .d-h2 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      margin: 22px 0 9px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .d-h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin: 16px 0 6px;
    }

    .d-para {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-2);
      margin-bottom: 10px;
    }

    .d-bullet {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-2);
      padding-left: 16px;
      position: relative;
      margin-bottom: 7px;
    }

    .d-bullet::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: 400;
    }

    .d-quote {
      background: var(--bg);
      border-left: 2px solid var(--gold);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 12.5px;
      font-style: italic;
      color: var(--text-2);
      margin: 12px 0;
      line-height: 1.7;
    }

    .no-detail-note {
      color: var(--text-3);
      font-size: 13px;
      text-align: center;
      padding: 32px 0;
    }

    /* ── Search results ── */
    .search-hd {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .sr-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 13px 15px;
      margin-bottom: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s;
    }

    .sr-item:active { transform: scale(0.98); }

    .sr-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .sr-cat {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .no-results {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-3);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <div class="logo">Product <span class="logo-dot">&</span> Volume</div>
      <div class="sync-badge" id="syncBadge">Loading…</div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Search products, strategies…" autocomplete="off" />
    </div>
  </header>

  <nav class="tabs">
    <div class="tab-btn active" id="tab-products"   onclick="switchTab('products')">🌿 Products</div>
    <div class="tab-btn"        id="tab-strategies"  onclick="switchTab('strategies')">📊 Strategies</div>
  </nav>

  <main id="main"></main>

  <!-- Bottom sheet modal -->
  <div id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modalTitle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let DATA = null;
    let tab   = 'products';
    let view  = 'grid';
    let slug  = null;

    // ─── Boot ─────────────────────────────────────────────────────────────────
    const main = document.getElementById('main');

    main.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';

    fetch('data/products.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        DATA = data;
        const d = new Date(data.lastUpdated);
        document.getElementById('syncBadge').textContent =
          'Synced ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        render();
      })
      .catch(() => {
        main.innerHTML = '<div class="no-results">⚠️ Could not load data.<br><small>Run the GitHub Action to generate data/products.json</small></div>';
        document.getElementById('syncBadge').textContent = 'No data';
      });

    // ─── Tab switch ───────────────────────────────────────────────────────────
    function switchTab(t) {
      tab  = t;
      view = 'grid';
      slug = null;
      document.getElementById('tab-products').classList.toggle('active',  t === 'products');
      document.getElementById('tab-strategies').classList.toggle('active', t === 'strategies');
      document.getElementById('searchInput').value = '';
      render();
    }

    // ─── Search ───────────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', e => {
      const q = e.target.value.trim();
      if (q.length >= 2) renderSearch(q.toLowerCase());
      else render();
    });

    // ─── Router ───────────────────────────────────────────────────────────────
    function render() {
      if (!DATA) return;
      if (tab === 'products') {
        view === 'grid' ? renderCatGrid() : renderCatDetail(slug);
      } else {
        view === 'grid' ? renderStratGrid() : renderStratDetail(slug);
      }
    }

    function navTo(newView, newSlug) {
      view = newView;
      slug = newSlug;
      render();
      window.scrollTo(0, 0);
    }

    function goBack() { navTo('grid', null); }

    // ─── Category grid ────────────────────────────────────────────────────────
    function renderCatGrid() {
      const cards = DATA.categories.map(c => {
        const emoji = extractEmoji(c.title);
        const label = c.title.replace(/^\p{Emoji_Presentation}\s*/u, '').replace(/^\p{Emoji}\s*/u, '');
        return `<div class="cat-card" onclick="navTo('detail','${c.slug}')">
          <div class="cat-emoji">${emoji}</div>
          <div class="cat-label">${esc(label)}</div>
        </div>`;
      }).join('');
      main.innerHTML = `<div class="cat-grid">${cards}</div>`;
    }

    // ─── Category detail ──────────────────────────────────────────────────────
    function renderCatDetail(s) {
      const cat = DATA.categories.find(c => c.slug === s);
      if (!cat) return goBack();

      const intro = cat.intro
        ? `<div class="intro-box">${esc(cat.intro)}</div>` : '';

      const cards = cat.rows.map(row => {
        const adv    = row.cells[1] || '';
        const pv     = row.cells[4] || '';
        const ibo    = row.cells[5] || '';
        const retail = row.cells[6] || '';

        const pvBadge  = pv     ? `<span class="badge pv">PV ${esc(pv)}</span>` : '';
        const iboBadge = ibo    ? `<span class="badge">IBO ${esc(ibo)}</span>`   : '';
        const retBadge = retail ? `<span class="badge">Retail ${esc(retail)}</span>` : '';

        const hasDetail = !!row.detailId;
        const clickAttr = hasDetail
          ? `onclick="openDetail('${row.detailId}','${escJs(row.name)}')"` : '';

        return `<div class="product-card${hasDetail ? '' : ' no-detail'}" ${clickAttr}>
          <div class="product-name">
            <span>${esc(row.name)}</span>
            ${hasDetail ? '<span class="arrow-tag">›</span>' : ''}
          </div>
          ${adv ? `<div class="product-adv">${esc(adv)}</div>` : ''}
          <div class="badges">${pvBadge}${iboBadge}${retBadge}</div>
        </div>`;
      }).join('') || '<div class="no-results">No products listed</div>';

      main.innerHTML = `
        <div class="view-hd">
          <button class="back-btn" onclick="goBack()">← Back</button>
          <div class="view-title">${esc(cat.title)}</div>
        </div>
        ${intro}${cards}`;
    }

    // ─── Strategy grid ────────────────────────────────────────────────────────
    function renderStratGrid() {
      const cards = DATA.strategies.map(s => {
        const count = s.rows?.length || 0;
        return `<div class="strat-card" onclick="navTo('detail','${s.slug}')">
          <div class="strat-title">${esc(s.title)}</div>
          <div class="strat-sub">${count} entr${count === 1 ? 'y' : 'ies'}</div>
        </div>`;
      }).join('');
      main.innerHTML = cards;
    }

    // ─── Strategy detail ──────────────────────────────────────────────────────
    function renderStratDetail(s) {
      const strat = DATA.strategies.find(x => x.slug === s);
      if (!strat) return goBack();

      const intro = strat.intro
        ? `<div class="intro-box">${esc(strat.intro)}</div>` : '';

      const headers = strat.columns || [];
      const rows    = strat.rows    || [];

      const theadCells = headers.map(h => `<th>${esc(h)}</th>`).join('');

      const tbodyRows = rows.map(row => {
        const cells = row.cells.map((cell, i) => {
          if (i === 0 && row.detailId) {
            return `<td class="linked" onclick="openDetail('${row.detailId}','${escJs(row.name)}')">${esc(cell)}</td>`;
          }
          return `<td>${esc(cell)}</td>`;
        }).join('');
        return `<tr>${cells}</tr>`;
      }).join('') || `<tr><td colspan="${headers.length}" style="text-align:center;color:var(--text-3)">No data</td></tr>`;

      main.innerHTML = `
        <div class="view-hd">
          <button class="back-btn" onclick="goBack()">← Back</button>
          <div class="view-title">${esc(strat.title)}</div>
        </div>
        ${intro}
        <div class="table-wrap">
          <table>
            <thead><tr>${theadCells}</tr></thead>
            <tbody>${tbodyRows}</tbody>
          </table>
        </div>`;
    }

    // ─── Product detail modal ─────────────────────────────────────────────────
    function openDetail(pageId, name) {
      const sections = DATA.productDetails?.[pageId];
      document.getElementById('modalTitle').textContent = name;

      if (!sections || sections.length === 0) {
        document.getElementById('modalBody').innerHTML =
          '<div class="no-detail-note">No detail page available.</div>';
      } else {
        document.getElementById('modalBody').innerHTML = sections.map(renderSection).join('');
      }

      document.getElementById('modalOverlay').classList.add('open');
    }

    function renderSection(s) {
      const t = esc(s.text);
      switch (s.type) {
        case 'callout':   return `<div class="d-callout">${t}</div>`;
        case 'heading_1': return `<div class="d-h1">${t}</div>`;
        case 'heading_2': return `<div class="d-h2">${t}</div>`;
        case 'heading_3': return `<div class="d-h3">${t}</div>`;
        case 'paragraph': return `<div class="d-para">${t}</div>`;
        case 'bullet':    return `<div class="d-bullet">${t}</div>`;
        case 'quote':     return `<div class="d-quote">${t}</div>`;
        default: return '';
      }
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').classList.remove('open');
      }
    }

    // ─── Search ───────────────────────────────────────────────────────────────
    function renderSearch(q) {
      const hits = [];

      for (const cat of (DATA.categories || [])) {
        for (const row of (cat.rows || [])) {
          const haystack = [row.name, ...row.cells].join(' ').toLowerCase();
          if (haystack.includes(q)) hits.push({ row, source: cat.title, type: 'product' });
        }
      }

      for (const strat of (DATA.strategies || [])) {
        for (const row of (strat.rows || [])) {
          const haystack = [row.name, ...row.cells].join(' ').toLowerCase();
          if (haystack.includes(q) && !hits.find(h => h.row.name === row.name)) {
            hits.push({ row, source: strat.title, type: 'strategy' });
          }
        }
      }

      if (hits.length === 0) {
        main.innerHTML = `<div class="no-results">No results for "<strong>${esc(q)}</strong>"</div>`;
        return;
      }

      const items = hits.map(({ row, source }) => {
        const hasDetail = !!row.detailId;
        const click = hasDetail ? `openDetail('${row.detailId}','${escJs(row.name)}')` : '';
        return `<div class="sr-item" ${click ? `onclick="${click}"` : ''}>
          <div class="sr-name">${esc(row.name)}</div>
          <div class="sr-cat">${esc(source)}</div>
        </div>`;
      }).join('');

      main.innerHTML = `
        <div class="search-hd">${hits.length} result${hits.length !== 1 ? 's' : ''}</div>
        ${items}`;
    }

    // ─── Utilities ────────────────────────────────────────────────────────────
    function esc(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escJs(s) {
      return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function extractEmoji(title) {
      const m = title.match(/^(\p{Emoji_Presentation}|\p{Emoji}️)/u);
      return m ? m[0] : '📦';
    }
  </script>
</body>
</html>
