ich-cream":{"advantage":"The rich and soft versions are the same formula in two textures, and texture is the only decision. Rich suits drier skin, colder months and night use, where a heavier occlusive layer actually helps rather than sits.","advantageZh":"丰润版和轻盈版是同一个配方的两种质地，唯一要决定的就是质地。丰润适合偏干的皮肤、更冷的季节和夜间使用，这些情况下更厚的封闭层是真的有用，而不是浮在脸上。","who":"Drier or mature skin, winter, and night application.","whoZh":"偏干或熟龄肌、冬季，以及夜间使用。"},"artistry-longxevity-soft-cream":{"advantage":"Same formula as the rich cream in a lighter texture. Combination and oilier skin, warmer climates and daytime layering under sunscreen are where the soft version is the correct choice, not the weaker one.","advantageZh":"与丰润版同配方，质地更轻。混合偏油的皮肤、温暖气候、以及白天叠在防晒下面，这些情况下轻盈版是正确选择，不是弱化版。","who":"Combination or oilier skin, humid climates, and daytime use.","whoZh":"混合或偏油肌、湿热气候，以及白天使用。"},"artistry-men-post-shave-toner":{"advantage":"Shaving is controlled exfoliation done with a blade, which is why post-shave irritation is a barrier problem, not a fragrance problem. Alcohol-forward aftershaves make that worse; a calming toner addresses it.","advantageZh":"刮胡子本质上是用刀片做的一次可控去角质，所以刮后刺痛是屏障问题，不是香味问题。以酒精为主的须后水只会加重它，而舒缓型爽肤水才是对症的。","who":"Men who shave most days, especially with sensitive skin or ingrown hairs.","whoZh":"几乎每天刮胡子的男性，尤其是敏感肌或者容易长内生须的人。"},"artistry-men-facial-moisturizer":{"advantage":"Men's skin is measurably thicker with higher sebum output, so the formulation target is hydration without a heavy finish. The reason men skip moisturiser is almost always how the last one felt, not scepticism.","advantageZh":"男性皮肤实测更厚、皮脂分泌更高，所以配方目标是补水但不厚重。男性不用面霜的原因，几乎总是上一支的肤感，而不是不认可。","who":"Men starting a routine, and anyone whose skin feels tight after washing.","whoZh":"刚开始护肤的男性，以及洗完脸觉得紧绷的人。"},"satinique-intensive-repair-shampoo":{"advantage":"Damaged hair is hair with a lifted cuticle, and cleansing is where you either smooth it back down or lift it further. For colour-treated or heat-styled hair, the shampoo choice matters more than the mask.","advantageZh":"受损发就是毛鳞片翘起的头发，而洗发这一步，要么把它抚平，要么把它掀得更开。对染烫或常用热工具的头发来说，洗发水的选择比发膜更关键。","who":"Colour-treated, bleached or daily heat-styled hair.","whoZh":"染过、漂过，或者每天用热工具造型的头发。"},"satinique-intensive-repair-conditioner":{"advantage":"Shampoo opens, conditioner closes. Using a repair shampoo without the matching conditioner leaves the cuticle open, which is why mixing lines often underperforms either line used properly.","advantageZh":"洗发水打开，护发素闭合。用了修护洗发水却不用配套护发素，毛鳞片就停在打开的状态，这也是为什么混用不同系列，效果常常不如任何一个系列用完整。","who":"Anyone using the Intensive Repair shampoo.","whoZh":"所有在用密集修护洗发水的人。"},"satinique-anti-hair-fall-shampoo":{"advantage":"Most visible hair fall is breakage part-way down the strand, not loss from the root. That distinction decides the fix: breakage responds to strand strength, root loss does not, and the shower drain looks identical either way.","advantageZh":"肉眼看到的掉发，多数是发丝中段的断裂，而不是从根部脱落。这个区分决定了怎么解决：断裂靠强化发丝有效，根部脱落无效，而地漏里看起来是一样的。","who":"People seeing more hair in the drain, especially with long or chemically treated hair.","whoZh":"发现地漏里头发变多的人，尤其是长发或者做过化学处理的。"},"satinique-anti-hair-fall-conditioner":{"advantage":"Strand strength is built where the conditioner sits, along the mid-length and ends, which is exactly where breakage happens. Skipping conditioner on fine hair to avoid weight is what leaves those ends brittle.","advantageZh":"发丝强度是在护发素停留的地方建立起来的，中段和发尾，而这正是断裂发生的位置。细软发为了怕塌而跳过护发素，结果就是发尾更脆。","who":"Anyone using the Anti-Hair Fall shampoo, particularly with fine hair.","whoZh":"所有在用防脱洗发水的人，尤其是细软发质。"},"satinique-anti-hair-fall-scalp-tonic":{"advantage":"A tonic goes on the scalp, not the hair, and stays there, which is the difference from a rinse-off product that has thirty seconds of contact. If a scalp is the actual issue, leave-on contact time is the whole mechanism.","advantageZh":"精华水是涂在头皮上而不是头发上，而且是留在上面的，这就是它和只有三十秒接触时间的冲洗类产品的区别。如果问题真的出在头皮，留驻的接触时长就是全部机理。","who":"People with a visibly widening part or thinning at the temples.","whoZh":"发缝明显变宽，或者两侧鬓角变稀的人。"},"satinique-anti-dandruff-shampoo":{"advantage":"Flaking is usually either a yeast overgrowth or a dry barrier, and they need opposite handling. If flakes are oily and yellowish it is the first; if they are fine and white with tightness it is the second, and washing more only helps one of them.","advantageZh":"头皮屑通常要么是马拉色菌过度增殖，要么是屏障干燥，这两种需要相反的处理。油腻发黄的屑是前者；细白干燥伴紧绷的是后者，而多洗几次只对其中一种有用。","who":"People with persistent flaking or an itchy scalp, especially in winter.","whoZh":"头皮屑反复、头皮发痒的人，冬天尤其明显。"},"satinique-purifying-conditioner":{"advantage":"Fine hair goes flat because conditioner reaches the roots. A purifying conditioner is formulated to condition the lengths while leaving the root area clean, which is a formulation problem, not a rinsing-technique problem.","advantageZh":"细软发扁塌，是因为护发素碰到了发根。清爽型护发素的配方目标是滋养中下段、让发根保持清爽，这是配方要解决的问题，不是冲洗手法能解决的。","who":"Fine or oily-root hair types who feel weighed down by regular conditioner.","whoZh":"细软发或者头皮容易出油、觉得普通护发素太压发的人。"},"satinique-smooth-moisture-conditioner-750ml":{"advantage":"The 750ml is the same product in a household size. For a family or anyone with long hair, the per-use cost drops enough that people stop rationing it, and under-using conditioner is a real reason routines fail.","advantageZh":"750ml是同款产品的家庭装。对一家人或者长发的人来说，单次成本降到不用再省着用，而护发素用量不足，确实是护理失败的一个真实原因。","who":"Families sharing one bottle, and anyone with long or thick hair.","whoZh":"共用一瓶的家庭，以及长发或发量多的人。"},"g-h-refresh-exfoliating-body-wash":{"advantage":"Rough patches on upper arms and thighs are usually keratin build-up in the follicle, and it responds to consistent gentle exfoliation rather than to lotion. People moisturise it for years and wonder why nothing changes.","advantageZh":"上臂和大腿上的粗糙颗粒，通常是毛囊口的角质堆积，它对持续温和的去角质有反应，对润肤露没有。很多人擦了好几年身体乳，纳闷为什么没变化。","who":"People with rough or bumpy upper arms, and anyone whose body lotion never seems to absorb.","whoZh":"上臂粗糙起颗粒的人，以及觉得身体乳总是吸收不了的人。"},"g-h-protect-hand-soap":{"advantage":"Handwashing is still the highest-return hygiene habit there is, and the reason people cut it short is dry cracked hands. Cracked skin is also broken barrier, so a soap that does not strip is doing two jobs.","advantageZh":"洗手仍然是回报率最高的卫生习惯，而人们敷衍了事的原因是手干裂。而裂开的皮肤本身就是屏障破损，所以一款不剥脱的洗手液，同时在做两件事。","who":"Households with kids, and anyone washing their hands twenty times a day.","whoZh":"有孩子的家庭，以及一天要洗二十次手的人。"},"g-h-protect-hand-sanitizer":{"advantage":"Sanitiser is for when soap and water are not available, not instead of them, and the practical variable is whether you have it on you. A bottle in the car and one in the school bag beats a better formula at home.","advantageZh":"免洗洗手液是在没有肥皂和水的时候用的，不是用来替代洗手，而真正起作用的变量是你身上有没有带。车里一瓶、书包里一瓶，胜过家里放一瓶更好的。","who":"Travel, commuting, school bags, and eating out.","whoZh":"出行、通勤、书包里，以及在外面吃饭。"},"g-h-protect-deodorant":{"advantage":"Antiperspirant and deodorant are two different mechanisms, one reduces sweat and one addresses odour, and most complaints come from buying the wrong one. Applying at night rather than morning also works better for the first mechanism.","advantageZh":"止汗和除臭是两个不同机理，一个减少出汗，一个处理气味，大多数不满意都来自买错了类型。另外，晚上涂比早上涂对止汗这个机理效果更好。","who":"Daily use, and anyone who has found other formulas irritating.","whoZh":"日常使用，以及用其他配方觉得刺激的人。"},"g-h-baby-wash-shampoo":{"advantage":"Baby skin barrier is thinner and more permeable than adult skin, so the standard for a baby product is what is left out, not what is added. Two-in-one also cuts bath time, which matters more than any brochure admits.","advantageZh":"婴儿皮肤屏障比成人更薄、通透性更高，所以婴儿产品的标准是它不含什么，而不是它加了什么。二合一还能缩短洗澡时间，这一点的重要性，任何宣传册都不会承认。","who":"Newborns through toddlers, and parents of children with reactive skin.","whoZh":"新生儿到幼儿，以及孩子皮肤容易起反应的父母。"},"g-h-baby-lotion":{"advantage":"The barrier-first approach to reactive baby skin is daily moisturising when the skin looks fine, not only when it flares. Waiting for a flare means you are always treating rather than preventing.","advantageZh":"对容易起反应的婴儿皮肤，屏障优先的做法是皮肤看起来好的时候也每天涂，而不是只在起疹时涂。等到起疹才涂，就永远在处理而不是在预防。","who":"Babies with dry or reactive skin, and daily use after bathing.","whoZh":"皮肤干燥或容易起反应的宝宝，以及洗澡后的日常使用。"},"glister-power-toothbrush-refill":{"advantage":"Bristles lose effectiveness at around three months, and worn bristles clean measurably worse while feeling the same. This is the cheapest item on this whole site and the one most people are overdue on.","advantageZh":"刷毛大约三个月后失去效力，磨损的刷毛清洁力实测明显下降，但手感没有区别。这是整个站上最便宜的一件东西，也是大多数人最该换而没换的一件。","who":"Anyone with the Glister power toothbrush whose last refill was more than three months ago.","whoZh":"用丽齿健电动牙刷、上次换头超过三个月的人。"},"amway-home-kitchen-cleaner":{"advantage":"Kitchen cleaning is a grease problem, and grease needs a surfactant rather than a disinfectant. The residue question matters more here than anywhere else in the house because these are the surfaces food touches.","advantageZh":"厨房清洁本质是油污问题，而油污需要的是表面活性剂，不是消毒剂。残留问题在厨房比家里任何地方都更重要，因为这些是食物会接触到的表面。","who":"Anyone who cooks at home, especially with high-heat or oil-heavy cooking.","whoZh":"在家做饭的人，尤其是爆炒或者用油多的做法。"},"amway-home-bathroom-cleaner":{"advantage":"Soap scum and limescale are mineral deposits, which is why a general-purpose spray smears them around instead of removing them. Dwell time is the other half: spray, wait, then wipe, rather than spray and wipe.","advantageZh":"皂垢和水垢是矿物沉积，这就是为什么万用喷雾只是把它们抹开而不是清掉。另一半是停留时间：喷、等、再擦，而不是喷完就擦。","who":"Hard-water areas, and anyone fighting the same shower door every week.","whoZh":"水质硬的地区，以及每周都在跟同一块淋浴玻璃较劲的人。"},"amway-home-automatic-dish-tablets":{"advantage":"Pre-rinsing actually makes most modern dishwasher detergents work worse, because the enzymes need food residue to bind to. A tablet also doses correctly every time, which powder does not.","advantageZh":"预冲洗其实会让多数现代洗碗机洗涤剂效果变差，因为其中的酶需要食物残渣去结合。而块状每次的投放量都是准的，粉状做不到。","who":"Households running a dishwasher daily.","whoZh":"每天用洗碗机的家庭。"},"espring-pre-filter":{"advantage":"A pre-filter catches sediment before it reaches the main cartridge, so the expensive part lasts closer to its rated life. On hard or sediment-heavy municipal water this is the cheapest way to protect the system.","advantageZh":"前置滤芯在泥沙到达主滤芯之前拦住它们，让贵的那一部分更接近额定寿命。在水质硬或泥沙多的市政供水下，这是保护整个系统最便宜的办法。","who":"eSpring owners, particularly on well water or in older buildings.","whoZh":"益之源用户，尤其是用井水或者住老楼的。"},"walking-to-bronze-bundle":{"advantage":"A starter bundle exists so a new IBO does not have to guess what to order in month one. It is assembled to hit the volume the first milestone requires with products that are genuinely used rather than stored.","advantageZh":"起步套装的存在，是为了让新IBO在第一个月不用猜该订什么。它的组合是为了达到第一个里程碑所需的业绩量，同时里面都是真正会用掉的产品，而不是囤着的。","who":"New IBOs in their first month, and anyone rebuilding a consistent monthly order.","whoZh":"第一个月的新IBO，以及正在重建稳定月订单的人。"},"artistry-hydrating-mousse-cleanser":{"advantage":"The cleanser is the step where most people accidentally make oily skin oilier. Harsh surfactants strip barrier lipids, the skin reads that as damage, and sebum output rises to compensate. A mousse format dilutes and distributes the surfactant before it touches the face, so it cleans without that rebound. If you only change one product in a routine, this is usually the one with the highest return.","advantageZh":"洁面是多数人不小心把油皮洗得更油的那一步。清洁力过强的表面活性剂会剥掉屏障脂质，皮肤把这个读成损伤，于是提高皮脂分泌来补偿。慕斯剂型在接触皮肤前就已经稀释并均匀分散了表面活性剂，所以洗得干净但不会引起反弹。如果一整套流程里只换一样东西，通常回报最高的就是这一支。","who":"Oily or breakout-prone skin that feels tight after washing, and anyone using acids or retinol who needs the barrier left intact.","whoZh":"洗完脸发紧的油性或痘痘肌，以及正在用酸类或A醇、需要保住屏障的人。"},"artistry-vitamin-c-ha3-daily-serum":{"advantage":"Two jobs in one bottle, and they are not the same job. Topical vitamin C works on the surface layers where an oral dose reaches poorly, slowing new pigment at the source, which is what keeps post-acne marks from deepening. The three hyaluronic acid molecular weights sit at different depths: large ones hold water at the surface, smaller ones carry it further in. That matters for oily skin, because dehydrated skin makes more oil, not less.","advantageZh":"一瓶里两件事，而且是两件不同的事。外用维C作用在口服很难充分抵达的表层，从源头减缓新色素生成，这正是让痘印不再变深的关键。三种分子量的玻尿酸停留在不同深度：大分子在表层锁水，小分子往里带水。这一点对油皮尤其重要，因为缺水的皮肤只会出更多油，不会更少。","who":"Anyone left with post-acne marks after the breakouts are handled, and oily skin that has been drying itself out.","whoZh":"痘痘控制住之后只剩痘印的人，以及一直在把自己越洗越干的油性皮肤。"}},"protocol":{"_note":"Snapshot of the Notion 🧭 调理地图 Protocol Map (DB 7d1e5d56-2a00-4680-b6f8-4c0f21f5eadc, ds 62fa2252-d5f8-4c85-b7ca-a35c3bcd3777). Only rows with 'Show on site' checked. Products are referenced by product NAME, resolved to site ids at build time. Areas not listed here fall back to the flat product grid.","stages":[{"key":"clear","zh":"清","glyph":"1","label":"Clear","labelZh":"清 · 先把出口打开","labelEnLong":"Clear the load","sub":"Take the load off before adding anything","subZh":"在补进去之前，先把负担卸掉","labelZhShort":"清负担"},{"key":"regulate","zh":"调","glyph":"2","label":"Regulate","labelZh":"调 · 让吸收变得有效","labelEnLong":"Regulate absorption","sub":"Make sure what you take actually gets used","subZh":"确保吃进去的东西真的用得上","labelZhShort":"促吸收"},{"key":"supplement","zh":"补","glyph":"3","label":"Replenish","labelZh":"补 · 给修复补上原料","labelEnLong":"Replenish the raw materials","sub":"Supply the raw materials repair needs","subZh":"把修复需要的原料供上","labelZhShort":"补原料"},{"key":"sustain","zh":"养","glyph":"4","label":"Sustain","labelZh":"养 · 守住已有的成果","labelEnLong":"Sustain the result","sub":"Protect the result so it holds","subZh":"护住结果，别让前面白做","labelZhShort":"守成果"}],"areas":{"skin":{"overview":"A pore becomes a pimple when four things line up: sebum runs high, the pore lining sheds faster than it clears and forms a plug, bacteria multiply in the trapped oil, and the whole thing inflames. Topical products act on the last two. The first two are set upstream, by insulin and IGF-1, by how much inflammatory load the gut is passing on, and by cortisol at night. That is why clearing the surface alone usually buys a few good weeks and then the same spots return. The four steps below run in that order on purpose: take the load off, make what you take in actually count, supply the materials repair needs, then protect the result.","overviewZh":"一个毛孔变成一颗痘，要四件事同时凑齐：油脂分泌偏高，毛孔内壁角质脱落快过排出、堵成栓子，细菌在闷住的油脂里大量繁殖，然后整个发炎。外用产品处理的是后两件。前两件是被上游决定的，决定它的是胰岛素和IGF-1、肠道往全身送出多少炎症负担、以及夜里的皮质醇。这就是为什么只清表面，通常能换来几周好转，然后同样的位置又回来。下面四步是有顺序的：先卸掉负担，再让吃进去的真的算数，然后把修复原料补上，最后守住结果。","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Carb Blocker","Prebiotic Fiber","Plant Protein Powder"],"why":"Start here because this is the best-evidenced diet link in acne. A high-glycemic meal spikes insulin, insulin raises IGF-1, and IGF-1 does two things at once: it tells sebaceous cells to make more oil, and it raises inflammatory signalling inside those same cells. In trials, two weeks of a low-glycemic-load diet measurably dropped IGF-1, and twelve weeks dropped lesion counts. You do not have to quit rice. You have to stop the spike: slow the starch, add fibre alongside it, and put protein where a refined-carb breakfast used to be.","key":"skin.clear.carb-blocker","whyZh":"从这里开始，因为这是痘痘领域证据最强的一条饮食链。一顿高升糖的饭把胰岛素顶上去，胰岛素抬高IGF-1，而IGF-1同时做两件事：让皮脂腺细胞多产油，并且提高这些细胞内部的炎症信号。临床试验里，低升糖负荷饮食两周就能实测降低IGF-1，十二周降低痘的数量。你不需要戒掉米饭，你需要的是掐掉那个尖峰：把淀粉的分解放慢，同一餐配上纤维，再把原来那份精致碳水早餐换成蛋白质。","productIds":["carb-blocker","prebiotic-fiber","plant-protein-powder"],"why_es":"Empieza aquí porque es el vínculo con la dieta que mejor evidencia tiene en acné. Una comida de índice glucémico alto dispara la insulina, la insulina sube el IGF-1, y el IGF-1 hace dos cosas a la vez: le dice a las células sebáceas que produzcan más aceite, y sube la señal inflamatoria dentro de esas mismas células. En ensayos, dos semanas de dieta de baja carga glucémica bajaron el IGF-1 de forma medible, y doce semanas bajaron el número de lesiones. No hace falta dejar el arroz. Hace falta cortar el pico: frena el almidón, acompáñalo de fibra, y pon proteína donde antes había un desayuno de carbohidrato refinado.","why_hi":"यहाँ से शुरू करें, क्योंकि मुँहासे में आहार का यही संबंध सबसे मज़बूत प्रमाणों वाला है। उच्च ग्लाइसेमिक भोजन इंसुलिन बढ़ाता है, इंसुलिन IGF-1 को ऊपर उठाता है, और IGF-1 एक साथ दो काम करता है: तेल ग्रंथियों से ज़्यादा तेल बनवाता है, और उन्हीं कोशिकाओं के भीतर सूजन के संकेत बढ़ाता है। परीक्षणों में, कम ग्लाइसेमिक भार वाले आहार के दो हफ़्तों में IGF-1 मापने लायक घटा, और बारह हफ़्तों में दानों की संख्या घटी। चावल छोड़ने की ज़रूरत नहीं। ज़रूरत है उस उछाल को रोकने की: स्टार्च को धीमा करें, उसी भोजन में फ़ाइबर जोड़ें, और जहाँ पहले रिफ़ाइंड कार्ब का नाश्ता था वहाँ प्रोटीन रखें।"},{"stage":"clear","rank":1,"route":"internal","products":["Probiotic","Green Superfood","Liver Support"],"why":"The second load is the gut. When the gut ecology tips, barrier permeability rises and metabolites that should have left the body get through instead, which raises inflammation everywhere, skin included. There is a second cost people miss: the same dysbiosis impairs absorption of zinc, selenium and omega-3, which are exactly the nutrients the repair stage depends on. So this is not only about clearing, it decides whether step three will work at all. Fibre carries out, probiotics rebuild, and the liver handles what the gut passes on.","key":"skin.clear.probiotic","whyZh":"第二个负担在肠道。肠道生态一旦失衡，肠壁通透性升高，本该排出体外的代谢物反而穿过屏障进入循环，全身的炎症水平随之上升，皮肤也在其中。还有一笔很多人漏掉的代价：同样的菌群失衡会损害锌、硒和Omega-3的吸收，而这几样恰恰是后面「补」那一步要用的原料。所以这一步不只是清，它决定了第三步能不能生效。纤维负责带走，益生菌负责重建，肝脏处理肠道递上来的那一部分。","productIds":["probiotic","green-superfood","liver-support"],"why_es":"La segunda carga es el intestino. Cuando la ecología intestinal se desequilibra, la permeabilidad de la barrera sube y metabolitos que deberían haber salido del cuerpo pasan al torrente, lo que eleva la inflamación en todas partes, piel incluida. Hay un segundo costo que la gente pasa por alto: esa misma disbiosis afecta la absorción de zinc, selenio y omega-3, que son justo los nutrientes de los que depende la etapa de reparación. Así que esto no es solo limpiar, decide si el paso tres va a funcionar. La fibra arrastra, los probióticos reconstruyen, y el hígado procesa lo que el intestino le pasa.","why_hi":"दूसरा बोझ आँत है। जब आँत का संतुलन बिगड़ता है, अवरोध की पारगम्यता बढ़ जाती है और जो चयापचय उत्पाद शरीर से निकल जाने चाहिए थे वे रक्त में लौट आते हैं, जिससे त्वचा सहित हर जगह सूजन बढ़ती है। एक दूसरी कीमत जो लोग चूक जाते हैं: वही असंतुलन ज़िंक, सेलेनियम और ओमेगा-3 के अवशोषण को बिगाड़ता है, और यही वे पोषक तत्व हैं जिन पर मरम्मत का चरण टिका है। इसलिए यह सिर्फ़ सफ़ाई नहीं है, यह तय करता है कि तीसरा चरण काम करेगा या नहीं। फ़ाइबर बाहर ले जाता है, प्रोबायोटिक्स फिर से बसाते हैं, और लिवर वह हिस्सा सँभालता है जो आँत आगे भेजती है।"},{"stage":"clear","rank":2,"route":"external","products":["Artistry Studio Rose All Day Anti-Acne Toner","Artistry Signature Select Purifying Mask"],"why":"External clearing deals with the plug that is already in the pore. The reason salicylic acid is the standard here and not something that sounds stronger: it is oil-soluble, so it can travel through the sebum filling the pore and break the plug up from the inside. A water-soluble acid stays on the surface and never reaches it. Use the toner across the whole face rather than only on the spot you can see, because the pore that becomes next week's pimple is already clogged today. Once a week is enough for the mask; over-cleansing raises oil output.","key":"skin.clear.artistry-studio-rose-all-day","whyZh":"外清处理的是已经堵在毛孔里的那个栓子。水杨酸之所以是这里的标准配置，而不是某个听起来更猛的成分，原因很具体：它是脂溶性的，能穿过填满毛孔的油脂，从内部把栓子瓦解掉。水溶性的酸只停在表面，根本到不了那里。爽肤水要全脸用，而不是只点你看得见的那颗，因为下周会冒出来的那个毛孔，今天已经堵上了。面膜每周一次足够，过度清洁反而会让出油更多。","productIds":["artistry-studio-rose-all-day-anti-acne-toner","artistry-signature-select-purifying-mask"],"why_es":"La limpieza externa se ocupa del tapón que ya está dentro del poro. La razón por la que el ácido salicílico es el estándar aquí, y no algo que suene más fuerte: es liposoluble, así que puede atravesar el sebo que llena el poro y deshacer el tapón desde dentro. Un ácido hidrosoluble se queda en la superficie y nunca llega. Usa el tónico en toda la cara y no solo en el grano que ya ves, porque el poro que será el grano de la semana que viene ya está tapado hoy. Con la mascarilla una vez por semana basta; limpiar de más aumenta la producción de aceite.","why_hi":"बाहरी सफ़ाई उस रुकावट को सँभालती है जो पहले से छिद्र में है। सैलिसिलिक एसिड यहाँ मानक क्यों है, किसी ज़्यादा ताक़तवर लगने वाली चीज़ के बजाय: यह वसा में घुलनशील है, इसलिए छिद्र भरे तेल के पार जाकर रुकावट को भीतर से तोड़ सकता है। पानी में घुलनशील एसिड सतह पर ही रह जाता है और वहाँ तक पहुँचता ही नहीं। टोनर पूरे चेहरे पर लगाएँ, सिर्फ़ उस दाने पर नहीं जो दिख रहा है, क्योंकि अगले हफ़्ते का दाना जिस छिद्र से निकलेगा वह आज ही बंद हो चुका है। मास्क हफ़्ते में एक बार काफ़ी है; ज़्यादा सफ़ाई से तेल और बढ़ता है।"},{"stage":"regulate","rank":1,"route":"internal","products":["Begin Daily GI Primer","Digestive Enzyme"],"why":"This stage is about conversion rate. Swallowing zinc, vitamin C and B vitamins is not the same as absorbing them, and poorly digested food left sitting in the gut adds back to the load you just spent step one reducing. For anyone who eats out most days or bloats after a big meal, skipping this step is why the supplements in step three underperform. The 6-in-1 folds clearing and regulating into one drink if you would rather not manage four bottles.","key":"skin.regulate.begin-daily-gi-primer","whyZh":"这一步管的是转化率。把锌、维生素C和B族吞下去，跟真正吸收进去是两件事；而消化不完全、滞留在肠道里的食物残渣，又会把你第一步刚卸掉的负担加回来。对于经常在外面吃、或者大餐后腹胀的人，跳过这一步，就是第三步的营养素效果打折的原因。如果不想同时管三四瓶，六合一把清和调压进一杯里。","productIds":["begin-daily-gi-primer","digestive-enzyme"],"why_es":"Esta etapa trata de la tasa de conversión. Tragarte el zinc, la vitamina C y las del grupo B no es lo mismo que absorberlos, y la comida mal digerida que se queda en el intestino vuelve a sumar a la carga que acabas de quitar en el paso uno. Para quien come fuera casi todos los días o se hincha después de una comida grande, saltarse este paso es la razón de que los suplementos del paso tres rindan menos. El 6 en 1 junta limpiar y regular en una sola bebida si prefieres no manejar cuatro frascos.","why_hi":"यह चरण रूपांतरण दर के बारे में है। ज़िंक, विटामिन सी और बी विटामिन निगल लेना और उन्हें सोख लेना दो अलग बातें हैं, और आँत में पड़ा अधपचा भोजन उसी बोझ को वापस जोड़ देता है जो आपने पहले चरण में हटाया था। जो लोग ज़्यादातर बाहर खाते हैं या भारी भोजन के बाद पेट फूलता है, उनके लिए इस चरण को छोड़ना ही वजह है कि तीसरे चरण के पोषक तत्व कम असर करते हैं। अगर चार डिब्बे सँभालना नहीं चाहते, तो 6-इन-1 सफ़ाई और नियमन को एक ही पेय में समेट देता है।"},{"stage":"regulate","rank":1,"route":"external","products":["Artistry Studio Spot On Dots","Artistry Studio Done with Zit"],"why":"A patch is not clearing anything, it is regulating how one lesion heals, which is why it sits here rather than in step one. It seals the spot into a moist, closed environment, keeps outside bacteria and air oxidation off an open surface, and physically stops you touching it. That last part matters most: picking is the single biggest cause of the mark left behind, and a mark outlasts the pimple by months. In a controlled trial, patched lesions scored better on crusting, redness, size and elevation. The spot gel is for the one that has not opened yet.","key":"skin.regulate.artistry-studio-spot-on-dots","whyZh":"痘痘贴不是在清理什么，它调控的是一颗痘的愈合环境，所以它放在这一步而不是第一步。它把这颗痘封成一个湿润的闭合环境，隔绝外界细菌和空气氧化，并且在物理上让你碰不到它。最后这一点最关键：抠，是留下痘印的头号原因，而痘印比痘本身要多留好几个月。在对照试验里，贴过的痘在结痂、泛红、大小和凸起这几项上评分都更好。凝胶留给还没破的那一颗。","productIds":["artistry-studio-spot-on-dots","artistry-studio-done-with-zit"],"why_es":"Un parche no está limpiando nada, está regulando cómo cicatriza una lesión, y por eso va aquí y no en el paso uno. Sella el grano en un ambiente húmedo y cerrado, mantiene fuera las bacterias y la oxidación del aire, y físicamente impide que te lo toques. Esto último es lo que más pesa: rascarse es la causa número uno de la marca que queda, y la marca dura meses más que el grano. En un ensayo controlado, las lesiones con parche puntuaron mejor en costra, enrojecimiento, tamaño y relieve. El gel es para el que todavía no ha abierto.","why_hi":"पैच कुछ साफ़ नहीं कर रहा, वह एक दाने के भरने का माहौल नियंत्रित कर रहा है, इसीलिए यह पहले चरण में नहीं यहाँ है। यह दाने को नम और बंद वातावरण में सील कर देता है, बाहरी बैक्टीरिया और हवा के ऑक्सीकरण को रोकता है, और शारीरिक रूप से आपको छूने नहीं देता। आखिरी बात सबसे अहम है: नोचना ही निशान पड़ने का सबसे बड़ा कारण है, और निशान दाने से महीनों ज़्यादा टिकता है। एक नियंत्रित परीक्षण में, पैच लगे दानों ने पपड़ी, लालिमा, आकार और उभार में बेहतर अंक पाए। जेल उस दाने के लिए है जो अभी फूटा नहीं।"},{"stage":"regulate","rank":1,"route":"external","products":["Artistry Hydrating Mousse Cleanser","Artistry Studio Glow Boss Cleanser + Exfoliator","Artistry Men Face Wash"],"why":"Cleansing is where most people make things worse without knowing. Harsh surfactants strip the barrier lipids, the skin reads that as damage, and sebum output goes up to compensate. So the person who washes four times a day to control oil ends up producing more of it. A mousse dilutes and distributes the surfactant before it reaches your face, which is the whole point of the format. Daily gentle exfoliation beats aggressive weekly scrubbing; pick the exfoliating one only if your skin is genuinely congested.","key":"skin.regulate.artistry-hydrating-mousse-cl","whyZh":"洗脸是多数人不知不觉把事情弄糟的地方。清洁力过强的表面活性剂会把屏障脂质剥掉，皮肤把这个读成损伤，于是提高皮脂分泌来补偿。结果就是：一天洗四次脸想控油的人，最后出油更多。慕斯剂型在接触皮肤之前就把表面活性剂稀释并分散开，这就是这个剂型存在的意义。每天温和去角质好过每周一次猛搓；只有在皮肤确实堵得厉害时，才选带磨砂的那一支。","productIds":["artistry-hydrating-mousse-cleanser","artistry-studio-glow-boss-cleanser-exfoliator","artistry-men-face-wash"],"why_es":"La limpieza es donde la mayoría empeora las cosas sin saberlo. Los tensioactivos agresivos arrancan los lípidos de la barrera, la piel lo lee como daño, y la producción de sebo sube para compensar. Así que quien se lava la cara cuatro veces al día para controlar el aceite termina fabricando más. Una mousse diluye y reparte el tensioactivo antes de que llegue a la cara, y ese es todo el sentido del formato. Exfoliar suave a diario le gana a frotar fuerte una vez por semana; elige el exfoliante solo si tu piel está de verdad congestionada.","why_hi":"सफ़ाई वही जगह है जहाँ ज़्यादातर लोग अनजाने में हालत बिगाड़ लेते हैं। तेज़ सर्फ़ैक्टेंट त्वचा अवरोध की वसा छीन लेते हैं, त्वचा इसे नुकसान समझती है, और भरपाई में तेल का उत्पादन बढ़ा देती है। यानी जो व्यक्ति तेल घटाने के लिए दिन में चार बार मुँह धोता है, वह और ज़्यादा तेल बनाने लगता है। मूस चेहरे तक पहुँचने से पहले ही सर्फ़ैक्टेंट को पतला और फैला देता है, और यही इस रूप का पूरा मक़सद है। हफ़्ते में एक बार ज़ोर से रगड़ने से बेहतर है रोज़ हल्का एक्सफ़ोलिएशन; स्क्रब वाला विकल्प तभी चुनें जब त्वचा वाकई बंद हो।"},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin B Complex 120ct"],"why":"If the breakouts sit on the nose folds, the T-zone and the chin, that is the classic B2 pattern. B2 maintains sebaceous gland and follicle function; without it sebum regulation drifts, pores clog and inflame. B3 belongs to the same story from the other end, and its shortfall shows up as the rough little bumps on the backs of the arms and along the jaw. B vitamins are water-soluble and clear in roughly a day, so they only work daily. Late nights burn B2 faster, which is why the nose goes first after a bad week.","key":"skin.supplement.vitamin-b-complex-120ct","whyZh":"如果痘集中在鼻唇沟、三角区和下巴，这是B2的典型分布。B2维护皮脂腺和毛囊的功能，缺了它，油脂分泌就会失调、毛孔堵塞、随即发炎。B3从另一头讲的是同一件事，它的不足表现为上臂外侧和下颌线上那些粗糙的小疙瘩。B族是水溶性的，大约一天就清空，所以它只有天天吃才有意义。熬夜会加速B2消耗，这就是为什么熬了糟糕的一周之后，先冒出来的往往是鼻子旁边那颗。","productIds":["vitamin-b-complex-120ct"],"why_es":"Si los granos se concentran en las aletas de la nariz, la zona T y el mentón, ese es el patrón clásico de la B2. La B2 mantiene la función de la glándula sebácea y del folículo; sin ella la regulación del sebo se descontrola, los poros se tapan y se inflaman. La B3 cuenta la misma historia desde el otro lado, y su falta aparece como esos bultitos ásperos en la parte de atrás de los brazos y a lo largo de la mandíbula. Las vitaminas B son hidrosolubles y se eliminan en aproximadamente un día, así que solo funcionan a diario. Trasnochar quema la B2 más rápido, y por eso después de una mala semana el primero en salir es el de al lado de la nariz.","why_hi":"अगर दाने नाक के किनारों, टी-ज़ोन और ठोड़ी पर केंद्रित हैं, तो यह बी2 का पहचाना हुआ पैटर्न है। बी2 तेल ग्रंथि और रोमकूप का कामकाज बनाए रखता है; इसके बिना तेल का नियंत्रण बिगड़ता है, छिद्र बंद होते हैं और सूजन आती है। बी3 उसी कहानी का दूसरा सिरा है, और इसकी कमी बाँहों के पिछले हिस्से और जबड़े की रेखा पर उन खुरदुरे छोटे दानों के रूप में दिखती है। बी विटामिन पानी में घुलनशील हैं और लगभग एक दिन में निकल जाते हैं, इसलिए ये रोज़ लेने पर ही काम करते हैं। देर रात जागना बी2 को तेज़ी से खर्च करता है, इसीलिए बुरे हफ़्ते के बाद सबसे पहले नाक के पास वाला दाना निकलता है।"},{"stage":"supplement","rank":1,"route":"internal","products":["Plant Protein Powder","Vitamin C Extended Release 180ct"],"why":"These two are one job: rebuilding. Skin turns over every day, and without enough protein the old cells shed but the new ones cannot be built. Vitamin C is the cofactor the body needs to actually assemble that protein into collagen, which is what decides whether a pitted mark fills back in. Vitamin C has a second, separate action: it inhibits tyrosinase, so it slows new pigment forming. Read that carefully, it keeps marks from getting darker rather than bleaching the ones you already have, which is why it only pays off as a daily habit.","key":"skin.supplement.plant-protein-powder","whyZh":"这两样其实是同一件事：重建。皮肤每天都在更新，蛋白质不够，旧细胞脱落了，新细胞造不出来。而维生素C是身体把这些蛋白质真正组装成胶原蛋白所需的辅因子，痘坑能不能填回来，取决于这一步。维生素C还有第二个独立作用：抑制酪氨酸酶，从源头减缓新色素的生成。这句话要读仔细，它管的是让痘印不再变深，而不是把已有的印漂掉，所以它只有当成每日习惯才划算。","productIds":["plant-protein-powder","vitamin-c-extended-release-180ct"],"why_es":"Estos dos son un mismo trabajo: reconstruir. La piel se renueva todos los días, y sin suficiente proteína las células viejas se caen pero las nuevas no se pueden fabricar. La vitamina C es el cofactor que el cuerpo necesita para ensamblar esa proteína en colágeno, que es lo que decide si una marca hundida se rellena. La vitamina C tiene una segunda acción, distinta: inhibe la tirosinasa, así que frena la formación de pigmento nuevo. Léelo con cuidado, evita que las marcas se oscurezcan más, no blanquea las que ya tienes, y por eso solo rinde como hábito diario.","why_hi":"ये दोनों एक ही काम हैं: पुनर्निर्माण। त्वचा हर दिन बदलती है, और पर्याप्त प्रोटीन के बिना पुरानी कोशिकाएँ झड़ती हैं पर नई बन नहीं पातीं। विटामिन सी वह सहकारक है जिसकी शरीर को उस प्रोटीन को कोलेजन में जोड़ने के लिए ज़रूरत होती है, और यही तय करता है कि गड्ढेदार निशान भरेगा या नहीं। विटामिन सी का एक अलग, दूसरा काम भी है: यह टायरोसिनेज़ को रोकता है, जिससे नया रंगद्रव्य बनना धीमा होता है। इसे ध्यान से पढ़ें, यह निशानों को और गहरा होने से रोकता है, पहले से मौजूद निशान मिटाता नहीं, इसीलिए यह सिर्फ़ रोज़ की आदत के रूप में फ़ायदा देता है।"},{"stage":"supplement","rank":2,"route":"external","products":["Artistry Vitamin C + HA3 Daily Serum"],"why":"Oral and topical vitamin C are not interchangeable, which is why this sits beside the tablet rather than instead of it. Swallowed vitamin C is distributed by the bloodstream and reaches the outer skin layers poorly; applied vitamin C lands directly where the pigment is being made. Use them together and you are working the same tyrosinase step from both sides. The three hyaluronic acid weights are the second half of the bottle: large molecules hold water at the surface, smaller ones carry it deeper, and hydrated skin produces less oil, not more.","key":"skin.supplement.artistry-vitamin-c-ha3-daily","whyZh":"口服维C和外用维C不能互相替代，所以这一条是放在药片旁边，而不是取而代之。吞下去的维C靠血液分配，到达皮肤外层的量很有限；涂上去的维C则直接落在色素正在生成的地方。两者一起用，等于从内外两侧作用在同一个酪氨酸酶环节上。三种分子量的玻尿酸是这瓶里的另一半：大分子在表层锁水，小分子往深处带，而水分充足的皮肤出油会更少，不是更多。","productIds":["artistry-vitamin-c-ha3-daily-serum"],"why_es":"La vitamina C oral y la tópica no son intercambiables, y por eso esta va al lado de la pastilla y no en su lugar. La que tragas se reparte por el torrente sanguíneo y llega mal a las capas externas de la piel; la que aplicas aterriza justo donde se está fabricando el pigmento. Usadas juntas, estás trabajando el mismo paso de la tirosinasa desde los dos lados. Los tres pesos moleculares de ácido hialurónico son la otra mitad del frasco: las moléculas grandes retienen agua en la superficie, las pequeñas la llevan más adentro, y una piel hidratada produce menos aceite, no más.","why_hi":"मुँह से ली गई और त्वचा पर लगाई गई विटामिन सी एक-दूसरे की जगह नहीं ले सकतीं, इसीलिए यह गोली के बदले नहीं, उसके साथ रखी गई है। निगली गई विटामिन सी रक्त के ज़रिए बँटती है और त्वचा की बाहरी परतों तक कम पहुँचती है; लगाई गई विटामिन सी सीधे वहीं उतरती है जहाँ रंगद्रव्य बन रहा है। दोनों साथ इस्तेमाल करने पर आप उसी टायरोसिनेज़ चरण पर दोनों तरफ़ से काम कर रहे होते हैं। तीन आणविक भार वाला हाइलुरोनिक एसिड इस बोतल का दूसरा आधा है: बड़े अणु सतह पर पानी रोकते हैं, छोटे उसे गहराई तक ले जाते हैं, और नमी वाली त्वचा कम तेल बनाती है, ज़्यादा नहीं।"},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin E Chewable"],"why":"This is the most specific mechanism on the page, and the one almost nobody explains. Acne skin produces roughly twice as much squalene as clear skin. Squalene itself is harmless; oxidised squalene is not, and its peroxide by-products are directly comedogenic and inflammatory. Measurements in acne patients show exactly that pattern: squalene peroxides up in the sebum, vitamin E and vitamin A down in the plasma. Vitamin E is the fat-phase antioxidant that sits inside that oil and stops the peroxidation. The lecithin alongside it is the same phospholipid your cell membranes are built from: an intact membrane holds water in and the cell stays a grape, a damaged one leaks and it becomes a raisin. That is also why topical moisturiser alone only goes so far.","key":"skin.supplement.vitamin-e-chewable","whyZh":"这是整页里最具体的一条机制，也是几乎没人讲清楚的一条。痘痘肌分泌的角鲨烯大约是健康皮肤的两倍。角鲨烯本身无害，但氧化后的角鲨烯不是，它的过氧化产物直接具有致粉刺性和促炎性。在痘痘患者身上实测到的正是这个组合：皮脂里角鲨烯过氧化物升高，血浆里维生素E和维生素A降低。维生素E是驻守在油脂相里的抗氧化剂，它的位置就在那层油里，作用就是阻止这个氧化过程。同时配的卵磷脂，与细胞膜的磷脂成分相同：膜完整，水分锁得住，细胞是饱满的葡萄；膜破损，水从里面跑掉，就成了葡萄干。这也解释了为什么只靠外用保湿，效果总是有限。","productIds":["vitamin-e-chewable"],"why_es":"Este es el mecanismo más concreto de toda la página, y el que casi nadie explica. La piel con acné produce alrededor del doble de escualeno que la piel limpia. El escualeno en sí es inofensivo; el escualeno oxidado no lo es, y sus peróxidos son directamente comedogénicos e inflamatorios. Las mediciones en pacientes con acné muestran exactamente ese patrón: peróxidos de escualeno altos en el sebo, vitamina E y vitamina A bajas en plasma. La vitamina E es el antioxidante de fase grasa que se aloja dentro de ese aceite y frena la peroxidación. La lecitina que la acompaña es el mismo fosfolípido con el que están hechas tus membranas celulares: con la membrana intacta la célula retiene agua y es una uva; con la membrana dañada se escapa y queda una pasa. Eso también explica por qué la hidratación tópica sola llega hasta cierto punto.","why_hi":"यह पूरे पन्ने का सबसे ठोस तंत्र है, और वही जिसे लगभग कोई नहीं समझाता। मुँहासे वाली त्वचा साफ़ त्वचा से लगभग दोगुना स्क्वैलीन बनाती है। स्क्वैलीन अपने आप में हानिरहित है; ऑक्सीकृत स्क्वैलीन नहीं, और उसके परॉक्साइड सीधे छिद्र बंद करने वाले और सूजन बढ़ाने वाले हैं। मुँहासे के रोगियों में की गई माप ठीक यही तस्वीर दिखाती है: सीबम में स्क्वैलीन परॉक्साइड ऊँचा, रक्त प्लाज़्मा में विटामिन ई और विटामिन ए नीचा। विटामिन ई वह वसा-चरण एंटीऑक्सिडेंट है जो उसी तेल के भीतर बैठकर इस ऑक्सीकरण को रोकता है। साथ मिला लेसिथिन वही फ़ॉस्फ़ोलिपिड है जिससे आपकी कोशिका झिल्ली बनी है: झिल्ली सही हो तो कोशिका पानी रोके रखती है और अंगूर जैसी रहती है; झिल्ली टूटे तो पानी निकल जाता है और वह किशमिश बन जाती है। यही समझाता है कि सिर्फ़ बाहरी मॉइस्चराइज़र एक हद तक ही काम क्यों करता है।"},{"stage":"supplement","rank":2,"route":"internal","products":["Advanced Omega"],"why":"Omega-3 works on two of the four steps at once: it slows the hyperkeratinisation that forms the plug, and it lowers leukotriene B4, one of the signals that turns a clogged pore into an inflamed one. The reason this is almost always a real gap is the ratio, not the absence: modern diets carry plenty of omega-6 and very little omega-3, and the balance between them is what sets the inflammatory tone. If you rarely eat oily fish, assume the gap is there.","key":"skin.supplement.advanced-omega","whyZh":"Omega-3 同时作用在四步中的两步：它减缓形成栓子的角化过度，并且降低白三烯B4，那是把一个堵住的毛孔推向发炎的信号之一。这一项之所以几乎总是真实存在的缺口，问题不在于完全没有，而在于比例：现代饮食里Omega-6很多、Omega-3很少，而决定炎症基调的正是两者的比例。如果你很少吃深海鱼，就默认这个缺口存在。","productIds":["advanced-omega"],"why_es":"El omega-3 actúa sobre dos de los cuatro pasos a la vez: frena la hiperqueratinización que forma el tapón, y baja el leucotrieno B4, una de las señales que convierte un poro tapado en uno inflamado. La razón de que casi siempre haya aquí un hueco real es la proporción, no la ausencia: la dieta moderna trae mucho omega-6 y muy poco omega-3, y el equilibrio entre ambos es lo que fija el tono inflamatorio. Si rara vez comes pescado azul, da por hecho que el hueco está.","why_hi":"ओमेगा-3 चार में से दो चरणों पर एक साथ काम करता है: यह उस अति-केराटिनीकरण को धीमा करता है जो रुकावट बनाती है, और ल्यूकोट्रीन बी4 घटाता है, जो बंद छिद्र को सूजे हुए छिद्र में बदलने वाले संकेतों में से एक है। यहाँ कमी लगभग हमेशा असली क्यों होती है, इसकी वजह अनुपात है, अनुपस्थिति नहीं: आधुनिक आहार में ओमेगा-6 बहुत है और ओमेगा-3 बहुत कम, और सूजन का स्तर इन दोनों का संतुलन तय करता है। अगर आप शायद ही कभी तैलीय मछली खाते हैं, तो मान लें कि कमी मौजूद है।"},{"stage":"supplement","rank":2,"route":"internal","products":["Immunity Defense Zinc + Holy Basil","Vitamin D"],"why":"Both of these show up as measured shortfalls rather than theory. Serum zinc runs lower in people with acne than in controls, and lowest in the most severe grades; trials adding zinc report fewer inflammatory lesions. Vitamin D follows the same shape: deficiency is roughly twice as common in acne patients as in matched controls, and levels track inversely with severity. Neither is a treatment. Both are worth closing if the gap is yours, and vitamin D is one of the few things here a blood panel can actually tell you about.","key":"skin.supplement.immunity-defense-zinc-holy-b","whyZh":"这两样都是实测出来的缺口，不是推论。痘痘人群的血清锌水平低于对照组，而且分级越重的人越低；补锌的试验报告炎症性皮损减少。维生素D是同样的形状：痘痘人群的缺乏率大约是对照组的两倍，血清水平与严重程度呈负相关。两者都不是治疗手段。但如果这个缺口在你身上，就值得补上；而且维生素D是这一页里少数几个抽血就能看清楚的指标之一。","productIds":["immunity-defense-zinc-holy-basil","vitamin-d"],"why_es":"Los dos aparecen como carencias medidas, no como teoría. El zinc en suero es más bajo en personas con acné que en controles, y más bajo aún en los grados más severos; los ensayos que añaden zinc reportan menos lesiones inflamatorias. La vitamina D sigue la misma forma: la deficiencia es aproximadamente el doble de común en pacientes con acné que en controles comparables, y los niveles se mueven en sentido contrario a la severidad. Ninguno es un tratamiento. Los dos vale la pena cerrarlos si el hueco es tuyo, y la vitamina D es de las pocas cosas de esta página que un análisis de sangre sí te puede decir.","why_hi":"ये दोनों सिद्धांत नहीं, मापी गई कमियाँ हैं। मुँहासे वाले लोगों में रक्त का ज़िंक स्तर तुलना समूह से कम रहता है, और सबसे गंभीर श्रेणियों में सबसे कम; ज़िंक जोड़ने वाले परीक्षणों में सूजन वाले घाव कम पाए गए। विटामिन डी की तस्वीर भी वैसी ही है: मुँहासे के रोगियों में कमी लगभग दोगुनी आम है, और स्तर गंभीरता के उल्टे चलता है। दोनों में से कोई इलाज नहीं है। पर अगर यह कमी आपमें है तो इसे पूरा करना सार्थक है, और विटामिन डी इस पन्ने की उन गिनी-चुनी चीज़ों में है जिसे खून की जाँच सचमुच बता सकती है।"},{"stage":"supplement","rank":3,"route":"internal","products":["Concentrated Fruits & Vegetables","Calcium Magnesium D"],"why":"Two supporting lines. Plant antioxidants work in the water phase where vitamin E works in the oil phase, and the carotenoid families are also where the body sources vitamin A, the other nutrient measured low in acne plasma. Calcium and magnesium are here for a different reason: they maintain neuromuscular excitability, and when they are short the body will not release even after you lie down. Across the 72 client assessments we have on file, 77% of acne cases also reported chronic late nights, and skin repair happens overnight.","key":"skin.supplement.concentrated-fruits-vegetabl","whyZh":"两条辅助线。植物抗氧化物工作在水相，而维生素E工作在油相，两者互补；而类胡萝卜素家族同时也是身体获取维生素A的来源，那是痘痘人群血浆里另一个被测出偏低的营养素。钙镁放在这里是另一个理由：它们维持神经肌肉的兴奋性，缺的时候人躺下了也放松不下来。在我们手上的72份健康评估里，77%的痘痘案例同时存在长期晚睡，而皮肤的修复发生在夜里。","productIds":["concentrated-fruits-vegetables","calcium-magnesium-d"],"why_es":"Dos líneas de apoyo. Los antioxidantes vegetales trabajan en la fase acuosa donde la vitamina E trabaja en la fase grasa, y las familias de carotenoides son además de donde el cuerpo obtiene vitamina A, el otro nutriente que se mide bajo en el plasma con acné. El calcio y el magnesio están aquí por otro motivo: mantienen la excitabilidad neuromuscular, y cuando faltan el cuerpo no se suelta ni después de acostarse. En las 72 evaluaciones de salud que tenemos registradas, el 77 por ciento de los casos de acné también reportaba trasnochar de forma habitual, y la piel se repara de noche.","why_hi":"दो सहायक कड़ियाँ। पादप एंटीऑक्सिडेंट जल-चरण में काम करते हैं जबकि विटामिन ई वसा-चरण में, और कैरोटीनॉयड परिवार वही स्रोत भी है जहाँ से शरीर विटामिन ए लेता है, वह दूसरा पोषक तत्व जो मुँहासे में रक्त प्लाज़्मा में कम मापा जाता है। कैल्शियम और मैग्नीशियम यहाँ किसी और वजह से हैं: ये तंत्रिका-मांसपेशी की उत्तेजना बनाए रखते हैं, और इनकी कमी में शरीर लेटने के बाद भी शिथिल नहीं हो पाता। हमारे पास दर्ज 72 स्वास्थ्य आकलनों में, मुँहासे के 77 प्रतिशत मामलों में लगातार देर रात जागना भी दर्ज था, और त्वचा की मरम्मत रात में होती है।"},{"stage":"sustain","rank":1,"route":"external","products":["Artistry Multi-Defense UV Protect SPF50","Artistry Hydrating Day Lotion SPF30"],"why":"Sunscreen is usually sold to acne-prone skin as mark protection, and that undersells it. UV generates reactive oxygen species in the skin, and those are what oxidise the squalene in your sebum into the comedogenic by-products from the replenish stage. So this step is not only protecting the result, it is cutting off one of the sources upstream. Texture is the whole decision here: a heavy sunscreen clogs pores and sends you back to step one, which is why a lightweight formula that layers without pilling is the one that actually gets worn.","key":"skin.sustain.artistry-multi-defense-uv-pr","whyZh":"防晒卖给油痘肌的时候，通常被说成是保护痘印不变深，这个说法把它讲小了。紫外线在皮肤里产生活性氧，而正是这些活性氧把你皮脂中的角鲨烯氧化成「补」那一步讲的致粉刺产物。所以这一步不只是守住成果，它同时切断了上游的一个源头。这里唯一要决定的是肤感：厚重的防晒本身堵毛孔，那就又回到第一步了，所以能真正被涂上脸的，是那支轻盈、能叠涂而不搓泥的。","productIds":["artistry-multi-defense-uv-protect-spf50","artistry-hydrating-day-lotion-spf30"],"why_es":"El protector solar se le vende a la piel con acné como protección contra las marcas, y eso lo deja corto. La radiación UV genera especies reactivas de oxígeno en la piel, y son justamente esas las que oxidan el escualeno de tu sebo hasta los subproductos comedogénicos de la etapa de reposición. Así que este paso no solo protege el resultado, corta una de las fuentes que están más arriba. Aquí la textura lo decide todo: un protector pesado tapa los poros y te devuelve al paso uno, por eso el que de verdad se usa es la fórmula ligera que se superpone sin apelmazarse.","why_hi":"मुँहासे वाली त्वचा को सनस्क्रीन अक्सर निशान बचाने के नाम पर बेचा जाता है, और यह उसे छोटा कर देता है। पराबैंगनी किरणें त्वचा में सक्रिय ऑक्सीजन कण बनाती हैं, और वही कण आपके सीबम के स्क्वैलीन को उन छिद्र-अवरोधक उत्पादों में बदलते हैं जिनकी बात पुनःपूर्ति चरण में हुई। इसलिए यह चरण सिर्फ़ नतीजा नहीं बचाता, यह ऊपर के एक स्रोत को भी काटता है। यहाँ सब कुछ बनावट पर टिका है: भारी सनस्क्रीन खुद छिद्र बंद करती है और आपको पहले चरण पर लौटा देती है, इसीलिए असल में वही लगती है जो हल्की हो और परत पर परत लगने पर लुढ़के नहीं।"},{"stage":"sustain","rank":1,"route":"external","products":["Artistry Sleeping Mask","Artistry Correcting Serum"],"why":"Water-oil balance is the part oily skin gets backwards. Dehydrated skin does not produce less oil, it produces more, because the barrier reads dryness as damage. Hydration and oil control are the same project, not opposites. Overnight is when to do it: skin repair peaks while you sleep, so a leave-on mask is working with the window rather than against the day. The correcting serum is for the stage after, when the acne is handled and what is left is the marks, which are pigment rather than scars and will respond given enough weeks.","key":"skin.sustain.artistry-sleeping-mask","whyZh":"水油平衡是油性皮肤最容易搞反的一环。缺水的皮肤不会少出油，而是会出更多油，因为屏障把干燥读成了损伤。补水和控油是同一个工程，不是对立面。而做这件事的时间是夜里：皮肤修复在睡眠中达到峰值，所以免洗的睡眠面膜是顺着这个修复窗口在做事，而不是跟白天硬碰硬。焕颜精华留给下一个阶段，痘控制住了、只剩痘印的时候，那是色素沉着而不是疤痕，给够周数它是会退的。","productIds":["artistry-sleeping-mask","artistry-correcting-serum"],"why_es":"El equilibrio agua-aceite es la parte que la piel grasa entiende al revés. La piel deshidratada no produce menos aceite, produce más, porque la barrera lee la sequedad como daño. Hidratar y controlar el aceite son el mismo proyecto, no opuestos. El momento es de noche: la reparación de la piel llega a su pico mientras duermes, así que una mascarilla que se queja puesta trabaja con esa ventana en lugar de pelearse con el día. El sérum corrector es para la etapa siguiente, cuando el acné ya está controlado y lo que queda son las marcas, que son pigmento y no cicatriz, y responden si se les dan suficientes semanas.","why_hi":"पानी और तेल का संतुलन वही हिस्सा है जिसे तैलीय त्वचा उल्टा समझती है। निर्जलित त्वचा कम तेल नहीं बनाती, ज़्यादा बनाती है, क्योंकि अवरोध सूखेपन को नुकसान समझ लेता है। नमी देना और तेल नियंत्रित करना एक ही काम है, विपरीत नहीं। समय रात का है: त्वचा की मरम्मत नींद में चरम पर होती है, इसलिए बिना धोए छोड़ा जाने वाला स्लीपिंग मास्क उसी खिड़की के साथ काम करता है, दिन से लड़ने के बजाय। करेक्टिंग सीरम अगले चरण के लिए है, जब मुँहासे नियंत्रण में हों और सिर्फ़ निशान बचे हों, जो घाव नहीं बल्कि रंगद्रव्य हैं और पर्याप्त हफ़्ते मिलने पर हल्के पड़ते हैं।"},{"stage":"sustain","rank":2,"route":"habit","products":["Sleep Gummies","Organics Ashwagandha Capsules"],"why":"Sleep is the free half of this plan, and the mechanism is more specific than people assume. Sebaceous cells carry receptors for corticotropin-releasing hormone, the stress signal. CRH does two things when it binds: it raises sebum output, and it activates the enzyme that converts precursors into active androgens, which raises sebum again. Skin sampled from acne-involved areas shows markedly stronger CRH receptor expression than clear skin on the same person. That is the mechanism behind breaking out after a bad week. Neither of these replaces going to bed earlier; they only help you land that step.","key":"skin.sustain.sleep-gummies","whyZh":"睡眠是这套方案里免费的那一半，而它的机制比多数人以为的要具体。皮脂腺细胞上带有促肾上腺皮质激素释放激素（CRH，也就是压力信号）的受体。CRH结合上去之后做两件事：提高皮脂分泌，并激活把前体转化为活性雄激素的那个酶，于是皮脂再一次上升。取自痘痘部位的皮肤样本，其CRH受体表达明显强于同一个人身上没长痘的皮肤。这就是压力大的一周之后爆痘的机制。这两样都不能替代早睡，它们只是帮你把早睡这一步落地。","productIds":["sleep-gummies","organics-ashwagandha-capsules"],"why_es":"El sueño es la mitad gratis de este plan, y el mecanismo es más concreto de lo que la gente supone. Las células sebáceas llevan receptores para la hormona liberadora de corticotropina, la señal de estrés. Cuando se une, la CRH hace dos cosas: sube la producción de sebo, y activa la enzima que convierte precursores en andrógenos activos, lo que vuelve a subir el sebo. La piel tomada de zonas con acné muestra una expresión de estos receptores mucho más fuerte que la piel limpia de la misma persona. Ese es el mecanismo detrás de brotar después de una mala semana. Ninguno de estos dos sustituye acostarse antes; solo te ayudan a aterrizar ese paso.","why_hi":"नींद इस योजना का मुफ़्त वाला आधा हिस्सा है, और इसका तंत्र लोगों की धारणा से कहीं ज़्यादा ठोस है। तेल ग्रंथि की कोशिकाओं पर कॉर्टिकोट्रोपिन-रिलीज़िंग हार्मोन, यानी तनाव संकेत, के ग्राही होते हैं। जुड़ते ही CRH दो काम करता है: सीबम का उत्पादन बढ़ाता है, और उस एंज़ाइम को सक्रिय करता है जो पूर्ववर्ती अणुओं को सक्रिय एंड्रोजन में बदलता है, जिससे सीबम फिर बढ़ता है। मुँहासे वाले हिस्सों से ली गई त्वचा में इन ग्राहियों की अभिव्यक्ति उसी व्यक्ति की साफ़ त्वचा से कहीं अधिक मिलती है। बुरे हफ़्ते के बाद दाने निकलने का यही तंत्र है। इनमें से कोई भी जल्दी सोने की जगह नहीं ले सकता; ये सिर्फ़ उस कदम को उतारने में मदद करते हैं।"}],"overview_es":"Un poro se convierte en grano cuando coinciden cuatro cosas: el sebo sube, el revestimiento del poro se descama más rápido de lo que se elimina y forma un tapón, las bacterias se multiplican en ese aceite atrapado, y todo se inflama. Los productos tópicos actúan sobre las dos últimas. Las dos primeras se deciden más arriba: por la insulina y el IGF-1, por cuánta carga inflamatoria está pasando el intestino, y por el cortisol de la noche. Por eso limpiar solo la superficie compra unas buenas semanas y luego vuelven los mismos granos. Los cuatro pasos de abajo van en ese orden a propósito: quita la carga, haz que lo que tomas realmente cuente, aporta el material que la reparación necesita, y después protege el resultado.","overview_hi":"रोमछिद्र मुँहासा तब बनता है जब चार चीज़ें एक साथ आती हैं: तेल का बनना बढ़ जाता है, छिद्र की भीतरी परत निकलने से तेज़ी से झड़कर रुकावट बना देती है, फँसे हुए तेल में बैक्टीरिया बढ़ते हैं, और फिर सूजन आ जाती है। बाहरी उत्पाद केवल आखिरी दो पर काम करते हैं। पहली दो ऊपर से तय होती हैं: इंसुलिन और IGF-1 से, आँत कितना सूजन-भार आगे भेज रही है उससे, और रात के कोर्टिसोल से। इसीलिए सिर्फ़ सतह साफ़ करने से कुछ अच्छे हफ़्ते मिलते हैं और फिर वही दाने लौट आते हैं। नीचे दिए चार चरण जानबूझकर इसी क्रम में हैं: पहले बोझ हटाएँ, फिर जो लेते हैं वह वाकई काम आए यह सुनिश्चित करें, फिर मरम्मत का कच्चा माल दें, और अंत में नतीजे की रक्षा करें।","summary":{"title":"Breaking out again? First, when does it happen?","titleZh":"又冒痘了？先想想，一般什么时候冒？","sub":"Most of what turns a pore into a pimple happens before your face is involved. Pick the one that sounds like you.","subZh":"一个毛孔会不会变成痘，大部分在脸之外就决定了。选一个最像你的情况。","moments":[{"id":"sugar","icon":"bowl","label":"Breakouts after sugar or takeout","labelZh":"吃甜的、吃外卖就冒痘","visual":"sugar","what":"That is a sugar spike. Sweet drinks, white rice and takeout push your blood sugar up fast, insulin rises, and that tells your oil glands to make more oil and get inflamed. The pimple is set days before you see it.","whatZh":"这是血糖在冲高。奶茶、白米饭、外卖，让血糖一下子升上去，胰岛素跟着升，它会让皮脂腺出更多油，也更容易发炎。你看到那颗痘的时候，其实几天前就已经定了。","twist":"You do not have to quit rice. You just stop the spike: slow the starch, add fibre, and put protein where the sugary breakfast used to be.","twistZh":"你不用戒米饭，只要别让血糖冲那么高：碳水吃慢一点，加点纤维，早餐把甜的换成蛋白质。","fixes":[{"id":"carb-blocker","why":"Take it before a rice or noodle meal to block part of the starch, so less of it turns into sugar.","whyZh":"吃米饭面条之前吃，挡掉一部分淀粉，少变成一些糖。"},{"id":"prebiotic-fiber","why":"Stir it into water or coffee. Fibre slows the sugar down and keeps your gut in balance, and your skin shows what your gut is doing.","whyZh":"加进水或咖啡里就行。纤维让糖慢下来，也帮肠道保持平衡，而肠道好不好，皮肤看得出来。"},{"id":"plant-protein-powder","why":"Swap the sweet breakfast for a protein shake. No spike, and your skin gets the raw material it rebuilds with.","whyZh":"把甜的早餐换成一杯蛋白奶昔。血糖不冲高，皮肤更新也有了原料。"}]},{"id":"period","icon":"calendar","label":"Breakouts before your period","labelZh":"经期前，下巴一圈冒痘","visual":null,"what":"In the week before your period, hormones shift and oil output goes up, and it tends to show up along the jaw and chin. Because it comes on schedule, you can get ahead of it.","whatZh":"经期前一周，荷尔蒙在变化，出油跟着变多，痘痘常常冒在下巴和下颌线一带。好在它很准时，你可以提前做准备。","twist":"Start before it shows: the pore that becomes next week's pimple is already clogged today. And when one comes up, do not pick it, cover it.","twistZh":"在它冒出来之前就动手：下周要冒的那颗痘，今天毛孔就已经堵上了。真冒出来了也别挤，贴起来。","fixes":[{"id":"cycle-support","why":"A chasteberry formula for your monthly rhythm. Take it all month, not only on the bad days.","whyZh":"圣洁莓配方，照顾每个月的节律。整个月都吃，不是难受那几天才吃。"},{"id":"artistry-studio-rose-all-day-anti-acne-toner","why":"Salicylic acid dissolves in oil, so it gets inside the pore and breaks the plug up. Use it on the whole jaw, not just the spot.","whyZh":"水杨酸是溶于油的，能钻进毛孔把堵塞化开。整个下巴都擦，不只点在痘上。"},{"id":"artistry-studio-spot-on-dots","why":"Patch it overnight. It keeps your fingers off it, and picking is what leaves the mark.","whyZh":"晚上贴一片，手就碰不到它。留印子最大的原因，就是用手挤。"}]},{"id":"oily","icon":"drop","label":"Oily by noon, still breaking out","labelZh":"中午就出油，还一直冒痘","visual":null,"what":"Most people fight oil by washing harder, and that backfires. Stripping your skin makes it think it is damaged, so it makes more oil. Dehydrated skin does the same: it gets oilier, not drier.","whatZh":"很多人一出油就拼命洗，结果适得其反。洗得太干净，皮肤以为自己受伤了，反而出更多油。缺水的皮肤也一样，越缺水越油。","twist":"You do not have to wash more. Wash gentler and keep skin hydrated. If the spots sit on the nose, T-zone and chin, look at your B vitamins too.","twistZh":"不用洗更多次，而是洗得更温和，再把水补够。如果痘总长在鼻翼、T区和下巴，也看看B族够不够。","fixes":[{"id":"artistry-hydrating-mousse-cleanser","why":"A mousse cleans without stripping, so your skin stops making extra oil to make up for it.","whyZh":"慕斯质地洗得干净又不伤屏障，皮肤就不用拼命出油来补偿。"},{"id":"artistry-studio-rose-all-day-anti-acne-toner","why":"Oil-soluble salicylic acid clears the pores that are about to become the next pimple.","whyZh":"水杨酸溶于油，把快要变成下一颗痘的毛孔先清通。"},{"id":"vitamin-b-complex-120ct","why":"B2 keeps oil glands and pores working normally, and late nights burn through it. It only works taken daily.","whyZh":"维生素B2让皮脂腺和毛孔正常运作，熬夜消耗得特别快。要每天吃才有用。"}]},{"id":"marks","icon":"face","label":"Marks left after pimples","labelZh":"痘好了，印子还在","visual":null,"what":"Most of those marks are pigment left behind after inflammation, not scars. They can fade, but they outlast the pimple by months, and both picking and sun make them darker.","whatZh":"大部分痘印是发炎之后留下的色素，不是疤。它们会慢慢淡，只是比痘本身多留好几个月，而用手挤和晒太阳，都会让它更深。","twist":"Do not pick, patch it. Then protect it: sunscreen every day is what keeps a fading mark from coming back darker.","twistZh":"别挤，贴上。然后做好防护：每天擦防晒，正在变淡的印子才不会又变深。","fixes":[{"id":"artistry-studio-spot-on-dots","why":"Seals the spot and keeps your fingers off it. Fewer picked spots, fewer marks.","whyZh":"把痘封起来，手碰不到。挤得少，印子就少。"},{"id":"artistry-vitamin-c-ha3-daily-serum","why":"Vitamin C on the skin slows new pigment right where it forms, so marks stop getting darker.","whyZh":"维C直接擦在皮肤上，在色素生成的地方把它减慢，印子不会越来越深。"},{"id":"artistry-multi-defense-uv-protect-spf50","why":"Light enough to wear every day, even under makeup. Sun darkens marks and oxidises the oil in your pores.","whyZh":"够轻薄，天天擦、上妆也不搓泥。紫外线会让印子变深，还会让毛孔里的油脂氧化。"}]},{"id":"stress","icon":"bolt","label":"Stressed and breaking out","labelZh":"压力一大就爆痘","visual":null,"what":"Your oil glands have receptors for the stress signal. A bad week and short nights turn oil output up, which is why you break out right after a deadline. And skin does most of its repair while you sleep.","whatZh":"皮脂腺上有接收压力信号的受体。一周压力大、睡得少，出油量就被调高，所以一忙完就爆痘。而且皮肤主要是在你睡觉的时候修复的。","twist":"Sleep is the free half of this plan. Going to bed earlier does the work; these only help you get there.","twistZh":"睡眠是这套方案里免费的那一半。真正起作用的是早点睡，下面这些只是帮你睡得着。","fixes":[{"id":"organics-ashwagandha-capsules","why":"Helps your body handle stress, so you are not wired at bedtime. Give it a few weeks.","whyZh":"帮身体扛住压力，睡前不会又累又亢奋。给它几周时间。"},{"id":"calcium-magnesium-d","why":"Calcium and magnesium help your body actually let go once you lie down.","whyZh":"钙和镁帮身体在躺下之后真正放松下来。"},{"id":"artistry-sleeping-mask","why":"Skin repair peaks overnight. A no-rinse mask works with that window, even when you are tired at 11 pm.","whyZh":"皮肤晚上修复最旺。免洗的睡眠面膜正好用上这段时间，晚上11点再累也能涂。"}]},{"id":"dull","icon":"sparkle","label":"Dull, uneven skin","labelZh":"气色差、肤色不均","visual":null,"what":"Your skin rebuilds itself every day, and it builds with protein. Without enough of it, old cells shed but new ones cannot be built well. Vitamin C is what turns that protein into collagen.","whatZh":"皮肤每天都在更新，用的原料就是蛋白质。蛋白质不够，旧细胞掉了，新的却长不好。维C则负责把蛋白质组装成胶原蛋白。","twist":"Skincare works on the surface. The glow comes from what you feed your skin every day, so judge it in months, not days.","twistZh":"护肤品管的是表面，真正的好气色，来自你每天喂给皮肤的东西。所以按月看效果，不是按天。","fixes":[{"id":"plant-protein-powder","why":"21 g of protein a scoop, the raw material your skin rebuilds with.","whyZh":"一勺21克蛋白质，就是皮肤更新用的原料。"},{"id":"vitamin-c-extended-release-180ct","why":"Helps build collagen and slows new pigment. It only pays off as a daily habit.","whyZh":"帮身体合成胶原蛋白，也减慢新色素生成。每天吃才看得到回报。"},{"id":"vitamin-e-chewable","why":"Protects the oil in your skin from going off, so skin stays soft and calm.","whyZh":"保护皮肤里的油脂不被氧化，皮肤更柔软，也更安稳。"}]}],"doctor":"Painful deep lumps, scarring, acne with irregular periods or extra hair growth, or breakouts that are getting you down? See a doctor or dermatologist first.","doctorZh":"如果是又深又痛的硬包、已经留疤、痘痘同时伴有月经不规律或毛发变多，或者痘痘让你情绪很低落，请先去看医生或皮肤科。"}},"hormone":{"overview":"Cyclical breakouts along the jaw, premenstrual mood shifts and cycle-linked fatigue follow a monthly rhythm rather than a daily one. That rhythm is the clue. The liver is where used hormones are cleared, minerals are lost and reset every month, and cortisol competes for the same raw materials. Judge any change over three cycles, not three weeks.","overviewZh":"下颌线周期性长痘、经前情绪波动、跟着周期走的疲劳，遵循的是月节律而不是日节律。这个节律本身就是线索：用过的激素在肝里清掉，矿物质每个月流失一次再重来，而皮质醇跟性激素抢的是同一批原料。看效果要看三个周期，不是三周。","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Liver Support"],"why":"Used oestrogen has to be deactivated by the liver before it can leave the body. When liver capacity falls behind, hormones back up in the system, and what you see is the same few jawline spots before every period, along with mood swings and tenderness. So the first step in cyclical acne is not on the face, it is at the liver. It also explains why a topical can flatten one round and the same spot returns next month.","key":"hormone.clear.liver-support","whyZh":"用过的雌激素是经肝脏灭活之后才能排出的。肝的处理能力一旦跟不上，激素就堆在系统里，表现出来就是经前下颌线那几颗痘、情绪波动和胀痛。所以周期性痘痘的第一步不在脸上，在肝。这也解释了为什么外用能压住一次，下个月同一个位置又会回来。","productIds":["liver-support"]},{"stage":"regulate","rank":1,"route":"internal","products":["Cycle Support"],"why":"Chasteberry has the longest research history of any botanical used for cycle comfort. One usage point trips most people up: it is taken continuously through the month, not only on the difficult days, because the rhythm being supported is monthly rather than daily. By the same logic, judge it over three cycles, not three weeks.","key":"hormone.regulate.cycle-support","whyZh":"圣洁莓是周期类植物成分里研究历史最长的一味。用法上有一个关键点很多人做错：它要整月连续吃，而不是难受那几天才吃。因为你要支持的是一个月节律，不是一个日节律。同理，看效果要看三个周期，而不是三周。","productIds":["cycle-support"]},{"stage":"supplement","rank":1,"route":"internal","products":["Calcium Magnesium D"],"why":"A woman's monthly cycle carries out a batch of magnesium and iron, so the mineral deficit reopens every month rather than being filled once. Calcium and magnesium also maintain neuromuscular excitability, which maps directly onto cramping and premenstrual tension. This is the step least worth skipping in a cycle protocol.","key":"hormone.supplement.calcium-magnesium-d","whyZh":"女性每个月的生理周期都会带走一批镁和铁。这意味着女性的矿物质缺口是每月重新出现的，不是补一次就完事。而钙镁同时维持神经肌肉兴奋性，这直接对应经期绞痛和经前的紧绷感。所以这一步是周期方案里最不该省的一步。","productIds":["calcium-magnesium-d"]},{"stage":"supplement","rank":2,"route":"internal","products":["Vitamin B Complex 120ct"],"why":"B vitamins are water-soluble and cannot be stored, clearing in roughly 24 hours, so they have to be taken daily. On the cycle line specifically, B6 is involved in neurotransmitter synthesis and is the link most often cited for premenstrual mood shifts, while B2 maintains sebaceous gland and follicle function, which connects straight back to jawline breakouts. One bottle covers both lines.","key":"hormone.supplement.vitamin-b-complex-120ct","whyZh":"B 族是水溶性的，体内存不住，基本 24 小时清空，所以它必须每天补。对周期这条线而言，B6 参与神经递质合成，是经前情绪波动最常被提到的一个环节；而 B2 维护皮脂腺与毛囊功能，直接接回下颌线那几颗痘。一瓶盖两条线。","productIds":["vitamin-b-complex-120ct"]},{"stage":"supplement","rank":2,"route":"internal","products":["Iron & Folic Acid"],"why":"Iron is the other mineral carried out every month, which is why high iron is nearly impossible in menstruating women and fairly common in men. The same protocol should not be prioritised the same way for both. One caution: iron should not be supplemented blind. Check haemoglobin and ferritin on a blood panel first.","key":"hormone.supplement.iron-folic-acid","whyZh":"铁是另一个每月被带走的矿物质。这也是为什么女性铁超标几乎不可能，而男性反而常见偏高，同一套方案，男女优先级本来就不一样。要注意的是：铁不该盲补，先看体检里的血红蛋白和铁蛋白。","productIds":["iron-folic-acid"]},{"stage":"sustain","rank":3,"route":"internal","products":["Organics Ashwagandha Capsules"],"why":"Adaptogens are not sedatives; they moderate the cortisol response. Cortisol and the sex hormones share a synthesis pathway, and sustained pressure pulls capacity onto the cortisol side. That is why the months a cycle is most disrupted are usually also the most exhausting months. It sits in the Sustain stage because it addresses background load, not the symptom in front of you.","key":"hormone.sustain.organics-ashwagandha-capsule","whyZh":"适应原不是镇静剂，它调节的是皮质醇反应。而皮质醇和性激素共用一条合成原料链，长期高压会把这条链拿走。这就是为什么周期乱得最厉害的那几个月，往往也是最累的那几个月。放在「养」这一步，是因为它要解决的是背景类压力，不是当下症状。","productIds":["organics-ashwagandha-capsules"]}],"overview_es":"Los granos cíclicos en la mandíbula, los cambios de ánimo premenstruales y el cansancio ligado al ciclo siguen un ritmo mensual, no diario. Ese ritmo es la pista. El hígado es donde se depuran las hormonas ya usadas, los minerales se pierden y se reponen cada mes, y el cortisol compite por la misma materia prima. Evalúa cualquier cambio a lo largo de tres ciclos, no de tres semanas.","overview_hi":"जबड़े की रेखा पर चक्रीय दाने, माहवारी से पहले मूड में बदलाव और चक्र से जुड़ी थकान मासिक लय पर चलते हैं, दैनिक लय पर नहीं। यही लय संकेत है। इस्तेमाल हो चुके हार्मोन लिवर में साफ़ होते हैं, खनिज हर महीने घटते और फिर से भरते हैं, और कोर्टिसोल उसी कच्चे माल के लिए होड़ करता है। किसी भी बदलाव को तीन हफ़्तों में नहीं, तीन चक्रों में आँकें।","summary":{"title":"Same thing every month? First, when does it show up?","titleZh":"每个月都来这么一回？先想想，是什么时候出现的？","sub":"What follows your cycle runs on a monthly rhythm, and that rhythm is the clue. Pick the one that sounds like you.","subZh":"跟着月经走的问题，是按月的节律来的，这个节律本身就是线索。选一个最像你的。","moments":[{"id":"jaw","icon":"face","label":"Jawline breakouts before your period","labelZh":"经前下巴冒痘","visual":null,"what":"Every cycle, your liver has to switch off the used hormones before they can leave your body. When it falls behind, they back up, and you get the same few spots along your jaw every month, right on schedule.","whatZh":"每个周期用过的激素，都要先经过肝脏“关掉”，才能排出身体。肝一忙不过来，激素就在体内堆着，于是每个月下巴那几颗痘准时报到。","twist":"It is not your face wash. A spot cream can flatten this round, but the cause is inside, so start at the liver, not the face.","twistZh":"不是你脸没洗干净。祛痘膏能压下这一轮，但根源在里面，所以要先从肝开始，而不是从脸开始。","fixes":[{"id":"liver-support","why":"Supports your liver in clearing used hormones. The first step for spots that arrive on schedule.","whyZh":"帮肝把用过的激素清走，这是对付“准时痘”的第一步。"},{"id":"cycle-support","why":"Chasteberry, for breakouts that come at the same time every month. Take it every day, not just that week.","whyZh":"圣洁莓，针对每个月准时来的痘。每天吃，不是只在那一周吃。"},{"id":"vitamin-b-complex-120ct","why":"B2 helps keep your oil glands and pores working normally.","whyZh":"B族里的B2，帮皮脂腺和毛孔保持正常运作。"}]},{"id":"mood","icon":"heart","label":"Mood swings and PMS","labelZh":"经前情绪起伏大","visual":null,"what":"The week before your period, your hormones shift and your mood goes with them. You are not being dramatic, it is chemistry. Your brain uses B6 and magnesium to make and steady the messengers that set your mood.","whatZh":"经前那一周，激素在变，情绪也跟着变。不是你矫情，是身体里的化学反应。大脑要靠B6和镁，去制造和稳住那些管情绪的“信使”。","twist":"Take it all month, not only on the hard days. Your cycle is a monthly rhythm, so judge it over three cycles, not three weeks.","twistZh":"整个月都要吃，不是难受那几天才吃。周期是按月走的，所以要看三个周期，而不是三个星期。","fixes":[{"id":"cycle-support","why":"Chasteberry has the longest research history of any plant used for cycle comfort.","whyZh":"圣洁莓，是调理周期舒适度的植物里，研究历史最久的一个。"},{"id":"vitamin-b-complex-120ct","why":"B6 is the vitamin most often linked to PMS mood. B vitamins cannot be stored, so take them daily.","whyZh":"B6是和经前情绪关系最密切的维生素。B族在身体里存不住，要每天补。"},{"id":"calcium-magnesium-d","why":"Calcium and magnesium keep nerves and muscles steady, which is where that on-edge feeling lives.","whyZh":"钙和镁让神经和肌肉保持平稳，那种一点就着的烦躁感，就跟它们有关。"}]},{"id":"cramps","icon":"bolt","label":"Cramps","labelZh":"经期肚子疼","visual":null,"what":"A cramp is a muscle squeezing too hard. Calcium and magnesium tell muscles when to tighten and when to let go, and every period carries some of your minerals out, so the gap reopens every month.","whatZh":"痛经其实是子宫的肌肉收得太用力。钙和镁负责告诉肌肉什么时候收、什么时候放，而每次月经都会带走一部分矿物质，所以这个缺口每个月都会重新打开。","twist":"Do not wait for day one. Take the minerals every day so you are already topped up when your period comes. And the hot water bottle is not just comfort, heat helps the muscle relax.","twistZh":"别等来了才补。每天吃，等月经来的时候，矿物质已经是满的。暖水袋也不只是心理安慰，热真的能让肌肉放松下来。","fixes":[{"id":"calcium-magnesium-d","why":"Calcium, magnesium and D together. The step least worth skipping in a cycle routine.","whyZh":"钙、镁、D三个一起，是周期调理里最不该省的那一步。"},{"id":"advanced-omega","why":"Omega-3 helps keep the body's inflammation signals in balance, and those signals are part of what drives cramping.","whyZh":"Omega-3帮身体的炎症信号保持平衡，而痛经就跟这些信号有关。"}]},{"id":"drained","icon":"drop","label":"Heavy periods, feeling drained","labelZh":"量多，人被掏空","visual":null,"what":"Every period carries iron out, and iron is what carries oxygen around your body. Lose more than you eat back and you feel tired, out of breath on the stairs and pale, especially around your period.","whatZh":"每次月经都会带走铁，而铁负责把氧气送到全身。流失的比吃回来的多，人就会累，爬几层楼就喘，脸色也发白，经期前后尤其明显。","twist":"Do not take iron blind. Ask your doctor to check haemoglobin and ferritin first. Low iron often hides behind a normal blood test.","twistZh":"铁不要盲补。先请医生查一下血红蛋白和铁蛋白。缺铁常常藏在“正常”的血常规后面。","fixes":[{"id":"iron-folic-acid","why":"Once you know your levels: iron plus folic acid, the pair your body uses to make red blood cells.","whyZh":"知道自己的数值之后再补：铁加叶酸，身体造红细胞正需要这一对。"},{"id":"vitamin-c-extended-release-180ct","why":"Take it with the same meal. Vitamin C helps your body absorb iron from food and supplements.","whyZh":"和铁同一餐吃。维生素C能帮身体更好地吸收食物和补充剂里的铁。"}]},{"id":"irregular","icon":"calendar","label":"Cycle all over the place","labelZh":"周期忽早忽晚","visual":null,"what":"Your stress hormone and your cycle hormones are made from the same raw materials. When pressure stays high for weeks, your body puts cortisol first. That is why your most stressful months are usually your messiest cycles.","whatZh":"压力激素和周期相关的激素，用的是同一批原料。压力一直很大，身体会优先去做皮质醇。所以最累、压力最大的那几个月，往往周期也最乱。","twist":"Look at the background load, not just the calendar. Sleep and stress matter here as much as anything you take.","twistZh":"别只盯着日历，看看背后的负担。睡眠和压力，在这里跟吃什么一样重要。","fixes":[{"id":"organics-ashwagandha-capsules","why":"Calms your stress response without sedating you. Evening suits most people, and give it a few weeks.","whyZh":"帮身体把压力反应调稳，又不会让人昏昏沉沉。大多数人适合晚上吃，给它几周时间。"},{"id":"cycle-support","why":"Taken every day through the month to support a steady monthly rhythm.","whyZh":"整个月每天吃，支持一个稳定的月节律。"}]}],"doctor":"Pain that stops your day, very heavy bleeding (soaking a pad every hour or two), bleeding between periods or a missed period? See a doctor first. Pregnant, trying to conceive or on hormonal birth control? Ask before taking Cycle Support, and keep taking anything your doctor prescribed.","doctorZh":"如果痛到影响正常生活、经量特别多（一两个小时就要换一片）、经期之间出血，或者月经没来，请先去看医生。怀孕、备孕或正在用激素类避孕药的话，吃周期支持之前先问医生。医生开的药照常吃。"}},"eczema":{"overview":"Skin is a backup detox route. It opens because the main route, the gut and then the liver, is blocked. That single idea sets the whole order: clear the main route first, rebuild the lipid barrier from the inside, and only then work on the surface. Creams relieve and then it comes back precisely because they treat the exit rather than the pressure.","overviewZh":"皮肤是排毒的备用通道，它被迫开启，是因为主通道（先肠道、再肝）堵了。这一个判断决定了整个顺序：先疏通主通道，再从内部把脂质屏障建起来，最后才处理表面。药膏能缓解、停了又复发，正是因为它处理的是出口，不是压力本身。","rows":[{"stage":"clear","rank":1,"route":"internal","products":["Probiotic","Prebiotic Fiber"],"why":"Skin is a backup detox route, and it opens because the main route is blocked. So the first step with stubborn eczema is not the skin: rebuild the flora with probiotics and give fibre to carry things out. Probiotics without fibre is hiring staff and not feeding them. Working on the skin first is closing the backup exit while leaving the pressure unchanged.","key":"eczema.clear.probiotic","whyZh":"皮肤是排毒的备用通道。通道被迫开启，是因为主通道堵了。所以顽固湿疹的第一步不是从皮肤开始，而是先用益生菌重建菌群、用纤维把东西带走。只补菌不给纤维，等于招了人不给粮。反过来先在皮肤上使劲，等于一边堵备用出口一边不减压。","productIds":["probiotic","prebiotic-fiber"]},{"stage":"regulate","rank":2,"route":"internal","products":["Liver Support"],"why":"The gut is the first route and the liver is the second. When the toxin load runs high, the portion the liver cannot process is what gets pushed out through the skin. It is also why eczema so often flares during stretches of heavy socialising, late nights and alcohol, which is exactly when the liver is busiest.","key":"eczema.regulate.liver-support","whyZh":"肠道是第一道，肝是第二道。体内毒素负荷超标时，肝处理不完的那部分才会转而从皮肤走。这也是为什么很多人的湿疹在应酬多、熬夜多、饮酒多的那段时间集中发作，那正好是肝最忙的时候。","productIds":["liver-support"]},{"stage":"supplement","rank":1,"route":"internal","products":["Advanced Omega"],"why":"The skin barrier is built from lipids, and the modern diet is heavily skewed toward omega-6. Adding omega-3 is not one more nutrient, it is pulling the fatty-acid ratio back. Once the ratio is right the barrier steadies and the skin's reaction to irritants slows down. For anyone who rarely eats oily fish, this gap is close to certain.","key":"eczema.supplement.advanced-omega","whyZh":"皮肤屏障是由脂质构成的，而现代饮食严重偏向 Omega-6。补足 Omega-3 不是多一种营养，而是在把脂肪酸的比例拉回来。比例对了，屏障才稳，皮肤对刺激的反应才会缓下来。很少吃深海鱼的人，这个缺口几乎必然存在。","productIds":["advanced-omega"]},{"stage":"sustain","rank":1,"route":"external","products":["g&h Nourish Body Wash","g&h Nourish Body Lotion"],"why":"The barrier-first approach means moisturising daily when the skin looks fine, not only when it flares. Waiting for a flare means always fighting the fire instead of preventing it. One detail people miss: the bigger variable is not the lotion, it is the body wash. A wash that cleans too aggressively strips a layer of barrier every day, and no lotion fully replaces that.","key":"eczema.sustain.g-h-nourish-body-wash","whyZh":"屏障优先的做法是：皮肤看起来好的时候也每天润肤，而不是只在起疹时才润。等起疹才处理，就永远在救火而不是防火。另一个常被忽略的细节：变量最大的不是身体乳，是沐浴露，清洁力过强的沐浴露每天把屏障剥掉一层，再好的身体乳也补不回来。","productIds":["g-h-nourish-body-wash","g-h-nourish-body-lotion"]}],"overview_es":"La piel es una ruta de desintoxicación de reserva. Se abre porque la ruta principal, primero el intestino y después el hígado, está bloqueada. Esa sola idea define todo el orden: despeja primero la ruta principal, reconstruye la barrera lipídica desde dentro, y solo entonces trabaja la superficie. Las cremas alivian y luego el problema vuelve precisamente porque tratan la salida y no la presión.","overview_hi":"त्वचा विषहरण का वैकल्पिक रास्ता है। यह इसलिए खुलता है क्योंकि मुख्य रास्ता, पहले आँत और फिर लिवर, अवरुद्ध है। यही एक बात पूरा क्रम तय कर देती है: पहले मुख्य रास्ता खोलें, फिर भीतर से वसा अवरोध बनाएँ, और उसके बाद ही सतह पर काम करें। क्रीम आराम देती है और फिर समस्या लौटती है, क्योंकि वह निकास का इलाज करती है, दबाव का नहीं।","summary":{"title":"Skin flaring up again? First, what sets it off?","titleZh":"湿疹又犯了？先想想，每次是怎么开始的？","sub":"Eczema has triggers, and each one points somewhere different. Pick the one that sounds like you.","subZh":"每次发作都有诱因，诱因不一样，要照顾的地方也不一样。选一个最像你的。","moments":[{"id":"winter","icon":"wind","label":"Worse in winter or dry air","labelZh":"一到秋冬就发作","visual":null,"what":"Your skin barrier is like a brick wall, and the mortar is fat. Dry air and indoor heating pull water out through the gaps, the skin gets tight and itchy, and scratching opens the gaps even wider.","whatZh":"皮肤屏障就像一面砖墙，砖缝里的“水泥”是油脂。天一干、暖气一开，水分就从缝里溜走，皮肤开始紧绷、发痒，一抓，缝就更大了。","twist":"Do not wait for the flare. Moisturise every day while your skin still looks fine. That is when it counts.","twistZh":"别等发作了才擦。皮肤看起来没事的时候天天擦，这才是真正起作用的时候。","fixes":[{"id":"g-h-nourish-body-lotion","why":"24-hour moisture that sinks in fast, so you can get dressed right away and actually keep using it.","whyZh":"24小时保湿，吸收快，擦完马上能穿衣服，才坚持得下去。"},{"id":"advanced-omega","why":"The mortar is built from the fats you eat. Omega-3 pulls the balance back from the inside, especially if you rarely eat oily fish.","whyZh":"那层“水泥”是用你吃进去的油脂砌的。平时很少吃深海鱼的话，鱼油帮你从里面把比例调回来。"},{"id":"vitamin-d","why":"Less sun in winter means less vitamin D. Worth asking your doctor to check your level.","whyZh":"冬天晒太阳少，维生素D也跟着往下掉。可以请医生顺便帮你查一下。"}]},{"id":"shower","icon":"drop","label":"Itchy after showers","labelZh":"洗完澡就痒","visual":null,"what":"Hot water and a strong body wash strip away the oil that holds your skin together. Every shower takes off a layer of barrier, and the itch is your skin telling you it feels exposed.","whatZh":"热水加上清洁力太强的沐浴露，会把皮肤表面那层保护油脂一起洗掉。每洗一次就少一层屏障，痒，是皮肤在告诉你它现在没有保护了。","twist":"The bigger fix is usually not the lotion, it is the wash. Go lukewarm, keep it short, and put lotion on within three minutes while your skin is still a little damp.","twistZh":"关键往往不在身体乳，而在沐浴露。水温调低一点，时间短一点，擦干后三分钟内、趁皮肤还微微湿的时候就把身体乳擦上。","fixes":[{"id":"g-h-nourish-body-wash","why":"Honey and shea based. It cleans without stripping, so you stop losing a layer every day.","whyZh":"蜂蜜加乳木果配方，洗得干净又不带走油脂，不会每天洗掉一层屏障。"},{"id":"g-h-nourish-body-lotion","why":"Put it on right after the shower to lock the water in before it evaporates.","whyZh":"洗完马上擦，趁水分还没蒸发，把它锁在皮肤里。"}]},{"id":"food","icon":"bowl","label":"Flares after takeout or certain foods","labelZh":"吃错东西就发","visual":null,"what":"Think of your skin as a backup exit. The main way out is your gut, then your liver. When the gut is struggling, whatever cannot leave that way gets pushed toward the skin, and that is when it flares.","whatZh":"可以把皮肤想成身体的“备用出口”。正门是肠道，然后是肝。肠道一堵，走不掉的东西就被挤到皮肤这边来，于是就发出来了。","twist":"Start with the gut, not the skin. You do not need a perfect diet. Just give the good bacteria something to eat.","twistZh":"先顾肠道，再顾皮肤。不用吃得多完美，给肠道里的好菌一点“口粮”就行。","fixes":[{"id":"probiotic","why":"Rebuilds the good bacteria in your gut, so the main exit works again.","whyZh":"把肠道里的好菌补回来，先让正门重新通畅。"},{"id":"prebiotic-fiber","why":"Probiotics without fibre is like hiring staff and not feeding them. Stir it into water or coffee.","whyZh":"只吃益生菌不补纤维，就像请了员工却不给饭吃。加进水或咖啡里就行。"}]},{"id":"late","icon":"moon","label":"Flares after late nights or stress","labelZh":"熬夜、压力大就发","visual":null,"what":"Late nights, drinks and stressful weeks are exactly when your liver is busiest. Whatever it cannot keep up with looks for another way out, and your skin is the backup.","whatZh":"熬夜、喝酒、压力大的那几周，正好是肝最忙的时候。肝处理不过来的那一部分，就会另找出口，而皮肤就是那个备用出口。","twist":"Watch the pattern. If your skin flares after every busy stretch, that is your clue. Look after your liver before the next one, not after.","twistZh":"留意一下规律：如果每次忙完一阵皮肤就发，这就是线索。下一次忙之前就把肝照顾好，而不是发了再说。","fixes":[{"id":"liver-support","why":"Milk thistle to support your liver on the weeks it is working overtime.","whyZh":"奶蓟草，在肝加班的那几周给它撑一把。"},{"id":"organics-ashwagandha-capsules","why":"Helps your body handle pressure that does not let up. Take it in the evening and give it a few weeks.","whyZh":"帮身体扛住一直放不下的压力。晚上吃，给它几周时间。"}]},{"id":"comes-back","icon":"calendar","label":"Keeps coming back","labelZh":"好了又反复","visual":null,"what":"Creams calm the patch you can see, and that relief is real. But if the pressure inside is still there, it finds its way out again, often in the same places.","whatZh":"药膏能把看得见的那一块压下去，这个缓解是真的。但如果里面的压力还在，它还会再找出口，而且常常就是老地方。","twist":"Keep using whatever your doctor prescribed. This works on the inside, alongside it. Skin renews about once a month, so judge it over a few months, not days.","twistZh":"医生开的药膏照常用，千万别自己停。这是从里面配合着一起做。皮肤大约一个月更新一轮，所以按几个月来看，不是按天。","fixes":[{"id":"probiotic","why":"Step one is the gut, the main exit. Open it up and less gets pushed to the skin.","whyZh":"第一步是肠道，把正门打通，被挤到皮肤上的就少了。"},{"id":"liver-support","why":"Step two is the liver, the second exit, so the load does not spill over.","whyZh":"第二步是肝，第二道出口，别让负担溢出来。"},{"id":"advanced-omega","why":"Step three rebuilds the barrier from the inside, so your skin reacts less.","whyZh":"第三步从里面把屏障修起来，皮肤就没那么容易被刺激。"}]},{"id":"reactive","icon":"face","label":"Reacts to new products","labelZh":"换个护肤品就过敏","visual":null,"what":"When the barrier is thin, everything gets through: fragrance, harsh cleansers, a new serum. Your skin reads it all as an attack, so it turns red, stings or itches.","whatZh":"屏障一薄，什么都容易进来：香精、清洁力太强的洁面、刚换的精华。皮肤把这些都当成攻击，于是就泛红、刺痛、发痒。","twist":"Use fewer products, not more. Try anything new on the inside of your arm for a few days before it goes on your face.","twistZh":"护肤做减法，不要做加法。新东西先在手臂内侧试几天，没事了再上脸。","fixes":[{"id":"artistry-hydrating-mousse-cleanser","why":"The cleanser is where most barriers get stripped. A mousse cleans gently and leaves yours intact.","whyZh":"屏障最常被洗坏的一步就是洁面。慕斯质地很温和，洗干净又不伤屏障。"},{"id":"advanced-omega","why":"A steadier barrier from the inside means less reacting on the outside.","whyZh":"从里面把屏障养稳了，外面就没那么敏感。"}]}],"doctor":"Skin that is weeping, crusting, hot or painful, or a flare with fever, can mean infection: see a doctor promptly. Never stop a cream your doctor prescribed.","doctorZh":"如果皮肤渗液、结黄痂、发烫发疼，或者发作时还发烧，可能是感染了，请尽快去看医生。医生开的药膏不要自己停。"}},"metabolic":{"overview":"Insulin is the signal that tells cells to take sugar out of the blood. In the pattern most adults over forty are in, the pancreas is still sending it, often more than ever. The cells have stopped answering. What makes them stop is fat in the wrong place: not the fat on your arms, which is fairly harmless, but the fat packed around the organs and inside the liver. That fat drains straight into the liver through the portal vein, pushes it to keep producing glucose when it should have stopped, and holds the whole system in low-grade inflammation. This is why someone only slightly overweight can have worse numbers than someone much heavier, and why waist measurement tells you more than weight does. Everything below sits alongside whatever your doctor has you on, never instead of it. The four steps run in order: flatten what arrives, change how the meal behaves, supply the raw materials, and hold the rhythm that the whole thing runs on.","overviewZh":"胰岛素是通知细胞把糖从血里搬走的信号。四十岁以上多数人所处的状态是：胰腺还在发这个信号，往往比以前发得更多，但细胞不再应答。让它们不应答的，是长错位置的脂肪，不是手臂上那些相对无害的皮下脂肪，而是包在内脏周围、囤在肝里的那部分。这部分脂肪经门静脉直接引流进肝脏，逼着肝在该停止产糖的时候继续产糖，并把整个系统按在一层低度炎症里。这解释了为什么一个只是略微超重的人，指标可能比一个重得多的人更差，也解释了为什么腰围比体重能告诉你更多。下面所有内容都是与医生给你的方案并行，永远不是替代它。四步按顺序走：压平进来的量，改变一餐的行为方式，把原料供上，守住整件事赖以运转的节律。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["Green Superfood"],"why":"The second load is free, and it is the order you eat in. In crossover trials, eating protein and vegetables before the rice produced a measurably lower glucose excursion than the same meal eaten in the reverse order. Same plate, same calories, same person, different curve. This is the single cheapest thing on this page and the one to give someone first, because it costs nothing, it proves to them that the mechanism is real, and a person who has seen one thing work will try the next one.","whyZh":"第二个负担是免费的，就是你吃东西的顺序。在交叉对照试验里，先吃蛋白质和蔬菜、后吃米饭，血糖曲线的波动明显低于同一餐反过来吃。同一盘菜、同样的热量、同一个人，曲线不一样。这是整页里最便宜的一件事，也是应该第一个交给别人的那件事，因为它不花钱、能让对方亲眼确认这个机理是真的，而一个见过一件事奏效的人，才会愿意试下一件。","key":"metabolic.clear.green-superfood","productIds":["green-superfood"],"why_es":"La segunda carga es gratis, y es el orden en que comes. En ensayos cruzados, comer proteína y verdura antes del arroz produjo una subida de glucosa medible más baja que la misma comida en orden inverso. Mismo plato, mismas calorí
