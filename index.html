"https://www.amway.com/medias/127063-en-US-690px-01?context=bWFzdGVyfGltYWdlc3wyNDA3NDB8aW1hZ2UvcG5nfHN5cy1tYXN0ZXIvaW1hZ2VzL2g4NC9oMTMvMTAxMzU4OTc2MDQxMjYvMTI3MDYzLWVuLVVTLTY5MHB4LTAxfDZlMTJmYzMxZDY1OGM4ZTZkMTBkMTE0ODA2NjFlNTAxMDdhOThhNjg4NTg5MGMyYTU5YTQxNTgyMDViMTFlMWQ","areas":["home"],"iboOnly":false},{"id":"walking-to-bronze-bundle","item":"321111","name":"Walking to Bronze Bundle","nameZh":"Bronze起步套装","brand":"Nutrilite","cat":"solutions","tagline":"IBO starter bundle aligned to the first milestone","taglineZh":"IBO起步套装，对齐首个里程碑","iboPrice":197.1,"retailPrice":219.0,"pv":57.47,"daysSupply":30,"oneTime":false,"imageUrl":"https://www.amway.com/medias/321111-en-US-690px-01?context=bWFzdGVyfGltYWdlc3w2OTQ2MDB8aW1hZ2UvcG5nfHN5cy1tYXN0ZXIvaW1hZ2VzL2hkYS9oNDkvOTYxMDkzOTEzODA3OC8zMjExMTEtZW4tVVMtNjkwcHgtMDF8YzNhM2JkYzFkMzFlMWViZGRmYWI4NjFkMzIxZjY4OTFlYmM5YTM0MmVlZjI2OGVlYTc3YTFkMmQ1MGQ3YTkyZA","areas":["energy"],"iboOnly":true}],"areas":[{"id":"weight","name":"Weight Management","nameZh":"体重管理","blurb":"The scale cannot tell you what you lost, and that is the whole problem, because losing muscle is what makes the weight come back.","blurbZh":"体重秤没法告诉你减掉的是什么，而问题恰恰在这里，因为掉的是肌肉的时候，体重才会反弹回来。","sensitive":false,"name_es":"Control de peso","name_hi":"वज़न प्रबंधन","blurb_es":"La báscula no puede decirte qué perdiste, y ahí está todo el problema, porque perder músculo es lo que hace que el peso vuelva.","blurb_hi":"वज़न काँटा यह नहीं बता सकता कि आपने क्या घटाया, और पूरी समस्या यही है, क्योंकि मांसपेशी घटने पर ही वज़न लौटकर आता है।","overview_es":"Dos personas pierden los mismos cinco kilos. Una pierde sobre todo grasa y los mantiene. La otra pierde un tercio en forma de músculo, y el músculo es el tejido que quema energía en reposo, así que termina la dieta más ligera y peor preparada para seguir ligera. Después recupera, y lo que vuelve es grasa. Ese es el bucle, y por eso el número de la báscula es una mala guía para saber si algo está funcionando. Los cuatro pasos de abajo giran en torno a la composición y no al número: haz que las comidas que ya haces llenen más para que el déficit sea soportable, come suficiente proteína para que tu cuerpo no tenga motivo para deshacer músculo, cubre los huecos de nutrientes que se abren siempre que comes menos, y protege lo que construiste, porque la parte difícil nunca fue bajarlo."},{"id":"skin","name":"Acne & Skin","nameZh":"皮肤与痘痘","blurb":"Almost everything that decides whether a pore becomes a pimple happens before your face is involved.","blurbZh":"决定一个毛孔会不会变成一颗痘的因素，几乎都发生在脸之外。","sensitive":true,"name_es":"Acné y piel","name_hi":"मुँहासे और त्वचा","blurb_es":"Casi todo lo que decide si un poro se convierte en grano ocurre antes de que tu cara entre en la historia.","blurb_hi":"यह तय करने वाली लगभग हर चीज़ कि रोमछिद्र मुँहासा बनेगा या नहीं, आपके चेहरे तक पहुँचने से पहले ही घट चुकी होती है।","overview_es":"Un poro se convierte en grano cuando coinciden cuatro cosas: el sebo sube, el revestimiento del poro se descama más rápido de lo que se elimina y forma un tapón, las bacterias se multiplican en ese aceite atrapado, y todo se inflama. Los productos tópicos actúan sobre las dos últimas. Las dos primeras se deciden más arriba: por la insulina y el IGF-1, por cuánta carga inflamatoria está pasando el intestino, y por el cortisol de la noche. Por eso limpiar solo la superficie compra unas buenas semanas y luego vuelven los mismos granos. Los cuatro pasos de abajo van en ese orden a propósito: quita la carga, haz que lo que tomas realmente cuente, aporta el material que la reparación necesita, y después protege el resultado.","overview_hi":"रोमछिद्र मुँहासा तब बनता है जब चार चीज़ें एक साथ आती हैं: तेल का बनना बढ़ जाता है, छिद्र की भीतरी परत निकलने से तेज़ी से झड़कर रुकावट बना देती है, फँसे हुए तेल में बैक्टीरिया बढ़ते हैं, और फिर सूजन आ जाती है। बाहरी उत्पाद केवल आखिरी दो पर काम करते हैं। पहली दो ऊपर से तय होती हैं: इंसुलिन और IGF-1 से, आँत कितना सूजन-भार आगे भेज रही है उससे, और रात के कोर्टिसोल से। इसीलिए सिर्फ़ सतह साफ़ करने से कुछ अच्छे हफ़्ते मिलते हैं और फिर वही दाने लौट आते हैं। नीचे दिए चार चरण जानबूझकर इसी क्रम में हैं: पहले बोझ हटाएँ, फिर जो लेते हैं वह वाकई काम आए यह सुनिश्चित करें, फिर मरम्मत का कच्चा माल दें, और अंत में नतीजे की रक्षा करें।"},{"id":"sleep","name":"Sleep & Stress","nameZh":"睡眠与压力","blurb":"Your body repairs in deep sleep, and stress keeps you out of it. Lower the alarm first, rebuild the raw materials, then hold a rhythm long enough to stick.","blurbZh":"身体在深睡时修复，而压力把你挡在深睡之外。先把警报调低，再补上原料，然后把节奏坚持到它自己稳下来。","sensitive":false,"name_es":"Sueño y estrés","name_hi":"नींद और तनाव"},{"id":"digestion","name":"Gut & Regularity","nameZh":"肠胃与排便","blurb":"Regular means once a day and formed, not too hard, not too loose. Both ends of that come back to the same three levers: fibre for bulk, water to keep things soft, and a microbiome with enough of the right bacteria to keep it moving. Most people fix the last one and skip the first two.","blurbZh":"正常是每天一次、成形，不干硬，也不稀软。这两头其实是同一件事的两个方向，取决于同样三个杠杆：纤维给体积，水分保持柔软，菌群提供动力。多数人只补了菌群，跳过了前两样。","sensitive":true,"name_es":"Intestino y regularidad","name_hi":"पाचन और नियमितता","blurb_es":"Regular quiere decir una vez al día y con forma, ni muy duro ni muy suelto. Los dos extremos vuelven a las mismas tres palancas: fibra para dar volumen, agua para mantenerlo blando, y una microbiota con suficientes bacterias buenas para que todo siga en movimiento. La mayoría atiende la última y se salta las dos primeras.","blurb_hi":"नियमित का मतलब है दिन में एक बार और ठोस, न बहुत कड़ा न बहुत ढीला। दोनों छोर एक ही तीन कारकों पर लौटते हैं: मात्रा के लिए फ़ाइबर, नरमी के लिए पानी, और गति बनाए रखने के लिए पर्याप्त अच्छे बैक्टीरिया। ज़्यादातर लोग आखिरी वाला ठीक करते हैं और पहले दो छोड़ देते हैं।"},{"id":"immunity","name":"Immunity","nameZh":"免疫力","blurb":"Immunity is not something to boost. It is something not to run short of: a calm gut, real sleep, and a steady daily supply of protein, vitamin C and vitamin D.","blurbZh":"免疫力不是用来「提升」的，而是不能让它短缺：平稳的肠道、真正的睡眠，以及每天稳定供应的蛋白质、维生素C和维生素D。","sensitive":false,"name_es":"Inmunidad","name_hi":"रोग प्रतिरोधक क्षमता"},{"id":"hormone","name":"Cycle Support","nameZh":"女性周期调理","blurb":"Cyclical breakouts along the jaw, PMS mood swings and cycle-linked fatigue follow a monthly rhythm rather than a daily one. That rhythm is the clue: what changes with the cycle needs cycle-aware support.","blurbZh":"下颌线周期性长痘、经前情绪波动、跟着周期走的疲劳，遵循的是月节律而不是日节律。这个节律本身就是线索：随周期变化的问题，需要顺着周期来支持。","sensitive":true,"name_es":"Apoyo al ciclo","name_hi":"मासिक चक्र सहायता","blurb_es":"Los granos cíclicos en la mandíbula, los cambios de ánimo premenstruales y el cansancio ligado al ciclo siguen un ritmo mensual, no diario. Ese ritmo es la pista: lo que cambia con el ciclo necesita un apoyo que siga el ciclo.","blurb_hi":"जबड़े की रेखा पर चक्र के साथ आने वाले दाने, माहवारी से पहले मूड में बदलाव और चक्र से जुड़ी थकान मासिक लय पर चलते हैं, दैनिक लय पर नहीं। यही लय संकेत है: जो चक्र के साथ बदलता है उसे चक्र के हिसाब से सहारा चाहिए।","overview_es":"Los granos cíclicos en la mandíbula, los cambios de ánimo premenstruales y el cansancio ligado al ciclo siguen un ritmo mensual, no diario. Ese ritmo es la pista. El hígado es donde se depuran las hormonas ya usadas, los minerales se pierden y se reponen cada mes, y el cortisol compite por la misma materia prima. Evalúa cualquier cambio a lo largo de tres ciclos, no de tres semanas.","overview_hi":"जबड़े की रेखा पर चक्रीय दाने, माहवारी से पहले मूड में बदलाव और चक्र से जुड़ी थकान मासिक लय पर चलते हैं, दैनिक लय पर नहीं। यही लय संकेत है। इस्तेमाल हो चुके हार्मोन लिवर में साफ़ होते हैं, खनिज हर महीने घटते और फिर से भरते हैं, और कोर्टिसोल उसी कच्चे माल के लिए होड़ करता है। किसी भी बदलाव को तीन हफ़्तों में नहीं, तीन चक्रों में आँकें।"},{"id":"hair","name":"Hair Health","nameZh":"头发与脱发","blurb":"Most hair shedding is an echo of something two or three months earlier: stress, an illness, a baby or a crash diet. Hair is made of protein, and when protein or iron runs short, it is one of the first things the body cuts.","blurbZh":"大部分掉发，是两三个月前某件事的回声：一段压力、一场病、生孩子或者节食。头发是蛋白质做的，蛋白质或铁一不够，身体最先省掉的就是它。","sensitive":false,"name_es":"Salud del cabello","name_hi":"बालों का स्वास्थ्य"},{"id":"rhinitis","name":"Allergies","nameZh":"过敏与鼻炎","blurb":"Allergies are your immune system overreacting to harmless things like pollen, dust mites and pet dander. The biggest win is cutting exposure, especially in the bedroom. Then support the gut, and start any seasonal plan before the season, not in the worst week.","blurbZh":"过敏，是免疫系统对花粉、尘螨、宠物皮屑这些无害的东西反应过度。最大的一步是减少接触，尤其是卧室。然后照顾好肠道，季节性的方案要在换季前开始，而不是等到最难受那一周。","sensitive":true,"name_es":"Alergias","name_hi":"एलर्जी"},{"id":"energy","name":"Energy & Fatigue","nameZh":"精力与疲劳","blurb":"Being tired all the time is rarely laziness. Usually the day runs on sugar and caffeine, not enough sleep, and a body short on the protein, B vitamins or iron it needs to turn food into energy.","blurbZh":"总是很累，很少是因为懒。通常是一天靠糖和咖啡撑着、睡眠不够，再加上身体缺少把食物变成能量的原料：蛋白质、B族或铁。","sensitive":false,"name_es":"Energía y cansancio","name_hi":"ऊर्जा और थकान"},{"id":"metabolic","name":"Blood Sugar","nameZh":"血糖管理","blurb":"The pancreas is usually still sending the signal. What changed is that the cells stopped answering it, and fat in the wrong place is why.","blurbZh":"胰腺通常还在发信号。变的是细胞不再应答，而原因是脂肪长错了位置。","sensitive":true,"name_es":"Azúcar en sangre","name_hi":"रक्त शर्करा","blurb_es":"El páncreas normalmente sigue mandando la señal. Lo que cambió es que las células dejaron de responderla, y la grasa en el lugar equivocado es la razón.","blurb_hi":"अग्न्याशय आमतौर पर अब भी संकेत भेज रहा होता है। बदला यह है कि कोशिकाओं ने जवाब देना बंद कर दिया, और इसकी वजह है गलत जगह जमी चर्बी।","overview_es":"La insulina es la señal que le dice a las células que saquen el azúcar de la sangre. En el patrón en el que está la mayoría de los adultos de más de cuarenta, el páncreas sigue mandándola, a menudo más que nunca. Las células han dejado de responder. Lo que hace que dejen de responder es la grasa en el lugar equivocado: no la de los brazos, que es bastante inofensiva, sino la que se empaqueta alrededor de los órganos y dentro del hígado. Esa grasa drena directo al hígado por la vena porta, lo empuja a seguir produciendo glucosa cuando debería haber parado, y mantiene todo el sistema en inflamación de bajo grado. Por eso alguien con solo un poco de sobrepeso puede tener peores números que alguien mucho más pesado, y por eso la medida de la cintura dice más que el peso. Todo lo de abajo va junto a lo que tu médico te haya indicado, nunca en su lugar. Los cuatro pasos van en orden: aplana lo que llega, cambia cómo se comporta la comida, aporta la materia prima, y sostén el ritmo del que depende todo lo demás."},{"id":"eczema","name":"Eczema & Sensitive Skin","nameZh":"湿疹与敏感肌","blurb":"When the liver cannot keep up with detoxification, the body recruits the skin as a backup route. Eczema and recurring rashes are often that route being forced open, which is why creams relieve and then it comes back.","blurbZh":"当肝脏解毒跟不上，身体会征用皮肤当备用排毒通道。湿疹和反复起疹往往就是这条通道被迫开启，这也是为什么药膏能缓解、停了又复发。","sensitive":true,"name_es":"Eczema y piel sensible","name_hi":"एक्ज़िमा और संवेदनशील त्वचा","blurb_es":"Cuando el hígado no da abasto con la desintoxicación, el cuerpo recluta la piel como ruta alternativa. El eczema y los brotes que vuelven suelen ser esa ruta abriéndose a la fuerza, y por eso las cremas alivian y luego el problema regresa.","blurb_hi":"जब लिवर विषहरण में पिछड़ जाता है, शरीर त्वचा को वैकल्पिक रास्ते के रूप में इस्तेमाल करता है। एक्ज़िमा और बार-बार लौटने वाले चकत्ते अक्सर उसी रास्ते का ज़बरदस्ती खुलना होते हैं, इसीलिए क्रीम से आराम मिलता है और फिर समस्या लौट आती है।","overview_es":"La piel es una ruta de desintoxicación de reserva. Se abre porque la ruta principal, primero el intestino y después el hígado, está bloqueada. Esa sola idea define todo el orden: despeja primero la ruta principal, reconstruye la barrera lipídica desde dentro, y solo entonces trabaja la superficie. Las cremas alivian y luego el problema vuelve precisamente porque tratan la salida y no la presión.","overview_hi":"त्वचा विषहरण का वैकल्पिक रास्ता है। यह इसलिए खुलता है क्योंकि मुख्य रास्ता, पहले आँत और फिर लिवर, अवरुद्ध है। यही एक बात पूरा क्रम तय कर देती है: पहले मुख्य रास्ता खोलें, फिर भीतर से वसा अवरोध बनाएँ, और उसके बाद ही सतह पर काम करें। क्रीम आराम देती है और फिर समस्या लौटती है, क्योंकि वह निकास का इलाज करती है, दबाव का नहीं।"},{"id":"eye","name":"Eye Health","nameZh":"眼睛健康","blurb":"Tired, dry eyes are mostly about how we use them, not damage. Breaks, blinking and sunglasses come first, and lutein and zeaxanthin, the pigments that filter light at the centre of the eye, have to come from food.","blurbZh":"眼睛累、眼睛干，多半是用眼方式的问题，不是眼睛坏了。先靠休息、眨眼和太阳镜，再补上叶黄素和玉米黄质，这两种黄斑色素负责过滤光线，身体自己造不出来。","sensitive":false,"name_es":"Salud visual","name_hi":"आँखों का स्वास्थ्य"},{"id":"brain","name":"Focus & Memory","nameZh":"专注与记忆","blurb":"Most brain fog is not your brain. It is a sugar crash, short sleep or stress, on top of a diet light on omega-3, B vitamins and protein.","blurbZh":"大多数脑雾，问题不在脑子本身，而是血糖坐过山车、睡不够、压力大，再加上Omega-3、B族和蛋白质吃得不够。","sensitive":false,"name_es":"Concentración y memoria","name_hi":"एकाग्रता और स्मृति"},{"id":"muscle","name":"Muscle & Fitness","nameZh":"增肌与运动表现","blurb":"Muscle is built in recovery, not in the gym. Most people who train fall short on protein, eat it in one big meal instead of spreading it out, or sleep too little for the repair to happen.","blurbZh":"肌肉是在恢复里长出来的，不是在健身房里。大多数练的人，要么蛋白质不够，要么全堆在一顿里吃，要么睡得太少，修复根本来不及。","sensitive":false,"name_es":"Músculo y rendimiento","name_hi":"मांसपेशी और फ़िटनेस"}],"solutions":[{"id":"students","title":"Students","titleZh":"学生党","icon":"backpack","situation":"Late nights, deadline sprints, delivery food, and a dorm where everything gets shared. Energy swings between wired and flat, skin reacts to the stress, and getting sick before finals is almost a tradition.","situationZh":"熬夜赶due、外卖为主、宿舍里什么都一起分。精力在亢奋和断电之间摇摆，皮肤跟着压力闹脾气，考试周前生病几乎成了传统。","gap":"A campus clinic visit ends with \"you're fine, get more sleep.\" That is accurate and useless, because nothing is diseased yet. This is the sub-health zone: reserves running down before symptoms appear.","gapZh":"校医院看完一句「你没事，多睡觉」。这话没错但没用，因为确实还没到生病。这就是亚健康区间：储备在消耗，但症状还没出现。","path":"Start with the two things that compound fastest: a real breakfast with protein instead of pastry, and steady vitamin C so the immune system is not running on empty during exam season. Add energy support that is not a fourth coffee. Build the habit before adding anything else.","pathZh":"先做两件复利最快的事：早餐用蛋白质替代面包，以及稳定补充维C，让考试季的免疫系统不至于空转。再加上不靠第四杯咖啡的能量支持。先把习惯做出来，再谈其他。","contents":["plant-protein-powder","vitamin-c-extended-release-60ct","xs-energy-drinks-12-pack","organics-all-in-one-bars","sleep-gummies"]},{"id":"professionals","title":"Working Professionals","titleZh":"职场人","icon":"laptop","situation":"Nine hours at a screen, lunch at the desk, the 3pm crash, and a mind that will not switch off at 11pm. Annual physical comes back clean, yet energy, focus and sleep have all quietly declined over three years.","situationZh":"一天九小时对着屏幕，午饭在工位解决，下午三点断电，晚上十一点大脑还停不下来。年度体检一切正常，但精力、专注和睡眠在三年里悄悄全面下滑。","gap":"A physical is designed to catch disease, not to measure how well you function. Blood work in normal range and feeling genuinely good are two different questions, and only one of them gets tested.","gapZh":"体检的设计目的是发现疾病，不是衡量你的机能状态。指标在正常范围和真正感觉很好，是两个不同的问题，而只有前者会被检测。","path":"Work in this order: stabilize energy metabolism (B vitamins, real protein at breakfast), then protect the eyes and brain that take the daily load, then rebuild the evening wind-down so sleep actually repairs. Fixing sleep last rarely works, fixing it as part of the chain does.","pathZh":"按这个顺序：先稳住能量代谢（B族、早餐真正的蛋白质），再保护每天承压的眼睛和大脑，最后重建晚间的放松节奏让睡眠真正修复。最后才治睡眠通常无效，把它放进整条链条里才有效。","contents":["vitamin-b-complex-120ct","double-x-multivitamin-31-day-refill","advanced-omega","vision-health","magnesium","plant-protein-powder"]},{"id":"family","title":"Family & Household","titleZh":"家庭","icon":"home","situation":"Two working parents, kids who bring home whatever is going around, aging parents you worry about, and a house full of products nobody ever read the label on. Health here is not one person, it is an environment.","situationZh":"双职工父母、把外面流行的病带回家的孩子、让你担心的长辈，还有满屋子从没人看过成分表的日用品。家庭健康不是一个人的事，是一个环境。","gap":"Doctors treat the person in front of them, one at a time. Nobody looks at the water, the air, the cookware, and the cleaning products as a system, even though those are the daily exposures the whole family shares.","gapZh":"医生一次只处理眼前这一个人。没有人会把水、空气、锅具、清洁用品当作一个系统来看，而这些恰恰是全家每天共同暴露的因素。","path":"Reduce the daily inputs of damage first, because that benefits everyone at once: water, air, and what you cook and clean with. Then layer in nutrition for whoever needs it most. A household upgrade is one decision that covers five people.","pathZh":"先减少每日的损伤输入，因为这一步全家同时受益：水、空气、以及用什么做饭和清洁。然后再针对最需要的人补充营养。一次家居升级，覆盖五口人。","contents":["espring-water-purifier-chrome","atmosphere-mini-air-purifier","loc-multi-purpose-cleaner","sa8-liquid-laundry","double-x-multivitamin-31-day-refill","probiotic","glister-toothpaste"]},{"id":"kids","title":"Kids & Teens","titleZh":"孩子与青少年","icon":"kids","situation":"Picky eaters, packed schedules, screens after homework, and whatever is going around at school. Parents worry most about two things: are they getting what they need to grow, and why do they catch everything.","situationZh":"挑食、日程排满、写完作业还要看屏幕，加上学校里流行什么就传什么。家长最担心两件事：长身体的营养够不够，以及为什么什么病都能中。","gap":"Pediatric visits are built around growth curves and acute illness. Nobody sits down with a parent to look at whether the everyday diet actually covers what a growing body needs, because that is not what the appointment is for.","gapZh":"儿科门诊的设计是看生长曲线和处理急性病。没有人会坐下来和家长一起看，日常饮食到底有没有覆盖一个正在长身体的孩子所需要的，因为门诊本来就不是干这个的。","path":"Start where kids will actually cooperate: something that tastes good and takes three seconds. Chewables and gummies win over tablets every time. Cover the basics first (fruit and vegetable gaps, immune support), then protein if meals are unreliable. Consistency beats optimization at this age.","pathZh":"从孩子真的愿意配合的地方开始：好吃、三秒钟就能搞定。咀嚼片和软糖永远赢过药片。先补基础（蔬果缺口、免疫支持），如果三餐不规律再加蛋白质。这个年纪，坚持比精准更重要。","contents":["go-shield","eye-mojo-blue-light-gummies","sleep-gummies","twist-tubes","plant-protein-powder","glister-toothpaste","vitamin-c-extended-release-60ct"]},{"id":"fitness","title":"Fitness & Wellness Centers","titleZh":"健身房与养生馆","icon":"dumbbell","situation":"Gyms, studios, massage and recovery spaces. Their members already buy protein, pre-workout and recovery products somewhere, usually from a shelf nobody vetted. The owner wants products that make members come back, not products that eat margin.","situationZh":"健身房、工作室、按摩与恢复中心。他们的会员本来就在别处买蛋白粉、训练前和恢复产品，通常来自没人把关的货架。老板要的是让会员回头的产品，不是吃掉利润的产品。","gap":"The supplement aisle is largely unregulated. Third-party testing, banned-substance screening and traceable sourcing are the exception, not the rule, and most members have no way to tell the difference.","gapZh":"补剂货架基本处于弱监管状态。第三方检测、禁药筛查、可追溯原料是例外而非常态，而大多数会员根本无从分辨。","path":"Lead with the differentiator that matters to a serious trainer: tested, traceable, grass-fed sourcing. Start the conversation with a sampling pack rather than a wholesale pitch, let their members taste it, then discuss a standing arrangement.","pathZh":"用真正打动专业教练的差异点切入：经过检测、可追溯、草饲原料。先用试用包开启对话而不是直接谈批发，让会员先尝到，再谈长期合作。","contents":["xs-grass-fed-whey-protein","xs-muscle-multiplier-eaas","xs-pre-workout-boost","xs-post-workout-recovery","xs-protein-bars-12-pack","advanced-omega","magnesium"]},{"id":"gifting","title":"Gifts & Sampling","titleZh":"礼盒与试用","icon":"gift","situation":"Holiday gifts, new-neighbor baskets, thank-you packages, and the wellness care package that starts a conversation without asking for anything. Anything that comes in single-serve format can go in the box.","situationZh":"节日礼物、新邻居礼篮、答谢包，以及那种不带任何要求、只为开启对话的健康关怀包。所有单份包装的产品都可以放进礼盒。","gap":"A gift lands differently than a pitch. Nobody puts up a defense against a thoughtful package, and single-serve formats let someone experience a product with zero commitment and zero risk.","gapZh":"礼物和推销的落点完全不同。没有人会对一份用心的礼包设防，而单份装让对方零承诺、零风险地体验产品。","path":"Build boxes around single-serve items: twist tubes, gummies, energy drinks, protein bars, travel-size personal care. Skip anything that only comes as a full bottle. Include a card with the product link so they can look up what they liked.","pathZh":"用单份产品搭礼盒：随身饮管、软糖、能量饮、蛋白棒、旅行装个护。跳过只有整瓶装的产品。附一张卡片写上产品链接，让他们能查到自己喜欢的那一款。","contents":["twist-tubes","sleep-gummies","go-shield","eye-mojo-blue-light-gummies","xs-energy-drinks-12-pack","xs-protein-bars-12-pack","glister-toothpaste","glister-refresher-spray"]}],"areaCopy":{"vitamin-c-extended-release-180ct":{"skin":{"tagline":"Collagen's raw material, released over 8 hours","taglineZh":"胶原蛋白的原料，8小时缓释","advantage":"Skin cannot build collagen without vitamin C. The 8-hour extended release keeps blood levels steady all day instead of spiking and flushing out.","advantageZh":"没有维C，皮肤无法合成胶原蛋白。8小时缓释让血液浓度全天平稳，而不是快速吸收又排出。","who":"Anyone working on acne marks, dull skin, or slow skin recovery. Works from the inside while your topical routine works outside.","whoZh":"在意痘印、暗沉或皮肤恢复慢的人。内服支持，配合外用护肤。"},"immunity":{"tagline":"Steady immune support your body can't store","taglineZh":"身体存不住的维C，全天稳定供给","advantage":"Immune cells consume vitamin C rapidly and the body cannot store it. Extended release maintains supply through the whole day from acerola cherries, not synthetic ascorbic acid alone.","advantageZh":"免疫细胞快速消耗维C，而身体无法储存。缓释配方全天维持供给，原料来自针叶樱桃而非纯合成。","who":"People who catch whatever is going around the office, frequent travelers, high-stress schedules.","whoZh":"办公室流行什么就中什么的人、经常出差的人、高压人群。"},"aging":{"tagline":"The antioxidant collagen production depends on","taglineZh":"胶原蛋白合成离不开的抗氧化剂","advantage":"Collagen production declines with age and vitamin C is required for every step of it. Steady 8-hour release supports daily repair against daily oxidative wear.","advantageZh":"胶原蛋白合成随年龄下降，而每一步都需要维C。8小时缓释支持每日修复，对抗每日氧化损耗。","who":"Anyone 30+ starting to think about skin elasticity and daily antioxidant coverage.","whoZh":"30岁以上、开始在意皮肤弹性和每日抗氧化储备的人。"}},"advanced-omega":{"skin":{"tagline":"Omega-3 supports the skin barrier from within","taglineZh":"Omega-3由内支持皮肤屏障","advantage":"The skin barrier is built from fats. Steady omega-3 intake is commonly associated with a calmer, better-hydrated barrier; modern diets skew heavily to omega-6.","advantageZh":"皮肤屏障由脂质构成。稳定摄入Omega-3与更稳定、更水润的屏障相关，而现代饮食普遍偏向Omega-6。","who":"Dry, easily irritated, or breakout-prone skin, especially if you rarely eat fatty fish.","whoZh":"皮肤干燥、易泛红或易爆痘的人，尤其是很少吃深海鱼的人。"}},"probiotic":{"skin":{"tagline":"The gut-skin axis: calmer gut, calmer skin","taglineZh":"肠皮轴：肠道稳，皮肤稳","advantage":"Research keeps linking gut microbiome balance with skin condition (the gut-skin axis). 6.3 billion CFU of clinically studied strains support that balance daily.","advantageZh":"越来越多研究将肠道菌群平衡与皮肤状态联系起来（肠皮轴）。63亿临床研究菌株每日支持这种平衡。","who":"Recurring breakouts that topicals alone never quite resolve, especially alongside bloating or irregular digestion.","whoZh":"反复长痘、光靠外用总解决不彻底的人，尤其伴随胀气或消化不规律。"},"immunity":{"tagline":"70% of immune tissue lines the gut","taglineZh":"70%的免疫组织分布在肠道","advantage":"The largest immune organ is the gut lining. Supporting the microbiome with clinically studied strains supports the immune system where most of it lives.","advantageZh":"人体最大的免疫器官就是肠道。用临床研究菌株支持菌群，就是在免疫系统的主场支持它。","who":"Frequent colds plus digestive ups and downs, the combination is often connected.","whoZh":"经常感冒又肠胃时好时坏的人，这两件事常常相关。"}},"artistry-studio-done-with-zit":{"skin":{"tagline":"Salicylic acid spot treatment, works overnight","taglineZh":"水杨酸点涂，一夜起效","advantage":"2% salicylic acid clears pores right at the spot, the go-to active for breakouts, without drying the whole face.","advantageZh":"2%水杨酸直接点涂疏通毛孔，祛痘经典成分，不干燥全脸。","who":"Sudden breakouts before events, teens and adults with occasional spots rather than full-face acne.","whoZh":"重要场合前突然爆痘的人；偶发性痘痘而非全脸痤疮的青少年和成人。"}},"artistry-signature-select-purifying-mask":{"skin":{"tagline":"Deep-clean mask for congested, oily skin","taglineZh":"深层清洁面膜，油痘肌友好","advantage":"Draws out impurities and excess oil from congested pores, the weekly reset that keeps daily breakouts down.","advantageZh":"吸附毛孔内的油脂与杂质，每周一次的深层重置，减少日常爆痘。","who":"Oily and combination skin with blackheads or frequent clogged pores.","whoZh":"有黑头、毛孔易堵的油性和混合性肌肤。"}},"vitamin-d":{"immunity":{"tagline":"The sunshine vitamin most people are low on","taglineZh":"大多数人都缺的阳光维生素","advantage":"Vitamin D helps regulate immune response, and indoor lifestyles leave most people below optimal levels most of the year.","advantageZh":"维D参与调节免疫反应，而室内生活方式让大多数人一年大部分时间都低于理想水平。","who":"Office workers, northern winters, anyone who wears sunscreen daily (which blocks vitamin D synthesis).","whoZh":"办公室人群、日照少的季节、每天涂防晒的人（防晒会阻断维D合成）。"}},"vitamin-b-complex-120ct":{"energy":{"tagline":"The coenzymes that turn food into energy","taglineZh":"把食物变成能量的辅酶","advantage":"B vitamins are the coenzymes of energy metabolism; without them food does not convert efficiently. Dual-action formula pairs instant and slow-release B, and one bottle lasts 4 months.","advantageZh":"B族是能量代谢的辅酶，缺了它食物无法高效转化为能量。双效配方兼顾速释与缓释，一瓶可用4个月。","who":"Afternoon crashes, coffee-dependent mornings, high-carb diets that burn through B vitamins faster.","whoZh":"下午断电、早上靠咖啡续命、高碳水饮食（消耗B族更快）的人。"}},"double-x-multivitamin-31-day-refill":{"energy":{"tagline":"Cover every micronutrient gap in one strip","taglineZh":"一条补齐所有微量营养缺口","advantage":"Persistent low energy often traces to multiple small nutrient gaps rather than one. 22 vitamins and minerals plus 22 plant concentrates cover the full base.","advantageZh":"长期没精神往往源于多个小缺口叠加，而不是缺某一种。22种维生素矿物质+22种植物浓缩，一次补齐地基。","who":"Busy people who eat irregularly and want one comprehensive daily habit instead of five bottles.","whoZh":"吃饭不规律、想用一个习惯代替五瓶补充剂的忙碌人群。"}},"plant-protein-powder":{"energy":{"tagline":"Steady blood sugar starts with morning protein","taglineZh":"早晨蛋白质，血糖稳一天","advantage":"A carb-only breakfast sets up a blood sugar rollercoaster that crashes mid-morning. 21g of plant protein at breakfast keeps energy release steady.","advantageZh":"纯碳水早餐让血糖坐过山车，上午十点就崩。早餐21克植物蛋白让能量平稳释放。","who":"People who skip breakfast or grab pastries, then wonder why energy dips before lunch.","whoZh":"不吃早餐或随手面包解决、然后纳闷为什么午饭前就没电的人。"},"muscle":{"tagline":"21g organic protein for the rebuild window","taglineZh":"21克有机蛋白，抓住修复窗口","advantage":"Muscle grows during recovery, not during the workout. Tri-plant blend (pea, rice, chia) delivers a complete amino acid profile without dairy bloating.","advantageZh":"肌肉是在恢复中生长的，不是在训练中。三重植物配方（豌豆+糙米+奇亚籽）氨基酸完整，无乳制品胀气。","who":"Lifters who bloat on whey, plant-based athletes, and anyone under-eating protein on busy days.","whoZh":"喝乳清胀气的健身人群、素食运动员，以及忙起来蛋白质摄入不够的人。"},"weight":{"tagline":"Protein keeps you full, fullness keeps you on plan","taglineZh":"蛋白质饱腹，饱腹才守得住计划","advantage":"Protein is the most satiating macronutrient. Replacing a carb-heavy meal or snack with 21g of plant protein reduces the cravings that break diets.","advantageZh":"蛋白质是饱腹感最强的营养素。用21克植物蛋白替换高碳水一餐或零食，减少击垮计划的馋嘴时刻。","who":"Anyone managing weight who gets derailed by afternoon or late-night snacking.","whoZh":"正在管理体重、但总被下午或夜宵零食带偏的人。"}},"magnesium":{"sleep":{"tagline":"The relaxation mineral stress burns through","taglineZh":"压力最先消耗的放松矿物质","advantage":"Magnesium supports muscle relaxation and nervous system wind-down, and it is exactly what sustained stress depletes fastest. Evening timing works best.","advantageZh":"镁支持肌肉放松与神经系统的平静，恰恰是持续压力消耗最快的矿物质。晚间服用效果最好。","who":"Wired-but-tired at bedtime, muscle tension, restless legs, or nighttime cramps.","whoZh":"身体累但大脑停不下来、肌肉紧绷、腿不安或夜间抽筋的人。"}},"sleep-gummies":{"sleep":{"tagline":"A clock signal for nights that start too late","taglineZh":"给开始得太晚的夜晚，一个时钟信号","advantage":"Each gummy has 3 mg of melatonin with passionflower and a little magnesium. Melatonin tells the body that night has started, so it helps most when the clock is the problem: jet lag, a late-shifted week, or getting back to a fixed wake time. Use it for occasional nights rather than as a nightly habit.","advantageZh":"每颗软糖含3毫克褪黑素，加上西番莲和少量镁。褪黑素的作用是告诉身体「天黑了」，所以当问题出在生物钟上时最有用：倒时差、作息往后推了一周，或者要把起床时间调回来。偶尔需要的晚上用，而不是每晚都吃。","who":"Occasional trouble falling asleep from travel or a shifted schedule. Not for children, pregnancy or breastfeeding without a doctor, and do not drive or drink alcohol after taking it.","whoZh":"因为出差或作息被打乱而偶尔难以入睡的人。儿童、孕期、哺乳期未经医生同意不要用；吃完不要开车、不要喝酒。"}},"calcium-magnesium-d":{"sleep":{"tagline":"Evening minerals for deeper rest","taglineZh":"晚间矿物质，睡得更沉","advantage":"Calcium and magnesium taken in the evening support muscle relaxation and the nervous system's shift into rest mode.","advantageZh":"晚间补充钙镁，支持肌肉放松和神经系统切换到休息模式。","who":"Light sleepers who wake at small noises, and anyone with evening muscle tightness.","whoZh":"睡得浅、一点动静就醒的人，以及晚间肌肉紧绷的人。"}},"xs-grass-fed-whey-protein":{"muscle":{"tagline":"25g grass-fed whey, third-party tested","taglineZh":"25克草饲乳清，第三方检测","advantage":"Fast-absorbing whey right after training hits the recovery window when muscles are most receptive. Grass-fed source, tested for banned substances.","advantageZh":"训练后快速吸收的乳清蛋白，正好赶上肌肉最需要营养的恢复窗口。草饲奶源，禁药检测。","who":"Regular gym-goers optimizing post-workout nutrition; athletes who need tested supplements.","whoZh":"规律健身、重视练后营养的人；需要检测认证补剂的运动员。"}},"begin-30-holistic-wellness-solution":{"weight":{"tagline":"30-day program: 70% of committed users lost weight","taglineZh":"30天计划，70%坚持者体重下降","advantage":"Not a crash diet, a 30-day habit reset covering food, water, movement and mindfulness, with gut-supporting products and an app to track it. In Amway's study, 70% of committed participants lost weight.","advantageZh":"不是极端节食，而是覆盖饮食、饮水、运动、正念的30天习惯重置，配合肠道支持产品和打卡App。官方研究中70%坚持者体重下降。","who":"People who have tried diets that work for two weeks then collapse; anyone who wants structure and tracking.","whoZh":"试过各种饮食法、坚持两周就崩的人；想要结构化计划和打卡追踪的人。"}},"hair-skin-nail":{"hair":{"tagline":"Biotin + collagen: feed hair from the root","taglineZh":"生物素+胶原：从发根养发","advantage":"Hair is built from protein and depends on biotin, collagen and silicon supply. Topical products coat the strand; nutrition feeds the follicle where growth actually happens.","advantageZh":"头发由蛋白质构成，依赖生物素、胶原和硅的供给。外用产品只能护发丝，营养才能滋养真正长发的毛囊。","who":"Thinning, shedding, or brittle hair and nails, especially after stress periods or dieting.","whoZh":"头发变稀、掉发、发甲易断的人，尤其在高压期或节食后。"}},"satinique-purifying-shampoo-280ml":{"hair":{"tagline":"Reset an oily scalp so follicles can breathe","taglineZh":"重置油性头皮，让毛囊呼吸","advantage":"Buildup and excess scalp oil suffocate follicles. Deep-cleansing without sulfate harshness keeps the scalp environment healthy for growth.","advantageZh":"油脂和残留堆积会闷住毛囊。无硫酸盐刺激的深层清洁，维持适合生长的头皮环境。","who":"Oily scalp, flat hair by mid-day, or product buildup from styling.","whoZh":"头皮出油快、到中午头发就塌、造型产品残留多的人。"}},"vitamin-e-chewable":{"aging":{"tagline":"Classic antioxidant protection for cell membranes","taglineZh":"经典抗氧化，保护细胞膜","advantage":"Vitamin E sits in cell membranes intercepting oxidative damage where it happens. Paired with lecithin for absorption, in a chewable format.","advantageZh":"维E驻守在细胞膜上，在损伤发生处拦截氧化。搭配卵磷脂助吸收，咀嚼型好入口。","who":"Adults building a long-term antioxidant base, often paired with vitamin C and omega-3.","whoZh":"在搭建长期抗氧化基础的成年人，常与维C、鱼油搭配。"}},"artistry-renewing-system-bundle":{"aging":{"tagline":"Peptide renewal routine in one set","taglineZh":"胜肽焕新，一套搭齐","advantage":"The complete renewing routine, cleanse, treat, protect, built around peptides that support skin's own renewal cycle, in one decision instead of three.","advantageZh":"完整焕新流程：清洁、修护、防护。围绕支持皮肤自身更新周期的胜肽配方，一次搭齐不用选三次。","who":"First fine lines, loss of glow, or anyone ready to upgrade from basic moisturizer to a real routine.","whoZh":"刚出现细纹、皮肤失去光泽的人，或准备从基础保湿升级到完整流程的人。"}}},"tiles":{"_note":"Tile photos are stored locally in images/tiles/ so nothing depends on an external CDN. To swap a photo, replace the .jpg file (keep the name) or point the value at a new path.","areas":{"energy":"images/tiles/are-energy.jpg","sleep":"images/tiles/are-sleep.jpg","skin":"images/tiles/are-skin.jpg","eye":"images/tiles/are-eye.jpg","brain":"images/tiles/are-brain.jpg","weight":"images/tiles/are-weight.jpg","hair":"images/tiles/are-hair.jpg","digestion":"images/tiles/are-digestion.jpg","muscle":"images/tiles/are-muscle.jpg","immunity":"images/tiles/are-immunity.jpg","oral":"images/tiles/are-oral.jpg","heart":"images/tiles/are-heart.jpg","aging":"images/tiles/are-aging.jpg","home":"images/tiles/are-home.jpg","eczema":"images/tiles/are-eczema.jpg","rhinitis":"images/tiles/are-rhinitis.jpg","hormone":"images/tiles/are-hormone.jpg","metabolic":"images/tiles/are-metabolic.jpg"},"solutions":{"students":"images/tiles/sol-students.jpg","professionals":"images/tiles/sol-professionals.jpg","family":"images/tiles/sol-family.jpg","kids":"images/tiles/sol-kids.jpg","fitness":"images/tiles/sol-fitness.jpg","gifting":"images/tiles/sol-gifting.jpg"},"cats":{"all":"images/tiles/cat-all.jpg","nutrition":"images/tiles/cat-nutrition.jpg","sports":"images/tiles/cat-sports.jpg","beauty":"images/tiles/cat-beauty.jpg","care":"images/tiles/cat-care.jpg","home":"images/tiles/cat-home.jpg","solutions":"images/tiles/cat-solutions.jpg","oral":"images/tiles/are-oral.jpg","aging":"images/tiles/are-aging.jpg","heart":"images/tiles/are-heart.jpg"}},"details":{"double-x-multivitamin-31-day-refill":{"advantage":"22 vitamins and minerals plus 22 plant concentrates in one strip, morning and evening. It is the flagship because it covers the widest range of everyday gaps at once instead of asking you to stack five bottles.","advantageZh":"22种维生素矿物质+22种植物浓缩，一条搞定早晚两次。它是旗舰产品，因为它一次覆盖最广泛的日常营养缺口，不用你叠五瓶。","who":"Anyone who eats irregularly and wants one comprehensive daily habit. The 31-day refill is the standard month; the 10-day pack is for trying it first.","whoZh":"吃饭不规律、想要一个全面日常习惯的人。31天装是标准月用量，10天装适合先试试看。"},"double-x-multivitamin-10-day":{"advantage":"The same flagship formula as the 31-day refill, in a 10-day size. Low-commitment way to feel the difference before switching to a monthly habit.","advantageZh":"与31天装同样的旗舰配方，10天体验装。在转为每月习惯之前，用最低门槛先感受差别。","who":"First-timers who want to try Double X without committing to a full month, and anyone traveling short-term.","whoZh":"想先试试双X、不愿一次买一个月的人，以及短期出行的人。"},"vitamin-c-extended-release-180ct":{"advantage":"Vitamin C is water-soluble, so the body cannot store it and flushes the excess. The 8-hour extended release keeps levels steadier through the day, and the acerola cherry concentrate comes from Nutrilite's own farms.","advantageZh":"维生素C是水溶性的，身体无法储存，多余的会排出。8小时缓释让全天浓度更平稳，针叶樱桃浓缩来自Nutrilite自有农场。","who":"The 180-count is the everyday size for people who want steady coverage year-round rather than only during cold season.","whoZh":"180粒装是日常规格，适合想全年稳定补充、而不只在换季时才吃的人。"},"vitamin-c-extended-release-60ct":{"advantage":"Same 8-hour extended-release formula in a smaller bottle. Easiest entry point into the Nutrilite line.","advantageZh":"同样的8小时缓释配方，小瓶装。是进入Nutrilite产品线最容易的入口。","who":"First-time customers, gift boxes, or anyone who wants to try before moving to the 180-count.","whoZh":"首次购买的客户、礼盒搭配，或想先试用再换180粒装的人。"},"vitamin-b-complex-120ct":{"advantage":"B vitamins act as coenzymes in energy metabolism, and the body uses them up faster under stress and high-carb diets. Dual-action pairs a quick-release and a slow-release layer so coverage lasts through the day.","advantageZh":"B族维生素是能量代谢的辅酶，压力大和高碳水饮食会消耗得更快。双效配方结合速释层与缓释层，让覆盖持续一整天。","who":"The 120-count runs four months, which makes it one of the lowest daily costs in the whole line. Good for anyone with afternoon energy dips.","whoZh":"120粒可用四个月，是整条产品线里日均成本最低的之一。适合下午容易没精神的人。"},"vitamin-b-complex-30ct":{"advantage":"The same dual-action B formula in a one-month bottle.","advantageZh":"同样的双效B族配方，一个月装。","who":"Trial size, travel, or adding B vitamins to a stack without a four-month commitment.","whoZh":"试用、出行，或想在组合里加B族但不想一次买四个月的人。"},"vitamin-d":{"advantage":"Vitamin D is made in the skin from sunlight, which is exactly what indoor work and daily sunscreen reduce. It supports bone health and normal immune function.","advantageZh":"维生素D靠皮肤在阳光下合成，而室内工作和每天防晒恰恰减少了这个过程。它支持骨骼健康和正常免疫功能。","who":"Office workers, people in low-sunlight seasons, and anyone who wears sunscreen daily.","whoZh":"办公室人群、日照少的季节，以及每天涂防晒的人。"},"vitamin-e-chewable":{"advantage":"Vitamin E is fat-soluble and sits inside cell membranes, where it helps protect against oxidative stress. The chewable format with lecithin makes it easier to take consistently than a large softgel.","advantageZh":"维生素E是脂溶性的，驻守在细胞膜内，帮助抵御氧化压力。含卵磷脂的咀嚼型比大颗软胶囊更容易长期坚持。","who":"Adults building a long-term antioxidant base, usually alongside vitamin C and omega-3.","whoZh":"在搭建长期抗氧化基础的成年人，通常与维C和鱼油搭配。"},"advanced-omega":{"advantage":"Concentrated EPA and DHA from fish oil, in a smaller softgel than most triple-strength products. Omega-3 is one of the few nutrients almost impossible to get enough of without eating fatty fish several times a week.","advantageZh":"浓缩鱼油EPA与DHA，软胶囊比多数三倍浓缩产品更小颗。Omega-3是极少数不靠每周吃几次深海鱼就几乎无法摄入足量的营养素之一。","who":"Anyone who rarely eats salmon or sardines. Commonly paired with brain, skin and heart goals.","whoZh":"很少吃三文鱼或沙丁鱼的人。常与大脑、皮肤、心血管目标搭配。"},"calcium-magnesium-d":{"advantage":"Calcium, magnesium and vitamin D work together rather than separately: D supports calcium absorption and magnesium supports how it is used. Taking one without the others is the common mistake.","advantageZh":"钙、镁、维生素D是协同作用而非各自为战：D支持钙的吸收，镁支持钙的利用。只补其中一个是常见误区。","who":"Bone health, evening muscle tension, and anyone told to take calcium who is only taking calcium.","whoZh":"关注骨骼健康、晚间肌肉紧绷的人，以及被建议补钙但只补了钙的人。"},"magnesium":{"advantage":"Magnesium is involved in hundreds of enzyme reactions, including muscle relaxation and nervous system regulation, and it is depleted faster under sustained stress.","advantageZh":"镁参与数百种酶反应，包括肌肉放松和神经系统调节，而持续压力会加快它的消耗。","who":"Evening routines, muscle tightness, and people who feel physically tired but mentally wired at bedtime.","whoZh":"晚间routine、肌肉紧绷，以及睡前身体累但大脑停不下来的人。"},"iron-folic-acid":{"advantage":"Iron carries oxygen in the blood and folic acid supports normal red blood cell formation. The two are paired because they work on the same process.","advantageZh":"铁负责血液运输氧气，叶酸支持正常红细胞生成。两者搭配是因为它们作用于同一个过程。","who":"Women with heavy cycles, vegetarians, and anyone whose tiredness comes with pale skin or breathlessness on stairs. Do not supplement iron long-term without knowing your levels.","whoZh":"经量偏多的女性、素食者，以及疲劳同时伴随面色苍白或爬楼气喘的人。不清楚自身铁水平时不建议长期补铁。"},"plant-protein-powder":{"advantage":"21g of protein from three organic plant sources (pea, brown rice, chia) so the amino acid profile is complete without dairy. Certified organic farms, and it mixes smooth rather than chalky.","advantageZh":"21克蛋白来自三种有机植物来源（豌豆、糙米、奇亚籽），氨基酸谱完整且不含乳制品。有机认证农场，冲调顺滑不粉。","who":"The single most useful product for people who skip breakfast or eat carb-only mornings. Also the go-to for anyone who bloats on whey.","whoZh":"对不吃早餐或早餐纯碳水的人来说，这是最有用的一个产品。喝乳清胀气的人也首选它。"},"organics-all-in-one-bars":{"advantage":"A real-food protein bar from organic ingredients, built to replace the vending-machine snack rather than to be a dessert.","advantageZh":"有机原料的真食物蛋白棒，定位是替代自动贩卖机零食，而不是当甜点。","who":"Busy afternoons, gym bags, and anyone whose 3pm snack is currently a pastry.","whoZh":"忙碌的下午、健身包里，以及现在下午三点靠面包续命的人。"},"green-superfood":{"advantage":"Concentrated organic greens for the days vegetables do not happen. Not a replacement for eating vegetables, a bridge for the days you did not.","advantageZh":"浓缩有机绿蔬，用于没吃上蔬菜的日子。它不替代吃蔬菜，只是没吃到那天的过渡。","who":"People who know their vegetable intake is low and want a realistic fallback rather than a guilt trip.","whoZh":"知道自己蔬菜吃得少、想要一个现实的补救方案而不是自责的人。"},"probiotic":{"advantage":"Clinically studied strains at a meaningful CFU count, in packaging that does not require refrigeration. Most of the immune system lines the gut, which is why this shows up in immunity, skin and digestion conversations alike.","advantageZh":"临床研究菌株，活菌数达到有意义的水平，包装无需冷藏。人体大部分免疫组织分布在肠道，这就是为什么它在免疫、皮肤、消化三类话题里都会出现。","who":"Recurring digestive irregularity, after antibiotics, or as the foundation piece in a gut-first plan.","whoZh":"消化反复不规律、用过抗生素之后，或作为肠道优先方案的基础产品。"},"digestive-enzyme":{"advantage":"Plant-sourced enzymes that help break down protein, fat, carbohydrate and fiber. Different from a probiotic: enzymes work on the meal, probiotics work on the microbiome.","advantageZh":"植物来源的酶，帮助分解蛋白质、脂肪、碳水和纤维。与益生菌不同：酶作用于这一餐，益生菌作用于菌群。","who":"Heavy meals, eating out often, or that uncomfortable fullness after a big dinner.","whoZh":"大餐、经常外食，或晚饭吃多后那种撑得难受的感觉。"},"begin-daily-gi-primer":{"advantage":"A 6-in-1 gut drink combining fermented greens, prebiotics, fiber, digestive enzymes, alkaline spices and postbiotics.","advantageZh":"六合一肠道饮，结合发酵绿蔬、益生元、纤维、消化酶、碱性香料和后生元。它是安利官方Begin 30计划的核心。","who":"People starting a structured gut reset rather than adding one more supplement to an existing pile.","whoZh":"想开始一个结构化肠道重启的人，而不是在现有一堆补充剂上再加一个。"},"sleep-gummies":{"advantage":"Each gummy has 3 mg of melatonin with passionflower and a little magnesium. Melatonin tells the body that night has started, so it helps most when the clock is the problem: jet lag, a late-shifted week, or getting back to a fixed wake time. Use it for occasional nights rather than as a nightly habit.","advantageZh":"每颗软糖含3毫克褪黑素，加上西番莲和少量镁。褪黑素的作用是告诉身体「天黑了」，所以当问题出在生物钟上时最有用：倒时差、作息往后推了一周，或者要把起床时间调回来。偶尔需要的晚上用，而不是每晚都吃。","who":"Occasional trouble falling asleep from travel or a shifted schedule. Not for children, pregnancy or breastfeeding without a doctor, and do not drive or drink alcohol after taking it.","whoZh":"因为出差或作息被打乱而偶尔难以入睡的人。儿童、孕期、哺乳期未经医生同意不要用；吃完不要开车、不要喝酒。"},"go-shield":{"advantage":"Elderberry and vitamin C in a gummy, which matters mainly because a gummy actually gets taken. Compliance beats formulation when nobody swallows the tablet.","advantageZh":"接骨木莓+维C软糖，关键在于软糖是真的会被吃掉。当没人愿意吞药片时，坚持比配方更重要。","who":"Kids, teens, travel season, and adults who genuinely will not take capsules.","whoZh":"孩子、青少年、出行季节，以及真的咽不下胶囊的成年人。"},"twist-tubes":{"advantage":"Twist the cap, shake into water, drink. Single-serve immunity support with no measuring and nothing to carry back.","advantageZh":"拧一下瓶盖，摇进水里，喝掉。单份免疫支持，不用量勺，也没有东西要带回去。","who":"Travel, office drawers, gym bags, and the easiest single item to put in a sampling or gift box.","whoZh":"出行、办公室抽屉、健身包，也是放进试用装或礼盒里最方便的单品。"},"hair-skin-nail":{"advantage":"Biotin, collagen and silicon target the three keratin-based tissues together, because hair, skin and nails are built from the same raw materials.","advantageZh":"生物素、胶原和硅同时作用于三种角蛋白组织，因为头发、皮肤和指甲由同样的原料构成。","who":"Thinning or brittle hair and nails, especially after a stressful period or a restrictive diet.","whoZh":"头发指甲变细变脆的人，尤其在高压期或节食之后。"},"lean-muscle":{"advantage":"CLA-based support intended to be paired with actual resistance training. It supports body composition efforts; it does not replace them.","advantageZh":"以CLA为基础的支持，需要配合真正的力量训练使用。它支持体成分管理，但不能替代训练。","who":"People already training consistently who want support on the body-composition side.","whoZh":"已经在规律训练、想在体成分方面获得支持的人。"},"men-s-pack":{"advantage":"A daily grab-and-go sachet combining the core multivitamin base with nutrients relevant to men. Removes the daily decision of which bottles to open.","advantageZh":"每日随身独立包装，结合核心综合营养基础与男性相关营养素。省去每天要开哪几瓶的决定。","who":"Men who want the foundation covered without managing a shelf of bottles.","whoZh":"想把基础营养补齐、又不想管理一排瓶子的男性。"},"women-s-pack":{"advantage":"A daily sachet combining the multivitamin base with nutrients relevant to women, including iron and calcium support.","advantageZh":"每日独立包装，结合综合营养基础与女性相关营养素，包含铁和钙的支持。","who":"Women who want a single daily habit instead of four separate bottles.","whoZh":"想用一个每日习惯代替四个瓶子的女性。"},"clearguard-allergy":{"advantage":"A botanical blend for seasonal respiratory comfort. Supportive rather than symptom-blocking, so it works best started before the season, not during the worst week.","advantageZh":"植物复方，用于换季呼吸道舒适。它是支持型而非阻断症状型，所以最好在换季前开始，而不是最难受那周才吃。","who":"People with predictable seasonal sensitivity who plan ahead.","whoZh":"换季敏感有规律、愿意提前准备的人。"},"garlic-heart-care":{"advantage":"Standardized garlic concentrate with the odor controlled, so it is realistic to take daily. Cardiovascular support is a decades-long maintenance job, which makes daily consistency the whole point.","advantageZh":"标准化大蒜浓缩，控味处理，所以每天吃是现实的。心血管保养是几十年的功课，因此每天坚持才是关键。","who":"Adults building long-term cardiovascular habits, often alongside omega-3.","whoZh":"在建立长期心血管保养习惯的成年人，常与鱼油搭配。"},"liver-support":{"advantage":"Milk thistle and botanical extracts supporting normal liver function. The liver handles everything you drink, eat and breathe, and it rarely complains until late.","advantageZh":"奶蓟草与植物萃取，支持正常肝功能。肝脏处理你喝的、吃的、呼吸的一切，而且往往到很晚才发出信号。","who":"People with frequent social drinking, heavy takeout diets, or high medication load. Not a substitute for medical care.","whoZh":"经常应酬饮酒、外卖为主，或用药较多的人。不能替代就医。"},"memory-builder":{"advantage":"Cistanche extract, studied specifically for memory support, which is a narrower and better-evidenced claim than general brain blends.","advantageZh":"管花肉苁蓉萃取，针对记忆力支持有专门研究，比泛泛的健脑复方更聚焦、证据更明确。","who":"Adults noticing more word-finding pauses, and people with family history who want to act early.","whoZh":"开始注意到话到嘴边想不起来的成年人，以及有家族史、想早点行动的人。"},"prostate-health":{"advantage":"Saw palmetto and nettle root, the two most studied botanicals for men's prostate health.","advantageZh":"锯棕榈与荨麻根，男性前列腺健康研究最充分的两种植物成分。","who":"Men 40 and over, particularly those getting up at night.","whoZh":"40岁以上男性，尤其是夜里起夜的人。"},"slimmetry":{"advantage":"Green tea extract standardized for EGCG, designed to support a weight-management effort that already includes diet and movement.","advantageZh":"标准化EGCG的绿茶萃取，用于支持已经包含饮食和运动的体重管理计划。","who":"People actively working on weight who want support at the margin. It does not work as a standalone.","whoZh":"正在认真管理体重、想要边际助力的人。单独使用无效。"},"vision-health":{"advantage":"Lutein and zeaxanthin are the pigments concentrated in the macula that filter high-energy light, and the body cannot make them. They have to come from diet or supplement.","advantageZh":"叶黄素和玉米黄质是黄斑区的色素，负责过滤高能光线，而人体无法自行合成，只能从饮食或补充剂获得。","who":"Anyone on screens all day or driving at night. This is a screen-generation product, not just an older-adult one.","whoZh":"整天对着屏幕或夜间开车的人。这是屏幕世代的产品，不只是给长辈的。"},"eye-mojo-blue-light-gummies":{"advantage":"Eye support in a gummy, aimed squarely at screen time. Easier to keep on a desk than a bottle of capsules.","advantageZh":"软糖形态的护眼支持，直接针对屏幕时间。放在办公桌上比一瓶胶囊更容易坚持。","who":"Students, gamers, and desk workers who will actually eat a gummy at 3pm but never open a bottle.","whoZh":"学生、游戏玩家、办公族，下午三点会吃颗软糖，但永远不会打开一个瓶子。"},"xs-energy-drinks-12-pack":{"advantage":"Zero sugar, B-vitamin based energy rather than a sugar spike, and it actually tastes good enough to repeat. The 12-pack is the format that gets shared.","advantageZh":"零糖，靠B族提供能量而不是糖分冲击，而且好喝到愿意回购。12罐装是最容易被分享的规格。","who":"The easiest first purchase for students and young professionals, and the fastest-moving item in a dorm or office.","whoZh":"学生和职场新人最容易的第一单，也是宿舍或办公室里走得最快的产品。"},"xs-energy-focus-60ct":{"advantage":"Caffeine plus focus ingredients in a tablet, so you get the effect without carrying a can or drinking 12 oz of liquid.","advantageZh":"咖啡因+专注成分的片剂，不用带罐子也不用喝下12盎司液体就能起效。","who":"Exam weeks, long drives, and anyone who wants the energy without the volume.","whoZh":"考试周、长途开车，以及想要能量但不想喝那么多液体的人。"},"xs-grass-fed-whey-protein":{"advantage":"Grass-fed whey, third-party tested for banned substances. In a category where testing is the exception rather than the rule, that is the actual differentiator worth leading with.","advantageZh":"草饲乳清，第三方禁药检测。在一个检测属于例外而非常态的品类里，这才是真正值得先讲的差异点。","who":"Serious trainers and competitive athletes who need to know what is in the tub. Also the opening product for any gym conversation.","whoZh":"认真训练的人和需要清楚成分的竞技运动员。也是所有健身房洽谈的开场产品。"},"xs-muscle-multiplier-eaas":{"advantage":"Nine essential amino acids, the ones the body cannot synthesize. Useful intra- or post-workout when a full protein shake is too heavy.","advantageZh":"9种必需氨基酸，即身体无法自行合成的那些。训练中或训练后，全份蛋白粉太沉时很实用。","who":"Lifters in a cut, fasted trainers, and anyone who trains before eating.","whoZh":"减脂期的训练者、空腹训练者，以及练完才吃饭的人。"},"xs-pre-workout-boost":{"advantage":"Pre-workout push without the jittery crash profile of high-stimulant products.","advantageZh":"训练前激活，没有高刺激产品那种心慌和随后的崩溃感。","who":"Early-morning or after-work training when motivation is the limiting factor.","whoZh":"清晨或下班后训练、动力才是瓶颈的时候。"},"xs-post-workout-recovery":{"advantage":"Recovery formula for the window right after training, when muscle is most receptive to nutrients.","advantageZh":"训练后恢复配方，用在肌肉对营养最敏感的那个窗口。","who":"People training four or more times a week who feel the accumulation.","whoZh":"每周训练四次以上、能感觉到疲劳累积的人。"},"xs-ignite-thermogenic-powder":{"advantage":"A thermogenic blend for people already in a structured training and nutrition plan.","advantageZh":"生热配方，适合已经有结构化训练和饮食计划的人。","who":"Active people in a defined cutting phase. Not a starting point for someone new.","whoZh":"处在明确减脂期的运动人群。不适合作为新手的起点。"},"xs-protein-bars-12-pack":{"advantage":"Protein bars that are a snack replacement rather than a candy bar with protein added.","advantageZh":"定位是零食替代的蛋白棒，而不是加了蛋白质的糖果棒。","who":"Gym bags, desk drawers, and long days when the alternative is skipping food entirely.","whoZh":"健身包、办公抽屉，以及那种不吃就等于不吃的漫长一天。"},"xs-rtd-protein-shakes-12-pack":{"advantage":"Ready to drink, zero preparation. The format that survives contact with a real schedule.","advantageZh":"开盖即饮，零准备。这是能在真实日程里活下来的形态。","who":"Morning commutes and post-gym, for people who will not wash a shaker bottle.","whoZh":"通勤路上和练完之后，适合不愿意洗摇摇杯的人。"},"xs-protein-crisps":{"advantage":"A crunchy high-protein snack for the salty-craving slot that chips usually fill.","advantageZh":"高蛋白脆片，填补通常被薯片占据的那个咸口零食位。","who":"People managing weight whose weak point is savory snacking, not sweets.","whoZh":"管理体重、但弱点是咸口零食而非甜食的人。"},"xs-cocowater-12-pack":{"advantage":"Coconut water with electrolytes for rehydration, without the sugar load of a sports drink.","advantageZh":"含电解质的椰子水补水，没有运动饮料那么高的糖负担。","who":"Hot-weather training, hangovers, and anyone who finds plain water boring.","whoZh":"高温训练、宿醉之后，以及觉得白水太寡淡的人。"},"perfect-empowered-drinking-water":{"advantage":"Purified, oxygenated and pH-balanced bottled water, sold by the case.","advantageZh":"净化、富氧、pH平衡的瓶装水，整箱销售。","who":"Events, offices and gatherings. Mainly a convenience and hosting item rather than a nutrition decision.","whoZh":"活动、办公室、聚会场合。它更多是便利和待客用品，而不是一个营养决策。"},"artistry-hydrating-lotion-spf30":{"advantage":"Daily moisture with broad-spectrum SPF 30, so hydration and sun protection happen in one step instead of two products people skip.","advantageZh":"日常保湿+广谱SPF30防晒，保湿和防晒一步完成，不用买两个然后两个都不用。","who":"Anyone whose morning routine needs to be short enough to actually happen.","whoZh":"早晨流程必须够短才做得到的人。"},"artistry-hydrating-day-lotion-spf30":{"advantage":"Lightweight day lotion with SPF for skin that feels tight by afternoon.","advantageZh":"轻盈日霜含防晒，适合下午会感到紧绷的皮肤。","who":"Dehydrated skin types and anyone in air-conditioned offices all day.","whoZh":"缺水肌，以及整天待在空调房的人。"},"artistry-hydrating-eye-gel-cream":{"advantage":"A cooling gel-cream texture for the eye area, lighter than a traditional eye cream so it works under makeup.","advantageZh":"眼周清凉啫喱霜质地，比传统眼霜更轻盈，可以在妆前使用。","who":"Screen fatigue, early morning puffiness, and first-time eye-care users.","whoZh":"屏幕疲劳、清晨浮肿，以及第一次用眼部产品的人。"},"artistry-hydrating-system-bundle":{"advantage":"The full hydrating routine, cleanse, tone, moisturize, bought as one decision instead of three.","advantageZh":"完整水润流程：清洁、爽肤、保湿，一次决定代替三次。","who":"People starting a real routine for the first time, and the simplest gift for skincare beginners.","whoZh":"第一次开始认真护肤的人，也是送护肤新手最简单的礼物。"},"artistry-renewing-day-lotion-spf30":{"advantage":"Peptide-based renewal with daily SPF, targeting early lines while preventing the sun exposure that causes more.","advantageZh":"胜肽焕新配方+每日防晒，在处理初期细纹的同时防止造成更多细纹的日晒。","who":"First fine lines, typically late twenties onward.","whoZh":"刚出现细纹的人，一般是二十多岁后期开始。"},"artistry-renewing-system-bundle":{"advantage":"The complete peptide renewal routine in one set, which also removes the guesswork about layering order.","advantageZh":"完整胜肽焕新流程一套配齐，也省去了叠加顺序的困扰。","who":"Upgrading from a basic moisturizer to a structured anti-aging routine.","whoZh":"从基础保湿升级到结构化抗老流程的人。"},"artistry-firming-system-bundle":{"advantage":"A firming-focused routine for elasticity and bounce rather than surface hydration.","advantageZh":"主打紧致的流程，针对弹性和饱满度而非表层保湿。","who":"Skin that looks hydrated but has started to lose definition along the jaw.","whoZh":"看起来不干、但下颌线开始模糊的皮肤。"},"artistry-defying-serum":{"advantage":"A phyto-peptide serum positioned for early aging signs, before heavier treatment products are needed.","advantageZh":"植物胜肽精华，定位在初老阶段，在需要更强效产品之前使用。","who":"People who want to start prevention rather than correction.","whoZh":"想做预防而不是补救的人。"},"artistry-labs-illuminating-serum":{"advantage":"Clinical-strength brightening from the Artistry Labs line, aimed at uneven tone and post-blemish marks.","advantageZh":"Artistry Labs线的临床级亮白，针对肤色不均和痘后印记。","who":"Pigmentation and acne marks that a basic routine has not moved.","whoZh":"基础护肤解决不了的色素沉着和痘印。"},"artistry-labs-retexturizing-serum":{"advantage":"Resurfacing serum for texture and pore appearance, the Labs line's answer to roughness rather than dryness.","advantageZh":"焕肤精华，针对肤质和毛孔外观，是Labs线对粗糙而非干燥的答案。","who":"Rough texture, enlarged pores, and skin that looks dull despite being moisturized.","whoZh":"肤质粗糙、毛孔明显，保湿做够了但看起来还是暗沉的皮肤。"},"artistry-labs-retexturizing-system":{"advantage":"An at-home device system paired with the retexturizing formula, bringing a clinic-style protocol home.","advantageZh":"居家仪器系统搭配焕肤配方，把类似诊所的护理流程搬回家。","who":"Committed skincare users comfortable with a device-based routine. A considered purchase, not an impulse one.","whoZh":"愿意投入、能接受仪器流程的护肤用户。这是一个需要考虑的购买，不是冲动消费。"},"artistry-longxevity-creams":{"advantage":"The flagship of the entire Artistry line, available in soft and rich textures for different skin needs and seasons.","advantageZh":"整个Artistry线的旗舰，有轻润和丰润两种质地对应不同肤质和季节。","who":"The premium tier. Usually bought by someone already committed to the brand.","whoZh":"高端线。通常是已经认可品牌的人才会买。"},"artistry-longxevity-eye-cream":{"advantage":"The premium eye treatment in the LongXevity line, formulated for deeper-set lines than a hydrating eye gel addresses.","advantageZh":"LongXevity线的高端眼部护理，针对比保湿眼胶所能处理的更深的纹路。","who":"Mature skin where a lightweight eye gel is no longer enough.","whoZh":"轻盈眼胶已经不够用的成熟肌。"},"artistry-intensive-skincare-14-night-reset":{"advantage":"A 14-night ampoule course, each night in a sealed single dose so the active stays fresh and the dosing stays consistent.","advantageZh":"14夜安瓶疗程，每晚一支独立密封，保证活性成分新鲜、用量一致。","who":"Before a wedding or event, or as a seasonal reset. Finite programs are easier to commit to than open-ended ones.","whoZh":"婚礼或重要场合前，或作为换季重启。有明确终点的疗程比无限期的更容易坚持。"},"artistry-everyday-skin-solution-bundle":{"advantage":"The everyday essentials bundled at a set price, covering the basics without choosing between twelve products.","advantageZh":"日常必需品打包定价，覆盖基础需求，不用在十二个产品里做选择。","who":"Beginners, and the most reliable skincare gift because it is complete.","whoZh":"护肤新手，也是最保险的护肤礼物，因为它是完整的。"},"artistry-signature-select-brightening-mask":{"advantage":"A targeted treatment mask for tone and radiance, used weekly rather than daily.","advantageZh":"针对肤色与光泽的护理面膜，每周使用而非每天。","who":"Dull skin, and the night before something that matters.","whoZh":"暗沉肌，以及重要场合的前一晚。"},"artistry-signature-select-purifying-mask":{"advantage":"A deep-cleaning mask that draws out excess oil and congestion from pores.","advantageZh":"深层清洁面膜，吸附毛孔中过多的油脂和堵塞物。","who":"Oily and combination skin with blackheads or frequent clogged pores.","whoZh":"有黑头、毛孔易堵的油性和混合性肌肤。"},"artistry-signature-select-firming-mask":{"advantage":"A firming treatment mask for a short-term lift and longer-term elasticity support.","advantageZh":"紧致护理面膜，兼顾短期提拉和长期弹性支持。","who":"Special occasions, and skin starting to lose bounce.","whoZh":"重要场合，以及开始失去饱满度的皮肤。"},"artistry-studio-eye-look-rested":{"advantage":"A de-puffing eye product for mornings after short sleep. Cosmetic and immediate rather than long-term treatment.","advantageZh":"晨间去浮肿眼部产品，适合没睡够的早上。效果是即时的妆效，而非长期护理。","who":"Late nights, early meetings, and travel.","whoZh":"熬夜、早会、出差。"},"artistry-men-face-wash":{"advantage":"A face wash formulated for typically oilier, thicker male skin, without stripping it.","advantageZh":"针对通常更油、角质更厚的男性肌肤设计的洁面，但不会过度清洁。","who":"Men whose current routine is bar soap. The easiest first step.","whoZh":"目前还在用香皂洗脸的男性。最容易的第一步。"},"artistry-signature-select-polishing-mask":{"advantage":"A gentle polishing mask that smooths surface texture without the harshness of a scrub.","advantageZh":"温和的焕肤面膜，改善表层肤质但没有磨砂的粗暴感。","who":"Rough or flaky texture, especially in winter.","whoZh":"肤质粗糙或起皮，尤其在冬天。"},"artistry-studio-spot-on-dots":{"advantage":"Hydrocolloid patches that protect a blemish overnight and stop you touching it, which is half the problem.","advantageZh":"水胶体贴片，整夜保护痘痘并阻止你去碰它，而碰它正是问题的一半。","who":"Teens and adults with occasional spots. The single most giftable skincare item.","whoZh":"偶发痘痘的青少年和成人。也是最适合当小礼物的护肤单品。"},"glister-toothpaste":{"advantage":"A concentrated formula, so a pea-sized amount is genuinely enough and one tube lasts far longer than it looks. Includes a g ok-4-piece-saucepan-set":{"advantage":"Saucepans for sauces, grains and small-batch cooking.","advantageZh":"汤锅套装，用于酱汁、谷物和少量烹调。","who":"Small households and couples cooking for two.","whoZh":"小家庭和两人份烹饪。"},"icook-4-piece-stock-pot":{"advantage":"A 4-quart stock pot for soups, stews and batch cooking.","advantageZh":"4夸脱深汤锅，用于煲汤、炖煮和批量备餐。","who":"Meal preppers and anyone who cooks soup weekly.","whoZh":"做备餐的人，以及每周煲汤的人。"},"icook-6-piece-dutch-oven":{"advantage":"An 8-quart Dutch oven for family-sized braising and slow cooking.","advantageZh":"8夸脱荷兰锅，适合家庭份量的焖炖和慢煮。","who":"Larger families and anyone who entertains.","whoZh":"人口较多的家庭，以及经常请客的人。"},"icook-9-5-nonstick-frypan":{"advantage":"PFAS-free nonstick with a lid, for eggs and delicate foods where stainless is harder to manage.","advantageZh":"无PFAS不粘煎锅带盖，适合鸡蛋和其他用不锈钢较难处理的娇嫩食材。","who":"Everyday breakfast use. The PFAS-free point matters to anyone who has read about older nonstick coatings.","whoZh":"日常早餐使用。无PFAS这点对了解过旧式不粘涂层的人很重要。"},"icook-11-nonstick-frypan":{"advantage":"The larger PFAS-free nonstick pan, sized for cooking for more than one or two.","advantageZh":"更大尺寸的无PFAS不粘煎锅，适合两人以上的分量。","who":"Families, and stir-frying where a small pan crowds the food.","whoZh":"家庭使用，以及小锅会把菜挤在一起的爆炒场景。"},"icook-5-piece-knifeware-set":{"advantage":"A precision knife set with a storage block. Sharp knives are safer than dull ones because they do not slip.","advantageZh":"精工刀具套装带刀座。锋利的刀比钝刀更安全，因为不会打滑。","who":"Home cooks still using one dull all-purpose knife.","whoZh":"还在用一把钝了的万能刀的家庭厨师。"},"icook-multipurpose-shears":{"advantage":"Kitchen shears that separate for cleaning, which is the detail that decides whether you actually use them.","advantageZh":"可拆卸清洗的厨房剪，这个细节决定了你会不会真的用它。","who":"The best first iCook purchase: low price, used immediately, and it opens the cookware conversation.","whoZh":"最好的iCook入门单品：价格低、马上就能用，而且能打开锅具的话题。"},"begin-30-holistic-wellness-solution":{"advantage":"Amway's official 30-day program: GI Primer, Plant Protein and Probiotic, paired with the Wellbeing+ app for daily tracking. Structure and tracking are why people finish it.","advantageZh":"安利官方30天计划：肠道启动粉、植物蛋白、益生菌，配合Wellbeing+ App每日打卡。有结构和追踪，才是人们能坚持完的原因。","who":"People who have tried and abandoned unstructured plans. A defined end date changes completion rates.","whoZh":"试过并放弃无结构计划的人。有明确终点会改变完成率。"},"everyday-nutrition-solution":{"advantage":"The official foundation stack: Double X, Plant Protein and Advanced Omega, bundled. It covers the three most common gaps in one order.","advantageZh":"官方基础组合：双X、植物蛋白、深海鱼油打包。一单覆盖三个最常见的缺口。","who":"The default recommendation when someone asks where to start.","whoZh":"有人问从哪开始时的默认答案。"},"sleep-stress-solution":{"advantage":"The official evening stack built around Sweet Dreams gummies and calming botanicals.","advantageZh":"官方晚间组合，以甜梦软糖和舒缓植物配方为核心。","who":"The wired-but-tired pattern, which is the most common complaint in this client base.","whoZh":"身体累但大脑停不下来，这是这个客户群里最常见的主诉。"},"healthy-aging-solution":{"advantage":"The official healthy-aging bundle: turmeric, Cal Mag D, Garlic Heart Care and Vision Health together.","advantageZh":"官方抗龄套装：姜黄、钙镁D、大蒜精华、护眼配方组合。","who":"Adults over 40 building a maintenance routine rather than chasing a single symptom.","whoZh":"40岁以上、在建立保养习惯而非追着某个症状跑的成年人。"},"energy-solution":{"advantage":"The official energy bundle, pairing foundational micronutrients with energy support.","advantageZh":"官方能量套装，基础微量营养素搭配能量支持。","who":"Persistent low energy where no single deficiency is obvious.","whoZh":"持续没精神但看不出明确单一缺口的人。"},"xs-fitness-jump-start-solution":{"advantage":"XS protein plus workout support, bundled to start a training habit with the nutrition side already handled.","advantageZh":"XS蛋白加训练支持打包，让你开始训练习惯时营养那一半已经安排好。","who":"New gym memberships, and anyone restarting after a long break.","whoZh":"刚办健身卡的人，以及长时间中断后重新开始的人。"},"prebiotic-fiber":{"advantage":"Probiotics add bacteria; prebiotic fiber feeds the ones already living in you. Most adults get about half the fiber they need, which is why a probiotic alone often underdelivers. Dissolves clear with no grit, so it goes into coffee or water without a texture argument.","advantageZh":"益生菌是加菌，益生元纤维是喂你本来就有的菌。大多数成年人纤维摄入只有需要量的一半左右，这就是为什么单吃益生菌常常效果打折。冲开无色无渣，加进咖啡或水里不会有口感上的抵触。","who":"Anyone who has tried a probiotic and felt nothing, eats out most days, or goes less than once a day.","whoZh":"吃过益生菌但没感觉、经常在外面吃、或者排便不到一天一次的人。"},"metabolic-pre-postbiotic":{"advantage":"Postbiotics are what the bacteria produce, not the bacteria themselves, so the benefit does not depend on whether the strains survive the trip. Paired with a prebiotic here so the two work on the same axis: what feeds the microbiome and what the microbiome makes.","advantageZh":"后生元是菌产出的代谢物，不是菌本身，所以效果不取决于菌株能不能活着到达肠道。这里配上益生元，两者作用在同一条轴上：一个喂菌群，一个是菌群的产物。","who":"People working on weight or metabolic markers who already eat reasonably and want the gut side covered.","whoZh":"已经吃得还算规律、在处理体重或代谢指标、想把肠道这一环补上的人。"},"stress-relief-probiotic":{"advantage":"The gut makes a large share of the body's serotonin, which is why gut and mood track together. This uses strains selected for gut-brain research rather than general digestive strains, so it is a different job from a standard probiotic.","advantageZh":"人体大部分血清素在肠道生成，这就是为什么肠道和情绪总是同步波动。这款用的是针对肠脑轴研究筛选的菌株，不是普通的助消化菌株，做的是不一样的事。","who":"People whose stomach reacts first when they are under pressure, or who lie awake with a busy head.","whoZh":"一紧张先闹肚子的人，或者躺下后脑子停不下来睡不着的人。"},"cycle-support":{"advantage":"Chasteberry has the longest research history of any botanical used for cycle comfort. The point of a cycle formula is that it is taken continuously through the month, not only on the difficult days, because the rhythm you are supporting is monthly rather than daily.","advantageZh":"圣洁莓是周期类植物成分里研究历史最长的一味。周期类配方的逻辑是整月连续吃，而不是只在难受的那几天吃，因为你要支持的是月节律，不是日节律。","who":"Women with predictable premenstrual mood shifts, breast tenderness, or breakouts that arrive on schedule along the jaw.","whoZh":"经前情绪波动、乳房胀痛，或者下颌线上准时报到的痘痘，这类有规律可循的女性。"},"sleep-health":{"advantage":"One capsule gives 3 mg of plant melatonin from tomato extract, plus chamomile. Melatonin tells your body it is night, so it suits nights where timing is the problem: falling asleep late, travel, or a schedule that has drifted. It is meant for occasional sleepless nights rather than every night.","advantageZh":"每粒含来自番茄提取物的3毫克植物褪黑素，外加洋甘菊。褪黑素告诉身体「天黑了」，所以适合问题出在时间上的晚上：入睡太晚、出差，或者作息慢慢往后漂移了。它用于偶尔睡不着的晚上，而不是每晚。","who":"Occasional sleeplessness, jet lag or a late-drifting schedule. Ask a doctor first if you are pregnant, breastfeeding, or take sedatives or blood thinners, and do not drive after taking it.","whoZh":"偶尔失眠、倒时差，或者作息越来越晚的人。怀孕、哺乳，或者在服用镇静类药物、抗凝药的人，先问医生；吃完不要开车。"},"joint-health":{"advantage":"Glucosamine supplies raw material for cartilage; collagen supplies raw material for the connective tissue around it. Joint work is a repair project measured in months, so the mistake most people make is stopping at week three.","advantageZh":"氨糖提供软骨的原料，胶原蛋白提供关节周围结缔组织的原料。关节是一个以月为单位的修复工程，多数人犯的错是第三周就停了。","who":"People over 40, or anyone whose knees complain on stairs after a decade of running.","whoZh":"40岁以上，或者跑了十年步之后上下楼梯膝盖就抗议的人。"},"concentrated-fruits-vegetables":{"advantage":"Each plant colour carries a different phytonutrient family, and almost nobody eats across all five in a week. This concentrates five colour groups into capsules, which is a floor under your diet, not a replacement for it.","advantageZh":"每种植物颜色对应一类不同的植物营养素，而几乎没有人能在一周内把五色吃全。这款把五个色系浓缩进胶囊，它是给饮食兜底，不是替代饮食。","who":"People whose vegetable intake is honestly two or three types on repeat, and travellers.","whoZh":"老实说蔬菜就那两三样来回吃的人，以及经常出差的人。"},"immunity-defense-zinc-holy-basil":{"advantage":"Zinc is the mineral immune cells run out of first, and holy basil is an adaptogen, meaning it works on the stress side of immunity rather than the pathogen side. Stress-driven and season-driven immune dips are different problems and this covers the first.","advantageZh":"锌是免疫细胞最先耗尽的矿物质，而圣罗勒是适应原，作用在免疫的压力端而不是病原端。压力型和季节型的免疫下滑是两回事，这款管的是前者。","who":"People who get sick right after a deadline or a stretch of poor sleep, not randomly.","whoZh":"不是随机生病，而是一赶完项目、一连着熬几天就倒下的人。"},"immunity-echinacea":{"advantage":"Echinacea is the most-studied immune botanical in Western herbal medicine. The usage detail that matters: it is designed for short intensive runs around a period of exposure, not as a year-round daily, which is the opposite of how most people use it.","advantageZh":"紫锥菊是西方草药里研究最多的免疫植物。关键用法：它是设计给暴露期前后短期集中服用的，不是全年天天吃，这跟多数人的用法正好相反。","who":"Travel weeks, flu season, or the fortnight after a child brings something home from school.","whoZh":"出差周、流感季，或者孩子从学校带回点什么之后的那两周。"},"heart-health-coq10":{"advantage":"Heart muscle has the highest concentration of mitochondria of any tissue, and CoQ10 is what those mitochondria use to make energy. Body production drops with age, and statins lower it further, which is why this is the single most common addition for people on that medication.","advantageZh":"心肌是全身线粒体密度最高的组织，而辅酶Q10正是线粒体产能所用。人体自身合成量随年龄下降，他汀类药物会进一步降低它，这就是为什么服用该类药物的人最常补的就是这一个。","who":"Adults over 45, and anyone whose doctor has them on a statin.","whoZh":"45岁以上的成年人，以及医生给开了他汀的人。"},"carb-blocker":{"advantage":"White kidney bean extract slows the enzyme that breaks starch into sugar, so part of a starch-heavy meal passes through instead of spiking blood sugar. It is a tool for specific meals, taken before them, not a daily supplement.","advantageZh":"白芸豆提取物抑制把淀粉分解成糖的那个酶，让一部分淀粉直接通过而不引起血糖飙升。它是针对特定一餐的工具，饭前吃，不是每天必补的营养品。","who":"People who cannot avoid rice, noodles or bread at certain meals and want to blunt the curve.","whoZh":"某几餐避不开米饭面条面包、想把血糖曲线压平一点的人。"},"wellness-bars":{"advantage":"The test for a bar is the first three ingredients. A candy bar with added protein leads with sugar; a whole-food bar leads with nuts, fruit or oats. That is the entire difference and it decides whether the bar helps or hurts.","advantageZh":"判断一根棒子看前三位配料。加了蛋白质的糖果棒第一位是糖；全食物棒第一位是坚果、水果或燕麦。区别就在这里，也决定了它是帮你还是害你。","who":"People who skip meals then over-eat at night, and anyone who needs something in a bag.","whoZh":"经常不吃正餐结果晚上暴食的人，以及需要在包里常备一点东西的人。"},"organics-all-in-one-shakes":{"advantage":"A meal replacement only works if it actually replaces the meal, which means protein, fiber and micronutrients in one glass rather than protein alone. Protein-only shakes leave you hungry in ninety minutes and that is why people abandon them.","advantageZh":"代餐要真的能替代一餐才算数，也就是一杯里要同时有蛋白质、纤维和微量营养素，而不是只有蛋白质。只有蛋白质的奶昔九十分钟后就饿，这就是人们坚持不下去的原因。","who":"People who skip breakfast, or who want the decision taken out of one meal a day.","whoZh":"不吃早餐的人，或者想把一天中一餐的选择题直接取消掉的人。"},"organics-turmeric-capsules":{"advantage":"Turmeric's problem has always been absorption, so what matters in a turmeric product is the delivery form, not the milligram number on the front. Inflammatory balance is a background process, so this is measured in months, not days.","advantageZh":"姜黄一直以来的问题是吸收率，所以看姜黄产品要看剂型工艺，而不是正面标的毫克数。炎症平衡是一个后台过程，要按月看，不是按天看。","who":"People with stiffness that is worse in the morning, or recurring skin flare-ups.","whoZh":"早上起来更僵硬的人，或者皮肤反复起疹的人。"},"organics-ashwagandha-capsules":{"advantage":"Adaptogens do not sedate you; they moderate the cortisol response, which is why ashwagandha can help someone sleep at night and stay steadier during the day from the same dose. Evening dosing suits most people.","advantageZh":"适应原不是镇静剂，它调节的是皮质醇反应，所以同一个剂量既能帮人晚上睡好，又能让白天更稳。多数人放在晚上吃更合适。","who":"People carrying sustained pressure, wired at bedtime and flat by mid-afternoon.","whoZh":"长期高压、晚上躺下反而清醒、下午三点就没电的人。"},"organics-lion-s-mane-capsules":{"advantage":"Lion's mane is studied for nerve growth factor rather than for stimulation, so it does not feel like caffeine and you should not expect it to. The reported effect is fewer word-finding pauses and steadier focus over weeks.","advantageZh":"猴头菇的研究方向是神经生长因子，不是提神，所以它的体感不像咖啡因，也不该期待它像。反馈到的效果是几周后想词卡壳变少、专注更稳。","who":"Knowledge workers, students, and anyone who noticed their recall slipping after 40.","whoZh":"脑力工作者、学生，以及40岁后发现记性变差的人。"},"men-s-daily-multivitamin":{"advantage":"A one-tablet multi is a different product from a multi-pack: lower doses, but a dose you will actually take every day beats a better dose you abandon in week two. Compliance is the variable that decides outcomes here.","advantageZh":"单片综合维生素和综合营养包是两类产品：剂量更低，但一个你能天天吃下去的剂量，胜过一个你第二周就放弃的更好剂量。决定结果的变量是坚持度。","who":"Men starting out who want one tablet, or who found Double X too much to keep up with.","whoZh":"刚开始想简单吃一片的男性，或者觉得倍立健坚持不下来的人。"},"women-s-daily-multivitamin":{"advantage":"Women's formulas differ mainly in iron, folate and calcium, which reflect real physiological differences rather than marketing. One tablet daily is the format most people can sustain for a year, which is the timescale that matters.","advantageZh":"女性配方的差别主要在铁、叶酸和钙，这反映的是真实的生理差异，不是营销话术。每天一片是多数人能坚持一年的剂型，而一年才是有意义的时间尺度。","who":"Women starting out, or anyone who wants a simple daily floor under their nutrition.","whoZh":"刚开始补充的女性，或者想给日常营养一个简单底线的人。"},"organics-men-s-daily-gummies":{"advantage":"The best supplement is the one that gets taken. For people who gag on tablets or forget them, a gummy that gets eaten daily outperforms a tablet sitting in a cupboard, and that is not a compromise, it is the whole point.","advantageZh":"最好的营养品是那个真的被吃掉的。对于吞不下药片或者总是忘记的人来说，每天真吃掉的软糖胜过柜子里的药片，这不是妥协，这就是重点。","who":"People with a tablet aversion, and anyone whose supplement bottle is still half full after six months.","whoZh":"咽不下药片的人，以及那瓶营养品放了半年还剩一半的人。"},"organics-women-s-daily-gummies":{"advantage":"Same logic as the men's gummy with a women's nutrient profile: iron and folate weighted differently. Being organic-certified matters more in a chewable because you are also eating the base, not just the actives.","advantageZh":"逻辑和男士软糖一样，但换成女性营养配比：铁和叶酸的权重不同。有机认证在咀嚼剂型里更重要，因为你连基质一起吃下去，不只是有效成分。","who":"Women who will not take tablets, and anyone building a habit from zero.","whoZh":"不肯吃药片的女性，以及从零开始建立习惯的人。"},"collagen-shots":{"advantage":"Collagen research uses hydrolysed peptides at a specific dose, and a shot delivers that dose without a scoop, a shaker or a decision. The convenience is not a gimmick; daily consistency is what the studies are actually measuring.","advantageZh":"胶原蛋白的研究用的是特定剂量的水解肽，而即饮装直接给到这个剂量，不用勺子、不用摇杯、不用做决定。便利不是噱头，研究真正测量的就是每日的坚持度。","who":"People who have bought collagen powder before and stopped using it.","whoZh":"以前买过胶原蛋白粉然后就搁置了的人。"},"collagen-gummies":{"advantage":"Skin collagen turns over on a roughly twelve-week cycle, so this is a three-month product judged at three months, not three weeks. The gummy format exists because the twelve-week version of you needs to still be taking it.","advantageZh":"皮肤胶原大约以十二周为一个更新周期，所以这是一个三个月的产品，看三个月的结果，不看三周。做成软糖，是因为十二周后的你还得在吃。","who":"People starting collagen for the first time who want the lowest-friction format.","whoZh":"第一次开始吃胶原、想要最低门槛剂型的人。"},"collagen-peptides":{"advantage":"Unflavoured peptides dissolve into coffee, soup or a smoothie without changing the taste, which means they attach to a habit you already have instead of asking you to build a new one. That is the most reliable way a supplement survives.","advantageZh":"无味肽粉可以溶进咖啡、汤或者奶昔里而不改变味道，也就是说它挂靠在你已有的习惯上，而不是要求你新建一个习惯。这是营养品能坚持下来最可靠的方式。","who":"People already drinking coffee every morning, and anyone wanting to control their own dose.","whoZh":"每天早上都喝咖啡的人，以及想自己控制剂量的人。"},"kids-daily-chewable-multivitamin":{"advantage":"With children, format is the entire strategy. A chewable that gets eaten every morning does more than a superior tablet that turns into a daily fight. Growth years also raise requirements for the exact nutrients picky eating removes.","advantageZh":"对孩子来说，剂型就是全部策略。每天早上真被吃掉的咀嚼片，比一片更好但天天要打仗的药片有用得多。而长身体的年纪恰恰提高了挑食最容易缺的那几种营养素的需求。","who":"Picky eaters, growth-spurt years, and families who want one thing that works for everyone.","whoZh":"挑食的孩子、正在长个子的年纪，以及想全家统一用一样东西的家庭。"},"kids-toddler-immunity-drops":{"advantage":"Toddlers cannot chew safely, so drops are not a lesser format, they are the only correct one below about three years old. Drops also let you scale the dose to a small body instead of splitting a tablet.","advantageZh":"幼儿不能安全咀嚼，所以滴剂不是次一等的剂型，在大约三岁以下它是唯一正确的剂型。滴剂还能按小身体的体重调整剂量，而不是掰药片。","who":"Toddlers, and children in their first year of daycare or preschool.","whoZh":"幼儿，以及第一年上托班或幼儿园的孩子。"},"kids-brainiums-dha-jelly":{"advantage":"About 60% of the brain by dry weight is fat, and DHA is the dominant structural fatty acid in it. Children build that structure now, from dietary supply, and fish twice a week is the intake most families are not hitting.","advantageZh":"大脑干重约60%是脂肪，而DHA是其中占主导的结构性脂肪酸。孩子现在正在搭这个结构，原料来自饮食供给，而每周两次鱼，是多数家庭达不到的摄入量。","who":"Children who do not eat fish, and school-age kids in demanding academic years.","whoZh":"不吃鱼的孩子，以及学业压力大的学龄儿童。"},"xs-sparkling-juiced-energy-12-pack":{"advantage":"Real juice base with zero sugar is a harder formulation than a synthetic flavour with zero sugar, and it is the reason this drinks like a soft drink rather than like a supplement. Same B-vitamin and caffeine structure as the rest of the XS line.","advantageZh":"真果汁基底加零糖，配方难度高于合成香精加零糖，这也是为什么它喝起来像汽水而不像营养品。B族维生素和咖啡因结构与XS其他产品一致。","who":"People switching off sugary energy drinks who still want something that tastes like one.","whoZh":"想戒掉高糖能量饮料、但还是想要那个口感的人。"},"xs-energy-burn-12-pack":{"advantage":"Energy plus a thermogenic blend means the same can does two jobs, which matters mostly for the pre-workout slot. Read it as an energy drink with an added angle, not as a weight product with caffeine attached.","advantageZh":"能量加热效应配方，等于同一罐做两件事，主要用在训练前那个时间段。把它理解成加了一个角度的能量饮料，而不是加了咖啡因的减重产品。","who":"People training in a calorie deficit who want one can before the session.","whoZh":"在热量赤字下训练、想在练前来一罐的人。"},"xs-energy-focus-30ct":{"advantage":"The 30-count is the trial size of the 60. Buying the small one first is the right move for anything caffeine-based, because individual tolerance varies more than any label can predict.","advantageZh":"30粒装是60粒装的试用规格。任何含咖啡因的东西，先买小包装都是对的做法，个体耐受度的差异比任何标签能预测的都大。","who":"First-time users testing tolerance before committing to the larger bottle.","whoZh":"第一次用、想先试耐受度再决定要不要上大瓶的人。"},"xs-cbd-cream":{"advantage":"Topical means it works where you rub it, on local muscle soreness, and does not enter general circulation the way an oral product would. That limits what it can do and also removes most of the concerns people have about the category.","advantageZh":"外用意味着它在你涂抹的部位起作用，针对局部肌肉酸痛，不像口服那样进入全身循环。这限制了它能做的事，同时也消除了人们对这个品类的大部分顾虑。","who":"Athletes and anyone with a specific sore shoulder, knee or lower back after training.","whoZh":"运动员，以及训练后肩、膝或下背某一处特别酸痛的人。"},"artistry-studio-glow-boss-cleanser-exfoliator":{"advantage":"Two steps in one is a compliance product: most people who own a separate exfoliant use it far less often than they should. Daily gentle exfoliation also beats aggressive weekly scrubbing, which is what damages a barrier.","advantageZh":"两步合一是一个坚持度产品：拥有单独去角质产品的人，绝大多数用的频率远低于应该的频率。而每天温和去角质，好过每周一次的猛搓，后者才是伤屏障的元凶。","who":"People with congested or textured skin who will not run a five-step routine.","whoZh":"毛孔堵塞、皮肤粗糙，但不会执行五步护肤流程的人。"},"artistry-studio-rose-all-day-anti-acne-toner":{"advantage":"Spot treatment handles the blemish you can see; a salicylic toner handles the pores that are about to become the next one. Treating the whole face is the difference between reacting and getting ahead of the cycle.","advantageZh":"点涂处理的是你看得见的那颗痘；水杨酸爽肤水处理的是即将变成下一颗的那些毛孔。全脸使用，是被动应对和跑在周期前面的区别。","who":"People whose breakouts come in waves rather than as isolated spots.","whoZh":"痘痘一片一片来、而不是零星几颗的人。"},"artistry-studio-done-with-zit":{"advantage":"Salicylic acid is oil-soluble, which is why it can get down inside a pore where a water-soluble acid cannot. That is the whole reason it is the standard for spot treatment rather than a stronger-sounding ingredient.","advantageZh":"水杨酸是脂溶性的，所以它能进到毛孔内部，而水溶性的酸做不到。这就是为什么它是点涂的标准成分，而不是某个听起来更猛的成分。","who":"Anyone who gets occasional single blemishes and wants something targeted in the bag.","whoZh":"偶尔冒一两颗痘、想在包里常备一支定点用的人。"},"artistry-multi-defense-uv-protect-spf50":{"advantage":"Sunscreen is the single highest-return anti-ageing product there is, and the reason people skip it is texture, not belief. An SPF that layers under makeup without pilling is solving the actual obstacle.","advantageZh":"防晒是抗老回报率最高的单一产品，而人们不涂的原因是肤感，不是不相信。一款能在妆前叠涂而不搓泥的防晒，解决的才是真正的障碍。","who":"Everyone daily, and specifically anyone using retinol, acids or brightening actives.","whoZh":"所有人每天都要用，尤其是在用A醇、酸类或美白成分的人。"},"artistry-sleeping-mask":{"advantage":"Skin repair peaks overnight, so an overnight mask is working during the window the skin is already in repair mode rather than fighting the day. No rinse step means it survives contact with a tired person at 11pm.","advantageZh":"皮肤修复在夜间达到峰值，所以睡眠面膜是在皮肤本来就在修复的窗口期起作用，而不是跟白天硬碰硬。免洗这一点，意味着它能扛得住晚上十一点一个疲惫的人。","who":"Dehydrated skin, winter, air-conditioned offices, and frequent flyers.","whoZh":"皮肤缺水、冬天、常年空调的办公室，以及经常坐飞机的人。"},"artistry-signature-select-hydrating-mask":{"advantage":"A treatment mask is a concentrated dose, not a daily step, so its job is to reset skin before an event or after a rough week. Judge it on the next morning, not on the ten minutes it is on.","advantageZh":"护理面膜是一次集中剂量，不是日常步骤，它的任务是在重要场合前或者难熬的一周后把皮肤重置一下。看第二天早上的状态，不看敷着那十分钟。","who":"Before events, after travel, and anyone whose skin looks tired rather than problematic.","whoZh":"重要场合前、旅行后，以及皮肤不是有问题、只是显疲态的人。"},"artistry-correcting-serum":{"advantage":"Post-blemish marks are pigment left behind after inflammation, not scars, which means they respond to tone-correcting actives given enough weeks. Confusing the two is why people give up on marks that would have faded.","advantageZh":"痘印是炎症之后留下的色素沉着，不是疤痕，这意味着给够周数，它们对匀色成分是有反应的。把两者混为一谈，是很多人放弃了本来会淡掉的痘印的原因。","who":"People clearing acne who are now left with the marks, and anyone with uneven tone.","whoZh":"痘痘已经控制住、现在只剩痘印的人，以及肤色不均的人。"},"artistry-longxevity-r
