的叶黄素和玉米黄质。如果你抽烟，先问医生，因为里面也含β-胡萝卜素。"},{"id":"concentrated-fruits-vegetables","why":"These pigments come from coloured plants. This is a floor under your diet for the weeks the greens do not happen.","whyZh":"这些色素都来自有颜色的蔬果。蔬菜没吃够的那几周，它给你的饮食垫个底。"}]},{"id":"kids","icon":"sun","label":"Kids on screens all day","labelZh":"孩子整天盯屏幕","visual":null,"what":"Children's eyes are still growing. Lots of close-up time and little daylight is linked to short-sightedness starting earlier, and once it starts it usually keeps getting worse through the school years.","whatZh":"孩子的眼睛还在发育。近距离用眼多、晒太阳少，近视就容易来得早；而且一旦开始，整个上学阶段通常都会继续加深。","twist":"The best-proven fix is free: get them outside. In a school trial in Guangzhou, just 40 extra minutes outdoors a day meant fewer kids became short-sighted over three years.","twistZh":"最有证据的办法不花钱：让孩子出门。广州的一项学校研究里，每天多40分钟户外活动，三年下来得近视的孩子明显少了。","fixes":[{"id":"eye-mojo-blue-light-gummies","why":"A gummy a teenager will actually eat. Check the age on the label before giving it to a younger child.","whyZh":"青少年真的愿意吃的软糖。给年纪更小的孩子吃之前，先看清标签上的适用年龄。"},{"id":"concentrated-fruits-vegetables","why":"Most kids eat the same two or three vegetables. This covers the colours they skip. Check the label for age here too.","whyZh":"大多数孩子来来回回就吃那两三种蔬菜，这个补上他们没吃到的颜色。同样先看标签上的适用年龄。"}]}],"doctor":"Sudden change in vision, eye pain, a red eye that hurts, new flashes or a shower of floaters, or a shadow across your sight? See an eye doctor the same day.","doctorZh":"如果视力突然变化、眼睛疼、眼睛红而且痛、突然出现闪光或一大片飞蚊，或者视野里像有一块阴影挡着，请当天就去看眼科。"}},"brain":{"overview":"Focus and memory depend less on brain supplements than on three everyday conditions: blood sugar that stays steady, enough sleep to clear the day's load and file what you learned, and stress that does not block recall. The plan takes the load off first, the sugar swings and the short nights. It then regulates what goes in: caffeine at the right hour, water through the day, and a lid on stress. Next it supplies the raw materials the brain is built and run from, omega-3 DHA, B vitamins and protein, which matter most for people who were running short, and it is honest about the herbal options, where the evidence is early. Last, it keeps a morning and evening rhythm with movement in it. None of this treats a memory disorder. If memory loss gets in the way of daily life, confusion comes on suddenly, or low mood will not lift, see a doctor first.","overviewZh":"专注力和记忆力，靠的不是什么补脑神药，而是三个日常条件：血糖平稳；睡眠够，让大脑清掉一天的负担、把学到的东西存好；压力不至于把记忆的门堵住。所以第一步先卸负担，也就是血糖起伏和睡眠不足。第二步调整进来的东西：咖啡因在对的时间喝，白天水喝够，把压力压下来。第三步补上大脑的原料：Omega-3 DHA、B族和蛋白质，原本就缺的人最能感受到差别；草本类的选择证据还在早期，我们照实说。第四步用早晚固定的节奏加上运动，把成果守住。这些都不是在治疗记忆方面的疾病。如果健忘已经影响日常生活、突然出现糊涂混乱，或者情绪低落一直缓不过来，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["Carb Blocker","Prebiotic Fiber"],"why":"The first load on focus is the blood-sugar swing. A meal that is mostly refined carbs lifts you and then drops you, and the drop feels like fog. In a review of 15 trials in adults, memory two hours after a low-glycaemic breakfast was better than after a high-glycaemic one, with the clearest effect in people under 35 and those with good glucose control. You do not have to give up rice or bread, you have to stop eating them alone. Add protein and fibre to the meal, and before the carb-heavy ones, take Carb Blocker.","key":"brain.clear.carb-blocker","whyZh":"影响专注力的第一个负担，是血糖的起伏。一顿以精致碳水为主的饭，先把你抬上去，再让你掉下来，掉下来的那种感觉就是脑雾。一项汇总了15个成人试验的分析发现，吃低升糖早餐两小时后，记忆力测试比吃高升糖早餐更好，35岁以下、血糖调节好的人差别最明显。你不需要戒米饭面包，只是别让碳水单独出现。每餐加上蛋白质和纤维，碳水特别多的那一顿，饭前吃阻碳片。","productIds":["carb-blocker","prebiotic-fiber"]},{"stage":"clear","rank":1,"route":"habit","products":["Magnesium"],"why":"The brain clears its own load at night. In mice, the space between brain cells widens by about 60 percent during sleep and waste washes out much faster, and in people, sleep is when new memories are filed. Pooled studies show sleep loss before learning cuts how much you take in, and after learning, how much you keep. So the first fix for fog is protected sleep: the same wake time every day, screens down half an hour before bed, no all-nighters before an exam. Evening magnesium supports the wind-down, though its sleep trials are small.","key":"brain.clear.magnesium","whyZh":"大脑自己的负担，是在夜里清掉的。动物研究发现，睡眠时脑细胞之间的空隙会扩大约六成，废物被冲走的速度快很多；在人身上，学完之后的那一觉，正是新记忆被归档的时候。汇总研究显示，学习前没睡够，学进去的就少；学完后没睡够，留得住的就少。所以脑袋发沉，第一件事是把睡眠护住：每天同一时间起床，睡前半小时放下手机，考试前不熬通宵。晚上补镁可以帮身体放松，不过镁和睡眠的试验规模都不大。","productIds":["magnesium"]},{"stage":"regulate","rank":1,"route":"habit","products":["XS Energy + Focus 30ct","XS Energy + Focus 60ct"],"why":"What you drink sets your focus more than most people think. Caffeine works: about 75 mg, one XS Energy + Focus tablet or a small coffee, reliably sharpens alertness and attention for a few hours. The cost comes at night. In a controlled study, 400 mg taken six hours before bed still cut sleep by more than an hour, and lost sleep is lost memory. Keep caffeine to the morning and early afternoon, start with the 30-count to test your tolerance, and drink water through the day: across 33 studies, losing more than 2 percent of body water measurably hurt attention.","key":"brain.regulate.xs-energy-focus-30ct","whyZh":"喝什么、什么时候喝，对专注力的影响比多数人想的大。咖啡因确实有效：大约75毫克，也就是一片XS能量专注片或一小杯咖啡，能稳定地提升几个小时的警觉和注意力。代价在晚上。一项对照研究里，睡前六小时摄入400毫克咖啡因，睡眠依然少了一个多小时，而少睡就是少记。咖啡因放在上午和午后早些时候，先用30粒装试试自己的耐受度，白天持续喝水：33项研究显示，身体缺水超过2%，注意力就会明显下降。","productIds":["xs-energy-focus-30ct","xs-energy-focus-60ct"]},{"stage":"regulate","rank":2,"route":"internal","products":["Organics Ashwagandha Capsules","Stress Relief Probiotic"],"why":"Stress hormones sharpen you for a fight but get in the way of pulling up what you already know, which is why a name vanishes in an interview and comes back in the car. That is retrieval, not lost memory. Regulate the stress first: slow breathing, a walk, enough sleep. Ashwagandha has the most human data: in small one-to-two-month trials, adults on about 600 mg a day beat placebo on memory and attention tests, but the trials are few and short. Avoid it in pregnancy. The Stress Relief Probiotic works on the gut-brain link: a sound idea, thin direct evidence for memory.","key":"brain.regulate.organics-ashwagandha-capsules","whyZh":"压力激素让你准备好战斗，却会挡住你调取已经记住的东西，所以面试时名字死活想不起来，一上车就想起来了。这是取不出来，不是记忆丢了。先把压力本身调下来：放慢呼吸、出去走走、睡够。南非醉茄在这方面的人体数据最多：一到两个月的小型试验里，每天约600毫克的成年人，记忆和注意力测试比安慰剂组好，但试验不多、时间也短。孕期不要用。舒压益生菌走的是肠脑轴，思路成立，直接针对记忆的证据还很少。","productIds":["organics-ashwagandha-capsules","stress-relief-probiotic"]},{"stage":"supplement","rank":1,"route":"internal","products":["Advanced Omega","Kids Brainiums DHA Jelly"],"why":"DHA is the brain's main structural fat, and it comes almost only from food, mostly fatty fish. The honest picture: a Cochrane review found no case for routine omega-3 to protect memory in healthy older people. The benefit shows where intake is low. In 176 young adults who rarely ate fish, 1.16 g of DHA a day for six months improved memory and reaction time, and in 485 over-55s with mild memory complaints, 900 mg a day for 24 weeks meant fewer learning errors. Eat salmon or sardines twice a week and you may not need it. Children who skip fish: the DHA jelly.","key":"brain.supplement.advanced-omega","whyZh":"DHA是大脑最主要的结构脂肪，几乎只能从食物里来，主要是深海鱼。实话实说：Cochrane综述认为，健康的老年人没有必要常规补Omega-3来保护记忆。效果体现在本来就吃得少的人身上。176位很少吃鱼的年轻人，每天1.16克DHA，六个月后记忆和反应速度都有改善；485位55岁以上、自觉记性变差的人，每天900毫克，24周后学习测试的错误更少。如果你每周吃两次三文鱼或沙丁鱼，可能不需要补。孩子不吃鱼，就用DHA果冻。","productIds":["advanced-omega","kids-brainiums-dha-jelly"]},{"stage":"supplement","rank":1,"route":"internal","products":["Vitamin B Complex 120ct","Vitamin B Complex 30ct"],"why":"B1 is needed to burn glucose, the brain's main fuel, and B6, B12 and folate help make its chemical messengers. The key word is deficiency. Low B12 can show up as memory problems, confusion or low mood, and absorption falls with age: 10 to 30 percent of older adults have the stomach change that blocks it, and metformin, acid reducers and a vegan diet add risk. A Cochrane review of 14 trials and nearly 28,000 people found B supplements do little for memory in people who were not short. So ask for a B12 test if you are in one of those groups, and take B complex with food.","key":"brain.supplement.vitamin-b-complex-120ct","whyZh":"B族是大脑运转的零件。B1负责燃烧葡萄糖，而葡萄糖是大脑的主要燃料；B6、B12和叶酸参与制造大脑的化学信使。关键在「缺不缺」。B12不足，可能表现为记性变差、糊涂或情绪低落，而且年纪越大越难吸收：10%到30%的老年人有影响B12吸收的胃部变化，长期吃二甲双胍、抑酸药或全素饮食，风险更高。Cochrane汇总了14个试验、近2.8万人，发现本来不缺的人，补B族对记忆帮助不大。属于上面这些人群的，先请医生查B12，B族随餐吃。","productIds":["vitamin-b-complex-120ct","vitamin-b-complex-30ct"]},{"stage":"supplement","rank":2,"route":"internal","products":["Plant Protein Powder","Organics All-in-One Shakes"],"why":"The brain's messengers are built from food. Serotonin and dopamine are made from amino acids, and acetylcholine, the messenger most tied to memory, from choline in eggs and soy lecithin. The teaching behind this plan puts protein first for memory, with a target of about 1.2 g per kilogram of body weight a day and a real share at breakfast, and it holds that a student who starts the day on congee or cereal fades by the third class. Direct trials of protein breakfasts on memory are few, so the firmer reason is step one: protein slows the sugar curve. One shake closes most of a breakfast gap.","key":"brain.supplement.plant-protein-powder","whyZh":"大脑的信使是用食物造出来的。血清素和多巴胺由氨基酸合成，和记忆关系最密切的乙酰胆碱，则来自鸡蛋和大豆卵磷脂里的胆碱。这套方案的老师把蛋白质放在记忆的第一位，目标是每天每公斤体重约1.2克，早餐要占一大块；他讲，一个孩子早上只喝白粥或吃麦片，到第三节课精力就掉下来了。直接研究蛋白质早餐和记忆的试验不多，所以更扎实的理由在第一步：蛋白质能让血糖曲线变平。一杯奶昔就能补上早餐的大部分缺口。","productIds":["plant-protein-powder","organics-all-in-one-shakes"]},{"stage":"supplement","rank":3,"route":"internal","products":["Memory Builder"],"why":"Memory Builder pairs ginkgo leaf with cistanche, a root long used in Chinese tradition. Two trials in China by researchers linked to the maker found better memory scores than placebo: 117 healthy adults after 30 days, and 100 adults aged 40 to 75 after 90 days. Independent ginkgo research is less encouraging: a review found no convincing effect in healthy people under 60, and the six-year GEM trial of 3,069 people over 75 found ginkgo did not prevent dementia. Ginkgo can add to bleeding risk with blood thinners, aspirin or surgery, so ask your doctor first.","key":"brain.supplement.memory-builder","whyZh":"记忆力支持片是银杏叶加肉苁蓉，肉苁蓉是中国传统里用了很久的一味根茎。两项在中国做的试验，研究者与生产企业有关联，结果记忆分数比安慰剂组好：117位健康成年人吃了30天，100位40到75岁的人吃了90天。单看银杏的独立研究就没那么乐观：综述认为60岁以下健康人看不到可靠效果；追踪六年、3069位75岁以上老人的GEM试验发现，银杏不能预防失智。银杏和抗凝药、阿司匹林同用或手术前服用，会增加出血风险，请先问医生。","productIds":["memory-builder"]},{"stage":"supplement","rank":3,"route":"internal","products":["Organics Lion's Mane Capsules"],"why":"Lion's Mane is the least tested option here. In the lab it is studied for nerve growth factor, not as a stimulant, so it will not feel like coffee. In the best human trial so far, 41 healthy young adults, one dose made them faster on one attention test and stress trended lower after four weeks, while delayed word recall did not improve. A small Japanese trial in 30 older adults with mild memory complaints reported better scores over 16 weeks that faded once they stopped. Treat it as an experiment: give it a month, and keep it only if you notice a difference.","key":"brain.supplement.organics-lion-s-mane-capsules","whyZh":"猴头菇是这里证据最少的一个。实验室里研究的是它和神经生长因子的关系，不是提神，所以吃了不会有喝咖啡的感觉。目前最好的人体试验只有41位健康年轻人：吃一次后，某项注意力测试反应更快，四周后压力感有下降趋势，但延迟回忆单词并没有改善。日本一项30位自觉记性变差的老年人的小试验，16周内分数提高，停用后又回落。把它当成一次尝试：吃一个月，自己感觉到差别再继续。","productIds":["organics-lion-s-mane-capsules"]},{"stage":"sustain","rank":1,"route":"habit","products":["Everyday Nutrition Solution","Double X Multivitamin 31-day Refill"],"why":"The day's focus is set in the morning. The breakfast this plan is built around covers protein, fibre, good fats, plant foods, vitamins and minerals, eaten between 7 and 9 am, so steps one and three happen in one meal; the foundation bundle puts multivitamin, protein and omega-3 in one order. Then move. A meta-analysis found attention improves after light to moderate exercise, and in a year-long trial of 120 older adults, walking three days a week enlarged the hippocampus, the memory centre, by about 2 percent. Walk ten minutes before hard thinking.","key":"brain.sustain.everyday-nutrition-solution","whyZh":"一天的专注力，早上就定下来了。这套方案围绕的营养早餐，一餐包含优质蛋白、纤维、好的脂肪、蔬果植物营养、维生素和矿物质，在早上7到9点吃，一顿饭就把第一步和第三步做了。基础营养方案把综合营养素、蛋白粉和鱼油放在一单里。然后动起来：一项汇总分析发现，轻到中等强度运动之后，注意力和执行功能会变好；另一项为期一年、120位老年人的试验里，每周快走三天，大脑的记忆中枢海马体增大了约2%。动脑之前先走十分钟，是最便宜的专注工具。","productIds":["everyday-nutrition-solution","double-x-multivitamin-31-day-refill"]},{"stage":"sustain","rank":3,"route":"internal","products":["Vitamin B Complex 120ct","Liver Support"],"why":"The evening half of the rhythm comes from the tradition this plan follows. It routes trouble falling asleep to the liver first, with B vitamins and Liver Support taken together between about 7:30 and 8:40 pm, every evening, judged over six months because liver cells take roughly 180 days to renew. There is no mainstream research on this timing or on liver support for sleep, so hold it as an evening anchor rather than a claim. What is well supported is the sleep itself, and a fixed evening routine is what gets you to bed at the same time, which protects step one.","key":"brain.sustain.vitamin-b-complex-120ct","whyZh":"节奏的另一半在晚上，来自这套方案所依据的调理传统。它把入睡困难先归到肝：每天晚上大约7点半到8点40之间，B族和护肝片一起吃，按六个月来看效果，因为肝细胞大约180天更新一轮。主流研究没有验证过这个时间点，也没有验证护肝和睡眠的关系，所以把它当作固定晚间节奏的一个锚点，而不是功效声明。有扎实证据的是睡眠本身，而固定的晚间习惯，能让你每天同一时间上床，这就守住了第一步。","productIds":["vitamin-b-complex-120ct","liver-support"]}],"summary":{"title":"Brain feels foggy? First, when does it happen?","titleZh":"脑子发懵？先想想，一般什么时候最明显？","sub":"Foggy at different times has different causes. Pick the one that sounds like you.","subZh":"不同时候脑子不在状态，原因不一样。选一个最像你的。","moments":[{"id":"lunch","icon":"bowl","label":"Foggy after lunch","labelZh":"午饭后脑子转不动","visual":"sugar","what":"That is your blood sugar, not your brain. Rice, noodles and sweet drinks turn into sugar fast, insulin rushes in to deal with it, and then your sugar drops. Long story short, the drop is the fog.","whatZh":"这不是脑子的问题，是血糖。米饭、面条、甜饮料很快变成糖，身体一下子放出一大波胰岛素去处理，接着血糖往下掉。说白了，掉下来的那一刻，就是你脑子发懵的时候。","twist":"You do not have to stop eating carbs. I know that is hard. Just never eat them alone, and slow the sugar down.","twistZh":"不用戒碳水，我知道很难。只要别让碳水单独出现，把糖进血的速度放慢就行。","fixes":[{"id":"carb-blocker","why":"Take it before a carb-heavy lunch, so less of the meal turns into sugar.","whyZh":"碳水多的午饭前吃，让这一餐少变成一些糖。"},{"id":"prebiotic-fiber","why":"Not a salad person? Stir fibre into water or coffee. It slows the sugar down the same way.","whyZh":"不爱吃菜？把纤维粉加进水或咖啡里，一样能让糖慢下来。"},{"id":"plant-protein-powder","why":"Protein digests slowly. Add a shake to lunch and the curve stays flat, so there is no crash.","whyZh":"蛋白质消化得慢。午饭配一杯蛋白饮，血糖曲线平了，就不会掉下来。"}]},{"id":"meetings","icon":"clock","label":"Fading in afternoon meetings","labelZh":"下午开会就走神","visual":null,"what":"By 3 pm most people are short on water, running on the morning's coffee, and have been sitting still for hours. Losing just 2 percent of your body water is enough to hurt attention, and you will not even feel thirsty yet.","whatZh":"到了下午三点，大多数人水喝得不够，靠早上那杯咖啡撑着，又已经坐了好几个小时。身体只要缺水2%，注意力就会下降，而这时候你还没觉得渴。","twist":"Before the meeting, drink a big glass of water and walk for ten minutes. If you want caffeine, have it early in the afternoon at the latest, so it does not steal tonight's sleep.","twistZh":"开会前先喝一大杯水，再走十分钟。想补点咖啡因，最晚午后早一点解决，别让它偷走今晚的睡眠。","fixes":[{"id":"xs-energy-focus-30ct","why":"75 mg of caffeine from green tea in one tablet, no can to carry. Start with the 30-count to see how you handle it.","whyZh":"一片75毫克咖啡因，来自绿茶，不用拎一罐饮料。先从30粒装试，看看自己的耐受度。"},{"id":"vitamin-b-complex-120ct","why":"B1 helps your brain burn its main fuel, glucose, and a long workday uses the Bs up.","whyZh":"B1帮大脑燃烧它的主要燃料葡萄糖，工作一整天，B族消耗得很快。"}]},{"id":"stress","icon":"bolt","label":"Forgetful when stressed","labelZh":"一紧张就忘词","visual":null,"what":"Stress hormones get you ready to fight, and they also block you from pulling up what you already know. That is why a name vanishes in an interview and comes back in the car. The memory is still there.","whatZh":"压力激素让身体进入战斗状态，同时也会挡住你调取已经记住的东西。所以面试时名字怎么都想不起来，一上车就想起来了。记忆其实还在，只是一时取不出来。","twist":"Before the big moment, slow your breathing down and breathe out longer than you breathe in. It tells your body the danger is over.","twistZh":"关键时刻之前，先把呼吸放慢，呼气比吸气长一点。这等于告诉身体：危险过去了。","fixes":[{"id":"organics-ashwagandha-capsules","why":"Helps your body handle stress, and small trials also saw better memory and attention scores. Give it a few weeks.","whyZh":"帮身体扛压力，小型试验里记忆和注意力的分数也有提高。给它几周时间。"},{"id":"stress-relief-probiotic","why":"Stomach reacts first when you are under pressure? These strains are picked for the gut-brain link.","whyZh":"一有压力胃就先有反应？这款益生菌的菌株，是专门针对肠脑轴挑选的。"}]},{"id":"exams","icon":"calendar","label":"Studying for exams","labelZh":"备考冲刺","visual":null,"what":"Your brain files what you learned while you sleep. Pull an all-nighter and you lose part of what you studied, plus tomorrow's focus. Sleep is part of studying, not a break from it.","whatZh":"白天学的东西，是大脑在你睡觉的时候归档存好的。熬个通宵，不但学过的会丢掉一部分，第二天的专注力也没了。睡觉本身就是复习的一部分，不是在浪费时间。","twist":"Study, then sleep. And eat protein at breakfast, so your focus lasts past the second class.","twistZh":"先学，再睡。早餐吃够蛋白质，专注力才撑得过第二节课。","fixes":[{"id":"advanced-omega","why":"DHA is the brain's main building fat. It helps most if you rarely eat fish.","whyZh":"DHA是大脑最主要的结构脂肪。平时很少吃鱼的人，补了最有用。"},{"id":"plant-protein-powder","why":"A protein shake at breakfast keeps your focus steady through the morning.","whyZh":"早餐一杯蛋白饮，整个上午专注力都稳。"},{"id":"kids-brainiums-dha-jelly","why":"For kids who will not touch fish: DHA in a jelly they actually want to eat.","whyZh":"孩子不爱吃鱼？做成果冻的DHA，孩子自己就愿意吃。"}]},{"id":"sleep","icon":"bed","label":"Bad night, foggy day","labelZh":"没睡好，一整天昏沉","visual":null,"what":"Sleep is when your brain cleans up after the day's thinking and files what you learned. Cut the night short and the job is not finished, so you start the day already heavy.","whatZh":"睡觉的时候，大脑在做两件事：清理白天用脑留下的废物，再把学到的东西归档。睡得太少，这些活没干完，第二天一起床脑袋就是沉的。","twist":"Coffee does not pay back sleep debt, it only hides it. Get up at the same time every day, and if you need more sleep, go to bed earlier, not later.","twistZh":"咖啡还不了睡眠债，只能把它盖住。每天固定时间起床，想多睡就早点上床，而不是晚点起。","fixes":[{"id":"magnesium","why":"Helps your body wind down in the evening.","whyZh":"帮身体在晚上放松下来。"},{"id":"liver-support","why":"Hard to fall asleep? Our tradition starts with the liver: Liver Support and B complex together, around 7:30 to 8:40 pm.","whyZh":"入睡难？我们的调理思路先从肝开始：晚上大约7点半到8点40，护肝片和B族一起吃。"},{"id":"vitamin-b-complex-120ct","why":"Your liver needs B vitamins to do its work. Take them with Liver Support in the evening.","whyZh":"肝脏干活离不开B族。晚上和护肝片一起吃。"}]},{"id":"words","icon":"brain","label":"Words on the tip of your tongue","labelZh":"话到嘴边想不起来","visual":null,"what":"After 40, recall gets a little slower, and that is normal. But sometimes it is a missing nutrient. Low B12 looks a lot like a memory problem, and it is common over 50, on metformin or acid reducers, or on a vegan diet.","whatZh":"过了40岁，想词慢一点是正常的。但有时候是缺了某种营养。B12不够，表现出来很像记性变差，50岁以上、在吃二甲双胍或抑酸药、或者吃全素的人，特别容易缺。","twist":"Ask your doctor to check your B12 first. It is one simple blood test, and it rules out the easiest cause to fix.","twistZh":"先请医生查一下B12。只是一个简单的验血，却能先排除最容易解决的那个原因。","fixes":[{"id":"memory-builder","why":"Ginkgo plus cistanche. Trials run with the maker saw better memory scores in 30 to 90 days. On blood thinners or aspirin? Ask your doctor first.","whyZh":"银杏加肉苁蓉。与厂家合作的试验里，30到90天记忆分数有提高。在吃抗凝药或阿司匹林的，先问医生。"},{"id":"vitamin-b-complex-120ct","why":"Covers B12, B6 and folate, the Bs your brain and nerves rely on. Take it with food.","whyZh":"包含B12、B6和叶酸，都是大脑和神经离不开的B族。随餐吃。"},{"id":"advanced-omega","why":"Fish oil with DHA, for anyone who rarely eats salmon or sardines.","whyZh":"含DHA的深海鱼油，适合很少吃三文鱼、沙丁鱼的人。"}]}],"doctor":"Memory loss that gets in the way of daily life, sudden confusion, or low mood that will not lift? See a doctor first.","doctorZh":"如果健忘已经影响到日常生活，或者突然变得糊涂、混乱，或者情绪低落一直缓不过来，请先去看医生。"}},"muscle":{"overview":"Training is the signal and recovery is where muscle actually grows, so results come down to what happens in the hours and days after a session. The four steps follow that order. First take off what slows repair: piling on load faster than the body adapts, alcohol after training, and lingering inflammation. Then make sure what you eat is used, by spreading protein across the day, sleeping enough and staying hydrated. Then supply the raw material: enough protein for someone who trains, plus the minerals and vitamin D that muscle and bone rely on. Finally keep training two to three times a week for years, because muscle you stop using is lost again. If you have kidney or liver disease, a heart condition or pain in a joint that does not settle, see a doctor before raising protein or training intensity.","overviewZh":"训练只是发出信号，肌肉真正长出来是在恢复的时候，所以效果取决于练完之后的几个小时、几天里发生了什么。下面四步就按这个顺序来。先卸掉拖慢修复的东西：加量加得比身体适应得快、练完喝酒、身体里一直没退的炎症。再让吃进去的真正用上：蛋白质分散到一天几餐、睡够、喝够水。然后把原料补足：练的人需要的蛋白质，加上肌肉和骨骼离不开的矿物质和维生素D。最后是每周练两到三次，坚持几年，因为不用的肌肉会再掉回去。如果有肾病、肝病、心脏问题，或者关节疼痛一直不好，加蛋白质或加大训练强度之前，请先去看医生。","rows":[{"stage":"clear","rank":1,"route":"habit","products":["XS CBD Cream"],"why":"The first load to take off is the damage you add faster than you repair. Soreness peaks one to three days after an unfamiliar session and fades quickly as the body adapts, so it is a sign of something new, not a measure of a good workout. Jumping weight or volume too fast is the common way to stall or get hurt. Alcohol is the other: in a small study, drinking after hard training cut muscle protein synthesis by about a quarter even when protein was taken with it. A topical cream is for comfort on the sore spot, not repair.","key":"muscle.clear.xs-cbd-cream","whyZh":"第一个要卸掉的负担，是你制造损伤的速度比修复还快。一次不熟悉的训练之后，酸痛在一到三天达到高峰，身体适应了就会很快减轻，所以酸痛说明动作是新的，并不代表练得好。重量或训练量加得太猛，是停滞和受伤最常见的原因。另一个是酒精：一项小型研究里，高强度训练后喝酒，就算同时补了蛋白质，肌肉蛋白合成也下降了大约四分之一。外用舒缓膏是让酸痛的部位舒服一些，不是帮它修复。","productIds":["xs-cbd-cream"]},{"stage":"clear","rank":2,"route":"internal","products":["Advanced Omega","Organics Turmeric Capsules"],"why":"The second load is inflammation that does not settle between sessions. The teaching behind this plan clears the blood with good fats and plant compounds before adding raw material, and here mainstream evidence is reasonably kind: a pooled analysis of 12 trials found omega-3 lowered soreness after hard eccentric exercise, though the effect was modest and strength did not recover faster. Curcumin from turmeric has smaller and less consistent trials. Treat both as background support taken daily, not a pill before a hard day.","key":"muscle.clear.advanced-omega","whyZh":"第二个负担，是两次训练之间一直没退下去的炎症。这套方案的逻辑是先用优质脂肪和植物营养素清血液，再补原料；在这一点上主流研究也算支持：一项汇总12个试验的分析发现，高强度离心训练后，补充Omega-3的人酸痛更轻，不过效果不大，力量恢复的速度没有明显差别。姜黄素的试验规模更小、结果也不太一致。两样都当成每天的底层支持，而不是练狠了之前临时吃一颗。","productIds":["advanced-omega","organics-turmeric-capsules"]},{"stage":"regulate","rank":1,"route":"habit","products":["XS RTD Protein Shakes 12-pack","XS Protein Bars 12-pack","Organics All-in-One Bars"],"why":"Muscle cannot bank protein, so how you spread it matters almost as much as how much you eat. In a controlled study after training, 20 g of protein every three hours raised muscle protein synthesis 31 to 48 percent more than the same total as two large or eight small doses. The ISSN advises 20 to 40 g per meal, about 0.25 g per kilogram, every three to four hours. Most people eat a light breakfast, a modest lunch and a large dinner. A ready shake or bar in the morning or mid-afternoon evens that out without cooking.","key":"muscle.regulate.xs-rtd-protein-shakes-12-pack","whyZh":"肌肉没办法把蛋白质存起来，所以怎么分配，几乎和吃多少一样重要。一项训练后的对照研究里，每三小时吃20克蛋白质，比同样总量分成两大次或八小次吃，肌肉蛋白合成高出31%到48%。国际运动营养学会建议每餐20到40克，大约每公斤体重0.25克，每三到四小时一次。大多数人早餐很少、午餐一般、晚餐一大顿。早上或下午来一瓶即饮奶昔或一根蛋白棒，不用做饭就把这个分配拉平了。","productIds":["xs-rtd-protein-shakes-12-pack","xs-protein-bars-12-pack","organics-all-in-one-bars"]},{"stage":"regulate","rank":1,"route":"habit","products":["Magnesium"],"why":"Sleep is when most repair happens, and cutting it shows up in the muscle itself. In a crossover study, one night without sleep lowered muscle protein synthesis by 18 percent, raised cortisol by 21 percent and lowered testosterone by 24 percent the next day. Aim for seven hours or more at a fixed wake time. Keep caffeine at least six hours before bed: 400 mg taken six hours before bedtime cut sleep by over an hour in one trial. Magnesium in the evening supports the wind-down, though a Cochrane review found it does not prevent cramps.","key":"muscle.regulate.magnesium","whyZh":"修复主要发生在睡觉的时候，睡少了，肌肉本身就会反映出来。一项交叉研究里，一晚不睡，第二天肌肉蛋白合成下降18%，皮质醇升高21%，睾酮下降24%。每天固定时间起床，争取睡够七小时以上。咖啡因至少在睡前六小时停掉：一项试验里，睡前六小时摄入400毫克咖啡因，睡眠少了一个多小时。晚上补镁可以帮身体放松下来；不过考科蓝的综述发现，镁并不能预防抽筋。","productIds":["magnesium"]},{"stage":"regulate","rank":2,"route":"habit","products":["XS CocoWater 12-pack"],"why":"Muscle is about three quarters water, and nutrients reach it through the blood. Losing more than about 2 percent of body weight in sweat measurably lowers endurance and makes a session feel harder, according to the American College of Sports Medicine. Weigh yourself before and after a long or hot session: each kilogram lost is roughly a litre to replace. Coconut water rehydrated about as well as a sports drink or water in a trial of trained men, with less sugar, but it is lower in sodium, so heavy sweaters also need salt from food.","key":"muscle.regulate.xs-cocowater-12-pack","whyZh":"肌肉大约四分之三是水，营养也要靠血液才能送到肌肉。美国运动医学会指出，出汗让体重掉超过2%左右，耐力就会明显下降，训练也会感觉更吃力。长时间或高温训练前后称一下体重，每掉一公斤，大约要补回一升水。一项针对有训练基础男性的试验里，椰子水补水的效果和运动饮料、白水差不多，糖更少；但它的钠偏低，出汗特别多的人还要从食物里补一点盐。","productIds":["xs-cocowater-12-pack"]},{"stage":"supplement","rank":1,"route":"internal","products":["XS Grass-Fed Whey Protein","Plant Protein Powder"],"why":"Muscle is built from protein, and training raises the need. The teaching behind this plan sets 1.2 g per kilogram a day as the base and says heavy physical work needs more. A review of 49 trials with 1,863 people found protein added to strength training raised gains in muscle and strength, with no further benefit above about 1.6 g per kilogram a day. For a 70 kg person that is about 112 g. Whey is rich in leucine, the amino acid that switches on repair, yet soy and whey gave equal gains in a review of 9 trials. Kidney disease needs a doctor first.","key":"muscle.supplement.xs-grass-fed-whey-protein","whyZh":"肌肉是蛋白质做的，训练会让需求升高。这套方案所依据的课程以每公斤体重1.2克作为基础量，并说重体力活动的人要更多。一项汇总49个试验、1863人的分析发现，力量训练配合补蛋白，肌肉和力量的增长更明显，但每天超过每公斤约1.6克就不再有额外好处。体重70公斤，就是大约112克。乳清富含亮氨酸，就是启动修复的那个氨基酸；不过一项汇总9个试验的分析里，大豆蛋白和乳清的增肌效果一样。有肾病的人先问医生。","productIds":["xs-grass-fed-whey-protein","plant-protein-powder"]},{"stage":"supplement","rank":2,"route":"internal","products":["XS Muscle Multiplier (EAAs)","XS Post-Workout Recovery"],"why":"Of the amino acids protein breaks into, nine are essential, meaning the body cannot make them and must get them from food. Taken on their own they are light, which is useful when you train fasted or a full shake feels too heavy. They are not better than whole protein, and branched-chain amino acids alone are not enough to build muscle. The post-workout window is also looser than marketing suggests: in a meta-analysis, the benefit of timing disappeared once total daily protein was matched. Use these to fill gaps, not replace meals.","key":"muscle.supplement.xs-muscle-multiplier-eaas","whyZh":"蛋白质分解成的氨基酸里，有九种是必需氨基酸，身体自己造不出来，只能从食物里来。单独吃的话很轻，空腹训练、或者一整杯奶昔喝不下的时候很好用。但它并不比完整的蛋白质更好，只补支链氨基酸也不足以长肌肉。练完的黄金窗口也没有广告说的那么窄：一项汇总分析发现，只要一天的蛋白质总量相同，时间点的优势就消失了。用它们补缺口，不要拿来代替正餐。","productIds":["xs-muscle-multiplier-eaas","xs-post-workout-recovery"]},{"stage":"supplement","rank":2,"route":"internal","products":["Calcium Magnesium D","Vitamin D","Double X Multivitamin 31-day Refill"],"why":"Muscle contracts on calcium and relaxes with magnesium, and bone takes the load. The teaching this plan follows notes that exercise raises nutrient use and that a typical diet in China supplies about 389 mg of calcium a day against a need of 800 mg or more. Vitamin D matters most for strength when it is low: a review of 30 trials found a small gain in strength, larger in people over 65 and in those deficient at the start, and none in muscle size. Ask for a vitamin D test, and treat a multivitamin as the base underneath.","key":"muscle.supplement.calcium-magnesium-d","whyZh":"肌肉收缩靠钙，放松靠镁，骨骼要承受训练的负荷。这套方案所依据的课程指出，运动会增加营养素的消耗，而中国人日常饮食平均每天只有约389毫克钙，需要量却是800毫克以上。维生素D在本来偏低的时候对力量最有帮助：一项汇总30个试验的分析发现，力量有小幅提升，65岁以上和一开始就缺乏的人更明显，但肌肉量没有变化。可以请医生查一下维生素D，再用综合营养素打底。","productIds":["calcium-magnesium-d","vitamin-d","double-x-multivitamin-31-day-refill"]},{"stage":"sustain","rank":1,"route":"habit","products":["Everyday Nutrition Solution","XS Fitness Jump Start Solution"],"why":"Muscle kept is muscle used. From around 30, muscle mass drifts down by an estimated 3 to 8 percent a decade without training, faster after 60. In a one-year Danish trial of 208 healthy adults over 65, protein alone did not change muscle size, while heavy strength training did. Protein supports training, it does not replace it. Aim for strength work two to three times a week and, past 65, at least 1.0 to 1.2 g of protein per kilogram a day. The teaching adds: match the training to your age and joints, with slower, controlled work later in life.","key":"muscle.sustain.everyday-nutrition-solution","whyZh":"肌肉是用出来、也是用才留得住的。大约30岁以后，如果不训练，肌肉量每十年估计会流失3%到8%，60岁以后更快。一项为期一年、208位65岁以上健康成年人参加的丹麦试验里，只补蛋白质，肌肉量没有变化；做大重量力量训练的才有变化。蛋白质是支持训练，不是替代训练。每周做两到三次力量训练，65岁以上每天每公斤至少1.0到1.2克蛋白质。课程也提醒，运动要跟年龄和关节状况匹配，年纪越大，动作越要慢、越要可控。","productIds":["everyday-nutrition-solution","xs-fitness-jump-start-solution"]},{"stage":"sustain","rank":3,"route":"internal","products":["XS Pre-Workout Boost"],"why":"Caffeine is one of the best-supported aids for training: the ISSN position stand finds 3 to 6 mg per kilogram, taken about an hour before, improves strength, endurance and sprint performance, with benefits seen from about 2 mg. A serving of this pre-workout carries about 115 mg per its current label, roughly a cup of coffee, so its lift is modest. Its beta-alanine can cause a harmless tingling. Its real use is getting you to the session on a tired evening. Skip it within six hours of bed, because sleep does more for recovery than the boost does.","key":"muscle.sustain.xs-pre-workout-boost","whyZh":"咖啡因是证据最充分的运动辅助之一：国际运动营养学会的立场声明指出，训练前约一小时摄入每公斤3到6毫克，能提升力量、耐力和冲刺表现，从大约2毫克起就能看到效果。按目前的标签，这款训练前激活粉一份约含115毫克咖啡因，差不多一杯咖啡，所以提升是温和的。里面的β-丙氨酸可能让皮肤有点刺刺麻麻，无害。它真正的用处，是在累了的晚上让你还愿意去练。睡前六小时内就别喝了，因为对恢复来说，睡好觉比这点提神重要得多。","productIds":["xs-pre-workout-boost"]},{"stage":"sustain","rank":3,"route":"internal","products":["Joint Health","Lean Muscle"],"why":"Two add-ons for people already training consistently, both with modest evidence. Joint Health supplies glucosamine and collagen as raw material for cartilage and connective tissue; trials of glucosamine for joint comfort are mixed, so judge it over months and stop if nothing changes. Lean Muscle is CLA, which in a review of long-term trials produced a small loss of body fat whose practical value the authors called uncertain. Neither builds muscle on its own. Both only make sense on top of the training, protein and sleep above.","key":"muscle.sustain.joint-health","whyZh":"两个给已经规律训练的人的附加选择，证据都不算强。关节灵提供氨基葡萄糖和胶原蛋白，作为软骨和结缔组织的原料；氨基葡萄糖对关节舒适度的试验结果不一致，所以要按月观察，没有变化就停。瘦肌肉支持片的成分是CLA，一项长期试验的汇总分析发现它能让体脂小幅下降，但作者也说实际意义不确定。两者都不会自己长出肌肉，只有在前面的训练、蛋白质和睡眠都做到之后才有意义。","productIds":["joint-health","lean-muscle"]}],"summary":{"title":"Working out? First, where are you stuck?","titleZh":"在练？先看看你卡在哪一步","sub":"Different sticking points have different fixes. Pick the one that sounds like you.","subZh":"卡在不同的地方，解决办法也不一样。选一个最像你的。","moments":[{"id":"results","icon":"dumbbell","label":"Training hard, no results","labelZh":"练得很拼，就是不长","visual":null,"what":"Muscle does not grow in the gym, it grows after, and it is built out of protein. Most people who train eat enough protein for sitting on a couch, not for building. Long story short: around 1.6 g per kilo of body weight a day, spread over your meals, is where gains top out in the research.","whatZh":"肌肉不是在健身房里长的，是练完之后长的，原料就是蛋白质。大多数练的人，吃的蛋白质只够坐沙发，不够长肌肉。简单说，研究里每天每公斤体重大约1.6克，分到几餐里吃，是增肌效果封顶的那个量。","twist":"You do not have to eat chicken breast six times a day. Get 20 to 40 g at each meal, and let a shake close the gap. Breakfast is usually where it is missing.","twistZh":"不用一天吃六顿鸡胸肉。每餐吃到20到40克，差的用一杯奶昔补上。通常缺得最多的就是早餐。","fixes":[{"id":"xs-grass-fed-whey-protein","why":"25 g of whey per scoop, third-party tested. Whey is rich in leucine, the amino acid that switches on repair.","whyZh":"一勺25克乳清蛋白，经过第三方检测。乳清富含亮氨酸，就是启动肌肉修复的那个氨基酸。"},{"id":"plant-protein-powder","why":"Whey bloats you? Studies found plant protein builds muscle just as well when you get enough of it.","whyZh":"喝乳清会胀气？研究发现，只要量吃够，植物蛋白增肌的效果一样好。"},{"id":"xs-rtd-protein-shakes-12-pack","why":"Won't wash a shaker? Grab one on the way out the door. Zero prep.","whyZh":"懒得洗摇摇杯？出门顺手拿一瓶，什么都不用准备。"}]},{"id":"sore","icon":"flame","label":"Sore for days after","labelZh":"练完酸好几天","visual":null,"what":"That soreness peaks one to three days after a workout your body is not used to. It means the movement was new, not that it was a good workout. If it never goes away, you are adding damage faster than you repair it, usually by going too heavy too soon, sleeping too little, or drinking after training.","whatZh":"这种酸痛，通常在做了身体不习惯的训练后一到三天最厉害。它说明动作是新的，不代表练得好。如果一直都不消，说明你制造损伤的速度比修复快，常见原因是加重量加得太急、睡得太少，或者练完去喝酒。","twist":"Repair happens when you sleep. One night without sleep cut muscle repair by almost a fifth the next day in one study. Sleep is the cheapest recovery tool there is.","twistZh":"修复是在睡觉的时候发生的。有研究发现，一晚不睡，第二天肌肉修复就少了将近五分之一。睡觉是最便宜的恢复工具。","fixes":[{"id":"advanced-omega","why":"Fish oil every day. Trials found less soreness after hard workouts, a modest but real effect.","whyZh":"每天吃深海鱼油。试验发现高强度训练后酸痛更轻，效果不大，但是真实的。"},{"id":"magnesium","why":"In the evening, to help your body wind down so the repair gets the sleep it needs.","whyZh":"晚上吃，帮身体放松下来，让修复有足够的睡眠时间。"},{"id":"xs-cbd-cream","why":"Rub it on the sore spot for comfort. It soothes the area, it does not do the repair.","whyZh":"涂在酸痛的地方，让它舒服一点。它是舒缓，不是帮你修复。"}]},{"id":"after-work","icon":"briefcase","label":"No energy for the gym after work","labelZh":"下班后没力气去练","visual":null,"what":"By 6 pm you have not eaten since lunch, you are a bit dehydrated, and your brain is done for the day. So your body says skip it. That is not laziness, the tank is just empty.","whatZh":"到了傍晚六点，你从午饭后就没吃东西，身体有点缺水，脑子也累了一整天。所以身体告诉你：今天算了吧。这不是懒，是油箱空了。","twist":"Eat something small with protein about an hour before, and drink a big glass of water. Most days that is enough to get you out the door.","twistZh":"练之前一小时左右，吃点带蛋白质的小东西，再喝一大杯水。大部分时候，这样就足够让你出门了。","fixes":[{"id":"xs-protein-bars-12-pack","why":"Keep one in your desk drawer and eat it at 5 pm. Fuel for the session and protein for after.","whyZh":"在办公桌抽屉里放几根，下午五点吃一根。训练有燃料，练完也有蛋白质。"},{"id":"xs-cocowater-12-pack","why":"Plain water boring? Coconut water rehydrates about as well as a sports drink, with less sugar.","whyZh":"觉得白水没味道？椰子水补水效果和运动饮料差不多，糖更少。"},{"id":"xs-pre-workout-boost","why":"About a cup of coffee's worth of caffeine to get you going. Not within six hours of bed.","whyZh":"咖啡因大约一杯咖啡的量，让你动起来。睡前六小时内就别喝了。"}]},{"id":"older","icon":"calendar","label":"Getting older, losing strength","labelZh":"年纪大了，力气变小","visual":null,"what":"From your thirties, muscle slowly shrinks if you do not use it, faster after 60. Older muscle is also harder to switch on, so it needs more protein at each meal to respond, and bones need calcium and vitamin D to carry the load.","whatZh":"三十岁以后，肌肉不用就会慢慢流失，过了六十岁更快。年纪大了，肌肉也更难被唤醒，每一餐需要更多的蛋白质才有反应；骨头也需要钙和维生素D，才扛得住训练的负荷。","twist":"It is never too late. Strength training two or three times a week still works in your seventies. Protein supports the training, it does not replace it.","twistZh":"什么时候开始都不晚。每周两三次力量训练，到了七十多岁一样有用。蛋白质是支持训练的，不能代替训练。","fixes":[{"id":"plant-protein-powder","why":"An easy way to get protein into breakfast, the meal that is usually short.","whyZh":"把蛋白质加进早餐最简单的方法，而早餐通常是蛋白质最少的一顿。"},{"id":"calcium-magnesium-d","why":"Calcium, magnesium and vitamin D together for the bones that carry the load. Ask your doctor to check your vitamin D.","whyZh":"钙、镁、维生素D一起补，照顾承重的骨骼。可以请医生查一下维生素D水平。"},{"id":"joint-health","why":"Knees complain on the stairs? Raw material for cartilage. Give it a few months, and stop if nothing changes.","whyZh":"上楼梯膝盖不舒服？给软骨补点原料。给它几个月时间，没变化就停。"}]},{"id":"starting","icon":"sun","label":"Just starting out","labelZh":"刚开始练","visual":null,"what":"The first months are when you are most sore and most likely to quit. The classic mistake is going all in during week one and giving up by week three, because training burns through nutrients and nobody changed what they eat.","whatZh":"刚开始的几个月，是最酸、也最容易放弃的时候。最常见的错误，就是第一周拼尽全力，第三周就放弃了，因为训练会大量消耗营养，可是吃的东西一点都没变。","twist":"Get the nutrition handled first, so the only thing you have to think about is showing up.","twistZh":"先把营养这件事安排好，这样你唯一要想的，就是按时去练。","fixes":[{"id":"xs-fitness-jump-start-solution","why":"Protein and workout support in one bundle, made for a new gym habit.","whyZh":"蛋白质和训练支持打包在一起，就是为刚养成的健身习惯准备的。"},{"id":"everyday-nutrition-solution","why":"The daily base: multivitamin, protein and fish oil, for what training uses up.","whyZh":"每天的基础：综合营养素、蛋白粉和鱼油，把训练消耗掉的补回来。"}]}],"doctor":"Kidney or liver disease, a heart condition, or joint pain that will not settle? See a doctor before adding protein or training harder.","doctorZh":"如果有肾病、肝病、心脏问题，或者关节疼痛一直不好，加蛋白质或加大训练强度之前，请先去看医生。"}}}},"ui":{"Areas of Support":{"es":"Áreas de apoyo","hi":"सहायता क्षेत्र"},"By Category":{"es":"Por categoría","hi":"श्रेणी अनुसार"},"Solutions":{"es":"Soluciones","hi":"समाधान"},"All Products":{"es":"Todos los productos","hi":"सभी उत्पाद"},"Nutrition":{"es":"Nutrición","hi":"पोषण"},"Sports & Energy":{"es":"Deporte y energía","h    then blurbZh for Chinese, then blurb. Product copy can join later by adding

}

/* ════════════════════════════════════════════════
   TILE ART — real photography (Unsplash, free commercial use).
   Swap any photo by changing its id in scripts/tile_images.json.
   ════════════════════════════════════════════════ */
let TILES = FALLBACK.tiles || { areas:{}, solutions:{}, cats:{} };

function tileUrl(group, key) {
  const v = (TILES[group] || {})[key];
  if (!v) return null;
  // Local repo path (preferred, never expires). Legacy remote forms still supported.
  if (v.startsWith('images/') || v.startsWith('./') || v.startsWith('http')) return v;
  const [host, path] = v.includes('|') ? v.split('|') : ['images.unsplash.com', v];
  return `https://${host}/${path}?auto=format&fit=crop&w=400&h=320&q=70`;
}

/* Show the fades and arrows only on the side that actually has more to see. */
function updateTileEdges() {
  const strip = document.getElementById('tile-strip');
  const sc = document.getElementById('tile-scroll');
  if (!strip || !sc) return;
  const max = sc.scrollWidth - sc.clientWidth;
  strip.classList.toggle('can-left', sc.scrollLeft > 4);
  strip.classList.toggle('can-right', sc.scrollLeft < max - 4);
}

function scrollTiles(dir) {
  const sc = document.getElementById('tile-scroll');
  if (!sc) return;
  // Advance by whole tiles, one short of a full screenful, so the tile that was
  // half cut off becomes the first full one and a new sliver appears on the far
  // edge. The peek is the thing that tells people the row keeps going, so every
  // click has to leave one behind.
  const tile = sc.querySelector('.tile');
  const gap = parseFloat(getComputedStyle(sc).columnGap || getComputedStyle(sc).gap) || 12;
  const step = tile ? tile.getBoundingClientRect().width + gap : 240;
  const perView = Math.max(1, Math.floor(sc.clientWidth / step) - 1);
  sc.scrollBy({ left: dir * step * perView, behavior: 'smooth' });
}

function tileHtml(group, key, label, active, onclick) {
  const url = tileUrl(group, key);
  const img = url
    ? `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : '';
  // Areas with a full 清调补养 protocol get a marker so the deeper content is findable.
  const deep = (group === 'areas' && (PROTOCOL.areas || {})[key])
    ? `<span class="tile-deep" title="${t('Step-by-step protocol', '有完整调理步骤')}">${t('4-step plan', '清调补养')}</span>` : '';
  return `<button class="tile${active ? ' active' : ''}" onclick="${onclick}" title="${label}">
    <span class="tile-img">${img}${deep}</span>
    <span class="tile-label">${label}</span>
  </button>`;
}

/* ════════════════════════════════════════════════
   PROTOCOL VIEW  (清调补养, from the Notion Protocol Map)
   Renders the four stages in order, each with its reasoning and products.
   Areas with no protocol row fall through to the plain grid.
   ════════════════════════════════════════════════ */
const ROUTE_LABEL = {
  internal:    ['Internal', '内服'],
  external:    ['Topical',  '外用'],
  habit:       ['Habit',    '习惯'],
  environment: ['Environment', '环境'],
};

function showGridHeader() {
  const sh = document.querySelector('main .section-header');
  if (sh) sh.style.display = '';
}

function protoHost() {
  let el = document.getElementById('protocol');
  if (!el) {
    el = document.createElement('section');
    el.id = 'protocol';
    el.className = 'protocol';
    const grid = document.getElementById('product-grid');
    // sits above the grid header if there is one, otherwise directly above the grid
    const header = grid.parentElement.querySelector('.section-header');
    grid.parentElement.insertBefore(el, header || grid);
  }
  return el;
}

function renderProtocol(proto, area) {
  const el = protoHost();
  if (!proto) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';

  const stages = (PROTOCOL.stages || []).map((st, idx) => {
    const rows = (proto.rows || [])
      .filter(r => r.stage === st.key)
      .sort((x, y) => (x.rank || 9) - (y.rank || 9));
    if (!rows.length) return '';

    let count = 0;
    const rowsHtml = rows.map((r, ri) => {
      const items = (r.productIds || []).map(findP).filter(Boolean)
        .filter(p => bizMode === 'ibo' || !p.iboOnly);
      if (!items.length) return '';
      count += items.length;
      const rl = ROUTE_LABEL[r.route] || ROUTE_LABEL.internal;
      const lead = r.rank === 1 ? `<span class="pr-lead">${t('Core', '首选')}</span>` : '';
      // The reasoning is the point of this page, but a 700-character paragraph
      // makes the row twice as tall as it needs to be. Clamp, with a way in.
      const body = tx(r, 'why');
      const long = currentLang === 'zh' ? body.length > 150 : body.length > 300;
      return `
        <div class="pr-row">
          <div class="pr-why" id="why-${st.key}-${ri}">
            <div class="pr-tags"><span class="pr-route">${t(rl[0], rl[1])}</span>${lead}</div>
            <p>${body}</p>
            ${long ? `<button class="pr-more" onclick="toggleWhy('why-${st.key}-${ri}', this)">${t('Read the rest', '展开全文')}</button>` : ''}
          </div>
          <div class="pr-items">${items.map(protoItemHtml).join('')}</div>
        </div>`;
    }).join('');
    if (!rowsHtml) return '';

    // First stage open, the rest collapsed — the page is a plan, not a wall.
    const open = protoOpen[st.key] !== undefined ? protoOpen[st.key] : (idx === 0);
    const glyph = currentLang === 'zh' ? st.zh : (st.glyph || String(idx + 1));
    return `
      <div class="pr-stage${open ? ' open' : ''}" data-stage="${st.key}">
        <button class="pr-stage-head" onclick="toggleStage('${st.key}')" aria-expanded="${open}">
          <span class="pr-glyph">${glyph}</span>
          <span class="pr-stage-text">
            <span class="pr-stage-title">${stageTitle(st)}</span>
            <span class="pr-stage-sub">${t(st.sub, st.subZh)}</span>
          </span>
          <span class="pr-count">${count}</span>
          <span class="pr-chev" aria-hidden="true">▾</span>
        </button>
        <div class="pr-body">${rowsHtml}</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="pr-intro">
      <div class="pr-intro-label">${t('How to work through this', '这个问题怎么一步步调理')}</div>
      <p>${tx(proto, 'overview')}</p>
    </div>
    ${stages}`;
}

/* Which protocol stages are expanded. Reset per area so you always land on step 1. */
let protoOpen = {};
/* Older builds stored why = Chinese and whyEn = English, the reverse of every
   other field. If GitHub still has one of those data files when this page loads,
   English mode would silently render Chinese. Migrate on read so the two files
   can be uploaded in either order, or separately. */
function normalizeProtocol(p) {
  Object.values((p && p.areas) || {}).forEach(blk => {
    (blk.rows || []).forEach(r => {
      if (r.whyEn) { r.whyZh = r.why; r.why = r.whyEn; delete r.whyEn; }

  });
  return p;
}

/* ═══════════════════════════════════════════════
   EDUCATION  (admin-only reader)
   Two courses as cards; each opens a list of its lessons; each lesson is one page of text.
   The lessons are static files built by scripts/build_education.py, fetched only when a
   an admin opens them, so the public page does not carry them.
   ═══════════════════════════════════════════════ */
let EDU_INDEX = null;                 // education/index.json, loaded the first time the tab opens
let eduSeries = null, eduLesson = null, eduTok = 0;
const eduText = {};                   // lesson text already fetched, keyed 'series/id'
const EDU_VIDEO_NOTE = '（此处播放了一段视频，录音无法准确转写。）';

function eduEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
/* English editions exist for some lessons (NN.en.txt, see education/TRANSLATION_SPEC.md).
   Any language other than Chinese reads the English edition when there is one. */
function eduWantsEn() { return currentLang !== 'zh'; }
function eduTitle(l) { return eduWantsEn() && l.titleEn ? l.titleEn : l.title; }
function eduMins(l) { return eduWantsEn() && l.minsEn ? l.minsEn : l.mins; }
function eduSeriesTitle(sr) { return eduWantsEn() && sr.titleEn ? sr.titleEn : sr.title; }
/* [[words in the sentence|note|url]] becomes a term with a bubble; url is optional. */
function eduPara(p) {
  let html = '', last = 0;
  const re = /\[\[([^\]|]+)\|([^\]|]*)(?:\|([^\]]*))?\]\]/g;
  let m;
  while ((m = re.exec(p))) {
    html += eduEsc(p.slice(last, m.index));
    const url = (m[3] || '').trim();
    const safe = /^https?:\/\//.test(url) ? url : '';
    html += `<span class="term" tabindex="0">${eduEsc(m[1])}<span class="term-q">?</span><span class="term-pop">${eduEsc(m[2])}${safe ? `<br><a href="${eduEsc(safe)}" target="_blank" rel="noopener">${t('Source', '来源')} ↗</a>` : ''}</span></span>`;
    last = m.index + m[0].length;
  }
  return html + eduEsc(p.slice(last));
}
function eduPlaceBubbles() {
  /* A flip left or right is not enough: it moves a short term's bubble off the other edge.
     Measure each bubble and shift it by exactly the overflow. */
  const vw = document.documentElement.clientWidth, pad = 8;
  document.querySelectorAll('.edu-text .term').forEach(tm => {
    const pop = tm.querySelector('.term-pop'); if (!pop) return;
    pop.style.transform = '';
    const prev = pop.style.display; pop.style.display = 'block';
    const r = pop.getBoundingClientRect();
    let shift = 0;
    if (r.right > vw - pad) shift = (vw - pad) - r.right;
    if (r.left + shift < pad) shift = pad - r.left;
    pop.style.transform = shift ? `translateX(${Math.round(shift)}px)` : '';
    pop.style.display = prev;
  });
}
window.addEventListener('resize', eduPlaceBubbles);
function eduTop() { window.scrollTo({ top: 0, behavior: 'auto' }); }
function eduOpenSeries(id) { eduSeries = id; eduLesson = null; renderEducationView(); eduTop(); }
function eduOpenLesson(sid, lid) { eduSeries = sid; eduLesson = lid; renderEducationView(); eduTop(); }
function eduBack() { if (eduLesson) eduLesson = null; else eduSeries = null; renderEducationView(); eduTop(); }

function eduCardsHtml() {

  return `
    <div class="edu-wrap">
      <div class="edu-eyebrow">${t('Admin only', '仅限管理员')}</div>
      <h1 class="edu-h1">${t('Education', '培训')}</h1>
      <p class="edu-sub">${t('Read at your own pace.', '按自己的节奏阅读。')}</p>

function eduLessonHtml(series, idx, text, isEn) {
  const l = series.lessons[idx], prev = series.lessons[idx - 1], next = series.lessons[idx + 1];
  let paras = text.trim().split(/\n\s*\n/);
  if (isEn && paras[0] && paras[0].startsWith('# ')) paras = paras.slice(1);
  const body = paras.map(p => `<p${p === EDU_VIDEO_NOTE ? ' class="edu-aside"' : ''}>${isEn ? eduPara(p) : eduEsc(p)}</p>`).join('');
  const nav = (x, dir, label) => x ? `
    <button class="edu-pn-btn ${dir}" onclick="eduOpenLesson('${series.id}','${x.id}')">
      <span class="edu-pn-dir">${dir === 'next' ? label + ' ›' : '‹ ' + label}</span>
      <span class="edu-pn-title">${x.n}. ${eduEsc(eduTitle(x))}</span>
    </button>` : '';
  const fallback = (eduWantsEn() && !isEn) ? `<div class="edu-fallback">${t('The English edition of this lesson is not ready yet. This is the original Chinese.', '')}</div>` : '';
  const custom = l.note ? (currentLang === 'zh' ? l.note.zh : l.note.en) : '';
  const note = custom || (isEn
    ? t('English edition, edited from the recorded lesson. Underlined terms open a note with its source.', '')
    : t('Transcribed automatically from the recording. A few words may be wrong.', '根据录音自动转写，个别用字可能有误。'));

      <div class="edu-head">

        <h1 class="edu-lesson-title">${eduEsc(isEn ? l.titleEn : l.title)}</h1>
        ${isEn && l.title ? `<div class="edu-speaker">${eduEsc(l.title)}${l.speaker ? ' · ' + eduEsc(l.speaker) : ''}</div>` : (l.speaker ? `<div class="edu-speaker">${eduEsc(l.speaker)}</div>` : '')}
      </div>
      ${fallback}
      ${custom ? `<div class="edu-fallback">${eduEsc(custom)}</div>` : ''}
      <div class="edu-text${isEn ? ' en' : ''}" lang="${isEn ? 'en' : 'zh-CN'}">${body}</div>
      <p class="edu-note">${note}</p>

async function renderEducationView() {
  const host = document.getElementById('edu-view');
  document.querySelector('main .section-header').style.display = 'none';
  const grid = document.getElementById('product-grid');
  grid.style.display = 'none'; grid.innerHTML = '';
  narrative([]); setSensitiveNote(false); renderProtocol(null); heroHide();
  host.style.display = 'block';
  const tok = ++eduTok;                        // a slow fetch must not overwrite a newer page
  const wrap = (inner) => `<div class="edu-wrap">${inner}</div>`;
  const failed = () => host.innerHTML = wrap(`<div class="edu-error">${t('Could not load this. Check your connection and try again.', '加载失败，请检查网络后重试。')}<br><button onclick="renderEducationView()">${t('Try again', '重试')}</button></div>`);
  const loading = () => host.innerHTML = wrap(`<div class="edu-loading">${t('Loading…', '加载中…')}</div>`);

  if (!EDU_INDEX) {
    loading();
    try { const r = await fetch('education/index.json'); if (!r.ok) throw 0; EDU_INDEX = await r.json(); }
    catch (e) { if (tok === eduTok) failed(); return; }
    if (tok !== eduTok || viewMode !== 'education') return;
  }
  const series = EDU_INDEX.series.find(s => s.id === eduSeries);
  if (!series) { eduSeries = eduLesson = null; host.innerHTML = eduCardsHtml(); return; }
  if (!eduLesson) { host.innerHTML = eduListHtml(series); return; }

  const idx = series.lessons.findIndex(l => l.id === eduLesson);
  if (idx < 0) { eduLesson = null; host.innerHTML = eduListHtml(series); return; }
  const isEn = eduWantsEn() && !!series.lessons[idx].titleEn;
  const key = series.id + '/' + eduLesson + (isEn ? '.en' : '');
  if (!(key in eduText)) {
    loading();
    try { const r = await fetch('education/' + key + '.txt'); if (!r.ok) throw 0; eduText[key] = await r.text(); }
    catch (e) { if (tok === eduTok) failed(); return; }
    if (tok !== eduTok || viewMode !== 'education') return;
  }
  host.innerHTML = eduLessonHtml(series, idx, eduText[key], isEn);
  if (isEn) { eduPlaceBubbles(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(eduPlaceBubbles); }
}

/* ════════════════════════════════════════════════
   CALCULATOR
   ════════════════════════════════════════════════ */
const calcSelections = {};   // { productId: qty (1-MAX_QTY) }
const MAX_QTY = 10;

function stepperHtml(id, qty) {
  if (qty > 0) {
    return `<button class="p-step-btn" onclick="setQty('${id}',${qty - 1},event)" aria-label="Remove one">−</button>` +
           `<span class="p-step-qty">${qty}</span>` +
           `<button class="p-step-btn" onclick="setQty('${id}',${qty + 1},event)"${qty >= MAX_QTY ? ' disabled' : ''} aria-label="Add one">+</button>`;
  }
  return `<button class="p-step-btn" onclick="setQty('${id}',1,event)" aria-label="Add to calculator">+</button>`;
}

function setQty(id, qty, event) {
  if (event) event.stopPropagation();
  qty = Math.max(0, Math.min(MAX_QTY, qty));
  if (qty === 0) delete calcSelections[id]; else calcSelections[id] = qty;

  // A product can be on screen more than once (full card + compact protocol row),
  // so update every instance rather than a single element id.
  document.querySelectorAll(`[data-step="${id}"]`).forEach(wrap => {
    const base = wrap.dataset.base || 'p-stepper';
    wrap.className = base + (qty > 0 && base === 'p-stepper' ? ' on' : '');
    wrap.innerHTML = stepperHtml(id, qty);
  });
  document.querySelectorAll(`[data-sel="${id}"]`).forEach(el => {
    el.classList.toggle(el.dataset.selon || 'selected', qty > 0);
  });
  syncHash();
  updateCalcWidget();
}

// kept for shareable links and preset stacks
function toggleSelect(id, event) { setQty(id, (calcSelections[id] || 0) > 0 ? 0 : 1, event); }

function clearCalc() {
  Object.keys(calcSelections).forEach(k => delete calcSelections[k]);
  document.querySelectorAll('.p-stepper').forEach(s => {
    s.className = 'p-stepper';
    s.innerHTML = stepperHtml(s.id.replace('step-', ''), 0);
  });
  document.querySelectorAll('.p-card.selected').forEach(c => c.classList.remove('selected'));
  syncHash();
  updateCalcWidget();
}

function calcTotals() {
  // Two different numbers, deliberately kept apart:
  //   orderTotal — what you actually pay for the packs in the cart, today.
  //   daily / monthly — the amortised run rate, i.e. what this plan costs to
  //   sustain, spread over the days each pack actually lasts.
  // Conflating them is what made a 12-bar box look like it cost double.
  let daily = 0, monthly = 0, pvMonthly = 0, oneTime = 0, oneTimePv = 0;
  let orderTotal = 0, orderPv = 0;
  Object.entries(calcSelections).forEach(([id, qty]) => {
    const p = findP(id);
    if (!p) return;
    const pr = price(p) || 0;
    orderTotal += pr * qty;
    if (p.pv) orderPv += p.pv * qty;
    if (p.oneTime) {
      oneTime += pr * qty;
      if (p.pv) oneTimePv += p.pv * qty;
    } else {
      const days = p.daysSupply || 30;
      monthly += pr * (30 / days) * qty;
      daily   += (pr / days) * qty;
      if (p.pv) pvMonthly += p.pv * (30 / days) * qty;
    }
  });
  const free = orderTotal >= SHIP.freeAt;
  return { daily, monthly, pvMonthly, oneTime, oneTimePv, orderTotal, orderPv, free };
}

/* How long one unit lasts — shown on the card so the run rate is never a surprise. */
function supplyLabel(p) {
  if (p.oneTime) return t('One-time', '一次性');
  const d = p.daysSupply || 30;
  if (d === 30) return t('1 month', '1个月');
  if (d >= 60) {
    const m = Math.round(d / 30);
    return t(m + ' months', m + '个月');
  }
  return t(d + ' days', d + '天');
}

function updateCalcWidget() {
  const widget = document.getElementById('header-calc');
  const items = Object.keys(calcSelections).length;
  if (!items) {
    // stays visible so people discover the calculator exists
    widget.classList.add('idle');
    document.getElementById('header-calc-summary').textContent = t('Cost calculator', '费用试算');
    renderCalcPanel();
    return;
  }
  widget.classList.remove('idle');
  const tt = calcTotals();
  // Lead with the real order total; the run rate is secondary.
  let compact = fmtPrice(tt.orderTotal);
  if (tt.monthly > 0) compact += ` · ~${fmtPrice(tt.monthly)}${t('/mo','/月')}`;
  if (bizMode === 'ibo') compact += ` · ${Math.round(tt.orderPv)} PV`;
  document.getElementById('header-calc-summary').textContent = compact;
  renderCalcPanel();
}

function renderCalcPanel() {
  const host = document.getElementById('calc-rows');
  if (!Object.keys(calcSelections).length) {
    host.innerHTML =
      `<div class="calc-empty">${t(
        'Tap <b>+</b> on any product to build a plan. You will see what the order costs today and what it costs per month to keep going.',
        '点任意产品上的 <b>+</b> 开始搭配。这里会分别显示这一单现在要付多少，以及长期维持每个月大约多少。')}</div>`;
    return;
  }
  const tt = calcTotals();
  const out = [];
  const row = (l, v, cls) => out.push(`<div class="calc-row ${cls||''}"><span>${l}</span><span>${v}</span></div>`);

  /* ── What you buy now ─────────────────────────────── */
  out.push(`<div class="calc-sec">${t('This order', '这一单')}</div>`);

  // Per-item line: this is what answers "why is the monthly higher than the box?"
  Object.entries(calcSelections).forEach(([id, qty]) => {
    const p = findP(id);
    if (!p) return;
    const pr = (price(p) || 0) * qty;
    out.push(`<div class="calc-item">
      <button class="ci-name-btn" onclick="openModal('${id}')" type="button">${t(p.name, p.nameZh || p.name)}<em>×${qty}</em></button>
      <span class="ci-meta">${supplyLabel(p)}${qty > 1 && !p.oneTime ? t(' each', ' 每份') : ''}</span>
      <span class="ci-price">${fmtPrice(pr)}</span>
    </div>`);
  });

  row(t('Order total', '本单合计'), fmtPrice(tt.orderTotal), 'strong');
  if (bizMode === 'ibo') row('PV', (Math.round(tt.orderPv * 10) / 10) + ' PV', 'pv');
  const shipTxt = tt.free
    ? t('Free (over $150)', '免运费（满$150）')
    : `${fmtPrice(SHIP.std)} · ${t('or','或')} ${fmtPrice(SHIP.ditto)} ${t('on DITTO','DITTO订购')}`;
  row(t('Shipping est.', '预计运费'), shipTxt, 'ship');
  if (!tt.free) {
    const gap = SHIP.freeAt - tt.orderTotal;
    out.push(`<div class="calc-hint">${t(`Add ${fmtPrice(gap)} more for free shipping`, `再加${fmtPrice(gap)}即可免运费`)}</div>`);
  }

  /* ── What it costs to keep going ──────────────────── */
  if (tt.monthly > 0) {
    out.push(`<div class="calc-sec">${t('To keep it going', '长期维持')}</div>`);
    row(t('Per day', '每天'), fmtPrice(tt.daily) + t('/day', '/天'));
    row(t('Per month', '每月'), fmtPrice(tt.monthly) + t('/mo', '/月'), 'strong');
    if (bizMode === 'ibo') row('PV' + t(' / month', '/月'), (Math.round(tt.pvMonthly * 10) / 10) + ' PV', 'pv');

    // Name the specific item causing any gap between order total and run rate.
    const odd = Object.keys(calcSelections).map(findP).filter(Boolean)
      .filter(p => !p.oneTime && (p.daysSupply || 30) !== 30)
      .sort((a, b) => (a.daysSupply || 30) - (b.daysSupply || 30));
    if (odd.length) {
      const s = odd[0], d = s.daysSupply || 30;
      const note = d < 30
        ? t(`Not every pack is a month. ${s.name} lasts ${d} days, so a full month works out to about ${Math.round(30 / d * 10) / 10} of them.`,
            `不是每个包装都刚好一个月。${s.nameZh || s.name} 一份用 ${d} 天，所以一个月大约要 ${Math.round(30 / d * 10) / 10} 份。`)
        : t(`Not every pack is a month. ${s.name} lasts ${supplyLabel(s)}, so the per-month figure is that cost spread out, not what you pay again next month.`,
            `不是每个包装都刚好一个月。${s.nameZh || s.name} 一份能用 ${supplyLabel(s)}，所以「每月」是把这笔钱摊开算的，不是下个月还要再付一次。`);
      out.push(`<div class="calc-note">${note}</div>`);
    }
  }
  if (tt.oneTime > 0) {
    out.push(`<div class="calc-note">${t(
      `Includes ${fmtPrice(tt.oneTime)} of one-time items, which are not part of the monthly figure.`,
      `其中 ${fmtPrice(tt.oneTime)} 是一次性大件，不计入每月成本。`)}</div>`);
  }

  host.innerHTML = out.join('');
}

function toggleCalcPanel() {
  document.getElementById('calc-panel').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('calc-panel');
  const widget = document.getElementById('header-calc');
  const overlay = document.getElementById('modal-overlay');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !widget.contains(e.target) && !overlay.contains(e.target)) {
    panel.classList.remove('open');
  }
});

/* ════════════════════════════════════════════════
   SHAREABLE LINKS  (#s=id:qty,id:qty)
   ════════════════════════════════════════════════ */
function syncHash() {
  const parts = Object.entries(calcSelections).map(([id, q]) => q > 1 ? `${id}:${q}` : id);
  const hash = parts.length ? '#s=' + parts.join(',') : '';
  history.replaceState(null, '', location.pathname + location.search + hash);
}

function loadHash() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return;
  m[1].split(',').forEach(part => {
    const [id, q] = part.split(':');
    if (findP(id)) calcSelections[id] = Math.min(MAX_QTY, Math.max(1, parseInt(q || '1', 10) || 1));
  });
}

function copyShareLink() {
  const url = location.href;
  const done = () => {
    const btn = document.getElementById('calc-copy-btn');
    const old = btn.textContent;
    btn.textContent = t('✓ Copied', '✓ 已复制');
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done);
  else { prompt('Copy link:', url); }
}

/* ════════════════════════════════════════════════
   NAV WIRING + INIT
   ════════════════════════════════════════════════ */
function updateChrome() {
  document.getElementById('search-input').placeholder = t('Search products', '搜索产品');
  const lt = document.getElementById('logo-tag');
  lt.textContent = t('Quality of health is quality of life', '健康的质量，就是生命的质量');
  lt.classList.toggle('zh', currentLang === 'zh');
  document.title = t('Quality of health is quality of life', '健康的质量，就是生命的质量');
}

/* Slide-down search */
function toggleSearch(force) {
  const bar = document.getElementById('search-bar');
  const btn = document.getElementById('search-toggle');
  const open = force === undefined ? !bar.classList.contains('open') : force;
  bar.classList.toggle('open', open);
  btn.classList.toggle('on', open);
  if (open) setTimeout(() => document.getElementById('search-input').focus(), 180);
  else {
    const inp = document.getElementById('search-input');
    if (inp.value) { inp.value = ''; runSearch(''); }
    inp.blur();
  }
}

/* Tapping the slogan returns to the default view */
function goHome(e) {
  if (e) e.preventDefault();
  toggleSearch(false);
  if (AREAS.length) currentArea = AREAS[0].id;
  setViewMode('home');
}

function updateFooter() {
  document.getElementById('footer-disclaimer').textContent = t(
    'Content on this page is general wellness education, not medical advice. Shipping estimate based on published US rates (free ground shipping on orders $150+).',
    '本页内容仅为一般健康教育，不构成医疗建议。运费预估基于美国公开费率（订单满$150免地面运费）。');
}

/* ════════════════════════════════════════════════
   SEARCH
   ════════════════════════════════════════════════ */
function runSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { render(); return; }
  heroHide();
  narrative([]);
  ['home-view', 'edu-view'].forEach(id => { const el = document.getElementById(id); if (el) { el.style.display = 'none'; el.innerHTML = ''; } });
  document.querySelector('main .section-header').style.display = '';
  document.getElementById('product-grid').style.display = '';
  const res = visibleProducts().filter(p =>
    [p.name, p.nameZh, p.brand, p.tagline, p.taglineZh].some(s => s && s.toLowerCase().includes(q)));
  document.getElementById('grid-label').textContent = t('Search results', '搜索结果');
  document.getElementById('grid-count').textContent = `${res.length} ${t('products', '款产品')}`;
  document.getElementById('product-grid').innerHTML = res.length
    ? res.map(cardHtml).join('')
    : `<div class="empty-state"><p>${t('No matches.', '没有匹配的产品。')}</p></div>`;
}
document.getElementById('search-input').addEventListener('input', e => runSearch(e.target.value));
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') { toggleSearch(false); toggleLangMenu(false); }
});

/* Language on arrival, in order: ?lang=zh on the link, then whatever this reader last
   picked, then English. Johnny sends this link on WeChat, and a Chinese reader landing on an
   English page and having to find a toggle is a page they close. */
function initLang() {
  var want = '';
  try { want = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); } catch (e) {}
  if (!want) { try { want = localStorage.getItem('pv_lang') || ''; } catch (e) {} }
  if (want === 'cn' || want === 'zh-cn' || want === 'zh_hans') want = 'zh';
  if (want && LANGS.some(function (l) { return l.code === want; })) {
    currentLang = want;
    document.documentElement.lang = want;
    var b = document.getElementById('lang-toggle-btn');
    if (b) b.classList.toggle('zh-active', want !== 'en');
  }
}

function init() {
  initLang();
  // Areas follow the 'order' field (pain-point priority); the first one is where the Areas tab opens
  if (AREAS.length && !AREAS.find(a => a.id === currentArea)) currentArea = AREAS[0].id;
  else if (AREAS.length) currentArea = AREAS[0].id;
  currentSolution = SOLUTIONS.length ? SOLUTIONS[0].id : null;
  normalizeProtocol(PROTOCOL);
  loadHash();
  // Auto-open the cart panel when arriving from a shareable link with products pre-loaded
  if (Object.keys(calcSelections).length > 0) {
    document.getElementById('calc-panel').classList.add('open');
  }
  renderLangMenu();
  renderPrimaryTabs();
  updateModeBtn();
  updateFooter();
  updateChrome();
  render();
  updateCalcWidget();
  // ?area=<id> opens that area directly, so a shared link lands on the page it is about.
  const qArea = new URLSearchParams(location.search).get('area');
  if (qArea && AREAS.some(a => a.id === qArea)) homeOpenArea(qArea);
}

// Try live data first (GitHub Pages); fall back to inline snapshot (file://)
try {
  fetch('data/products.json')
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => {
      // Only accept data in the expected shape — otherwise keep the built-in snapshot
      if (d && Array.isArray(d.products) && d.products.length) {
        PRODUCTS = d.products;
        if (Array.isArray(d.areas) && d.areas.length) AREAS = d.areas;
        if (Array.isArray(d.solutions) && d.solutions.length) SOLUTIONS = d.solutions;
        if (d.areaCopy) AREACOPY = d.areaCopy;
        if (d.tiles) TILES = d.tiles;
        if (d.details) DETAILS = d.details;
        if (d.protocol && d.protocol.areas) PROTOCOL = normalizeProtocol(d.protocol);
        if (d.ui) UI = d.ui;
      }
    })
    .catch(() => {})
    .finally(init);
} catch (e) { init(); }
