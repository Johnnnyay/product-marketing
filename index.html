<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellspring · Quality of health is quality of life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --white:        #ffffff;
      --off-white:    #f7f8fa;
      --gray-100:     #f3f4f6;
      --gray-200:     #e5e7eb;
      --gray-300:     #d1d5db;
      --gray-400:     #9ca3af;
      --gray-500:     #6b7280;
      --gray-600:     #4b5563;
      --gray-800:     #1f2937;
      --navy:         #1B2A4A;
      --navy-hover:   #243459;
      --green:        #2D7F4E;
      --green-mid:    #38a169;
      --green-light:  #e8f5ee;
      --purple:       #6b46a0;
      --purple-light: #f0eafb;
      --blue:         #2563eb;
      --blue-light:   #eff6ff;
      --amber:        #b45309;
      --amber-light:  #fffbeb;
      --red:          #dc2626;
      --shadow-xs:    0 1px 2px rgba(0,0,0,0.05);
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:       0 4px 16px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 28px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
      --radius-sm:    8px;
      --radius:       12px;
      --radius-lg:    18px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--off-white);
      color: var(--gray-800);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    #site-header {
      background: var(--navy);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .header-top {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      user-select: none;
    }
    .logo { display: flex; flex-direction: column; line-height: 1.15; }
    .logo-mark { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
    .logo-tag {
      font-size: 10.5px; font-weight: 400; letter-spacing: 0.1px;
      color: rgba(255,255,255,0.5); margin-top: 2px; white-space: nowrap;
    }
    @media (max-width: 700px) { .logo-tag { display: none; } }
    .logo .brand-tag {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      margin-left: 8px;
      letter-spacing: 0;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.18s;
      letter-spacing: 0.3px;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.2); }
    .lang-btn.zh-active { background: rgba(255,255,255,0.15); }

    /* .cat-nav / .cat-tab replaced by .primary-nav / .secondary-nav system */

    /* ─── CATEGORY HERO ─── */
    .cat-hero {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 28px 24px;
      display: none;
    }
    .cat-hero.visible { display: block; }
    .cat-hero-inner { max-width: 1280px; margin: 0 auto; }
    .cat-hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .cat-hero h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .cat-hero p {
      font-size: 14px;
      color: var(--gray-500);
      max-width: 700px;
      line-height: 1.65;
    }
    /* Category accent colors for hero */
    .hero-nutrition .cat-hero-label { color: var(--green); }
    .hero-beauty    .cat-hero-label { color: var(--purple); }
    .hero-care      .cat-hero-label { color: var(--blue); }
    .hero-home      .cat-hero-label { color: var(--amber); }

    /* ─── MAIN + GRID ─── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .section-count {
      font-size: 13px;
      color: var(--gray-400);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ─── PRODUCT CARD ─── */
    .p-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.18s;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--gray-200);
    }
    .p-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    .p-card:active { transform: translateY(-1px); }

    /* Image area */
    .p-img {
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .p-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .p-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
    }
    .p-initial {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .p-brand-small {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }

    /* Category theme backgrounds */
    .theme-nutrition .p-img { background: linear-gradient(135deg, #e0f2ea 0%, #c8e8d9 100%); }
    .theme-nutrition .p-initial { color: var(--green); }
    .theme-nutrition .p-brand-small { color: var(--green); }

    .theme-beauty .p-img { background: linear-gradient(135deg, #ede9f7 0%, #ddd2f0 100%); }
    .theme-beauty .p-initial { color: var(--purple); }
    .theme-beauty .p-brand-small { color: var(--purple); }

    .theme-care .p-img { background: linear-gradient(135deg, #dbeafe 0%, #c3d7f8 100%); }
    .theme-care .p-initial { color: var(--blue); }
    .theme-care .p-brand-small { color: var(--blue); }

    .theme-home .p-img { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
    .theme-home .p-initial { color: var(--amber); }
    .theme-home .p-brand-small { color: var(--amber); }

    /* Card body */
    .p-body {
      padding: 14px 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .p-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .p-brand { color: var(--green); }
    .theme-beauty    .p-brand { color: var(--purple); }
    .theme-care      .p-brand { color: var(--blue); }
    .theme-home      .p-brand { color: var(--amber); }

    .p-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .p-tagline {
      font-size: 12.5px;
      color: var(--gray-500);
      line-height: 1.5;
      flex: 1;
    }

    /* Card footer pricing */
    .p-pricing {
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--gray-100);
      margin-top: 12px;
    }
    .p-price-col {}
    .p-price-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 2px;
    }
    .p-price-ibo {
      font-size: 17px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1;
    }
    .p-price-retail {
      font-size: 11px;
      color: var(--gray-400);
      margin-top: 2px;
    }
    .p-pv-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--green);
      color: white;
      white-space: nowrap;
    }
    .p-pv-badge.dim { background: var(--gray-300); }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,20,35,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-imgbar {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      position: relative;
      overflow: hidden;
    }
    .modal-imgbar img { width: 100%; height: 100%; object-fit: cover; }
    .modal-imgbar-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .modal-initial {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .modal-brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .theme-nutrition .modal-imgbar { background: linear-gradient(135deg, #d1ead9 0%, #b8dfc8 100%); }
    .theme-nutrition .modal-initial { color: var(--green); }
    .theme-nutrition .modal-brand-tag { color: var(--green); }
    .theme-beauty    .modal-imgbar { background: linear-gradient(135deg, #ddd3f1 0%, #cbbde9 100%); }
    .theme-beauty    .modal-initial { color: var(--purple); }
    .theme-beauty    .modal-brand-tag { color: var(--purple); }
    .theme-care      .modal-imgbar { background: linear-gradient(135deg, #c7d9f8 0%, #afc8f5 100%); }
    .theme-care      .modal-initial { color: var(--blue); }
    .theme-care      .modal-brand-tag { color: var(--blue); }
    .theme-home      .modal-imgbar { background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%); }
    .theme-home      .modal-initial { color: var(--amber); }
    .theme-home      .modal-brand-tag { color: var(--amber); }

    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: rgba(0,0,0,0.2);
      border: none;
      color: white;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.4); }

    .modal-head {
      padding: 18px 22px 0;
    }
    .modal-brand-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .theme-nutrition .modal-brand-label { color: var(--green); }
    .theme-beauty    .modal-brand-label { color: var(--purple); }
    .theme-care      .modal-brand-label { color: var(--blue); }
    .theme-home      .modal-brand-label { color: var(--amber); }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--gray-800);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .modal-tagline {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .modal-pricing-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: var(--gray-100);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 0 22px 18px;
    }
    .modal-price-cell { text-align: center; }
    .modal-price-lbl {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 4px;
    }
    .modal-price-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--gray-800);
    }
    .modal-price-val.pv { color: var(--green); }
    .modal-price-val.retail {
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-400);
    }
    .modal-price-val.na { color: var(--gray-300); font-size: 16px; }

    .modal-body { padding: 0 22px 22px; }

    .modal-section { margin-bottom: 16px; }
    .modal-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 6px;
    }
    .modal-section-text {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.65;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-notion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: white;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-notion:hover { background: var(--navy-hover); }
    .btn-notion svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ─── CALCULATOR SECTION ─── */
    .calc-section {
      background: white;
      border-top: 1px solid var(--gray-200);
      padding: 52px 24px;
      text-align: center;
    }
    .calc-inner { max-width: 520px; margin: 0 auto; }
    .calc-section h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--gray-800);
      margin-bottom: 8px;
    }
    .calc-section .calc-sub {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .calc-coming {
      border: 2px dashed var(--gray-200);
      border-radius: var(--radius);
      padding: 36px 24px;
      color: var(--gray-400);
      font-size: 14px;
    }
    .calc-coming .calc-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .calc-milestone {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* ─── FOOTER ─── */
    footer {
      background: var(--navy);
      padding: 20px 24px;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 24px;
      text-align: center;
      color: var(--gray-400);
    }
    .empty-state p { font-size: 15px; }

    /* ─── PRIMARY NAV (mode selector) ─── */
    .primary-nav {
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .primary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
    }
    .primary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      padding: 12px 22px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
      letter-spacing: 0.2px;
    }
    .primary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 22px; right: 22px;
      height: 2px;
      background: #93c5fd;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .primary-tab:hover { color: rgba(255,255,255,0.85); }
    .primary-tab.active { color: white; }
    .primary-tab.active::after { transform: scaleX(1); }

    /* ─── SECONDARY NAV (contextual sub-tabs) ─── */
    .secondary-nav {
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: none;
    }
    .secondary-nav.visible { display: block; }
    .secondary-nav-scroll {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .secondary-nav-scroll::-webkit-scrollbar { display: none; }
    .secondary-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color 0.18s;
    }
    .secondary-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 2px;
      background: white;
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.18s;
    }
    .secondary-tab:hover { color: rgba(255,255,255,0.8); }
    .secondary-tab.active { color: white; }
    .secondary-tab.active::after { transform: scaleX(1); }

    /* ─── PRODUCT IMAGE FIX ─── */
    .p-img img { object-fit: contain !important; padding: 8px; background: white; }
    .modal-imgbar img { object-fit: contain !important; padding: 12px; background: white; }

    /* ─── HEADER CALC WIDGET ─── */
    .header-calc {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 5px 6px 5px 14px;
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .header-calc.visible { display: flex; }
    .header-calc-onetime {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 8px;
    }
    .header-calc-clear {
      background: rgba(255,255,255,0.12);
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 14px;
      transition: background 0.15s;
      margin-left: 2px;
    }
    .header-calc-clear:hover { background: rgba(255,255,255,0.22); color: white; }

    /* ─── CARD SELECTION ─── */
    .p-card.selected {
      box-shadow: 0 0 0 2px var(--green), var(--shadow-sm);
    }
    .p-add-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.28);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      z-index: 2;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .p-add-btn:hover { background: rgba(0,0,0,0.5); transform: scale(1.12); }
    .p-add-btn.selected {
      background: var(--green);
      border-color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.3px;

      transition: transform 0.4s ease;

    .tile:hover .tile-img img { transform: scale(1.06); }
    .tile-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(12,20,38,0.82) 0%, rgba(12,20,38,0.32) 45%, rgba(12,20,38,0.06) 100%);

      content: ''; display: block; width: 26px; height: 3px;

    .module-narrative {

/* ════════════════════════════════════════════════
   TILE ART — real photography (Unsplash, free commercial use).
   Swap any photo by changing its id in scripts/tile_images.json.
   ════════════════════════════════════════════════ */
let TILES = FALLBACK.tiles || { areas:{}, solutions:{}, cats:{} };

function tileUrl(group, key) {
  const v = (TILES[group] || {})[key];
  if (!v) return null;
  // Local repo path (preferred, never expires). Legacy remote forms still supported.
  if (v.startsWith('images/') || v.startsWith('./') || v.startsWith('http')) return v;
  const [host, path] = v.includes('|') ? v.split('|') : ['images.unsplash.com', v];
  return `https://${host}/${path}?auto=format&fit=crop&w=400&h=320&q=70`;
}

function tileHtml(group, key, label, active, onclick) {
  const url = tileUrl(group, key);
  const img = url
    ? `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : '';
  return `<button class="tile${active ? ' active' : ''}" onclick="${onclick}" title="${label}">
    <span class="tile-img">${img}</span>
    <span class="tile-label">${label}</span>
  </button>`;
}

function render() {
  renderSecondaryNavs();
  if (viewMode === 'area') renderAreaView();
  else if (viewMode === 'category') { renderGrid(currentCat); updateHeroCat(currentCat); }
  else renderSolutionView();
}

function renderPrimaryTabs() {
  document.getElementById('vtab-area').textContent = t('Areas of Support', '健康支持');
  document.getElementById('vtab-category').textContent = t('By Category', '按品类');
  document.getElementById('vtab-solution').textContent = t('Solutions', '官方方案');
}

function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.primary-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('vtab-' + mode).classList.add('active');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSecondaryNavs() {
  const strip = document.getElementById('tile-scroll');
  if (viewMode === 'area') {
    strip.innerHTML = AREAS.map(a =>
      tileHtml('areas', a.id, t(a.name, a.nameZh), a.id === currentArea, `selectArea('${a.id}')`)).join('');
  } else if (viewMode === 'category') {
    const cats = [['all', t('All Products','全部产品')], ['nutrition', t('Nutrition','营养补充')],
      ['sports', t('Sports & Energy','运动能量')], ['beauty', t('Beauty','美容护肤')],
      ['care', t('Personal Care','个人护理')], ['home', t('Home','家居')],
      ['solutions', t('Official Bundles','官方套装')]];
    strip.innerHTML = cats.map(([id, label]) =>
      tileHtml('cats', id, label, id === currentCat, `selectCat('${id}')`)).join('');
  } else {
    const sols = SOLUTIONS.filter(s => bizMode === 'ibo' || !s.iboOnly);
    strip.innerHTML = sols.map(s =>
      tileHtml('solutions', s.id, t(s.title, s.titleZh), s.id === currentSolution, `selectSolution('${s.id}')`)).join('');
  }
}

function selectCat(id) {
  currentCat = id;
  renderSecondaryNavs();
  updateHeroCat(id);
  renderGrid(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ════════════════════════════════════════════════
   AREA VIEW  (default landing)
   ════════════════════════════════════════════════ */
function selectArea(id) { currentArea = id; renderSecondaryNavs(); renderAreaView(); }

function renderAreaView() {
  const a = AREAS.find(x => x.id === currentArea) || AREAS[0];

   CATEGORY VIEW
   ════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════
   SOLUTION VIEW  (official Amway bundles as preset stacks)
   ════════════════════════════════════════════════ */
function selectSolution(id) { currentSolution = id; renderSecondaryNavs(); renderSolutionView(); }

function renderSolutionView() {
  const sols = SOLUTIONS.filter(s => bizMode === 'ibo' || !s.iboOnly);
  if (!sols.find(s => s.id === currentSolution)) currentSolution = sols[0] && sols[0].id;
  const s = sols.find(x => x.id === currentSolution);
  if (!s) return;

  const loadBtn = `<button class="hero-stack-btn" onclick="loadStack('${s.id}')">${t('⊕ Load this set into calculator', '⊕ 一键加入计算器')}</button>`;
  heroSet(t('Who this is for', '适合人群'), t(s.title, s.titleZh), t(s.situation, s.situationZh), 'nutrition', loadBtn);

  narrative([
    { label: t('Why a clean checkup still leaves you feeling off', '为什么体检正常却还是不舒服'),
      text: t(s.gap, s.gapZh), cls: 'gap' },
    { label: t('Where to start, in order', '从哪开始，按顺序'),
      text: t(s.path, s.pathZh) },
  ]);

  const cards = (s.contents || []).map(findP).filter(Boolean).filter(p => bizMode === 'ibo' || !p.iboOnly);
  document.getElementById('grid-label').textContent = t('Products that support this', '支持这些需求的产品');
  document.getElementById('grid-count').textContent = `${cards.length} ${t('products', '款产品')}`;
  document.getElementById('product-grid').innerHTML = cards.map(cardHtml).join('');
}

function loadStack(solutionId) {
  const s = SOLUTIONS.find(x => x.id === solutionId);
  if (!s) return;
  (s.contents || []).forEach(id => { if (findP(id)) calcSelections[id] = calcSelections[id] || 1; });
  syncHash();
  updateCalcWidget();
  render();
}

/* ════════════════════════════════════════════════
   CARD RENDERING
   ════════════════════════════════════════════════ */
function cardHtml(p) {
  const theme = CATS[p.cat] ? CATS[p.cat].theme : 'nutrition';
  const initial = p.brand.charAt(0);
  const qty = calcSelections[p.id] || 0;
  const pr = price(p);
  const iurl = imgUrl(p);
  const cc = (viewMode === 'area' && AREACOPY[p.id] && AREACOPY[p.id][currentArea]) || null;

  const imgSection = iurl
    ? `<img src="${iurl}" alt="${p.name}" loading="lazy"
            onerror="this.style.display='none';this.parentElement.querySelector('.p-img-placeholder').style.display='flex'">`
    : '';
  const placeholderDisplay = iurl ? 'display:none' : '';

  const pvBadge = (bizMode === 'ibo')
    ? (p.pv !== null ? `<div class="p-pv-badge">${fmtPv(p.pv)} PV</div>` : `<div class="p-pv-badge dim">—</div>`)
    : '';

  let costTag = '';
  if (p.oneTime) {
    costTag = `<span class="p-onetime-tag">${t('One-time', '一次性')}</span>`;
  } else if (pr) {
    const days = p.daysSupply || 30;
    costTag = `<span class="p-daily-cost">${fmtPrice(pr / days)}${t('/day', '/天')}</span>`;
  }

  const priceLabel = bizMode === 'ibo' ? t('IBO Price', 'IBO价') : t('Price', '价格');
  const subLine = bizMode === 'ibo' && p.retailPrice
    ? `<div class="p-price-retail">${t('Retail', '零售')} ${fmtPrice(p.retailPrice)}</div>` : '';

  const addLabel = qty > 0 ? `×${qty}` : '+';
  const addClass = qty > 0 ? 'p-add-btn selected' : 'p-add-btn';

  return `
    <div class="p-card theme-${theme}${qty > 0 ? ' selected' : ''}" id="card-${p.id}"
         onclick="openModal('${p.id}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')openModal('${p.id}')">
      <div class="p-img">
        ${imgSection}
        <div class="p-img-placeholder" style="${placeholderDisplay}">
          <div class="p-initial">${initial}</div>
          <div class="p-brand-small">${p.brand}</div>
        </div>
        <button class="${addClass}" id="add-btn-${p.id}"
                onclick="toggleSelect('${p.id}',event)"
                aria-label="Add to calculator">${addLabel}</button>
      </div>
      <div class="p-body">
        <div class="p-brand">${p.brand}</div>
        <div class="p-name">${t(p.name, p.nameZh)}</div>
        <div class="p-tagline">${cc ? t(cc.tagline, cc.taglineZh) : t(p.tagline, p.taglineZh)}</div>
      </div>
      <div class="p-pricing">
        <div class="p-price-col">
          <div class="p-price-label">${priceLabel}</div>
          <div class="p-price-ibo-row">
            <span class="p-price-ibo">${fmtPrice(pr)}</span>
            ${costTag}
          </div>
          ${subLine}
        </div>
        ${pvBadge}
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════ */
function openModal(id) {
  const p = findP(id);
  if (!p) return;
  const theme = CATS[p.cat] ? CATS[p.cat].theme : 'nutrition';
  const d = PRODUCT_DETAILS[id] || {};
  const cc = (viewMode === 'area' && AREACOPY[id] && AREACOPY[id][currentArea]) || null;

  const imgbar = document.getElementById('modal-imgbar');
  imgbar.className = `modal-imgbar theme-${theme}`;
  document.getElementById('modal-initial').textContent = p.brand.charAt(0);
  document.getElementById('modal-brand-tag').textContent = p.brand;

  const mImg = document.getElementById('modal-img');
  const mPlaceholder = document.getElementById('modal-img-placeholder');
  const miurl = imgUrl(p);
  if (miurl) {
    mImg.src = miurl; mImg.alt = p.name; mImg.style.display = '';
    mPlaceholder.style.display = 'none';
    mImg.onerror = () => { mImg.style.display='none'; mPlaceholder.style.display='flex'; };
  } else { mImg.style.display = 'none'; mPlaceholder.style.display = 'flex'; }

  const brandLabel = document.getElementById('modal-brand-label');
  brandLabel.className = `modal-brand-label theme-${theme}`;
  brandLabel.textContent = p.brand;
  document.getElementById('modal-title').textContent = t(p.name, p.nameZh);
  document.getElementById('modal-tagline').textContent = cc ? t(cc.tagline, cc.taglineZh) : t(p.tagline, p.taglineZh);
  document.querySelector('#modal-sec-advantage .modal-section-label').textContent = t('Key Advantage', '核心优势');
  document.querySelector('#modal-sec-who .modal-section-label').textContent = t("Who It's For", '适合谁');
  document.querySelector('#modal-sec-how .modal-section-label').textContent = t('How to Share the Story', '如何讲这个故事');

  // Pricing cells adapt to mode
  const cell1 = document.getElementById('modal-cell-1');
  const cell2 = document.getElementById('modal-cell-2');
  const days = p.daysSupply || 30;
  const pr = price(p);
  document.getElementById('modal-lbl-main').textContent = bizMode === 'ibo' ? t('IBO Price','IBO价') : t('Price','价格');
  document.getElementById('modal-ibo-val').textContent = fmtPrice(pr);
  if (bizMode === 'ibo') {
    cell1.style.display = '';
    document.getElementById('modal-lbl-2').textContent = 'PV';
    const pvEl = document.getElementById('modal-pv-val');
    pvEl.textContent = fmtPv(p.pv);
    pvEl.className = p.pv ? 'modal-price-val pv' : 'modal-price-val na';
    document.getElementById('modal-lbl-3').textContent = t('Retail','零售价');
    document.getElementById('modal-retail-val').textContent = fmtPrice(p.retailPrice);
  } else {
    document.getElementById('modal-lbl-2').textContent = t('Per day','每天');
    const pvEl = document.getElementById('modal-pv-val');
    pvEl.textContent = p.oneTime ? t('One-time','一次性') : fmtPrice(pr / days) ;
    pvEl.className = 'modal-price-val';
    document.getElementById('modal-lbl-3').textContent = t('Lasts','可用');
    document.getElementById('modal-retail-val').textContent = p.oneTime ? t('Years','多年') : `${days} ${t('days','天')}`;
  }

  // Body sections — hide when no content
  const sec = (elId, secId, val) => {
    document.getElementById(secId).style.display = val ? '' : 'none';
    if (val) document.getElementById(elId).textContent = val;
  };
  sec('modal-advantage', 'modal-sec-advantage', cc ? t(cc.advantage, cc.advantageZh) : t(d.advantage, d.advantageZh));
  sec('modal-who', 'modal-sec-who', cc ? t(cc.who, cc.whoZh) : t(d.who, d.whoZh));
  sec('modal-how', 'modal-sec-how', bizMode === 'ibo' ? t(d.how, d.howZh) : null);

  const footer = document.getElementById('modal-footer');
  if (d.notionId && bizMode === 'ibo') {
    const url = `https://www.notion.so/${d.notionId.replace(/-/g, '')}`;
    footer.innerHTML = `<a class="btn-notion" href="${url}" target="_blank" rel="noopener">${t('Full Product Profile', '查看完整产品档案')}</a>`;
  } else footer.innerHTML = '';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ════════════════════════════════════════════════
   CALCULATOR
   ════════════════════════════════════════════════ */
const calcSelections = {};   // { productId: qty (1-3) }

function toggleSelect(id, event) {
  if (event) event.stopPropagation();
  const current = calcSelections[id] || 0;
  const next = current >= 3 ? 0 : current + 1;
  if (next === 0) delete calcSelections[id]; else calcSelections[id] = next;

  const btn = document.getElementById('add-btn-' + id);
  const card = document.getElementById('card-' + id);
  if (btn) {
    btn.textContent = next > 0 ? '×' + next : '+';
    btn.className = next > 0 ? 'p-add-btn selected' : 'p-add-btn';
  }
  if (card) card.classList.toggle('selected', next > 0);
  syncHash();
  updateCalcWidget();
}

function clearCalc() {
  Object.keys(calcSelections).forEach(k => delete calcSelections[k]);
  document.querySelectorAll('.p-add-btn').forEach(b => { b.textContent = '+'; b.className = 'p-add-btn'; });
  document.querySelectorAll('.p-card.selected').forEach(c => c.classList.remove('selected'));
  syncHash();
  updateCalcWidget();
}

function calcTotals() {
  let daily = 0, monthly = 0, pvMonthly = 0, oneTime = 0;
  Object.entries(calcSelections).forEach(([id, qty]) => {
    const p = findP(id);
    if (!p) return;
    const pr = price(p) || 0;
    if (p.oneTime) {
      oneTime += pr * qty;
      if (p.pv) pvMonthly += 0; // one-time PV counted separately if needed
    } else {
      const days = p.daysSupply || 30;
      monthly += pr * (30 / days) * qty;
      daily += (pr / days) * qty;
      if (p.pv) pvMonthly += p.pv * (30 / days) * qty;
    }
  });
  const oneTimePv = Object.entries(calcSelections).reduce((s,[id,qty]) => {
    const p = findP(id); return p && p.oneTime && p.pv ? s + p.pv * qty : s;
  }, 0);
  const firstOrder = monthly + oneTime;
  const free = firstOrder >= SHIP.freeAt;
  return { daily, monthly, pvMonthly, oneTime, oneTimePv, firstOrder, free };
}

function updateCalcWidget() {
  const widget = document.getElementById('header-calc');
  const items = Object.keys(calcSelections).length;
  if (!items) { widget.classList.remove('visible'); document.getElementById('calc-panel').classList.remove('open'); return; }
  widget.classList.add('visible');
  const tt = calcTotals();
  let compact = `~${fmtPrice(tt.monthly)}${t('/mo','/月')}`;
  if (tt.oneTime > 0) compact += ` +${fmtPrice(tt.oneTime)}`;
  if (bizMode === 'ibo') compact += ` · ${Math.round(tt.pvMonthly + tt.oneTimePv)} PV`;
  document.getElementById('header-calc-summary').textContent = compact;
  renderCalcPanel();
}

function renderCalcPanel() {
  const tt = calcTotals();
  const rows = [];
  const row = (l, v, cls) => rows.push(`<div class="calc-row ${cls||''}"><span>${l}</span><span>${v}</span></div>`);
  row(t('Daily cost','每日成本'), fmtPrice(tt.daily) + t('/day','/天'));
  row(t('Monthly cost','每月成本'), fmtPrice(tt.monthly) + t('/mo','/月'), 'strong');
  if (bizMode === 'ibo') row('PV' + t(' / month','/月'), (Math.round((tt.pvMonthly + tt.oneTimePv) * 10) / 10) + ' PV', 'pv');
  if (tt.oneTime > 0) row(t('One-time add-ons','一次性大件'), '+' + fmtPrice(tt.oneTime), 'onetime');
  row(t('First order total','首单合计'), fmtPrice(tt.firstOrder), 'strong');
  const shipTxt = tt.free
    ? t('Free (over $150)', '免运费（满$150）')
    : `${fmtPrice(SHIP.std)} · ${t('or','或')} ${fmtPrice(SHIP.ditto)} ${t('on DITTO','DITTO订购')}`;
  row(t('Shipping est.','预计运费'), shipTxt, 'ship');
  if (!tt.free) {
    const gap = SHIP.freeAt - tt.firstOrder;
    rows.push(`<div class="calc-hint">${t(`Add ${fmtPrice(gap)} more for free shipping`, `再加${fmtPrice(gap)}即可免运费`)}</div>`);
  }
  document.getElementById('calc-rows').innerHTML = rows.join('');
}

function toggleCalcPanel() {
  document.getElementById('calc-panel').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('calc-panel');
  const widget = document.getElementById('header-calc');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !widget.contains(e.target)) {
    panel.classList.remove('open');
  }
});

/* ════════════════════════════════════════════════
   SHAREABLE LINKS  (#s=id:qty,id:qty)
   ════════════════════════════════════════════════ */
function syncHash() {
  const parts = Object.entries(calcSelections).map(([id, q]) => q > 1 ? `${id}:${q}` : id);
  const hash = parts.length ? '#s=' + parts.join(',') : '';
  history.replaceState(null, '', location.pathname + location.search + hash);
}

function loadHash() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return;
  m[1].split(',').forEach(part => {
    const [id, q] = part.split(':');
    if (findP(id)) calcSelections[id] = Math.min(3, Math.max(1, parseInt(q || '1', 10) || 1));
  });
}

function copyShareLink() {
  const url = location.href;
  const done = () => {
    const btn = document.getElementById('calc-copy-btn');
    const old = btn.textContent;
    btn.textContent = t('✓ Copied', '✓ 已复制');
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done);
  else { prompt('Copy link:', url); }
}

   NAV WIRING + INIT
   ════════════════════════════════════════════════ */
function updateChrome() {
  document.getElementById('search-input').placeholder = t('Search products', '搜索产品');
  document.getElementById('logo-tag').textContent =
    t('Quality of health is quality of life', '健康的质量，就是生活的质量');
}

function updateFooter() {
  document.getElementById('footer-disclaimer').textContent = t(
    'Content on this page is general wellness education, not medical advice. Shipping estimate based on published US rates (free ground shipping on orders $150+).',
    '本页内容仅为一般健康教育，不构成医疗建议。运费预估基于美国公开费率（订单满$150免地面运费）。');
}

/* ════════════════════════════════════════════════
   SEARCH
   ════════════════════════════════════════════════ */
function runSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { render(); return; }
  heroHide();
  narrative([]);
  const res = visibleProducts().filter(p =>
    [p.name, p.nameZh, p.brand, p.tagline, p.taglineZh].some(s => s && s.toLowerCase().includes(q)));
  document.getElementById('grid-label').textContent = t('Search results', '搜索结果');
  document.getElementById('grid-count').textContent = `${res.length} ${t('products', '款产品')}`;
  document.getElementById('product-grid').innerHTML = res.length
    ? res.map(cardHtml).join('')
    : `<div class="empty-state"><p>${t('No matches.', '没有匹配的产品。')}</p></div>`;
}
document.getElementById('search-input').addEventListener('input', e => runSearch(e.target.value));
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; runSearch(''); e.target.blur(); }
});

function init() {
  // Areas are ordered by real client-assessment frequency; land on the most common one
  if (AREAS.length && !AREAS.find(a => a.id === currentArea)) currentArea = AREAS[0].id;
  else if (AREAS.length) currentArea = AREAS[0].id;
  currentSolution = SOLUTIONS.length ? SOLUTIONS[0].id : null;
  loadHash();
  renderPrimaryTabs();
  updateModeBtn();
  updateFooter();
  updateChrome();
  render();
  updateCalcWidget();
}

// Try live data first (GitHub Pages); fall back to inline snapshot (file://)
try {
  fetch('data/products.json')
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => {
      // Only accept data in the expected shape — otherwise keep the built-in snapshot
      if (d && Array.isArray(d.products) && d.products.length) {
        PRODUCTS = d.products;
        if (Array.isArray(d.areas) && d.areas.length) AREAS = d.areas;
        if (Array.isArray(d.solutions) && d.solutions.length) SOLUTIONS = d.solutions;
        if (d.areaCopy) AREACOPY = d.areaCopy;
        if (d.tiles) TILES = d.tiles;
      }
    })
    .catch(() => {})
    .finally(init);
} catch (e) { init(); }

</script>
