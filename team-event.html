<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HY Team Event</title>
<meta property="og:title" content="HY Team Event">
<meta property="og:description" content="Agenda, roles and details for our Friday Night Hangouts and team nights.">
<meta name="theme-color" content="#F2F5F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* HY team night agendas. Johnny, 2026-10-14: every event in a navigation bar on the left, and on
   the right just a clean page of the agenda with minimal formatting. The FNH palette (deep sage
   on near-white) is kept, but used only for the few things that need pointing at.
   The agendas live in data/team-events.json; the ··· signs in with the health site's admin login
   and makes every part of an event editable. */
:root{
  --ground:#F2F5F1; --page:#FFFFFF; --line:#DDE4DE; --line-2:#C2CCC4;
  --ink:#141A16; --ink-2:#3A453C; --muted:#68756B;
  --sage:#345043; --sage-2:#4A7060; --sage-light:#E4EDE6;
  --amber:#96420A; --amber-light:#FBEEE2; --red:#A81C1C; --blue:#1546B0;
  --nav:286px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--sage)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---- left: every event ---- */
.side{position:fixed;inset:0 auto 0 0;width:var(--nav);background:var(--ground);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:30}
.brand{padding:22px 20px 14px}
.brand .e{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .n{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.brand .n span{color:var(--sage)}
.navlist{flex:1;overflow-y:auto;padding:0 10px 14px}
.ng{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.ni{display:block;text-decoration:none;color:var(--ink);border-radius:9px;padding:8px 10px;border-left:3px solid transparent}
.ni:hover{background:rgba(52,80,67,.07)}
.ni[aria-current="true"]{background:var(--page);border-left-color:var(--sage);box-shadow:0 1px 3px rgba(20,26,22,.08)}
.ni .d{display:block;font-size:12.5px;font-weight:700;color:var(--sage);font-variant-numeric:tabular-nums}
.ni .t{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.ni .s{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.sidefoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sidefoot .sp{flex:1}
.dots{background:none;border:0;color:var(--muted);font:inherit;font-size:20px;font-weight:800;letter-spacing:.06em;line-height:1;
  padding:4px 8px;border-radius:8px;cursor:pointer}
.dots:hover{background:rgba(52,80,67,.08);color:var(--ink)}
.newbtn{display:block;width:calc(100% - 20px);margin:0 10px 4px;text-align:left}

/* ---- right: the agenda as a page ---- */
.main{margin-left:var(--nav);min-height:100vh}
.doc{max-width:720px;margin:0 auto;padding:44px 40px 70px}
.dtop{display:flex;align-items:center;gap:10px;min-height:32px}
.stat{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.stat.past{color:var(--muted)}
.dtop .sp{flex:1}
.doc h1{font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:6px 0 4px;text-wrap:balance}
.dsub{font-size:18px;color:var(--ink-2);margin:0}
.meta{margin:24px 0 0;border-top:1px solid var(--line)}
.meta div{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.meta dt{font-size:13px;font-weight:600;color:var(--muted);padding-top:1px}
.meta dd{margin:0;font-weight:600}
.meta dd small{display:block;font-weight:400;color:var(--ink-2);font-size:14.5px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--sage);text-decoration:underline;cursor:pointer}
.zl{font-weight:500;font-size:14.5px;margin-left:8px}
.doc h2{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:38px 0 10px;
  display:flex;justify-content:space-between;gap:10px}
.doc h2 span{letter-spacing:0;text-transform:none;font-weight:600}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:6px 0}
.rows .k{color:var(--muted);font-variant-numeric:tabular-nums}
.rows .n{display:block;color:var(--muted);font-size:14px}
.tbc{color:var(--muted);font-style:italic;font-weight:400}
.ag{list-style:none;margin:0;padding:0;counter-reset:seg}
.ag > li{counter-increment:seg;padding:16px 0 16px 38px;border-top:1px solid var(--line);position:relative}
.ag > li:first-child{border-top:0;padding-top:4px}
.ag > li::before{content:counter(seg);position:absolute;left:0;top:16px;font-weight:800;color:var(--sage);font-variant-numeric:tabular-nums}
.ag > li:first-child::before{top:4px}
.ag h3{font-size:18px;line-height:1.3;font-weight:700;margin:0}
.am{font-size:14px;color:var(--muted);margin-top:1px}
.am b{color:var(--ink-2);font-weight:600}
.al{margin:6px 0 0;color:var(--ink-2);font-style:italic}
.ag ul{margin:6px 0 0;padding-left:19px}
.ag li li{margin:2px 0}
.ag ul ul{margin-top:2px}
.cal{list-style:none;padding-left:0 !important}
.cal li{display:grid;grid-template-columns:118px 1fr;gap:12px}
.cal .k{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.foot{margin-top:46px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ver{font-size:12px;color:var(--muted);margin:4px 0 0}
.ver.old{color:var(--amber);font-weight:700}
.note{background:var(--amber-light);color:var(--amber);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;margin:0 0 16px}
.empty{color:var(--muted);padding:40px 0}

/* ---- phone: the list becomes a drawer ---- */
.mbar{display:none}
.scrim{display:none}
@media (max-width:820px){
  .side{transform:translateX(-102%);transition:transform .22s ease,visibility .22s;width:min(86vw,320px);visibility:hidden}
  body.navopen .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(20,26,22,.25)}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(20,26,22,.35);z-index:25}
  .main{margin-left:0}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .mbar .n{font-weight:800;font-size:16px;flex:1}
  .mbar .n span{color:var(--sage)}
  .doc{padding:22px 16px 56px}
  .doc h1{font-size:26px}
  .meta div{grid-template-columns:92px 1fr;gap:10px}
  .rows li{grid-template-columns:1fr;gap:0;padding:7px 0}
  .ag > li{padding-left:28px}
  .cal li{grid-template-columns:1fr;gap:0;padding:3px 0}
}

/* ---- admin ---- */
.btn{background:var(--page);border:1.5px solid var(--line-2);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;
  font-weight:700;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.pri:hover{background:var(--sage-2);border-color:var(--sage-2)}
.btn.warn{color:var(--red);border-color:#E3B4B4}
.btn.warn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn:disabled{opacity:.55;cursor:default}
.ed h2:first-of-type{margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fl{display:block;min-width:0}
.fl.full{grid-column:1/-1}
.fl > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 3px}
.fl > span i{font-style:normal;font-weight:400;color:var(--muted)}
.ed input,.ed textarea{width:100%;background:#fff;border:1.5px solid var(--line-2);border-radius:8px;color:var(--ink);
  font:inherit;font-size:15px;padding:7px 10px;line-height:1.45}
.ed textarea{resize:vertical;min-height:62px}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--sage)}
.ed input.bad{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.sege{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px;background:var(--ground)}
.sege .sh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sege .sh b{font-size:14px;color:var(--sage);margin-right:auto}
.sege .grid2{grid-template-columns:2fr 1fr}
.edbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--page);
  border-top:1px solid var(--line);margin:22px 0 0;padding:12px 0}
.edbar .st{flex:1 1 220px;font-size:14px;font-weight:600;color:var(--ink-2);min-width:0}
.edbar .st.err{color:var(--red)}
.edbar .st .btn{margin:6px 6px 0 0}
@media (max-width:640px){ .grid2,.sege .grid2{grid-template-columns:1fr} }
/* Template cards: one per segment type (Add a segment), and one per kind of night (New event). */
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--page);border:1.5px solid var(--line-2);
  border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.tc:hover{border-color:var(--sage);background:var(--sage-light)}
.tc b{font-size:14.5px;line-height:1.3}
.tc span{font-size:12.5px;font-weight:700;color:var(--sage)}
.tc i{font-style:normal;font-size:13px;color:var(--muted);line-height:1.35}
.tc.blank{justify-content:center;align-items:center;color:var(--muted);font-weight:700;border-style:dashed}
.tc.big{padding:16px 16px}
.tc.big b{font-size:17px}
.sege select{font:inherit;font-size:13px;border:1.5px solid var(--line-2);border-radius:7px;padding:3px 6px;background:#fff;color:var(--ink-2);max-width:48%}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;
  padding:9px 16px;font-size:14px;font-weight:600;z-index:95;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
#upd{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 10px 8px 18px;font-size:14px;font-weight:600;max-width:calc(100% - 24px)}
#upd[hidden]{display:none}
#upd button{font:inherit;font-size:13px;font-weight:800;background:#FFD166;color:var(--ink);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
@media print{ .side,.mbar,#upd,.toast,.dtop .btn,.zl{display:none !important} .main{margin:0} .doc{padding:0} }
</style>

<aside class="side" id="side" aria-label="All events">
  <div class="brand"><div class="e">HY Team</div><div class="n">Team <span>Event</span></div></div>
  <div id="adminTop"></div>
  <nav class="navlist" id="nav"></nav>
  <div class="sidefoot"><span class="sp" id="who"></span><button type="button" class="dots" id="dots" title="Admin" aria-label="Admin login">···</button></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <div class="mbar"><div class="n">Team <span>Event</span></div><button type="button" class="btn" id="navbtn" aria-controls="side" aria-expanded="false">All events</button></div>
  <main class="doc" id="doc" aria-live="polite"></main>
</div>
<div id="upd" hidden><span id="updt"></span><button type="button" id="updgo">Reload now</button></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="admin-session.js"></script>
<script>
/* The pre-commit hook in the pm-final clone rewrites this time on every commit that touches this
   file. The version check at the bottom reads it, and the script text, to tell an old copy of
   this page from the newest one (DiamondA70/_skills/app-qa/references/self-update.md). */
const BUILD = "2026-10-15T03:03:40Z";
const SELF = document.currentScript ? document.currentScript.textContent : "";

/* The agendas: data/team-events.json next to this page, read fresh through the API (GitHub Pages
   can lag a minute after a save), the file itself if the API is out of reach, and the last good
   copy kept on this phone if neither answers. Saving goes through the same API and needs the
   admin login; the API refuses an edit to an event someone changed after this page loaded it. */
const API = "https://health-intake-api.vercel.app/api/save-functions?doc=team-events";
const KEEP = "team-events-copy";
const ZOOM_DEFAULT = "515-333-3193";
const FNH_FLOW = [["7:20 to 7:30 PM", "Networking"], ["7:30 to 9:00 PM", "All partners"], ["9:00 to 9:30 PM", "Hangout"]];
const INTROS = { t: "Introductions & Recognition", pts: [
  ["Candidates & new IBOs", ["Name · City · Background · What excites you about the opportunity"]],
  ["Existing partners", ["Name · City · Background · What you did this week (2 MG1 / 20+ PV retail) · Goal"]]
]};

/* ---------------- templates ----------------
   Johnny, 2026-10-14: "study each type of topic to develop template card for each type so future
   event creation can leverage it and be consistent." Built from all 54 segments of the eight
   agendas from Feb 27 to Oct 16, 2026. Ten types (how often each appeared): intro 7, calendar 6,
   growth 9, spotlight 4, product 5, retail 5, panel 3, training 7, wrapup 7, qa 1. A card fills
   in the title, the usual minutes and the standard prompts; who and the topic are left to fill,
   with a hint in the empty box. Each segment keeps its type in `k`. */
const HOST_NOTE = "Keep energy high and the event on time; have music ready before the event starts.";
const READ = "What you read, 1 or 2 major takeaways, 1 or 2 things you are implementing";
const LISTEN = "What you listened to, 1 or 2 major takeaways, 1 or 2 things you are implementing";
const TYPES = [
  { k: "intro", name: "Introductions & Recognition", ph: { who: "Hosts" } },
  { k: "calendar", name: "Calendar", ph: { who: "Host" } },
  { k: "growth", name: "Personal Growth", ph: { who: "One partner" } },
  { k: "spotlight", name: "Partner Spotlight", ph: { who: "One partner (or: Lister, interviewed by Irene)", lead: "The win, e.g. 10+ MG1s in two months" } },
  { k: "product", name: "Product Education & Demo", ph: { who: "Who presents", lead: "The product or area" } },
  { k: "retail", name: "Retail & Volume", ph: { who: "Who shares", lead: "The theme, e.g. product parties, holiday bundles" } },
  { k: "panel", name: "Leadership Panel", ph: { who: "Panelists, led by Johnny", lead: "The theme" } },
  { k: "training", name: "Leadership Training", ph: { who: "Who teaches", lead: "The topic", pts: "3 to 5 points: why it matters, how to do it, what to avoid" } },
  { k: "wrapup", name: "Wrap-Up Training", ph: { who: "Johnny & Irene", lead: "The topic", pts: "3 to 5 points" } },
  { k: "qa", name: "Open Q&A", ph: { who: "The leader" } }
];
const TYPE = {}; TYPES.forEach(function(t){ TYPE[t.k] = t; });
const CARDS = [
  { id: "intro", about: "Guests and new IBOs introduce themselves; partners share their week.", seg: { k: "intro", t: "Introductions & Recognition", pts: INTROS.pts } },
  { id: "calendar", about: "What's coming up on the JL team calendar.", seg: { k: "calendar", t: "Calendar", min: 5 } },
  { id: "book", about: "One partner on what they're reading.", seg: { k: "growth", t: "Personal Growth: Book", min: 2, pts: [READ] } },
  { id: "audio", about: "One partner on what they're listening to.", seg: { k: "growth", t: "Personal Growth: Audio", min: 2, pts: [LISTEN] } },
  { id: "spotlight", about: "One partner, one recent win, and how they did it.", seg: { k: "spotlight", t: "Partner Spotlight", min: 5,
      pts: ["What you did, in numbers", "How you did it: the habits, the help, the hard part", "What you would tell someone starting now"] } },
  { id: "product", about: "One product or area: why it matters, and a demo anyone can repeat.", seg: { k: "product", t: "Product Education & Demo", min: 10,
      pts: ["What it is, and who it's for", "Why it matters, in plain words", "One simple demo anyone can repeat", "How to bring it up in an everyday conversation"] } },
  { id: "retail", about: "How someone found customers and built volume, or a retail skill.", seg: { k: "retail", t: "Retail & Volume", min: 10,
      pts: ["Personal use first, and why it builds belief", "Where the first customers came from", "What the volume looked like after", "One thing to try this week"] } },
  { id: "panel", about: "Two or three partners answer questions, led by a host.", seg: { k: "panel", t: "Leadership Panel", min: 15,
      pts: ["What was it like when you first started?", "What changed, and what made the difference?", "What would you tell someone in their first 90 days?"] } },
  { id: "training", about: "A leader teaches one topic.", seg: { k: "training", t: "Leadership Training", min: 15 } },
  { id: "wrapup", about: "The closing talk from a top leader.", seg: { k: "wrapup", t: "Wrap-Up Training", min: 20 } },
  { id: "qa", about: "Questions to the leader at the end.", seg: { k: "qa", t: "Open Q&A", min: 8 } }
];
const CARD = {}; CARDS.forEach(function(c){ CARD[c.id] = c; });
function fromCard(id, over){ return Object.assign(clone(CARD[id].seg), over || {}); }
/* The two kinds of night so far. FNH: Friday 7:30 at the condo (Mar to Oct). Orientation: Saturday
   8 PM on Zoom (Sep 26). The agenda is the usual running order of each. */
const NIGHTS = {
  fnh: { name: "Friday Night Hangout", about: "Friday 7:30 to 9:00 PM at Johnny & Irene's, also on Zoom. Intros, calendar, product, book, audio, training, wrap-up.",
    make: function(date){ return {
      date: date, kind: "FNH", title: "HY Friday Night Hangout", sub: monthName(date),
      time: "7:30 to 9:00 PM ET", where: "Johnny & Irene's place, Flushing", whereNote: "Address in the group chat · also on Zoom",
      zoom: ZOOM_DEFAULT, pass: "", dress: "Sharp business casual", agendaTitle: "", flow: clone(FNH_FLOW),
      roles: [["Host / Co-host", "", HOST_NOTE], ["Online CEO (Chief Energy Officer)", "", ""], ["DJ & Technology", "", ""]],
      agenda: [fromCard("intro"), fromCard("calendar"), fromCard("product"), fromCard("book"), fromCard("audio"), fromCard("training"), fromCard("wrapup")]
    }; }, day: 5 },
  orientation: { name: "New Apprentice Orientation", about: "Saturday 8:00 to 9:00 PM on Zoom, camera on. Welcome, book, audio, product & volume, mentorship, networking, first 90 days, Q&A.",
    make: function(date){ return {
      date: date, kind: "Orientation", title: "HY Saturday Night Hangout", sub: monthName(date) + " New Apprentice Orientation",
      time: "8:00 to 9:00 PM ET", where: "Zoom only", whereNote: "", zoom: ZOOM_DEFAULT, pass: "", dress: "Business casual, camera on",
      agendaTitle: "New IBO Orientation", flow: [["7:55 to 8:00 PM", "Check in"], ["8:00 to 9:00 PM", "All partners"]],
      roles: [["Host / Timer", "", "Keep energy high and the event on time. Remind everyone to turn their camera on, and give speakers a 30-second countdown."]],
      agenda: [
        { k: "intro", t: "Welcome & Introductions", min: 3, pts: [["New apprentices since the last orientation", ["Name · City · Who you are building with · What you are excited about · One fun fact about yourself"]]] },
        fromCard("book"), fromCard("audio"),
        fromCard("retail", { t: "Product & Volume", lead: "First circle: personal use and retail" }),
        fromCard("training", { t: "Mentorship", min: 5 }),
        fromCard("training", { t: "Networking", min: 10, lead: "Networking in your first 90 days" }),
        fromCard("wrapup", { t: "Leadership Training: First 90 Days", min: 15 }),
        fromCard("qa")
      ]
    }; }, day: 6 }
};
function monthName(d){ return asDate(d).toLocaleDateString("en-US", { month: "long" }); }

let EVENTS = [], SAVED_AT = null, LOADED = false, LOAD_FAILED = false, KEPT_AT = 0, CHOOSING = false;
let EDIT = null, DIRTY = false, SAVING = false, CONFLICT = null;
let stale = false, checkedAt = 0, triedAt = 0, staleKey = "";   /* the version check, at the bottom */

const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function admin(){ return !!(window.AdminSession && AdminSession.has()); }
function todayET(){ return new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" }); }
function asDate(d){ return new Date(d + "T12:00:00"); }
function longDate(d){ return asDate(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }
function navDate(d){ return asDate(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function ymd(t){ return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }
function byDateDesc(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }
function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(el._h); el._h = setTimeout(function(){ el.hidden = true; }, 3200); }

/* The event to open with: the next one coming (today counts), else the most recent. */
function defaultEvent(){
  const t = todayET();
  const ahead = EVENTS.filter(function(e){ return e.date >= t; }).sort(function(a, b){ return -byDateDesc(a, b); });
  return ahead[0] || EVENTS.slice().sort(byDateDesc)[0] || null;
}
function current(){
  const want = decodeURIComponent(location.hash.slice(1));
  return EVENTS.filter(function(x){ return x.id === want; })[0] || defaultEvent();
}
function statusOf(e){
  const t = todayET(), d = defaultEvent();
  if(e.date === t) return ["Tonight", ""];
  if(e.date > t) return [e === d ? "Next up" : "Coming up", ""];
  return [e === d ? "Most recent" : "Past event", "past"];
}

/* ---------------- loading ---------------- */
function setData(d){
  EVENTS = (d.events || []).slice().sort(byDateDesc); SAVED_AT = d.savedAt || null; LOADED = true; LOAD_FAILED = false; KEPT_AT = 0;
  try { localStorage.setItem(KEEP, JSON.stringify({ savedAt: SAVED_AT, events: EVENTS, keptAt: Date.now() })); } catch(e){}
}
function getJSON(u){
  return fetch(u + (u.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ return d && Array.isArray(d.events) ? d : null; })
    .catch(function(){ return null; });
}
function loadData(){
  return getJSON(API).then(function(d){ return d || getJSON("data/team-events.json"); }).then(function(d){
    if(d){
      const changed = !LOADED || KEPT_AT || d.savedAt !== SAVED_AT;
      setData(d);
      if(changed){ if(EDIT) renderNav(); else render(); }
      return;
    }
    if(LOADED) return;
    let kept = null; try { kept = JSON.parse(localStorage.getItem(KEEP) || "null"); } catch(e){}
    if(kept && Array.isArray(kept.events)){ EVENTS = kept.events; SAVED_AT = kept.savedAt; LOADED = true; KEPT_AT = kept.keptAt || 1; }
    else LOAD_FAILED = true;

  });
}

/* ---------------- editing ----------------
   Lists are typed as lines. Overview: "time | what". Roles: "role | person | note". Calendar:
   "date | what". Points: one per line; a line starting with "- " is a sub-point of the one above. */
function fmtRows(rows){ return (rows || []).map(function(r){ const a = r.slice(); while(a.length && !a[a.length - 1]) a.pop(); return a.join(" | "); }).join("\n"); }
function parseRows(text, n){
  return String(text || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    const p = l.split("|").map(function(x){ return x.trim(); });
    const out = p.slice(0, n - 1); out.push(p.slice(n - 1).join(" | "));
    while(out.length < n) out.push("");
    return out;
  });
}
function fmtPts(pts){ return (pts || []).map(function(p){ return Array.isArray(p) ? [p[0]].concat((p[1] || []).map(function(q){ return "- " + q; })).join("\n") : p; }).join("\n"); }
function parsePts(text){
  const out = [];
  String(text || "").split("\n").forEach(function(l){
    if(!l.trim()) return;
    const m = /^\s*[-–•]\s+(.*)$/.exec(l);
    if(m && out.length){
      let last = out[out.length - 1];
      if(!Array.isArray(last)){ last = [last, []]; out[out.length - 1] = last; }
      last[1].push(m[1].trim());
    } else out.push(l.replace(/^\s*[-–•]\s+/, "").trim());
  });
  return out;
}
function field(name, label, value, opts){
  opts = opts || {};
  const tag = opts.area ? '<textarea name="' + name + '" rows="' + (opts.rows || 3) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + '>' + esc(value || "") + '</textarea>'
    : '<input name="' + name + '" type="' + (opts.type || "text") + '" value="' + esc(value == null ? "" : value) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.attr || "") + '>';
  return '<label class="fl' + (opts.full ? ' full' : '') + '"><span>' + label + '</span>' + tag + (opts.hint ? '<p class="hint">' + opts.hint + '</p>' : '') + '</label>';
}

    +   field("t", "Title", s.t) + field("min", "Minutes", s.min || "", { type: "number", attr: ' min="0" max="240" inputmode="numeric"' })
    +   field("lead", "Subtitle <i>(optional)</i>", s.lead, { ph: ph.lead }) + field("who", "Who", s.who, { ph: ph.who })
    +   field("pts", "Points <i>(one per line; start a line with - for a sub-point)</i>", fmtPts(s.pts), { area: true, full: true, rows: Math.max(3, (s.pts || []).length + 1), ph: ph.pts })
    +   field("cal", "Calendar rows <i>(optional: date | what)</i>", fmtRows(s.cal), { area: true, full: true, rows: s.cal && s.cal.length ? s.cal.length + 1 : 2, ph: "Oct 21 (Wed) | JL Team Evaluation" })
    + '</div></div>';

function collect(){
  const f = $("edf"); if(!f || !EDIT) return;
  const v = function(n, root){ const el = (root || f).querySelector('[name="' + n + '"]'); return el ? el.value : ""; };
  const d = EDIT.draft;
  ["title", "sub", "kind", "date", "time", "where", "whereNote", "zoom", "pass", "dress", "agendaTitle"].forEach(function(k){ d[k] = v(k).trim(); });
  d.flow = parseRows(v("flow"), 2);
  d.roles = parseRows(v("roles"), 3);
  d.agenda = Array.prototype.map.call(f.querySelectorAll(".sege"), function(s){
    const seg = { t: v("t", s).trim() };
    const k = v("k", s); if(k) seg.k = k;
    const lead = v("lead", s).trim(), who = v("who", s).trim(), min = parseInt(v("min", s), 10);
    if(lead) seg.lead = lead;
    if(min > 0) seg.min = min;
    if(who) seg.who = who;
    const cal = parseRows(v("cal", s), 2); if(cal.length) seg.cal = cal;
    const pts = parsePts(v("pts", s)); if(pts.length) seg.pts = pts;
    return seg;
  });
}
function edStatus(t, err){ const el = $("edst"); if(el){ el.textContent = t; el.classList.toggle("err", !!err); } }
/* The next free date on that weekday (5 Friday, 6 Saturday), today included. */
function nextDay(dow){
  const t = asDate(todayET());
  t.setDate(t.getDate() + (dow - t.getDay() + 7) % 7);
  while(EVENTS.some(function(e){ return e.date === ymd(t); })) t.setDate(t.getDate() + 7);
  return ymd(t);
}
function startNew(){
  if(EDIT && DIRTY){ toast("Save or cancel the event you are editing first."); return; }

function chooserHTML(){
  return '<div class="dtop"><span class="stat">New event</span></div><h1>What kind of night?</h1>'
    + '<p class="dsub">Starts from the usual running order. Everything can be changed before you save.</p>'
    + '<div class="tpl" style="margin-top:22px">' + Object.keys(NIGHTS).map(function(id){
        const n = NIGHTS[id];
        return '<button type="button" class="tc big" data-act="night" data-night="' + id + '"><b>' + esc(n.name) + '</b>'
          + '<span>' + esc(navDate(nextDay(n.day))) + '</span><i>' + esc(n.about) + '</i></button>';
      }).join("")
    + '<button type="button" class="tc blank big" data-act="night" data-night="">Blank event</button></div>'
    + '<p style="margin-top:18px"><button type="button" class="btn" data-act="unchoose">Cancel</button></p>';
}
function startFrom(id){
  const n = NIGHTS[id];
  const draft = n ? n.make(nextDay(n.day)) : { date: nextDay(5), kind: "", title: "", sub: "", time: "", where: "", whereNote: "",
    zoom: ZOOM_DEFAULT, pass: "", dress: "", agendaTitle: "", flow: [], roles: [], agenda: [] };
  CHOOSING = false;
  EDIT = { id: null, isNew: true, base: null, draft: draft };
  DIRTY = true; CONFLICT = null; render(); scrollTo(0, 0);
}
function startEdit(){
  const e = current(); if(!e) return;
  EDIT = { id: e.id, isNew: false, base: e.at || null, draft: clone(e) };
  DIRTY = false; CONFLICT = null; render(); scrollTo(0, 0);
}
function stopEdit(){ EDIT = null; DIRTY = false; CONFLICT = null; render(); scrollTo(0, 0); }
function save(){
  collect();
  const d = EDIT.draft;
  if(!d.title){ edStatus("Give the event a title.", true); markBad("title"); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){ edStatus("Pick the date.", true); markBad("date"); return; }
  let id = EDIT.id;
  if(EDIT.isNew){ id = d.date; let n = 2; while(EVENTS.some(function(e){ return e.id === id; })) id = d.date + "-" + n++; }
  const ev = clone(d); ev.id = id; delete ev.at;
  const body = { events: {}, base: {} }; body.events[id] = ev; body.base[id] = EDIT.isNew ? null : EDIT.base;
  send(body, function(){
    EDIT = null; DIRTY = false; CONFLICT = null;
    history.replaceState(null, "", "#" + id); render(); scrollTo(0, 0);
    toast("Saved. Everyone sees it on their next refresh, within a minute.");
  });
}
function markBad(n){ const el = document.querySelector('#edf [name="' + n + '"]'); if(el){ el.classList.add("bad"); el.focus(); } }
function deleteEvent(){
  const body = { events: {}, base: {} }; body.events[EDIT.id] = { deleted: true }; body.base[EDIT.id] = EDIT.base;
  send(body, function(){
    EDIT = null; DIRTY = false; CONFLICT = null;
    history.replaceState(null, "", location.pathname); render(); scrollTo(0, 0);
    toast("Event deleted.");
  });
}
function send(body, onOk){
  if(SAVING) return;
  if(!admin()){ AdminSession.login(function(){ renderNav(); send(body, onOk); }); return; }
  SAVING = true; CONFLICT = null; edStatus("Saving…");
  document.querySelectorAll('.edbar .btn').forEach(function(b){ b.disabled = true; });
  const done = function(){ SAVING = false; document.querySelectorAll('.edbar .btn').forEach(function(b){ b.disabled = false; }); };
  fetch(API, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, AdminSession.headers()), body: JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function(x){
      done();
      if(x.ok && Array.isArray(x.j.events)){ setData(x.j); onOk(); return; }
      if(x.status === 401){
        AdminSession.logout(); renderNav();
        edStatus("Your admin login has expired. Sign in again and it saves.", true);
        AdminSession.login(function(){ renderNav(); send(body, onOk); });
        return;
      }
      if(x.status === 409 && Array.isArray(x.j.events)){
        setData({ savedAt: x.j.savedAt, events: x.j.events }); renderNav();
        CONFLICT = { msg: x.j.error || "This event changed on another device." }; showConflict(); return;
      }
      edStatus("Not saved: " + (x.j.error || "error " + x.status) + ". Your changes are still here.", true);
    })
    .catch(function(){ done(); edStatus("Not saved. Check the connection and tap Save again. Your changes are still here.", true); });
}
function showConflict(){
  const el = $("edst"); if(!el) return;
  el.classList.add("err");
  el.innerHTML = esc(CONFLICT.msg) + ' Not saved. Your version is still here.<br>'
    + '<button type="button" class="btn sm pri" data-act="mine">Save mine over it</button>'
    + (EDIT.isNew ? '' : '<button type="button" class="btn sm" data-act="theirs">Load the newer one</button>');
}
function keepMine(){
  collect();
  const id = EDIT.id, cur = EVENTS.filter(function(e){ return e.id === id; })[0];
  if(EDIT.isNew){ /* the date is taken: save() picks the next free id */ }
  else if(cur) EDIT.base = cur.at || null;
  else { EDIT.isNew = true; EDIT.base = null; }       /* deleted elsewhere: save it back as new */
  CONFLICT = null; save();
}
function loadTheirs(){
  const cur = EVENTS.filter(function(e){ return e.id === EDIT.id; })[0];
  if(!cur){ stopEdit(); toast("That event was deleted on another device."); return; }
  EDIT = { id: cur.id, isNew: false, base: cur.at || null, draft: clone(cur) }; DIRTY = false; CONFLICT = null; render();
}
function arm(btn, label, fn){
  if(btn.dataset.armed){ fn(); return; }
  const was = btn.textContent; btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = was; } }, 3500);
}

document.addEventListener("click", function(ev){
  const c = ev.target.closest("[data-copy]");
  if(c){
    const v = c.dataset.copy.replace(/\D/g, "");
    const ok = function(){ toast("Zoom ID copied"); }, no = function(){ toast("Zoom ID: " + c.dataset.copy); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, no); else no();
    return;
  }
  const b = ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === "retry"){ LOAD_FAILED = false; render(); loadData(); return; }
  if(act === "new"){ startNew(); return; }
  if(act === "night"){ startFrom(b.dataset.night); return; }
  if(act === "unchoose"){ CHOOSING = false; render(); return; }
  if(act === "edit"){ startEdit(); return; }
  if(act === "signout"){
    if(EDIT && DIRTY){ toast("Save or cancel your edit first."); return; }
    AdminSession.logout(); EDIT = null; render(); toast("Signed out of admin."); return;
  }
  if(!EDIT) return;
  if(act === "save"){ save(); return; }
  if(act === "cancel"){ if(DIRTY) arm(b, "Discard changes?", stopEdit); else stopEdit(); return; }
  if(act === "delevent"){ arm(b, "Tap again to delete", deleteEvent); return; }
  if(act === "mine"){ keepMine(); return; }
  if(act === "theirs"){ loadTheirs(); return; }
  if(act === "addseg" || act === "addtpl"){
    collect(); EDIT.draft.agenda = EDIT.draft.agenda || [];
    EDIT.draft.agenda.push(act === "addtpl" ? fromCard(b.dataset.tpl) : { t: "" }); DIRTY = true; renderEditor();
    const all = document.querySelectorAll(".sege"), last = all[all.length - 1];
    if(last){ last.scrollIntoView({ block: "center" }); last.querySelector(act === "addtpl" ? '[name="who"]' : '[name="t"]').focus(); }
    return;
  }
  const seg = b.closest(".sege"); if(!seg) return;
  /* collect() builds a fresh agenda list from the form, so take the list after it, not before. */
  const i = +seg.dataset.i;
  if(act === "up" || act === "down"){
    collect(); const ag = EDIT.draft.agenda, j = act === "up" ? i - 1 : i + 1; if(j < 0 || j >= ag.length) return;
    const tmp = ag[i]; ag[i] = ag[j]; ag[j] = tmp; DIRTY = true; renderEditor(); return;
  }
  if(act === "delseg"){ arm(b, "Tap again", function(){ collect(); EDIT.draft.agenda.splice(i, 1); DIRTY = true; renderEditor(); }); }
});
$("doc").addEventListener("input", function(ev){
  if(!EDIT) return;
  DIRTY = true; ev.target.classList && ev.target.classList.remove("bad");
  if(ev.target.name === "title"){ const h = document.querySelector("#doc h1"); if(h) h.textContent = ev.target.value || "Untitled event"; }
});
addEventListener("beforeunload", function(ev){ if(EDIT && DIRTY){ ev.preventDefault(); ev.returnValue = ""; } });
addEventListener("hashchange", function(){ if(!EDIT){ render(); scrollTo({ top: 0 }); } });

render();
loadData();
setInterval(function(){ if(!document.hidden) loadData(); }, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) loadData(); });

/* ---------- always the newest version ----------
   GitHub Pages lets a browser reuse its saved copy for ten minutes, and a tab that stays open
   never asks again, so a phone opened before the last change would keep old code. The page asks
   the server for its own newest copy, past every cache: on load, when the tab comes back into
   view, and once a minute. If the script there differs from the one running, it reloads onto
   it, keeping the event you were on. Never while an edit is open: it waits for Save or Cancel. */
function paintVer(){
  const when = function(t){ return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
  const txt = "Version " + when(BUILD) + (stale ? " · a newer version is out, reloading"
    : checkedAt ? " · the newest (checked " + new Date(checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ")" : "");
  document.querySelectorAll(".ver").forEach(function(el){ el.textContent = txt; el.classList.toggle("old", stale); });
}
function freshen(){
  if(!/^https?:$/.test(location.protocol) || document.hidden || Date.now() - triedAt < 8000) return;
  triedAt = Date.now();
  fetch(location.pathname + "?latest=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(html){
      const m = /const BUILD = "([^"]+)";/.exec(html);
      if(!m || !SELF) return;                  /* not this page: a wifi sign-in screen, an error */
      checkedAt = Date.now();
      /* Behind only when the server's copy is not older and its script differs. Right after a
         push one edge server can lag, and that must not pull anyone back. */
      stale = m[1] >= BUILD && html.indexOf(SELF) < 0;
      staleKey = m[1] + ":" + html.length;
      paintVer(); reloadWhenSafe();
    }).catch(function(){});
}
function reloadWhenSafe(){
  if(!stale){ $("upd").hidden = true; return; }
  let tried = ""; try{ tried = sessionStorage.getItem("team-event-tried") || ""; }catch(e){}
  /* One automatic reload per new version, so a bad edge server can never cause a loop. */
  if(tried !== staleKey && !EDIT){ reloadNow(); return; }
  $("updt").textContent = EDIT ? "A newer version is out. It loads after you save or cancel." : "A newer version of this page is out.";
  $("upd").hidden = false;
}
function reloadNow(){
  try{ sessionStorage.setItem("team-event-tried", staleKey); }catch(e){}
  location.replace(location.pathname + "?v=" + Date.now() + location.hash);
}
$("updgo").onclick = function(){ if(EDIT && DIRTY){ toast("Save or cancel your edit first."); return; } reloadNow(); };
paintVer(); freshen();
setInterval(freshen, 60000);
setInterval(function(){ if(stale) reloadWhenSafe(); }, 3000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) freshen(); });
addEventListener("focus", freshen);
addEventListener("pageshow", function(e){ if(e.persisted){ triedAt = 0; freshen(); } });
</script>
