<style>
/* The agenda for every HY team night, the newest first. Same look as the FNH Jeopardy page
   (fnh.html): light ground, near-black text, deep sage, because it gets screen-shared on Zoom
   and read on phones in a bright room as often as it is read at a desk. Agendas come from
   Johnny's Notion page "Team Event Agenda 2026"; each one is an entry in EVENTS below. */
:root{
  --ground:#F2F5F1; --panel:#FFFFFF; --panel-2:#E8EEE8; --line:#C8D2C9; --line-2:#A8B6AA;
  --ink:#141A16; --ink-2:#3A453C; --muted:#5F6C62;
  --sage:#345043; --sage-2:#4A7060; --sage-light:#E4EDE6;
  --amber:#96420A; --amber-light:#FBEEE2; --blue:#1546B0;
  --shadow:0 10px 34px rgba(20,26,22,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:26px 18px 60px}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
a{color:var(--sage);font-weight:600}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.05;margin-top:2px}
.top h1 span{color:var(--sage)}
.jump{background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink-2);
  font:inherit;font-size:14px;font-weight:700;padding:8px 13px;cursor:pointer;text-decoration:none}
.jump:hover{border-color:var(--line-2);color:var(--ink)}

/* The event itself */
.hero{background:var(--sage);color:#fff;border-radius:16px;padding:22px 22px 20px;box-shadow:var(--shadow)}
.pill{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  border-radius:999px;padding:5px 12px;background:#FFD166;color:#2A2008}
.pill.past{background:rgba(255,255,255,.18);color:#fff}
.hero h2{font-size:34px;line-height:1.06;margin:12px 0 4px}
.hero .subt{font-size:19px;font-weight:600;opacity:.92;margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fact{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:10px 13px;min-width:0}
.fact .k{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.fact .v{font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.fact .v small{display:block;font-size:14px;font-weight:500;opacity:.88}
.zoomrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.zbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--sage);border:0;border-radius:9px;
  font:inherit;font-size:14px;font-weight:800;padding:7px 12px;cursor:pointer;text-decoration:none}
.zbtn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.zbtn:hover{filter:brightness(.96)}

.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.card h3{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two .card{margin-top:16px}
.flow{list-style:none;margin:0;padding:0}
.flow li{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--panel-2)}
.flow li:first-child{border-top:0;padding-top:0}
.flow .t{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:122px;color:var(--sage)}
.roles{list-style:none;margin:0;padding:0}
.roles li{padding:7px 0;border-top:1px solid var(--panel-2)}
.roles li:first-child{border-top:0;padding-top:0}
.roles .r{font-size:13.5px;font-weight:700;color:var(--muted)}
.roles .p{font-weight:800;font-size:17px}
.roles .n{font-size:14px;color:var(--ink-2);margin-top:1px}

/* The run of show */
.agenda-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.agenda-h h3{font-size:22px}
.agenda-h .tot{font-size:14px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;background:var(--panel);border:2px solid var(--line);
  border-radius:14px;padding:16px 18px;margin-top:10px}
.seg .no{width:36px;height:36px;border-radius:10px;background:var(--sage-light);color:var(--sage);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:17px}
.seg h4{margin:0;font-size:19.5px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.seg .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;align-items:center}
.seg .min{font-size:13px;font-weight:800;background:var(--amber-light);color:var(--amber);border-radius:999px;padding:2px 10px}
.seg .who{font-size:15px;font-weight:700;color:var(--sage)}
.seg .lead{margin:8px 0 0;color:var(--ink-2);font-style:italic}
.seg ul{margin:8px 0 0;padding-left:20px}
.seg li{margin:3px 0}
.seg li ul{margin-top:3px}
.seg li::marker{color:var(--sage-2)}
.seg .body{grid-column:2;min-width:0}
.seg .cal{list-style:none;padding:0}
.seg .cal li{display:flex;gap:10px}
.seg .cal .d{font-weight:800;color:var(--sage);min-width:92px;font-variant-numeric:tabular-nums}

/* Every event */
.past{margin-top:34px}
.past h3{font-size:22px;margin-bottom:10px}
.plist{list-style:none;margin:0;padding:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.plist a{display:flex;gap:14px;align-items:baseline;padding:13px 18px;border-top:1px solid var(--panel-2);
  color:var(--ink);text-decoration:none;font-weight:600}
.plist li:first-child a{border-top:0}
.plist a:hover{background:var(--ground)}
.plist a[aria-current="true"]{background:var(--sage-light)}
.plist .d{font-weight:800;color:var(--sage);min-width:104px;font-variant-numeric:tabular-nums}
.plist .k{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.ver{font-size:12px;color:var(--muted);margin:6px 0 0}
.ver.old{color:var(--amber);font-weight:700}
#upd{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 10px 8px 18px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);max-width:calc(100% - 24px)}
#upd[hidden]{display:none}
#upd button{font:inherit;font-size:13px;font-weight:800;background:#FFD166;color:var(--ink);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;
  padding:9px 16px;font-size:14px;font-weight:600;z-index:95}
.toast[hidden]{display:none}

@media (max-width:640px){
  .wrap{padding:18px 16px 50px}
  .hero{padding:18px 16px}
  .hero h2{font-size:28px}
  .facts,.two{grid-template-columns:1fr}
  .two{gap:0}
  .seg{grid-template-columns:1fr;padding:14px 15px}
  .seg .no{width:30px;height:30px;font-size:15px;border-radius:8px}
  .seg .body{grid-column:1}
  .flow .t{min-width:104px}
  .plist .d{min-width:84px}
  .plist .k{display:none}
}
@media print{ .jump,.zoomrow,#upd,.past{display:none} body{background:#fff} .hero{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:none} .fact{border-color:var(--line)} .pill{border:1px solid var(--line)} }
</style>

const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function todayET(){ return new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" }); }
function longDate(d){ return new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }
function shortDate(d){ return new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
/* The event to open with: the next one coming (today counts), else the most recent. */
function defaultEvent(){
  const t = todayET();
  const ahead = EVENTS.filter(function(e){ return e.date >= t; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  return ahead[0] || EVENTS.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; })[0];
}
function status(e){
  const t = todayET(), d = defaultEvent();
  if(e.date === t) return ["Tonight", ""];
  if(e.date > t) return [e === d ? "Next up" : "Coming up", ""];
  return [e === d ? "Most recent" : "Past event", "past"];
}
function pointsHTML(pts){
  return '<ul>' + pts.map(function(p){
    return Array.isArray(p) ? '<li>' + esc(p[0]) + pointsHTML(p[1]) + '</li>' : '<li>' + esc(p) + '</li>';
  }).join("") + '</ul>';
}
function segHTML(s, i){
  return '<article class="seg"><div class="no" aria-hidden="true">' + (i + 1) + '</div><div class="body">'
    + '<h4>' + esc(s.t) + '</h4>'
    + ((s.min || s.who) ? '<div class="meta">' + (s.min ? '<span class="min">' + s.min + ' min</span>' : '') + (s.who ? '<span class="who">' + esc(s.who) + '</span>' : '') + '</div>' : '')
    + (s.lead ? '<p class="lead">' + esc(s.lead) + '</p>' : '')
    + (s.cal ? '<ul class="cal">' + s.cal.map(function(c){ return '<li><span class="d">' + esc(c[0]) + '</span><span>' + esc(c[1]) + '</span></li>'; }).join("") + '</ul>' : '')
    + (s.pts ? pointsHTML(s.pts) : '')
    + '</div></article>';
}
function render(){
  const want = decodeURIComponent(location.hash.slice(1));
  const e = EVENTS.filter(function(x){ return x.id === want; })[0] || defaultEvent();
  const st = status(e);
  const zid = (e.zoom || ZOOM).replace(/\D/g, "");
  const total = e.agenda.reduce(function(n, s){ return n + (s.min || 0); }, 0);
  $("ev").innerHTML =
    '<section class="hero" aria-labelledby="evt">'
    + '<span class="pill ' + st[1] + '">' + esc(st[0]) + '</span>'
    + '<h2 id="evt">' + esc(e.title) + '</h2>'
    + (e.sub ? '<p class="subt">' + esc(e.sub) + '</p>' : '')
    + '<div class="facts">'
    +   '<div class="fact"><div class="k">When</div><div class="v">' + esc(longDate(e.date)) + '<small>' + esc(e.time) + '</small></div></div>'
    +   '<div class="fact"><div class="k">Where</div><div class="v">' + esc(e.where) + (e.whereNote ? '<small>' + esc(e.whereNote) + '</small>' : '') + '</div></div>'
    +   '<div class="fact"><div class="k">Zoom</div><div class="v">' + esc(e.zoom || ZOOM)
    +     (e.pass ? '<small>Passcode ' + esc(e.pass) + '</small>' : '')
    +     '<div class="zoomrow"><a class="zbtn" href="https://zoom.us/j/' + zid + '" target="_blank" rel="noopener">Join Zoom</a>'
    +     '<button type="button" class="zbtn ghost" data-copy="' + esc(e.zoom || ZOOM) + '">Copy ID</button></div></div></div>'
    +   '<div class="fact"><div class="k">Dress code</div><div class="v">' + esc(e.dress) + '</div></div>'
    + '</div></section>'
    + '<div class="two">'
    +   (e.flow ? '<section class="card"><h3>Overview</h3><ul class="flow">' + e.flow.map(function(f){ return '<li><span class="t">' + esc(f[0]) + '</span><span>' + esc(f[1]) + '</span></li>'; }).join("") + '</ul></section>' : '')
    +   '<section class="card"' + (e.flow ? '' : ' style="grid-column:1/-1"') + '><h3>Roles</h3><ul class="roles">' + e.roles.map(function(r){
          return '<li><div class="r">' + esc(r[0]) + '</div><div class="p">' + esc(r[1]) + '</div>' + (r[2] ? '<div class="n">' + esc(r[2]) + '</div>' : '') + '</li>';
        }).join("") + '</ul></section>'
    + '</div>'
    + '<div class="agenda-h"><h3>' + esc(e.agendaTitle || "Agenda") + '</h3>' + (total ? '<span class="tot">' + total + ' min planned</span>' : '') + '</div>'
    + e.agenda.map(segHTML).join("");
  document.title = e.title + " · " + shortDate(e.date);
  $("plist").innerHTML = EVENTS.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).map(function(x){
    return '<li><a href="#' + x.id + '"' + (x === e ? ' aria-current="true"' : '') + '><span class="d">' + esc(shortDate(x.date)) + '</span>'
      + '<span>' + esc(x.title) + (x.sub ? ' · ' + esc(x.sub) : '') + '</span><span class="k">' + esc(x.kind) + '</span></a></li>';
  }).join("");
}
addEventListener("hashchange", function(){
  if(location.hash === "#all") return;
  render(); scrollTo({ top: 0, behavior: "smooth" });
});
document.addEventListener("click", function(ev){
  const b = ev.target.closest("[data-copy]"); if(!b) return;
  const v = b.dataset.copy.replace(/\D/g, "");
  const done = function(ok){ const t = $("toast"); t.textContent = ok ? "Zoom ID copied" : "Zoom ID: " + b.dataset.copy; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, 2200); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function(){ done(true); }, function(){ done(false); });
  else done(false);
});
render();

/* ---------- always the newest version ----------
   GitHub Pages lets a browser reuse its saved copy for ten minutes, and a tab that stays open
   never asks again, so a phone opened before the last change would keep the old agenda. The page
   asks the server for its own newest copy, past every cache: on load, when the tab comes back
   into view, and once a minute. If the script there differs from the one running, it reloads
   onto it, keeping the event you were on. Nothing here is typed, so nothing to protect. */
let stale = false, checkedAt = 0, triedAt = 0, staleKey = "";
function paintVer(){
  const when = function(t){ return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
  const txt = "Version " + when(BUILD) + (stale ? " · a newer version is out, reloading"
    : checkedAt ? " · the newest (checked " + new Date(checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ")" : "");
  document.querySelectorAll(".ver").forEach(function(el){ el.textContent = txt; el.classList.toggle("old", stale); });
}
function freshen(){
  if(!/^https?:$/.test(location.protocol) || document.hidden || Date.now() - triedAt < 8000) return;
  triedAt = Date.now();
  fetch(location.pathname + "?latest=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(html){
      const m = /const BUILD = "([^"]+)";/.exec(html);
      if(!m || !SELF) return;                  /* not this page: a wifi sign-in screen, an error */
      checkedAt = Date.now();
      /* Behind only when the server's copy is not older and its script differs. Right after a
         push one edge server can lag, and that must not pull anyone back. */
      stale = m[1] >= BUILD && html.indexOf(SELF) < 0;
      staleKey = m[1] + ":" + html.length;
      paintVer(); reloadWhenSafe();
    }).catch(function(){});
}
function reloadWhenSafe(){
  if(!stale){ $("upd").hidden = true; return; }
  let tried = ""; try{ tried = sessionStorage.getItem("team-event-tried") || ""; }catch(e){}
  /* One automatic reload per new version, so a bad edge server can never cause a loop. */
  if(tried !== staleKey){ reloadNow(); return; }
  $("updt").textContent = "A newer version of this page is out.";
  $("upd").hidden = false;
}
function reloadNow(){
  try{ sessionStorage.setItem("team-event-tried", staleKey); }catch(e){}
  location.replace(location.pathname + "?v=" + Date.now() + location.hash);
}
$("updgo").onclick = reloadNow;
paintVer(); freshen();
setInterval(freshen, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) freshen(); });
addEventListener("focus", freshen);
addEventListener("pageshow", function(e){ if(e.persisted){ triedAt = 0; freshen(); } });
</script>
