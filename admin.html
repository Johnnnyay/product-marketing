<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Health Reports Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:        #3D5A4C;
    --navy-hover:  #47695a;
    --green:       #5C8A6E;
    --green-light: #EDF2EE;
    --off-white:   #F7F9F7;
    --gray-100:    #F0F3F0;
    --gray-200:    #E4E9E5;
    --gray-300:    #d1d5db;
    --gray-400:    #9ca3af;
    --gray-500:    #6E7B74;
    --gray-600:    #55605A;
    --gray-800:    #2A332D;
    --amber:       #b45309;
    --amber-light: #fffbeb;
    --red:         #dc2626;
    --red-light:   #fef2f2;
    --shadow-sm:   0 1px 4px rgba(0,0,0,0.07);
    --shadow:      0 4px 16px rgba(0,0,0,0.09);
    --radius:      12px;
    --radius-lg:   18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--off-white);
    color: var(--gray-800);
    -webkit-font-smoothing: antialiased;
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--navy);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-logo {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
  }
  .admin-badge {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logout-btn {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 52px);
    padding: 24px;
  }
  .login-card {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-icon {
    width: 56px;
    height: 56px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 24px;
  }
  .login-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 13px;
    color: var(--gray-500);
    margin-bottom: 28px;
  }
  .login-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--gray-800);
    background: var(--off-white);
    outline: none;
    transition: border-color 0.15s;
    text-align: center;
    letter-spacing: 2px;
  }
  .login-input:focus { border-color: var(--green); }
  .login-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .login-btn:hover { background: var(--navy-hover); }
  .login-error {
    margin-top: 12px;
    font-size: 13px;
    color: var(--red);
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }

  .dash-hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--green) 100%);
    color: white;
    padding: 32px 24px 28px;
  }
  .dash-hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }
  .dash-hero-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .dash-hero-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }
  .dash-stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.9);
  }
  .stat-pill span {
    font-weight: 700;
    margin-right: 4px;
  }

  /* ── CONTROLS ── */
  .controls-bar {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray-400);
    font-size: 14px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: white;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--green); }
  .sort-select {
    padding: 10px 14px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: white;
    outline: none;
    color: var(--gray-800);
    cursor: pointer;
  }

  /* ── CLIENT LIST ── */
  .client-list {
    max-width: 900px;
    margin: 16px auto 60px;
    padding: 0 16px;
  }

  .client-card {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .client-header {
    padding: 18px 20px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: background 0.12s;
    user-select: none;
  }
  .client-header:hover { background: var(--gray-100); }
  .client-avatar {
    width: 42px;
    height: 42px;
    background: var(--navy);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .client-info { flex: 1; min-width: 0; }
  .client-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-800);
  }
  .client-meta {
    font-size: 12px;
    color: var(--gray-400);
    margin-top: 1px;
  }
  .client-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .report-count-badge {
    background: var(--green-light);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .chevron {
    color: var(--gray-300);
    font-size: 14px;
    transition: transform 0.2s;
  }
  .client-card.open .chevron { transform: rotate(180deg); }

  /* ── REPORT ROWS ── */
  .report-rows {
    border-top: 1px solid var(--gray-200);
    display: none;
    padding: 4px 0;
  }
  .client-card.open .report-rows { display: block; }

  .report-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px 12px 72px;
    text-decoration: none;
    color: inherit;
    transition: background 0.12s;
    border-bottom: 1px solid var(--gray-100);
  }
  .report-row:last-child { border-bottom: none; }
  .report-row:hover { background: var(--off-white); }

  .report-date-block {
    flex-shrink: 0;
    text-align: center;
    min-width: 48px;
  }
  .report-date-month {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--green);
  }
  .report-date-day {
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-800);
    line-height: 1;
    margin: 1px 0;
  }
  .report-date-year {
    font-size: 11px;
    color: var(--gray-400);
  }

  .report-info { flex: 1; min-width: 0; }
  .report-signals {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 4px;
  }
  .signal-tag {
    font-size: 11px;
    color: var(--gray-600);
    background: var(--gray-100);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .report-products {
    font-size: 12px;
    color: var(--amber);
    font-weight: 500;
  }

  .latest-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--navy);
    color: white;
    padding: 2px 7px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .open-arrow {
    color: var(--gray-300);
    font-size: 14px;
    flex-shrink: 0;
  }
  .report-row:hover .open-arrow { color: var(--green); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-400);
    font-size: 14px;
  }

  /* ── SECTION HEADER ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gray-400);
    padding: 8px 20px 6px 20px;
  }

  @media (max-width: 600px) {
    .dash-hero-title { font-size: 20px; }
    .report-row { padding-left: 16px; }
    .client-header { gap: 10px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <span class="site-logo">Health Reports</span>
  <span class="admin-badge">Admin</span>
  <div class="header-right">
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</header>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <div class="login-title">Admin Access</div>
    <div class="login-sub">Enter your passcode to view all client reports</div>
    <input class="login-input" type="password" id="passcode-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Enter Dashboard</button>
    <div class="login-error" id="login-error">Incorrect passcode. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-hero">
    <div class="dash-hero-label">Admin Dashboard</div>
    <div class="dash-hero-title">All Client Reports</div>
    <div class="dash-hero-sub" id="dash-sub">Loading...</div>
    <div class="dash-stats" id="dash-stats"></div>
  </div>

  <div class="controls-bar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" type="text" id="search-input" placeholder="Search by name or signal..." oninput="renderClients()">
    </div>
    <select class="sort-select" id="sort-select" onchange="renderClients()">
      <option value="name-asc">Name A–Z</option>
      <option value="name-desc">Name Z–A</option>
      <option value="date-desc">Most Recent First</option>
      <option value="date-asc">Oldest First</option>
      <option value="count-desc">Most Reports</option>
    </select>
  </div>

  <div class="client-list" id="client-list"></div>
</div>

<script>
// ── CONFIG ──
const PASSCODE = "diamond2026";
const INDEX_URL = "reports/index.json";
const SESSION_KEY = "hr_admin_authed";

let allClients = [];

// ── AUTH ──
function tryLogin() {
  const val = document.getElementById("passcode-input").value;
  if (val === PASSCODE) {
    sessionStorage.setItem(SESSION_KEY, "1");
    showDashboard();
  } else {
    document.getElementById("login-error").style.display = "block";
    document.getElementById("passcode-input").value = "";
    document.getElementById("passcode-input").focus();
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("passcode-input").value = "";
  document.getElementById("login-error").style.display = "none";
}

// ── INIT ──
window.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    showDashboard();
  }
});

function showDashboard() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadData();
}

// ── DATA ──
async function loadData() {
  try {
    const r = await fetch(INDEX_URL + "?t=" + Date.now());
    const data = await r.json();
    allClients = Object.entries(data.clients).map(([key, client]) => ({
      key,
      ...client,
      latestDate: client.reports[0]?.date || ""
    }));
    renderStats();
    renderClients();
  } catch (e) {
    document.getElementById("client-list").innerHTML =
      '<div class="empty-state">Could not load index.json. Make sure this page is served over HTTP (GitHub Pages).<br><br>' + e.message + '</div>';
  }
}

function renderStats() {
  const totalReports = allClients.reduce((s, c) => s + c.reports.length, 0);
  const totalClients = allClients.length;
  // Latest report date
  const dates = allClients.flatMap(c => c.reports.map(r => r.date)).sort().reverse();
  const latestDate = dates[0] ? formatDate(dates[0]) : "—";

  document.getElementById("dash-sub").textContent =
    `${totalClients} client${totalClients !== 1 ? "s" : ""} · ${totalReports} report${totalReports !== 1 ? "s" : ""} on file`;

  document.getElementById("dash-stats").innerHTML = `
    <div class="stat-pill"><span>${totalClients}</span> Clients</div>
    <div class="stat-pill"><span>${totalReports}</span> Reports</div>
    <div class="stat-pill">Last assessment: <span style="margin-left:4px">${latestDate}</span></div>
  `;
}

// ── RENDER ──
function renderClients() {
  const q = document.getElementById("search-input").value.toLowerCase().trim();
  const sort = document.getElementById("sort-select").value;

  let clients = allClients.filter(c => {
    if (!q) return true;
    if (c.name.toLowerCase().includes(q)) return true;
    if (c.reports.some(r => r.signals.some(s => s.toLowerCase().includes(q)))) return true;
    if (c.reports.some(r => r.products.some(p => p.toLowerCase().includes(q)))) return true;
    return false;
  });

  clients = [...clients].sort((a, b) => {
    if (sort === "name-asc") return a.name.localeCompare(b.name);
    if (sort === "name-desc") return b.name.localeCompare(a.name);
    if (sort === "date-desc") return (b.latestDate || "").localeCompare(a.latestDate || "");
    if (sort === "date-asc") return (a.latestDate || "").localeCompare(b.latestDate || "");
    if (sort === "count-desc") return b.reports.length - a.reports.length;
    return 0;
  });

  const container = document.getElementById("client-list");

  if (clients.length === 0) {
    container.innerHTML = '<div class="empty-state">No clients match your search.</div>';
    return;
  }

  container.innerHTML = clients.map((client, idx) => {
    const initials = client.name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
    const reportCount = client.reports.length;

    const reportRows = client.reports.map((r, ri) => {
      const d = r.date ? r.date.split("-") : ["", "", ""];
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const monthStr = d[1] ? months[parseInt(d[1]) - 1] : "—";
      const dayStr = d[2] ? parseInt(d[2]) : "—";
      const yearStr = d[0] || "—";
      const isLatest = ri === 0;

      return `
        <a class="report-row" href="reports/${r.file}" target="_blank">
          <div class="report-date-block">
            <div class="report-date-month">${monthStr}</div>
            <div class="report-date-day">${dayStr}</div>
            <div class="report-date-year">${yearStr}</div>
          </div>
          <div class="report-info">
            <div class="report-signals">
              ${r.signals.map(s => `<span class="signal-tag">${s}</span>`).join("")}
            </div>
            <div class="report-products">${r.products.join(" · ")}</div>
          </div>
          ${isLatest ? '<span class="latest-badge">Latest</span>' : ""}
          <span class="open-arrow">↗</span>
        </a>`;
    }).join("");

    return `
      <div class="client-card" id="card-${idx}">
        <div class="client-header" onclick="toggleCard(${idx})">
          <div class="client-avatar">${initials}</div>
          <div class="client-info">
            <div class="client-name">${client.name}</div>
            <div class="client-meta">DOB ${client.dob} · Last assessed ${formatDate(client.latestDate)}</div>
          </div>
          <div class="client-right">
            <span class="report-count-badge">${reportCount} report${reportCount !== 1 ? "s" : ""}</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="report-rows">
          <div class="section-label">Assessment History</div>
          ${reportRows}
        </div>
      </div>`;
  }).join("");
}

function toggleCard(idx) {
  const card = document.getElementById("card-" + idx);
  card.classList.toggle("open");
}

function formatDate(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
}
</script>
</body>
</html>
