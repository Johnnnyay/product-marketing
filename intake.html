<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3D5A4C;--green:#5C8A6E;--green-light:#EDF2EE;
    --off-white:#F7F9F7;--gray-100:#F0F3F0;--gray-200:#E4E9E5;--gray-400:#9ca3af;
    --gray-500:#6E7B74;--gray-600:#55605A;--gray-800:#2A332D;--radius-lg:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--off-white);color:var(--gray-800);-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit}
  [hidden]{display:none !important}

  /* Header: same tools as the live form (All reports for admins, language, admin login). */
  .site-header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
  .site-logo{font-family:'Caveat',cursive;font-size:22px;font-weight:600}
  .hdr-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
  .pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.88);font-size:12px;font-weight:600;padding:6px 11px;border-radius:18px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .pill:hover{background:rgba(255,255,255,.2)}
  .caret{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid currentColor;opacity:.65}
  .lang-wrap{position:relative}
  .lang-menu{position:absolute;top:calc(100% + 7px);right:0;z-index:300;background:#fff;border:1px solid var(--gray-200);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;min-width:150px}
  .lang-opt{display:flex;gap:10px;width:100%;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--gray-800)}
  .lang-opt:hover,.lang-opt.on{background:var(--green-light)}
  .lang-opt b{width:24px;font-size:10.5px;color:var(--green)}

  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 110px}
  .steps{display:flex;gap:6px;margin-bottom:6px}
  .steps i{flex:1;height:4px;border-radius:999px;background:var(--gray-200)}
  .steps i.on{background:var(--green)}
  .step-label{font-size:12px;color:var(--gray-500);text-align:center;margin-bottom:18px}
  h1{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .lede{font-size:14.5px;color:var(--gray-600);line-height:1.6;margin-bottom:18px}
  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:0 1px 4px rgba(0,0,0,.07);padding:22px;margin-bottom:14px}
  .card-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card-title::after{content:'';flex:1;height:1px;background:var(--gray-200)}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .field > label,.q{display:block;font-size:13.5px;font-weight:600;color:var(--gray-600);margin-bottom:7px}
  .hint{font-weight:400;font-size:12px;color:var(--gray-500);margin-left:4px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--gray-200);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;color:var(--gray-800);background:#fff}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
  .field textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border:1.5px solid var(--gray-200);border-radius:999px;background:#fff;font-size:13.5px;color:var(--gray-600);cursor:pointer;transition:all .12s}
  .chip:hover{border-color:var(--green)}
  .chip.on{background:var(--green-light);border-color:var(--green);color:var(--navy);font-weight:600}
  .unit-pair{display:flex;align-items:center;gap:8px}
  .unit-box{position:relative;flex:1 1 0;min-width:0}
  .unit-box input{padding-right:32px !important}
  .unit-box span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--gray-500)}
  .unit-eq{color:var(--gray-400);font-size:13px}
  /* Name and email: one slim bar above everything. */
  .id-bar{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:12px 14px;margin-bottom:22px}
  .id-row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
  @media(max-width:560px){.id-row{grid-template-columns:1fr}}
  .id-row input{width:100%;border:1.5px solid var(--gray-200);border-radius:9px;padding:9px 11px;font:inherit;font-size:14.5px;color:var(--gray-800)}
  .id-row input:focus{outline:none;border-color:var(--green)}
  .id-hint{font-size:11.5px;color:var(--gray-500);margin-top:7px}
  /* "Why we ask", on every question, as on the live form. */
  .help-btn{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--green-light);border:0;padding:0;margin-left:7px;color:var(--green);cursor:pointer;vertical-align:middle;font-size:10.5px;font-weight:800;line-height:1}
  .help-btn::before{content:"?"}
  .help-btn:hover{background:var(--green);color:#fff}
  /* The "why lifestyle" reading: one line closed, the full reasoning open. */
  /* The thank-you reading, set like a short magazine piece: headline, lead, image rows,
     a pull quote and one number to remember. */
  .story{background:#fff;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:34px 34px 30px;margin-top:6px}
  .st-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
  .st-title{font-size:27px;line-height:1.25;font-weight:700;color:var(--navy);letter-spacing:-.01em;margin-bottom:14px}
  .st-lead{font-size:18px;line-height:1.6;color:var(--gray-800);margin-bottom:26px}
  .st-row{display:grid;grid-template-columns:42% 1fr;gap:24px;align-items:center;margin-bottom:26px}
  .st-row.rev{grid-template-columns:1fr 42%}
  .st-row img{width:100%;aspect-ratio:4/3.3;object-fit:cover;border-radius:14px;display:block}
  .st-sub{font-size:15.5px;font-weight:700;color:var(--gray-800);line-height:1.4;margin-bottom:12px}
  .drv{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--gray-100)}
  .drv:first-of-type{border-top:0}
  .drv i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green-light);color:var(--green);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .drv b{display:block;font-size:14.5px;color:var(--gray-800)}
  .drv span{font-size:13.5px;color:var(--gray-600)}
  .st-p{font-size:14.5px;line-height:1.7;color:var(--gray-600);margin-top:10px}
  .pull{margin:6px 0 30px;padding:22px 26px;border-radius:16px;background:var(--navy);color:#fff;font-size:21px;line-height:1.45;font-weight:600;position:relative}
  .pull::before{content:'\201C';position:absolute;top:-8px;left:18px;font-size:64px;line-height:1;color:rgba(255,255,255,.25);font-family:Georgia,serif}
  .split-t{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px}
  .stat{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .stat b{font-size:44px;line-height:1;font-weight:800;color:var(--green);letter-spacing:-.02em}
  .stat.small b{font-size:30px;color:var(--gray-400)}
  .stat span{font-size:16px;font-weight:600;color:var(--gray-600)}
  .bottle{background:var(--green-light);border-radius:14px;padding:18px 20px}
  .bottle h4{font-size:16px;color:var(--navy);margin-bottom:6px}
  .bottle p{font-size:14.5px;line-height:1.65;color:var(--gray-600)}
  @media(max-width:640px){.story{padding:24px 18px}.st-title{font-size:23px}.st-lead{font-size:16.5px}.st-row,.st-row.rev{grid-template-columns:1fr;gap:14px}.st-row.rev img{order:-1}.pull{font-size:18px}}
  .scale-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
  @media(max-width:560px){.scale-grid{grid-template-columns:1fr 1fr}}
  .edit-box{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:14px 16px;margin:22px 0 14px;font-size:14px;color:var(--gray-600);line-height:1.5}
  .edit-box span{flex:1;min-width:220px}
  .edit-box .btn{padding:9px 18px;font-size:14px}
  .honest{font-size:13.5px;color:var(--gray-600);margin:-8px 0 16px;padding-left:12px;border-left:3px solid var(--green)}
  .help-box{display:none;background:var(--green-light);border-radius:9px;padding:9px 11px;margin:0 0 9px;font-size:12.5px;line-height:1.6;color:var(--gray-600);font-weight:400}
  .help-box.open{display:block}
  .sys-h .help-btn{margin-left:auto;margin-right:8px;color:var(--c)}
  .sys-h .help-btn::before{background:#fff;color:var(--c)}
  .sys-help{display:none;padding:10px 14px 2px;border-bottom:1px solid var(--gray-100);font-size:12.5px;line-height:1.55;color:var(--gray-600)}
  .sys-help.open{display:block}
  .sys-help p{margin-bottom:8px}
  .sys-help b{color:var(--c)}
  /* A yes-or-no question is a checkbox in front of a statement. */
  .field > label.check-q{display:flex;align-items:center;flex-wrap:wrap;gap:0 10px;font-size:14px;font-weight:600;color:var(--gray-800);cursor:pointer;margin-bottom:6px}
  .check-q .help-btn{margin-left:0}
  .field .check-q input{width:18px;height:18px;padding:0;border:0;margin:1px 0 0;accent-color:var(--green);flex:none;cursor:pointer}
  .err{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#991b1b;margin-bottom:14px}

  /* ── The body map. Once = outlined in the system's color, twice = filled. ── */
  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;color:var(--gray-600);margin:4px 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg{display:inline-block;width:26px;height:16px;border-radius:999px;border:1.5px solid var(--gray-200);background:#fff}
  .lg.occ{border:2px solid #5C8A6E}
  .lg.often{background:#5C8A6E;border-color:#5C8A6E}
  .map{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.map{grid-template-columns:1fr}}
  .sys{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
  .sys-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--ct);color:var(--c);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .sys-h em{font-style:normal;font-size:11px;font-weight:700;background:#fff;color:var(--c);border-radius:999px;padding:1px 8px;letter-spacing:0}
  .sys-b{padding:12px;display:flex;flex-wrap:wrap;gap:6px}
  .m{padding:7px 11px;border:1.5px solid var(--gray-200);border-radius:999px;background:#fff;font-size:13px;color:var(--gray-600);cursor:pointer;line-height:1.25;user-select:none;-webkit-tap-highlight-color:transparent}
  .m:hover{border-color:var(--c)}
  .m.s1{border:2px solid var(--c);padding:6.5px 10.5px;color:var(--c);font-weight:600}
  .m.s2{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
  .sub-sys{border-radius:14px;padding:12px;background:var(--ct);margin-bottom:14px}
  .sub-sys .q{color:var(--c)}

  /* ── Details ── */
  .rank{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;margin-right:6px}
  .grid-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
  .grid-row:last-child{border-bottom:0}
  .grid-name{font-size:13.5px;color:var(--gray-800)}
  .fb{display:flex;gap:4px;flex-shrink:0}
  .fb button{padding:5px 8px;border:1.5px solid var(--gray-200);border-radius:7px;background:#fff;font-size:11.5px;font-weight:600;color:var(--gray-500);cursor:pointer;white-space:nowrap}
  .fb button.on{background:var(--green-light);border-color:var(--green);color:var(--navy)}
  @media(max-width:600px){.grid-row{flex-direction:column;align-items:stretch;gap:6px}.fb{display:grid;grid-template-columns:repeat(4,1fr)}.fb button{white-space:normal}}
  .toggle{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--gray-100);border-radius:9px;cursor:pointer;font-size:13.5px}
  .toggle input{width:18px;height:18px;accent-color:var(--green)}

  .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--gray-200);padding:12px 16px;z-index:50}
  .bottom-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .count{font-size:13px;color:var(--gray-600);flex:1}
  .btn{padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;border:0;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}
  .btn.ghost{background:var(--gray-100);color:var(--gray-600)}

  /* Sending, then the thank-you page with the "what this is for" reading. */
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  .spin{width:42px;height:42px;border:3px solid var(--gray-200);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{text-align:center;padding:30px 0 10px}
  .done-icon{width:62px;height:62px;margin:0 auto 16px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center}
  .done h2{font-size:23px;color:var(--navy);margin-bottom:8px}
  .done p{font-size:15px;color:var(--gray-600);line-height:1.6;max-width:480px;margin:0 auto 20px}
  .done .small{font-size:12.5px;color:var(--gray-500);margin-top:12px}
  .back-event{display:inline-block;margin-top:14px;font-size:14px;font-weight:600;color:var(--green);text-decoration:none}
</style>
<script src="intake-content.js?v=3.0"></script>
</head>
<body>

<header class="site-header">
  <span class="site-logo">Health Assessment</span>
  <div class="hdr-tools">
    <a class="pill" id="reportsBubble" href="admin.html" hidden>All reports</a>
    <div class="lang-wrap">
      <button class="pill" id="langBtn" aria-haspopup="true"><span id="langCur">English</span><span class="caret"></span></button>
      <div class="lang-menu" id="langMenu" hidden></div>
    </div>
    <button class="pill" id="adminDots" title="Admin login">···</button>
  </div>
</header>

<div class="wrap" id="form">
  <div class="steps"><i id="s0" class="on"></i><i id="s1"></i></div>
  <div class="step-label" id="stepLabel"></div>
  <div class="err" id="err"></div>

  <!-- ═══ 1. Name, email and the body map ═══ -->
  <section id="p0">
    <div class="id-bar">
      <div class="id-row">
        <input id="f-name" autocomplete="name" data-ph="namePh" aria-label="Name" required>
        <input id="f-email" type="email" autocomplete="email" data-ph="emailPh" aria-label="Email" required>
      </div>
      <div class="id-hint" data-t="emailHint"></div>
    </div>
    <h1 data-t="p0h"></h1>
    <p class="lede" data-t="p0sub"></p>
    <div class="legend">
      <span><i class="lg"></i><span data-t="lgNone"></span></span>
      <span><i class="lg occ"></i><span data-t="lgOcc"></span></span>
      <span><i class="lg often"></i><span data-t="lgOften"></span></span>
    </div>
    <div class="map" id="map"></div>
    <div class="card" style="margin-top:14px">
      <div class="field"><label data-t="mapOther"></label><input id="f-mapOther" data-ph="mapOtherPh"></div>
    </div>
  </section>

  <!-- ═══ 2. About you, then only what applies ═══ -->
  <section id="p1" hidden>
    <h1 data-t="p1h"></h1>
    <p class="lede" id="honest"></p>

    <div class="card">
      <div class="card-title" data-t="aboutT"></div>
      <div class="row2">
        <div class="field"><label id="dobL"><span data-t="dob"></span></label><input id="f-dob" type="date"></div>
        <div class="field"><label id="genderL" data-t="gender"></label><div class="chips" id="genderChips"></div></div>
      </div>
      <div class="row2">
        <div class="field"><label id="heightL" data-t="height"></label>
          <div class="unit-pair">
            <div class="unit-box"><input type="number" step="any" inputmode="decimal" id="f-height" placeholder="175"><span>cm</span></div>
            <span class="unit-eq">=</span>
            <div class="unit-box"><input type="number" inputmode="numeric" id="f-heightFt" placeholder="5"><span>ft</span></div>
            <div class="unit-box"><input type="number" step="any" inputmode="decimal" id="f-heightIn" placeholder="9"><span>in</span></div>
          </div>
        </div>
        <div class="field"><label id="weightL" data-t="weight"></label>
          <div class="unit-pair">
            <div class="unit-box"><input type="number" step="any" inputmode="decimal" id="f-weight" placeholder="160"><span>lb</span></div>
            <span class="unit-eq">=</span>
            <div class="unit-box"><input type="number" step="any" inputmode="decimal" id="f-weightKg" placeholder="72.6"><span>kg</span></div>
          </div>
        </div>
      </div>
      <!-- Only once gender and birthday say they apply: women's health, and the 45+ and 55+ items. -->
      <div id="extraSys"></div>
      <div id="cycleBox" hidden>
        <div class="row2">
          <div class="field"><label id="cycRegL"></label><div class="chips" data-single="cycleRegular"></div></div>
          <div class="field"><label id="cycPainL"></label><div class="chips" data-single="menstrualPain"></div></div>
          <div class="field"><label id="cycFlowL"></label><div class="chips" data-single="heavyFlow"></div></div>
          <div class="field"><label id="cycPmsL"></label><div class="chips" data-single="pmsMoodSwings"></div></div>
        </div>
      </div>
      <!-- Optional: smart scale readings. Closed unless they have them. -->
      <div class="field" id="scaleF" style="margin-top:4px">
        <label class="check-q"><input type="checkbox" id="hasScale"><span data-t="scaleQ"></span></label>
        <div id="scaleBox" hidden style="margin-top:10px"><div class="scale-grid" id="scaleGrid"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-t="prioT"></div>
      <div class="field"><label id="prioL" data-t="prioQ"></label><div class="chips" id="prioChips"></div></div>
      <div class="field" id="prioOtherF" hidden><label data-t="prioOther"></label><input id="f-prioOther" maxlength="80"></div>
      <div class="field" id="prioWordsF" hidden><label data-t="prioWords"></label><textarea id="f-prioWords" rows="2" maxlength="300"></textarea></div>
    </div>

    <div class="card">
      <div class="card-title" id="weekT"></div>
      <div id="weekRows"></div>
      <div class="field" style="margin-top:16px"><label id="waterL"></label><div class="chips" data-single="water"></div></div>
      <div class="field"><label id="bedL"></label><div class="chips" data-single="bedtime"></div></div>
      <div class="field" id="wakeFollow" hidden><label id="w13L" data-t="w13"></label><div class="chips" data-single="wake13"></div></div>
      <div class="field"><label id="dietL"></label><textarea id="f-diet" rows="3"></textarea></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="suppT"></div>
      <div class="field"><label id="suppL" data-t="suppQ"></label><div class="chips" id="suppChips"></div>
        <input id="f-suppOther" style="margin-top:10px" data-ph="suppOtherPh"></div>
      <div class="field" id="suppFreqF" hidden><label id="suppFreqL"></label><div class="chips" data-single="supplementFreq"></div></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="gutT"></div>
      <div class="field"><label id="bowelL"></label><div class="chips" data-single="bowelFreq"></div></div>
      <div class="field"><label id="wipeL"></label><div class="chips" data-single="wiping"></div></div>
    </div>

    <div class="card">
      <div class="field" id="diagF">
        <label class="check-q"><input type="checkbox" id="hasDiag"><span data-t="diagQ"></span></label>
        <div id="diagBox" hidden style="margin-top:10px"><div class="chips" id="diagChips"></div>
          <input id="f-diagNote" style="margin-top:10px" data-ph="diagNotePh"></div>
      </div>

  if (!label || !text) return;

  if (!box || !box.classList.contains('help-box')) { box = document.createElement('div'); box.className = 'help-box'; label.after(box); }
  let b = label.querySelector(':scope > .help-btn');
  if (!b) {
    b = document.createElement('button'); b.type = 'button'; b.className = 'help-btn';
    b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); box.classList.toggle('open'); };
    const hint = label.querySelector(':scope > .hint');
    if (hint) label.insertBefore(b, hint); else label.appendChild(b);
  }
  b.setAttribute('aria-label', tx(UI.why)); b.title = tx(UI.why);

function age(){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec($('f-dob').value || '');
  if (!m) return null;
  const n = new Date(); let a = n.getFullYear() - +m[1];
  if (n.getMonth()+1 < +m[2] || (n.getMonth()+1 === +m[2] && n.getDate() < +m[3])) a--;
  return a >= 0 && a < 130 ? a : null;
}
function applies(w){
  if (!w) return true;
  if (w.gender && w.gender !== state.gender) return false;
  if (w.notGender && (!state.gender || state.gender === w.notGender)) return false;
  if (w.minAge !== undefined && (age() === null || age() < w.minAge)) return false;
  return true;
}

function suggested(){

  MAP.forEach((s) => s.items.forEach((it) => { const v = state.map[it[2]]; if (v) score[s.p] = (score[s.p] || 0) + v; }));
  if (state.map['Skin and Hair__Hair falling out easily'] || state.map['Skin and Hair__Dry, dull, or yellowish hair']) score.hair = (score.hair || 0) + 1;
  ['Digestion__Unexplained weight change', 'Energy and Body__Hard to lose weight', 'Energy and Body__Belly fat'].forEach((k) => {
    if (state.map[k]) score.weight = (score.weight || 0) + 2;

}

  Object.keys(state.map).forEach((k) => { symptoms[k] = often[state.map[k]]; });
  const food = {}, own = {};
  DIET_FREQ.forEach((q) => { const v = state.week[q.id]; if (!v) return; if (q.field) own[q.field] = (q.send && q.send[v]) || v; else food[q.id] = v; });
  const wv = symptoms['Sleep and Mood__Wake up during the night'];
  const w = state.single.wake13;
  const typed = $('f-suppOther').value.trim();
  const cm = num('f-height');
  const p = {
    formVersion: FORM_VERSION, symptomMode: 'map', formLang: LANGS[L].code,
    name: $('f-name').value.trim(), email: $('f-email').value.trim(), dob: $('f-dob').value, gender: state.gender,
    height: cm ? Math.round(cm * 10) / 10 + ' cm (' + $('f-heightFt').value + ' ft ' + ($('f-heightIn').value || 0) + ' in)' : null,
    weight: $('f-weight').value || null, weightKg: $('f-weightKg').value || null,
    symptoms, mapOther: $('f-mapOther').value.trim() || null,
    priorities: state.prio.map((id, i) => {
      const r = { id, rank: i + 1 };
      if (i === 0 && $('f-prioWords').value.trim()) r.words = $('f-prioWords').value.trim();
      if (id === 'other') r.other = $('f-prioOther').value.trim();
      return r;
    }),
    dietFrequency: food, breakfastFreq: own.breakfastFreq || null, smoking: own.smoking || null,
    water: state.single.water || null, bedtime: state.single.bedtime || null, diet: $('f-diet').value.trim() || null,
    waking13: wv ? wv + (w === 'yes' ? ', usually between 1 and 3 AM' : w === 'no' ? ', usually at other times' : '') : null,
    supplements: state.suppNone ? 'None' : (Object.keys(state.supp).concat(typed ? [typed] : []).join(', ') || null),
    supplementFreq: state.suppNone ? 'Not currently taking any' : (state.single.supplementFreq || null),
    bowelFreq: state.single.bowelFreq || null, wiping: state.single.wiping || null,
    cycleRegular: state.single.cycleRegular || null, menstrualPain: state.single.menstrualPain || null,
    heavyFlow: state.single.heavyFlow || null, pmsMoodSwings: state.single.pmsMoodSwings || null,
    diagnosed: Object.keys(state.diag), diagnosedNote: $('f-diagNote').value.trim() || null,
    medication: ($('hasMed').checked && $('f-medication').value.trim()) || null,
    notes: $('f-notes').value.trim() || null,
  };
  if ($('hasScale').checked) SCALE_KEYS.forEach((k) => { if ($(k).value) p[k.slice(2)] = $(k).value; });
  if (EVENT) p.event = EVENT;
  if (lastRid) p.replaces = lastRid;
  return p;
}

let reportUrl = '', lastRid = '';
async function submit(){
  const p = payload();
  $('loadT').textContent = tx(UI.loadTitle);
  $('loading').hidden = false; $('next').disabled = true;
  try {
    const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(p) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || ('the server answered ' + r.status));
    reportUrl = j.reportUrl;
    lastRid = j.rid || '';
    if (EVENT) {
      try {
        const k = 'event-guest:' + EVENT, g = JSON.parse(localStorage.getItem(k) || '{}') || {};
        g.name = p.name; g.email = p.email; localStorage.setItem(k, JSON.stringify(g));
      } catch (err) {}
    }
    $('form').hidden = true; $('bottom').hidden = true; $('doneView').hidden = false;
    paintDone(); window.scrollTo(0, 0);
  } catch (err) {
    fail(tx(T.sendFail).replace('{e}', err.message));
  } finally {
    $('loading').hidden = true; $('next').disabled = false;
  }
}

/* The report opens locked for a customer; the consultant unlocks it. The reading below is the
   "what this assessment is for" text that used to open the form. */
function paintDone(){
  const first = ($('f-name').value.trim().split(/\s+/)[0]) || '';
  $('okTitle').textContent = tx(T.doneTitle).replace('{name}', first);
  $('okSub').textContent = tx(T.doneSub);
  $('okNote').textContent = tx(T.doneNote);
  $('reportLink').textContent = tx(UI.okBtn);
  $('reportLink').href = reportUrl || '#';
  if (EVENT && BACK) { $('eventBack').hidden = false; $('eventBack').href = BACK + '?done=health'; $('eventBack').textContent = tx(T.eventBack); }
  $('editText').textContent = tx(T.editText);
  $('editBtn').textContent = tx(T.editBtn);
  /* The reasoning, here rather than mid-form: it sets up what the report is for while they wait. */
  const st = T.story;
  [['stEyebrow','eyebrow'],['stTitle','title'],['stLead','lead'],['stDriversT','driversT'],['stEarlier','earlier'],['stQuote','quote'],
   ['stSplitT','splitT'],['stDiet','diet'],['stWorkout','workout'],['stQuestion','question'],['stBottleT','bottleT'],['stBottle','bottle']]
    .forEach(([id, k]) => { $(id).textContent = tx(st[k]); });
  $('stDrivers').innerHTML = st.drivers.map((d, i) => '<div class="drv"><i>' + (i + 1) + '</i><div><b>' + esc(tx(d[0])) + '</b><span>' + esc(tx(d[1])) + '</span></div></div>').join('');
}

/* Back into the form with every answer still in place. Sending again replaces this report. */
$('editBtn').onclick = () => {
  $('doneView').hidden = true; $('form').hidden = false; $('bottom').hidden = false;
  show(1);
};

/* The "what this is for" reading, split: the last paragraph (answer honestly) is always shown
   at the top of page 2; the reasoning sits in a tab whose question makes people want to open it. */
function paintWhyLife(){
  const paras = tx(STAGE_SETTING.body).split('\n\n');
  $('honest').textContent = paras[paras.length - 1];
}

/* Opened from an event page: the name and email this guest already typed there. */
if (EVENT) {
  try {
    const g = JSON.parse(localStorage.getItem('event-guest:' + EVENT) || '{}') || {};
    if (g.name) $('f-name').value = g.name;
    if (g.email) $('f-email').value = g.email;
  } catch (e) {}
}

renderLang(); adminChrome(); show(0);
</script>
